version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      root:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      rust:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /docs-site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      consumers:
        patterns: ['*']
