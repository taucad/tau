# Maintains the standing release pull request (head `release/next`, base `main`).
#
# After every successful `main` CI run with pending Version Plans:
#   1. Regenerate the release commit with `release:prepare --from-plans`: the
#      plans dictate the version, and the same validations and quality gate
#      apply as a manual `release:prepare -- <version>` run.
#   2. Delete every consumed plan file explicitly: nx has left consumed plans
#      on disk before, and a survivor would re-trigger this workflow for a
#      version that just shipped.
#   3. Force-push `release/next` and upsert one pull request titled with the
#      exact release subject. The squash merge takes the pull request title
#      (`PR_TITLE`), and `ci.yml`'s release policy tolerates the ` (#N)` suffix.
#
# With no pending plans (a release just merged, or plans were reverted), close
# the pull request and delete the branch instead.
#
# Merging the pull request is the entire release act: the push to `main`
# carries the release subject, and `ci.yml` owns publication, provenance,
# registry verification, tags, and GitHub Releases. Nothing here touches npm.
#
# A minted `tau-release-bot` installation token is required: pushes made with
# the default GITHUB_TOKEN trigger no CI (the required `ci-gate` check would
# never report), and the organization does not allow Actions to create pull
# requests.
name: Release PR

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release-pr
      deployment: false
    steps:
      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: true
          token: ${{ steps.bot.outputs.token }}

      - name: Check pending Version Plans
        id: plans
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          if compgen -G '.nx/version-plans/*.md' > /dev/null; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pending=false" >> "$GITHUB_OUTPUT"
          pr_number=$(gh pr list --base main --head release/next --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --comment "No Version Plans are pending on \`main\`, so there is nothing to release." --delete-branch
          else
            git push origin --delete release/next 2>/dev/null || true
          fi

      - name: Setup repository
        if: steps.plans.outputs.pending == 'true'
        uses: ./.github/actions/setup
        with:
          node-version: '@@CREATE_REPO_node-latest@@'

      - name: Generate the release commit
        id: generate
        if: steps.plans.outputs.pending == 'true'
        run: |
          set -euo pipefail
          previous_version=$(node -p "require('./package.json').version")
          # The list feeds only the pull request body; nx reads the plans
          # themselves. A plan that states its bump another way must not fail
          # the step between the heredoc delimiters.
          {
            echo 'plans<<PLANSEOF'
            grep -HE '^(@@CREATE_REPO_slug@@|__default__):' .nx/version-plans/*.md | sed 's/^/- /' ||
              echo '- (no bump line matched; see the consumed plan files in this pull request)'
            echo 'PLANSEOF'
          } >> "$GITHUB_OUTPUT"

          pnpm release:prepare -- --from-plans

          # nx has left consumed plan files on disk before; every plan affects
          # the fixed group, so every plan is consumed by every release.
          git rm --quiet --force '.nx/version-plans/*.md'

          # Stage the release files explicitly: the quality gate inside
          # release:prepare can regenerate committed artifacts that must stay
          # out of the release commit. The allow-list equals the files
          # scripts/ci-release.mjs admits in a release commit.
          mapfile -t platform_manifests < <(compgen -G 'npm/*/package.json' || true)
          git add CHANGELOG.md package.json pnpm-lock.yaml "${platform_manifests[@]}"
          staged=$(git diff --cached --name-only)
          allowed='^(CHANGELOG\.md|package\.json|pnpm-lock\.yaml|npm/[^/]+/package\.json|\.nx/version-plans/.+\.md)$'
          unexpected=$(grep -Ev "$allowed" <<< "$staged" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::release generation changed unexpected files: $unexpected"
            exit 1
          fi

          version=$(node -p "require('./package.json').version")
          git config user.name "tau-release-bot[bot]"
          git config user.email "tau-release-bot[bot]@users.noreply.github.com"
          git commit --quiet -m "chore(release): @@CREATE_REPO_slug@@ v$version"
          git push --force origin HEAD:refs/heads/release/next

          # A first release has no previous tag to diff against.
          {
            echo "version=$version"
            echo "previous_version=$previous_version"
            echo 'commit_log<<LOGEOF'
            if git rev-parse --verify --quiet "refs/tags/v$previous_version" >/dev/null; then
              git log -100 "v$previous_version..origin/main" --pretty='- %h %s'
            else
              git log -100 origin/main --pretty='- %h %s'
            fi
            echo 'LOGEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert the release pull request
        if: steps.plans.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TITLE: 'chore(release): @@CREATE_REPO_slug@@ v${{ steps.generate.outputs.version }}'
          VERSION: ${{ steps.generate.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.generate.outputs.previous_version }}
          PLANS: ${{ steps.generate.outputs.plans }}
          COMMIT_LOG: ${{ steps.generate.outputs.commit_log }}
        run: |
          set -euo pipefail
          body=$(cat <<BODYEOF
          Releases @@CREATE_REPO_npm-name@@ **v${VERSION}** (from v${PREVIOUS_VERSION}). The consumed
          Version Plans dictate the bump:

          ${PLANS}

          Commits since v${PREVIOUS_VERSION}:

          ${COMMIT_LOG}

          ---

          - This pull request is **bot-managed**: it is regenerated after every successful
            \`main\` CI run and closes itself when no Version Plans are pending. Do not push
            to \`release/next\` or enable auto-merge.
          - **Merging this pull request publishes to npm.** Squash-merge it with the title
            unchanged; the release policy validates the resulting commit.
          BODYEOF
          )
          pr_number=$(gh pr list --base main --head release/next --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            gh pr create --base main --head release/next --title "$TITLE" --body "$body"
          else
            gh pr edit "$pr_number" --title "$TITLE" --body "$body"
          fi
