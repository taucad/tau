name: 'Queue verdict'
description: >-
  On a push to `main`, finds the merge-queue `ci.yml` run on the identical commit whose required
  gate passed, so the push run can reuse its verdict instead of running the same checks again, and
  names the base the queue diffed against, so the push selects the same affected lanes.

# The merge queue tests the exact commit that lands: `main` fast-forwards to the
# group's commit, so a `merge_group` run on `github.sha` whose required gate passed
# already ran every lane its `nx affected` selected on this tree. Rerunning them on the
# push cost about 3.4 runner-hours per commit (operator decision 2026-11-08, Brain
# research/ci-throughput-review.md). A commit that reached `main` without the queue
# (an emergency bypass) has no such run and gets the full push run.
#
# The proof is the gate's jobs, not the run's overall conclusion. GitHub merges as soon
# as the required checks pass, so the queue run is often still `in_progress` when this
# push starts, and `merge-queue-sweep.yml` then cancels it as a run of a deleted queue
# branch. Until 2026-11-12 this lookup asked only for successful runs, found nothing,
# and 25 of 41 pushes reran every lane (Brain ci-audit 2026-11-12, F1). A run counts
# only when `Run affected tasks` and `Validate workspace` both completed `success`.
# `Run affected tasks` waits for every lane and fails on any selected lane that did not
# pass, so a run whose gate failed, was cancelled before it finished or never reached it
# is never reused, and nothing here reads a lane by name.
#
# The base: the queue diffs against `HEAD^1`, while `nx-set-shas` on a push reaches back
# to the last successful push run, several commits behind while earlier pushes still run,
# so the push selected the union of several pull requests' lanes, each already proved by
# its own queue run (F3). A push with any merge-group run on its commit diffs against
# `HEAD^1` too (`setup-nx`'s `affected-base`), so `nx affected` alone selects what the
# queue selected. A bypass push keeps the wider `nx-set-shas` base.

inputs:
  github-token:
    description: 'Token with actions: read'
    required: true

outputs:
  run-id:
    description: "The most recent merge-group run on this commit whose `Run affected tasks` and `Validate workspace` jobs concluded `success`, or '' when there is none or this is not a push to main"
    value: ${{ steps.find.outputs.run-id }}
  affected-base:
    description: "'HEAD^1', the queue's own `nx affected` base, when this is a push to main and a merge-group run exists on this commit whatever its outcome; '' otherwise, which keeps the base `nx-set-shas` finds"
    value: ${{ steps.find.outputs.affected-base }}

runs:
  using: 'composite'
  steps:
    - name: Find the merge-queue run on this commit whose required gate passed
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        run_id=''
        affected_base=''
        if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
          # Every merge-group run on this commit, any status, newest first: the first whose
          # gate jobs both completed `success` is the verdict.
          candidates=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=merge_group&per_page=10" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id')
          if [ -n "$candidates" ]; then
            affected_base='HEAD^1'
          fi
          for candidate in $candidates; do
            candidate_jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/jobs?per_page=100" \
              --jq '.jobs[] | {name, status, conclusion}' | jq -s .)
            if jq -e '
              def passed($name): any(.[]; .name == $name and .status == "completed" and .conclusion == "success");
              passed("Run affected tasks") and passed("Validate workspace")' <<< "$candidate_jobs" > /dev/null; then
              run_id=$candidate
              break
            fi
            echo "Merge-queue run $candidate on $GITHUB_SHA has no passed required gate; not reused."
          done
        fi
        if [ -n "$run_id" ]; then
          echo "::notice::Reusing merge-queue run $run_id on $GITHUB_SHA, whose required gate passed."
        elif [ -n "$affected_base" ]; then
          echo "No merge-queue run on $GITHUB_SHA passed its gate; the lanes run, diffing against $affected_base like the queue."
        fi
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
        echo "affected-base=$affected_base" >> "$GITHUB_OUTPUT"
