name: 'Setup formal toolchains'
description: 'Java plus the TLC, Apalache and Lean toolchains pinned in tools/formal/toolchain.lock (run after setup-nx)'

inputs:
  tools:
    description: 'Comma-separated tools for `formal setup`: tlc, lean, apalache'
    required: false
    default: 'tlc'

runs:
  using: 'composite'
  steps:
    # Temurin 25 LTS; the lock's minimum is 21, which Apalache needs.
    - name: Setup Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Normalize tool selection for cache key
      id: cache-key
      shell: bash
      env:
        FORMAL_TOOLS: ${{ inputs.tools }}
      run: printf 'tools=%s\n' "${FORMAL_TOOLS//,/-}" >> "$GITHUB_OUTPUT"

    # Toolchains live under node_modules/.cache/formal, never in `pnpm install`.
    # The key changes when the lock does, so a re-pin re-downloads and re-verifies.
    - name: Restore formal toolchain cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.cache/formal
        key: formal-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-key.outputs.tools }}-${{ hashFiles('tools/formal/toolchain.lock') }}

    # Downloads what the cache lacks and refuses any bytes whose sha256 differs from the lock.
    - name: Provision and verify toolchains
      shell: bash
      env:
        FORMAL_TOOLS: ${{ inputs.tools }}
      run: pnpm nx run formal:setup --tools="$FORMAL_TOOLS"
