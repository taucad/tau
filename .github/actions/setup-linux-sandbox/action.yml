name: 'Setup Linux sandbox prerequisites'
description: 'Bubblewrap, capability-bearing user namespaces and uv for suites that run native kernel workers on Ubuntu'

runs:
  using: 'composite'
  steps:
    # Native kernel workers run inside the operating-system sandbox on every host,
    # including CI; a Linux runner needs the Bubblewrap toolchain and capability-bearing
    # user namespaces, which Ubuntu 24.04 restricts through AppArmor by default.
    # desktop:prepare-build123d-python resolves its wheels with uv (as release-build.yml
    # installs it). A cache hit never needs it; a full-graph miss does.
    - name: Install Linux sandbox prerequisites
      shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y bubblewrap socat ripgrep
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        command -v uv || pipx install uv
        uv --version
