name: 'Setup Nx Environment'
description: 'Sets up Node.js, pnpm, dependencies, and Nx SHAs for CI workflows'

inputs:
  node-version:
    description: "Node.js version used by this job. The default is Node 26 LTS, whose V8 has the wasm import-wrapper fix Node 24 lacks (nodejs/node#66366); `ci.yml`'s floor lane passes the Node 24 floor. The earlier '24.21 segfaults Nx' note was one CI crash: the same intermittent Nx SIGSEGV shows on 24.10, 24.19 and 24.20 and nx-guard reruns it (Brain research/node-26-ci-migration.md, Finding 2)."
    required: false
    default: '26.13.1'
  save-pnpm-store:
    description: "'false' restores the pnpm store and the cached Node.js without saving them after the job, for jobs whose end gates a workflow"
    required: false
    default: 'true'
  affected-base:
    description: "A commit `nx affected` diffs against in place of the one `nx-set-shas` finds: `queue-verdict`'s `affected-base` (`HEAD^1`, the merge queue's own base, on a push whose commit has a merge-group run). '' keeps `nx-set-shas`."
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # The pinned Node is not in the hosted images' toolcache, so `setup-node` downloaded it
    # in every job (13–42 s, including a 504 and its retry; Brain
    # research/ci-decomposition-blueprint.md, X9). Its toolcache folder (the version's
    # directory and `.complete` marker) is cached by version, and `setup-node` then finds
    # it installed. Saved and restored like the pnpm store below.
    - name: Cache the pinned Node.js
      if: inputs.save-pnpm-store == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.tool_cache }}/node/${{ inputs.node-version }}
        key: ${{ runner.os }}-${{ runner.arch }}-node-toolcache-${{ inputs.node-version }}

    - name: Restore the pinned Node.js
      if: inputs.save-pnpm-store != 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.tool_cache }}/node/${{ inputs.node-version }}
        key: ${{ runner.os }}-${{ runner.arch }}-node-toolcache-${{ inputs.node-version }}

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: 'https://registry.npmjs.org'

    # Node 25 and later ship without corepack. Install it into the selected Node itself, pinned to the 0.35.0 that
    # Node 24.20.0 bundled, rather than lean on the runner image's own: the VM guests of `hosted-linux-vm.sh` and
    # `shell-conformance-vm.sh` copy this Node's directory and run `corepack enable` from it. A Node that has its own
    # (the 24.x floor jobs) keeps it.
    - name: Provide corepack in the selected Node
      shell: bash
      run: |
        bin="$(dirname "$(command -v node)")"
        if [ -e "$bin/corepack" ] || [ -e "$bin/corepack.cmd" ]; then
          echo "corepack: $("$bin/corepack" --version 2>/dev/null || echo bundled) in $bin"
          exit 0
        fi
        # Into this Node's own prefix, never npm's configured global one: on windows-2025 that is C:\npm\prefix,
        # which already holds the image's `yarn` shim (EEXIST) and which no guest copies. A Windows Node keeps its
        # global bins beside node.exe; elsewhere they go to <prefix>/bin.
        if [ "$RUNNER_OS" = Windows ]; then prefix="$bin"; else prefix="$(dirname "$bin")"; fi
        for attempt in 1 2 3; do
          if npm install --global --prefix "$prefix" --no-audit --no-fund corepack@0.35.0; then break; fi
          if [ "$attempt" -eq 3 ]; then exit 1; fi
          echo "::warning title=corepack install failed::attempt $attempt failed; retrying" >&2
          sleep $((attempt * 5))
        done
        test -e "$bin/corepack" || test -e "$bin/corepack.cmd"

    - name: Enable corepack
      run: corepack enable
      shell: bash

    # Nx's native PTY command runner intermittently segfaults a few seconds into
    # `nx run-many`, before any task output (SIGSEGV, seen on Node 24.10 and
    # 24.20). Child-process execution keeps Nx caching and orchestration.
    - name: Run Nx tasks without the native PTY runner
      run: echo 'NX_NATIVE_COMMAND_RUNNER=false' >> "$GITHUB_ENV"
      shell: bash

    # Native revision suites, the CLI and every disk host record with `git` and
    # `git lfs` (`resolveGitToolchain`). The GitHub-hosted images ship git-lfs;
    # this states that dependency and fails here, by name, on an image without it,
    # rather than as product-shaped test failures later.
    - name: Require git-lfs
      run: git lfs version
      shell: bash

    # The first `pnpm` call of the job makes corepack download the pinned pnpm
    # from the npm registry, and that is the flakiest network call here: in run
    # 41670839293 it reset mid-stream (`TypeError: terminated` / `read
    # ECONNRESET`) and took the job with it. Do the download in a step of its
    # own, with retries, so a reset costs seconds instead of a CI round. Each
    # retry is an `infra-retry` event (`apt-install/infra-retry.sh`).
    - name: Download pnpm through corepack
      shell: bash
      env:
        INFRA_RETRY_BACKOFF: '5 10'
      run: bash "$GITHUB_ACTION_PATH/../apt-install/infra-retry.sh" pnpm-download pnpm --version

    - name: Get pnpm store directory
      shell: bash
      run: |
        # An empty store path fails the cache step after this one as "Input
        # required and not supplied: path", which names neither pnpm nor the
        # download that actually broke. Fail here instead, by name.
        store="$(pnpm store path --silent)"
        if [ -z "$store" ]; then
          echo "::error title=No pnpm store path::pnpm store path printed nothing" >&2
          exit 1
        fi
        echo "STORE_PATH=$store" >> "$GITHUB_ENV"

    - name: Setup pnpm cache
      if: inputs.save-pnpm-store == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

    # Saving a missed store is a post step of about 2.5 minutes on macOS (1.1 GB), which
    # holds back every job that needs this one.
    - name: Restore pnpm cache
      if: inputs.save-pnpm-store != 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

    # Postinstall scripts fetch release binaries (Electron) from GitHub, which can answer 504 for
    # minutes at a time. A frozen install is idempotent, so retry it a bounded number of times.
    # Each attempt is also bounded in time: a cold install on `macos-26-intel` takes 5–11 minutes,
    # and three Intel jobs that stalled in this setup on 2026-11-16 (runs 43801415465 and
    # 43813916763) held it until the job's timeout or a lost runner. Outside Windows a watchdog ends
    # an attempt's process group after `INFRA_RETRY_ATTEMPT_SECONDS`, so the next attempt runs
    # instead. Each retry is an `infra-retry` event (`apt-install/infra-retry.sh`).
    - name: Install dependencies
      env:
        INFRA_RETRY_ATTEMPT_SECONDS: '900'
        INFRA_RETRY_BACKOFF: '30 60'
      run: bash "$GITHUB_ACTION_PATH/../apt-install/infra-retry.sh" pnpm-install pnpm install --frozen-lockfile
      shell: bash

    # Every `pnpm nx` call goes through `nx-guard.ts`: it reruns a command once
    # when Nx dies from SIGSEGV, and points Nx at a local relay to the remote
    # cache that turns cache faults, oversize entries and refused writes into
    # misses (with a rerun with the cache off as the fallback; see the file
    # header). Every other exit status passes through unchanged.
    - name: Guard Nx against segfaults and remote cache faults
      if: runner.os != 'Windows'
      shell: bash
      env:
        GUARD: ${{ github.action_path }}/nx-guard.ts
      run: |
        bin=node_modules/.bin
        if [ -e "$bin/nx-segv-guarded" ]; then exit 0; fi
        mv "$bin/nx" "$bin/nx-segv-guarded"
        real="$(cd "$bin" && pwd)/nx-segv-guarded"
        printf '#!/bin/sh\nexec node --disable-warning=ExperimentalWarning "%s" "%s" "$@"\n' "$GUARD" "$real" > "$bin/nx"
        chmod +x "$bin/nx"

    - name: Set NX SHAs
      if: inputs.affected-base == ''
      uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

    # On `merge_group`, `nx-set-shas` sets NX_BASE to `HEAD^1`, and the recorded retry (RT-3,
    # `@taucad/vitest-ci`) diffs the entry from it to find the files the entry changes. A job that
    # checks out one commit (the default depth, as the end-to-end rows do) has no `HEAD^1`, so each
    # retried pass there failed its task as "the changed files are unknown (Command failed: git
    # merge-base HEAD^1 <sha>)" (run 45991511410). Fetch the parent whatever depth the job checked
    # out; a checkout that has it fetches nothing. Each retry is an `infra-retry` event.
    - name: Fetch the merge-queue base
      if: github.event_name == 'merge_group' && inputs.affected-base == ''
      shell: bash
      env:
        INFRA_RETRY_BACKOFF: '5 10'
      run: |
        set -euo pipefail
        if git rev-parse --quiet --verify 'HEAD^1^{commit}' > /dev/null; then exit 0; fi
        bash "$GITHUB_ACTION_PATH/../apt-install/infra-retry.sh" merge-queue-base-fetch \
          git fetch --no-tags --no-recurse-submodules --depth=2 origin "$(git rev-parse HEAD)"
        git rev-parse --quiet --verify 'HEAD^1^{commit}' > /dev/null

    # A push to `main` whose commit has a merge-group run diffs against the queue's own base,
    # so `nx affected` selects exactly the lanes the queue selected (`queue-verdict`).
    - name: Set NX SHAs to the given base
      if: inputs.affected-base != ''
      shell: bash
      env:
        BASE: ${{ inputs.affected-base }}
      run: |
        set -euo pipefail
        base=$(git rev-parse --verify "$BASE^{commit}")
        {
          echo "NX_BASE=$base"
          echo "NX_HEAD=$(git rev-parse --verify HEAD)"
        } >> "$GITHUB_ENV"
        echo "nx affected diffs against $BASE ($base)."
