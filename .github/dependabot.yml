version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 10
    versioning-strategy: 'increase'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      # Security updates have their own groups; routine batches cannot hold them.
      # These types follow manifest declarations, not runtime exposure analysis.
      security-production:
        applies-to: 'security-updates'
        dependency-type: 'production'
        patterns:
          - '*'
      security-development:
        applies-to: 'security-updates'
        dependency-type: 'development'
        patterns:
          - '*'
      # First match wins: keep related packages ahead of the patch catch-all.
      # Nx majors need a coherent migration across nx and all official plugins.
      nx:
        applies-to: 'version-updates'
        patterns:
          - 'nx'
          - '@nx/*'
          - '@nrwl/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # Vitest core, browser providers, coverage and UI require matching releases.
      vitest:
        applies-to: 'version-updates'
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # Auth adapters and UI packages declare peers on the auth core/plugins.
      auth:
        applies-to: 'version-updates'
        patterns:
          - 'better-auth'
          - '@better-auth/*'
          - '@better-auth-ui/*'
        update-types:
          - 'minor'
          - 'patch'
      # The Vite plugin and optional compiler must satisfy each other's peers.
      react-compiler:
        applies-to: 'version-updates'
        patterns:
          - '@vitejs/plugin-react'
          - 'oxc-transform-react'
        update-types:
          - 'minor'
          - 'patch'
      react:
        applies-to: 'version-updates'
        patterns:
          - '*react*'
        update-types:
          - 'minor'
          - 'patch'
      testing:
        applies-to: 'version-updates'
        patterns:
          - '*vitest*'
          - '*playwright*'
        update-types:
          - 'minor'
          - 'patch'
      eslint:
        applies-to: 'version-updates'
        patterns:
          - '*eslint*'
        update-types:
          - 'minor'
          - 'patch'
      patch-updates:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '10:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'github-actions'
      - 'ci'
      - 'automated'

    groups:
      actions-minor-patch:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directories:
      - '/apps/api'
      - '/packages/host'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '11:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(docker)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'

  - package-ecosystem: 'docker-compose'
    directory: '/infra'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '11:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(infra)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'

  - package-ecosystem: 'docker-compose'
    directory: '/infra/search'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '11:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(search)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'search'
      - 'automated'

  # Active native manifests; provenance-controlled sources and frozen fixtures stay separate.
  - package-ecosystem: 'cargo'
    directories:
      - '/packages/geospec-engine-native/rust'
      - '/packages/geospec-engine-native/bindings/emscripten'
      - '/packages/geospec-engine-native/bindings/node'
      - '/packages/geospec-engine-native/bindings/python'
      - '/packages/geospec-engine-native/bindings/wasm'
      - '/packages/geospec-engine-native/native/cache-host'
      - '/packages/geospec-engine-native/native/manifold-rust/adapter'
      - '/packages/geospec-engine-native/native/occt/rust'
      - '/packages/geospec-engine-native/native/runtime'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '12:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(root)'
    groups:
      cargo-minor-patch:
        applies-to: 'version-updates'
        patterns: ['*']
        update-types: ['minor', 'patch']
      cargo-security:
        applies-to: 'security-updates'
        patterns: ['*']
  - package-ecosystem: 'pip'
    directory: '/packages/geospec-engine-native/bindings/python'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '13:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(root)'
    groups:
      python-minor-patch:
        applies-to: 'version-updates'
        patterns: ['*']
        update-types: ['minor', 'patch']
      python-security:
        applies-to: 'security-updates'
        patterns: ['*']
