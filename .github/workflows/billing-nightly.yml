name: Billing nightly (local contracts)

# Same credential-free suite as PR/main CI; no provider account or hosted UI.
on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: billing-nightly
  cancel-in-progress: false

jobs:
  billing-nightly:
    name: Billing database and Stripe adapter contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      # postgres:17-alpine pinned by digest, the same pin as ci.yml's billing-e2e job, which says how to refresh it.
      - name: Pull the billing foundation PostgreSQL image
        run: |
          docker pull postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
          docker tag postgres@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac postgres:17-alpine

      - name: Run billing database and Stripe adapter contracts
        run: pnpm nx run-many -t test:billing-foundation

      # The two foundation suites that compose billing with the app's chat and agent-observability code.
      - name: Run the API's billing composition contracts
        run: pnpm nx run-many -t test:billing-composition
