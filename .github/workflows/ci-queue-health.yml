# Weekly merge-queue health report (CI decomposition blueprint, Part 5a, defect X7, work package DC-21).
#
# Queue rebuilds multiply the demand that causes every runner wait: when the head of the merge queue fails,
# every group behind it is cancelled and rebuilt. Once a week this reads the `merge_group` runs of `ci.yml`
# from the last 7 days and the jobs of every attempt through the jobs API, and reports runs by conclusion and
# by class (a failed run is one with a failed job, since `Fail fast` makes it conclude `cancelled`; origin,
# inherited and victim runs are counted apart, global review 2026-11-24 ruling 9), origin failures by the lane
# that failed first and the suites it names (the table suite owners read; Vitest's `github-actions` reporter
# names the tests), every attempt's runner minutes per class and of the cancelled runs, and each job's
# runner-wait share. A 5xx is retried with a backoff of up to a minute; a run the API keeps refusing is
# reported as not fetched rather than failing the report. The test flake ledger section (FQ-2) reads the per-test
# state `flake-ledger.yml` keeps on the `flake-ledger` branch: the tests with a flake event in the window, their
# executions and variants, and the completed runs the ledger has not counted. The Markdown goes to the job summary and the JSON to
# an artifact kept 90 days. It reads only: no issues or comments are posted, nothing is written to the Nx
# remote cache and no environment is used.
#
# Monday 07:23 UTC: after the weekend's quiet queue, before the operator's week starts. The nightly watchdog
# watches it as a weekly cron.
name: CI queue health

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Days of merge-group runs to report on
        type: number
        default: 7

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    name: Report merge-queue health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Report merge-queue health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || 7 }}
        run: node scripts/src/ci-queue-health-cli.ts --days "$DAYS" --out out/reports/ci-queue-health/queue-health.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-queue-health
          path: out/reports/ci-queue-health/queue-health.json
          if-no-files-found: warn
          retention-days: 90
