name: CI

on:
  push:
    branches: [main] # Only run on pushes to main branch
  pull_request:
    # PRs vs `main`: the fast lanes (plan, workspace, the affected lanes, the package checks
    # and the PR-only reports); the merge queue runs everything but viewer parity, which a pull request
    # runs when its own diff touches a parity input (VP-1). A draft runs nothing until it is
    # marked ready (`ready_for_review`). PRs targeting `production` only (trail PR): skip
    # checks — release gate is staging smoke + human merge.
    types: [opened, synchronize, reopened, ready_for_review]
    branches-ignore:
      - production
  # The merge queue runs the required checks on the exact commit that will land:
  # the PR on top of current `main` and every PR queued ahead of it. A green PR run
  # only proves the PR against the `main` its run started from, and required checks
  # are not strict, so two individually green PRs could land as a red `main`
  # (2026-10-29: #1133 over #1239, incidents/2026-10-29-tau-main-red-revisions-tests).
  merge_group:
    types: [checks_requested]
env:
  pnpm_config_verify_deps_before_run: warn
  # Nx remote cache, provisioned by tau-cloud `tau-ci-cache`. The server is set only when a
  # token is present (fork and Dependabot runs get none, and Nx fails on a tokenless 403).
  # Same-repository pull request jobs granted `id-token: write` swap the read token for a session that
  # writes only their own pull request's entries (tau-cloud CP-5b; setup-nx `nx-guard.ts`, item 5).
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN != '' && vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
  TAU_API_URL: http://localhost:4000
  TAU_WEBSOCKET_URL: ws://localhost:4001
  TAU_FRONTEND_URL: http://localhost:3000

# A newer push to a pull request, Dependabot's included, cancels its outdated run;
# different PRs run side by side. Each push to `main` gets a group of its own and is
# never cancelled, so it neither waits for nor cancels another: in one shared group a
# run held the group until its last job ended,
# including a Darwin job waiting hours for a macOS runner, and each newer push was
# cancelled while pending, staging deploy and release commit included (2026-10-11,
# runs 38179340616 and 38183401821).
#
# Staging deploys live in `staging.yml`, not here: this workflow's result is the
# colour of `main` and the gate every release reads (`main-ci-success`), so it holds
# only checks a pull request also runs. Deploy-only failures (Netlify credits, Fly
# registry errors, a missing environment secret) made `main` red for 111 of 214 red
# hours in October 2026 with no code at fault
# (incidents/2026-10-29-tau-main-red-revisions-tests).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One affected computation for the lanes that need a project list or a flag: the
  # service, browser, formal, GeoSpec, native-host, viewer-parity, end-to-end ratchet and
  # package-check lanes, the PR-only reports, and
  # `staging.yml` (the `ci-plan` artifact). The `affected-lane` jobs do not wait
  # for it: they run their own `nx affected` and read the queue verdict themselves.
  # Every selector here is a tag, a target name or a project type — no job in this
  # workflow may name a project, except the shell lane's path check below, which names
  # `sandbox`, the project whose rows those paths feed (shell split blueprint rows 15, 17).
  plan:
    name: Plan affected lanes
    # A draft pull request runs no CI (the runner pool is the queue's bottleneck,
    # 2026-11-10); marking it ready runs this workflow.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      api: ${{ steps.plan.outputs.api }}
      api-image: ${{ steps.plan.outputs.api-image }}
      billing: ${{ steps.plan.outputs.billing }}
      cli-e2e: ${{ steps.plan.outputs.cli-e2e }}
      size: ${{ steps.plan.outputs.size }}
      formal: ${{ steps.plan.outputs.formal }}
      formal-nightly: ${{ steps.plan.outputs.formal-nightly }}
      formal-nightly-projects: ${{ steps.plan.outputs.formal-nightly-projects }}
      geospec-examples: ${{ steps.plan.outputs.geospec-examples }}
      browser: ${{ steps.plan.outputs.browser }}
      browser-projects: ${{ steps.plan.outputs.browser-projects }}
      native-hosts: ${{ steps.plan.outputs.native-hosts }}
      native-darwin: ${{ steps.plan.outputs.native-darwin }}
      native-darwin-projects: ${{ steps.plan.outputs.native-darwin-projects }}
      native-linux: ${{ steps.plan.outputs.native-linux }}
      viewer-parity: ${{ steps.plan.outputs.viewer-parity }}
      desktop: ${{ steps.plan.outputs.desktop }}
      desktop-projects: ${{ steps.plan.outputs.desktop-projects }}
      shell: ${{ steps.plan.outputs.shell }}
      shell-projects: ${{ steps.plan.outputs.shell-projects }}
      e2e-queue: ${{ steps.plan.outputs.e2e-queue }}
      e2e-queue-suites: ${{ steps.plan.outputs.e2e-queue-suites }}
      pkgcheck: ${{ steps.plan.outputs.pkgcheck }}
      pkgcheck-shards: ${{ steps.plan.outputs.pkgcheck-shards }}
      node-floor: ${{ steps.plan.outputs.node-floor }}
      node-floor-shards: ${{ steps.plan.outputs.node-floor-shards }}
      compute-qualify: ${{ steps.plan.outputs.compute-qualify }}
      reused: ${{ steps.queue.outputs.run-id }}
      affected-base: ${{ steps.queue.outputs.affected-base }}
    steps:
      # A queue run diffs against its first parent (`nx-set-shas` sets NX_BASE to `HEAD^1`
      # on `merge_group`), so two commits are enough; pushes and pull requests keep full
      # history, which `nx-set-shas` walks to find their base (a push with a merge-group run
      # on its commit diffs against `HEAD^1` instead, `queue-verdict`).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      # A push to `main` whose identical commit passed the merge queue reuses that
      # verdict: no lane runs again. A push whose commit has a merge-group run diffs
      # against that run's base (`affected-base`), so this plan selects what the queue did.
      - name: Find the merge-queue verdict for this commit
        id: queue
        uses: ./.github/actions/queue-verdict
        with:
          github-token: ${{ github.token }}

      # Only `workspace` saves a missed pnpm store in pull requests and the queue (a save
      # is a 12–15 s post step on the job's end, X10). On a push the plan saves too: it is
      # the one job that sets up Nx on every push, and a push that reuses the queue verdict
      # skips `workspace`'s setup, while a store saved in the queue is scoped to the queue's
      # ref and never reaches `main` or the pull requests that read it.
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: ${{ github.event_name == 'push' && 'true' || 'false' }}
          affected-base: ${{ steps.queue.outputs.affected-base }}

      # One `nx show projects --affected` and one graph, and each lane's projects selected
      # from them by the tags, targets and project type in LANE_SELECTORS (seven separate
      # `nx show projects --affected` calls took 31–50 s). A selector naming a tag or a
      # target that no project has fails the step, rather than leaving its lane off.
      - name: Compute affected lanes
        id: plan
        env:
          REUSED: ${{ steps.queue.outputs.run-id }}
          # Billing contracts: the project that owns them (`api-billing`) or one it depends on changed.
          # CLI end-to-end suites: the project that owns them or one it depends on (the CLI) changed.
          # API image: the project with the `docker:smoke` target (`api`) or one it depends on
          # changed, so a change to another `scope:api` project (an end-to-end suite, `files`)
          # does not rebuild the production image.
          # Native host rows (`native-hosts.yml`): a `tag:ci:native-hosts` project (Build123d, PicoGK,
          # the CLI) or a `test:native-linux` project is affected; the latter are also the linux-x64
          # native rows it runs. Its Intel rows run at the desktop candidate gate, never here (INTEL-1).
          # Native darwin rows (`native-darwin.yml`): a `test:native-darwin` project (Build123d, PicoGK, the
          # CLI) is affected; `native-darwin-projects` names the rows. NATIVE_DARWIN_LANE_PATHS select every
          # such project: that workflow and the nuget standalone oracle's sources outside the native closure,
          # which its row's last steps read (go-live PRJ-1). Viewer parity (`viewer-parity.yml`, VP-1, operator ruling
          # 2026-11-18 "PR-side + release gate"): never in the merge queue (`queue: never`, lockfile or not). A ready pull
          # request runs it when its own diff touches a viewer-parity input (`pr: paths`): a path in VIEWER_PARITY_LANE_PATHS
          # (the viewer and its capture code, the Three.js and camera packages it renders through, the image plugin, the
          # render profile, the capture options, the parity scripts, manifest and committed fixtures, and the workflow), an
          # example directory the parity manifest names as a fixture source, or a VIEWER_PARITY_PINS renderer pin in
          # `pnpm-workspace.yaml` or its patch. Kernel code is not an input: the viewer and nanoraster draw the same GLB
          # bytes, so a kernel change moves both sides alike; kernel tests and the GeoSpec contracts cover the geometry, and
          # the release gate runs every fixture on every candidate. A push to `main` the queue did not prove runs it when
          # the graph finds `tau-examples` affected; the release gate (`release-gate.yml`) runs it on every candidate.
          # Desktop lane: a `tag:ci:desktop` project (the Electron app and, after the split, its services
          # host). No job here runs it: the packaged suite runs on every staging candidate instead
          # (operator decision D-DS1 (b), `desktop-packaged.yml`), so the lane is informational and
          # `lanes.json` records it for the observed desktop lane rate.
          # Shell lane: a `tag:ci:shell` project (the sandbox, native-process-core, the shell service, the
          # host and the Terminal concern), in the merge queue only; `shell-projects` names the rows' projects.
          # SHELL_LANE_PATHS select it too (with `sandbox`): the fixture producers and the workflow the graph
          # does not see, checked here rather than as target `inputs`, which would mark `sandbox` and every
          # project that depends on it affected in the ordinary lanes (shell split blueprint rows 15, 17).
          # Formal nightly lane (`formal-nightly.yml`, CI throughput review Q-4): a project with a `formal:nightly`
          # target is affected; the deep formal tiers run per project in the merge queue only, seeded by the commit.
          # End-to-end ratchet (`e2e-queue`, operator ruling 2026-11-15): a project with a `test:e2e:queue` target
          # is affected. That target's `dependsOn` lists the project's end-to-end suites that passed five consecutive
          # e2e-nightly runs (two before 2026-11-17, when merge-queue defect MQ-3 raised the bar); `e2e-queue-suites`
          # names one row per suite, and e2e-nightly.yml leaves them out.
          # `pr` is a lane's pull-request rule; without it a pull request runs the lane as the queue does.
          # "queue": the lane runs in the merge queue only. "touched": a pull request runs the lane only
          # for the selected projects that own a file of its own diff (Nx's file-to-project map: the
          # deepest project root above the file), never for one that is affected only through a dependency.
          # "paths": a pull request runs the lane for every project with its target when its own diff touches one of
          # the lane's paths, and not at all otherwise (viewer parity alone has a path list).
          # `queue` is a lane's merge-queue rule, read against the entry's own diff (`HEAD^1`), so a change to a
          # hub (`agent-host`, `host`) no longer carries every slow lane behind it (merge-queue defects MQ-2).
          # "touched": the lane runs for the selected projects that own a file of the diff. "any-touched": the
          # lane runs for every selected project when the diff touches one of them, and not at all otherwise.
          # "closure": the lane runs for the selected projects whose own dependency closure holds a project the
          # diff touches, walked without entering QUEUE_HUBS, so a hub change alone does not select them. "never": the
          # lane never runs in the merge queue. The release gate (RG-1, which replaced the formal nightly's schedule) runs
          # every `formal:nightly` project, the release gate every viewer-parity fixture, and the candidate gate the full
          # shell tier. A diff that touches `pnpm-lock.yaml` applies no `queue` rule but "never".
          # Node floor lane (`node-floor`, Brain research/node-26-ci-migration.md R2): an affected published package
          # (`type:package`, the release projects) with a `test` target; its suites run again on the `engines.node`
          # floor, Node 24, while every other lane runs setup-nx's Node 26 (compatibility policy: package tests and
          # universal Wasm instantiation at the declared host floor). A pull request runs the packages its diff touches.
          LANE_SELECTORS: >-
            {"apps": {"type": "app"},
             "api": {"tags": ["scope:api"], "pr": "touched"},
             "api-image": {"targets": ["docker:smoke"]},
             "billing": {"targets": ["test:billing-foundation"], "pr": "queue"},
             "cli-e2e": {"targets": ["test:scenarios"], "pr": "queue"},
             "size": {"targets": ["size"]},
             "formal": {"targets": ["formal:tla"], "pr": "queue"},
             "formal-nightly": {"targets": ["formal:nightly"], "pr": "queue", "queue": "touched"},
             "geospec-examples": {"targets": ["test-geospec"], "pr": "queue"},
             "browser": {"tags": ["ci:browser"], "targets": ["verify-browser"], "pr": "touched"},
             "native-hosts": {"tags": ["ci:native-hosts"], "pr": "queue", "queue": "closure"},
             "native-linux": {"targets": ["test:native-linux"], "pr": "queue", "queue": "closure"},
             "native-darwin": {"targets": ["test:native-darwin"], "pr": "queue"},
             "viewer-parity": {"targets": ["test:viewer-parity"], "pr": "paths", "queue": "never"},
             "desktop": {"tags": ["ci:desktop"]},
             "shell": {"tags": ["ci:shell"], "pr": "queue", "queue": "any-touched"},
             "e2e-queue": {"targets": ["test:e2e:queue"], "pr": "touched"},
             "compute-qualify": {"targets": ["compute-qualify-ci"]},
             "node-floor": {"tags": ["type:package"], "targets": ["test"], "pr": "touched"}}
          QUEUE_HUBS: '["agent-host", "host"]'
          SHELL_LANE_PATHS: >-
            [".github/workflows/shell-conformance.yml",
             "apps/desktop/scripts/hosted-linux-bwrap-fixture.mts",
             "apps/desktop/scripts/linux-apt-package.mts",
             "apps/desktop/scripts/runtime-stage.mts"]
          # Compute reuse qualification lane (`compute-qualify`, audit R5): `runtime-e2e:compute-qualify-ci` asserts the
          # Replicad reuse-off GLB hashes and work counts of `apps/runtime-e2e/src/compute-baseline`. runtime-e2e stays
          # quarantined from the test lanes, and it is affected by most of the workspace, so the selector's project is
          # kept only when a project the qualification measures is affected (COMPUTE_QUALIFY_LANE_PROJECTS) or a file it
          # reads outside the graph changed (COMPUTE_QUALIFY_LANE_PATHS: the harness and the pinned example models).
          COMPUTE_QUALIFY_LANE_PROJECTS: '["replicad", "runtime", "middleware", "occt-core", "esbuild"]'
          COMPUTE_QUALIFY_LANE_PATHS: >-
            ["apps/runtime-e2e/src/compute-baseline",
             "apps/runtime-e2e/project.json",
             "libs/tau-examples/src/kernels/replicad/gridfinity-box",
             "libs/tau-examples/src/kernels/replicad/six-axis-arm",
             "libs/tau-examples/src/kernels/replicad/spur-gearbox"]
          NATIVE_DARWIN_LANE_PATHS: >-
            [".github/workflows/native-darwin.yml",
             "scripts/src/check-standalone-project.ts",
             "scripts/src/standalone-geometry.ts",
             "apps/ui/app/constants/project.constants.ts",
             "apps/ui/app/utils/kernel-libraries.ts",
             "libs/tau-examples/src/standalone/picogk"]
          # A file or a directory each. The manifest's example sources (`libs/tau-examples/src/kernels/<kernel>/<example>`)
          # are read from the manifest itself, so a fixture added there is an input with no edit here.
          VIEWER_PARITY_LANE_PATHS: >-
            [".github/workflows/viewer-parity.yml",
             "packages/viewer",
             "packages/three",
             "packages/camera",
             "packages/plugins/image",
             "libs/types/src/constants/viewer-render-profile.constants.ts",
             "libs/agent-tools/src/capture",
             "libs/tau-examples/fixtures/viewer-parity",
             "libs/tau-examples/scripts/export-parity-fixtures.mts",
             "libs/tau-examples/scripts/viewer-parity.ts",
             "libs/tau-examples/scripts/viewer-parity-files.ts",
             "libs/tau-examples/scripts/viewer-parity-render.ts",
             "libs/tau-examples/scripts/viewer-parity.gate.test.ts",
             "libs/tau-examples/scripts/viewer-parity.wasm.browser.test.ts",
             "libs/tau-examples/vitest.viewer-parity.config.ts",
             "libs/tau-examples/project.json",
             "apps/ui/app/routes/convert/gear-8.glb"]
          # The renderers both sides run, as package-name patterns: their `pnpm-workspace.yaml` catalog pins (nanoraster and
          # its native addons) and three's patch. A changed pin line there, or a patch file of one, selects the lane.
          VIEWER_PARITY_PINS: '["three", "nanoraster(-[a-z0-9-]+)?"]'
        run: |
          # `pipefail` so a failing `nx` call fails the step instead of leaving an empty
          # output behind `tail`. `tail -1` keeps the JSON array and drops Nx's log lines.
          set -o pipefail
          affected=$(pnpm nx show projects --affected --json | tail -1)
          pnpm nx graph --file="$RUNNER_TEMP/graph.json" > /dev/null
          lanes=$(jq -c --argjson affected "$affected" --argjson selectors "$LANE_SELECTORS" '
            .graph.nodes as $nodes
            | ([$selectors[] | .tags[]?] - [$nodes[] | .data.tags[]?]) as $unknown_tags
            | ([$selectors[] | .targets[]?] - [$nodes[] | .data.targets // {} | keys[]]) as $unknown_targets
            | if ($unknown_tags + $unknown_targets) != [] then
                error("lane selectors name a tag or target no project has: \($unknown_tags + $unknown_targets | join(", "))")
              elif ([$selectors[] | .pr // empty] - ["queue", "touched", "paths"]) != [] then
                error("lane selectors name a pull-request rule other than queue, touched or paths")
              elif ([$selectors | to_entries[] | select(.value.pr == "paths") | .key] - ["viewer-parity"]) != [] then
                error("only the viewer-parity lane has a pull-request path list")
              elif ([$selectors[] | .queue // empty] - ["touched", "any-touched", "closure", "never"]) != [] then
                error("lane selectors name a merge-queue rule other than touched, any-touched, closure or never")
              else . end
            | $selectors | map_values(. as $selector
              | [$affected[] | . as $name | $nodes[$name] | select(. != null)
                  | select($selector.type == null or .type == $selector.type)
                  | select(all($selector.tags[]?; . as $tag | $nodes[$name].data.tags // [] | index([$tag]) != null))
                  | select(all($selector.targets[]?; . as $target | $nodes[$name].data.targets // {} | has($target)))
                  | $name] | sort)' "$RUNNER_TEMP/graph.json")
          # The project that owns a file, as Nx maps it: the deepest project root above the file, else the workspace.
          owner_def='($graph[0].graph.nodes | with_entries({key: (.value.data.root | if . == "" then "." else rtrimstr("/") end), value: .key})) as $roots
            | def owner: split("/") as $parts
                | [range($parts | length; 0; -1) as $depth | $parts[:$depth] | join("/")] + ["."]
                | map($roots[.] // empty) | first // empty;'
          # The shell lane's path check: a change to a fixture producer or to the shell workflow selects the
          # sandbox rows, whose guests install those fixtures (the reuse and pull-request rules below still apply).
          shell_paths=$(git diff --name-only --no-renames "$NX_BASE" "${NX_HEAD:-HEAD}" \
            | jq -cRn --argjson paths "$SHELL_LANE_PATHS" '[inputs | select(. as $file | $paths | index([$file]) != null)]')
          if [ "$shell_paths" != '[]' ]; then
            jq -e '.graph.nodes.sandbox.data.tags // [] | index(["ci:shell"]) != null' "$RUNNER_TEMP/graph.json" > /dev/null \
              || { echo "::error::the shell lane path check names sandbox, which is not a tag:ci:shell project"; exit 1; }
            lanes=$(jq -c '.shell |= (. + ["sandbox"] | unique)' <<< "$lanes")
            echo "Shell lane paths changed: $shell_paths"
          fi
          # The native darwin lane's path check: a change to its workflow or to a nuget oracle source outside
          # the graph selects every `test:native-darwin` project (a path names a file or a directory).
          darwin_paths=$(git diff --name-only --no-renames "$NX_BASE" "${NX_HEAD:-HEAD}" \
            | jq -cRn --argjson paths "$NATIVE_DARWIN_LANE_PATHS" \
                '[inputs | select(. as $file | any($paths[] as $path | $file == $path or ($file | startswith($path + "/")); .))]')
          if [ "$darwin_paths" != '[]' ]; then
            lanes=$(jq -c --slurpfile graph "$RUNNER_TEMP/graph.json" \
              '."native-darwin" = ([$graph[0].graph.nodes[] | select(.data.targets // {} | has("test:native-darwin")) | .name] | sort)' <<< "$lanes")
            echo "Native darwin lane paths changed: $darwin_paths"
          fi
          # The compute qualification lane's input check: keep its project only when a measured project is affected or a
          # qualification path changed (a path names a file or a directory).
          if [ "$(jq -c '."compute-qualify"' <<< "$lanes")" != '[]' ]; then
            qualify_projects=$(jq -c --argjson projects "$COMPUTE_QUALIFY_LANE_PROJECTS" \
              '[.[] | select(. as $name | $projects | index([$name]) != null)]' <<< "$affected")
            qualify_paths=$(git diff --name-only --no-renames "$NX_BASE" "${NX_HEAD:-HEAD}" \
              | jq -cRn --argjson paths "$COMPUTE_QUALIFY_LANE_PATHS" \
                  '[inputs | select(. as $file | any($paths[] as $path | $file == $path or ($file | startswith($path + "/")); .))]')
            if [ "$qualify_projects" = '[]' ] && [ "$qualify_paths" = '[]' ]; then
              lanes=$(jq -c '."compute-qualify" = []' <<< "$lanes")
              echo "Compute qualification lane: no measured project affected and no qualification path changed."
            else
              echo "Compute qualification inputs: projects $qualify_projects, paths $qualify_paths"
            fi
          fi
          # The viewer parity lane's path check, which only the pull-request "paths" rule below reads (`path_lanes`):
          # the pull request's own files (the same diff as that rule) against VIEWER_PARITY_LANE_PATHS and the
          # manifest's example sources, or a VIEWER_PARITY_PINS pin line of `pnpm-workspace.yaml` or its patch file.
          path_lanes='{}'
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            pr_base=$(git merge-base "$NX_BASE" "${NX_HEAD:-HEAD}")
            parity_paths=$(jq -c --argjson paths "$VIEWER_PARITY_LANE_PATHS" \
              '$paths + [.fixtures[].source | select(test("^[a-z0-9-]+/[a-z0-9-]+$")) | "libs/tau-examples/src/kernels/" + .]' \
              libs/tau-examples/fixtures/viewer-parity/fixtures.json)
            parity_files=$(git diff --name-only --no-renames --relative "$pr_base" "${NX_HEAD:-HEAD}" \
              | jq -cRn --argjson paths "$parity_paths" --argjson pins "$VIEWER_PARITY_PINS" '[inputs | select(. != "")
                  | select(. as $file | any($paths[] as $path | $file == $path or ($file | startswith($path + "/")); .)
                      or any($pins[] as $pin | $file | test("^tools/pnpm/patches/" + $pin + "@"); .))]')
            parity_pins=$(git diff --no-renames -U0 "$pr_base" "${NX_HEAD:-HEAD}" -- pnpm-workspace.yaml \
              | jq -cRn --argjson pins "$VIEWER_PARITY_PINS" '[inputs | select(test("^[-+][^-+]"))
                  | select(any($pins[] as $pin | test("^[-+]\\s+" + $pin + "(@[^:]*)?:"); .))]')
            if [ "$parity_files" != '[]' ] || [ "$parity_pins" != '[]' ]; then
              echo "Viewer parity inputs changed: $parity_files $parity_pins"
              path_lanes=$(jq -c '{"viewer-parity": ([.graph.nodes[] | select(.data.targets // {} | has("test:viewer-parity")) | .name] | sort)}' \
                "$RUNNER_TEMP/graph.json")
            fi
          fi
          # The merge queue applies each lane's `queue` rule to the entry's own files. A shell lane path counts as
          # touching `sandbox`, so the path checks above keep every shell project they selected.
          entry_files=$(git diff --name-only --no-renames "$NX_BASE" "${NX_HEAD:-HEAD}")
          if [ "$GITHUB_EVENT_NAME" = merge_group ] && grep -qxF pnpm-lock.yaml <<< "$entry_files"; then
            echo "The entry changes pnpm-lock.yaml: no merge-queue rule applies."
          elif [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            lanes=$(printf '%s\n' "$entry_files" \
              | jq -cRn --argjson lanes "$lanes" --argjson selectors "$LANE_SELECTORS" --argjson hubs "$QUEUE_HUBS" \
                  --argjson forced "$(if [ "$shell_paths" != '[]' ]; then echo '["sandbox"]'; else echo '[]'; fi)" \
                  --slurpfile graph "$RUNNER_TEMP/graph.json" "$owner_def"'
                ([inputs | select(. != "") | owner] + $forced) as $touched
                | ($graph[0].graph.dependencies // {}) as $deps
                | def touched: . as $name | $touched | index([$name]) != null;
                  # The project and every project it depends on, never entering a hub (the project itself may be one).
                  def closure: {seen: [.], todo: [.]}
                    | until(.todo == []; .todo[0] as $next | .todo |= .[1:]
                        | ([$deps[$next][]?.target] | unique) as $targets
                        | reduce ($targets[] | . as $target | select(($hubs | index([$target])) == null)) as $dep (.;
                            if (.seen | index([$dep])) == null then .seen += [$dep] | .todo += [$dep] else . end))
                    | .seen;
                $lanes | with_entries(.key as $lane | $selectors[$lane].queue as $rule
                  | if $rule == "touched" then .value |= map(select(touched))
                    elif $rule == "any-touched" and (any(.value[]; touched) | not) then .value = []
                    elif $rule == "closure" then .value |= map(select(any(closure[]; touched)))
                    else . end)')
            jq -r --argjson selectors "$LANE_SELECTORS" \
              'to_entries[] | select($selectors[.key].queue != null and $selectors[.key].queue != "never") | "Merge queue (\($selectors[.key].queue)) \(.key): \(.value | tojson)"' <<< "$lanes"
          fi
          # A "never" lane leaves the merge queue whatever the entry changes, the lockfile included (viewer parity, VP-1:
          # the pull request ran it on its own diff, and the release gate runs every fixture).
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            lanes=$(jq -c --argjson selectors "$LANE_SELECTORS" \
              'with_entries(if $selectors[.key].queue == "never" then .value = [] else . end)' <<< "$lanes")
            jq -r --argjson selectors "$LANE_SELECTORS" \
              'to_entries[] | select($selectors[.key].queue == "never") | "Merge queue (never) \(.key): \(.value | tojson)"' <<< "$lanes"
          fi
          jq -r 'to_entries[] | "Affected \(.key): \(.value | tojson)"' <<< "$lanes"
          # What `nx affected` selected, for `lanes.json` below.
          selected=$lanes
          # A push that reuses the merge-queue run on this commit runs no lane again: that run's
          # required gate passed, and the gate waits for every lane and fails on any selected lane
          # that did not pass. One rule for every lane; this plan diffed against the queue's own
          # base, so what it selected is what the queue selected and passed.
          if [ -n "$REUSED" ]; then
            lanes=$(jq -c 'map_values([])' <<< "$lanes")
            echo "Reusing merge-queue run $REUSED: its required gate passed every lane it selected on this commit; no lane runs again."
          fi
          # A pull request applies each lane's `pr` rule. The "queue" lanes run on the exact commit that
          # lands: a PR run of them proved nothing the queue does not prove again, and PR runs held about six
          # times the queue's runner minutes when the 60-job pool was the queue's bottleneck (2026-11-10).
          # A "touched" lane runs for the projects the diff itself changes, where a deterministic failure
          # would otherwise first evict a queue entry and rebuild every entry behind it (F15). The files are
          # Nx's own (`git diff --no-renames --relative` from the merge base of NX_BASE and NX_HEAD). A "paths" lane
          # runs the projects the lane's path check above found (`path_lanes`), and none when it found none.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            head=${NX_HEAD:-HEAD}
            lanes=$(git diff --name-only --no-renames --relative "$(git merge-base "$NX_BASE" "$head")" "$head" \
              | jq -cRn --argjson lanes "$lanes" --argjson selectors "$LANE_SELECTORS" --argjson matched "$path_lanes" \
                  --slurpfile graph "$RUNNER_TEMP/graph.json" "$owner_def"'
                [inputs | select(. != "") | owner] as $touched
                | $lanes | with_entries(.key as $lane | $selectors[$lane].pr as $rule
                  | if $rule == "queue" then .value = []
                    elif $rule == "touched" then .value |= map(. as $name | select($touched | index([$name]) != null))
                    elif $rule == "paths" then .value = ($matched[$lane] // [])
                    else . end)')
            jq -r --argjson selectors "$LANE_SELECTORS" \
              'to_entries[] | select($selectors[.key].pr != null) | "Pull request (\($selectors[.key].pr)) \(.key): \(.value | tojson)"' <<< "$lanes"
          fi
          flag() { jq -r --arg lane "$1" 'if .[$lane] == [] then "false" else "true" end' <<< "$lanes"; }
          api=$(flag api)
          billing=$(flag billing)
          formal=$(flag formal)
          formal_nightly=$(flag formal-nightly)
          formal_nightly_projects=$(jq -c '."formal-nightly"' <<< "$lanes")
          browser=$(flag browser)
          geospec_examples=$(flag geospec-examples)
          cli_e2e=$(flag cli-e2e)
          browser_projects=$(jq -c '.browser' <<< "$lanes")
          native_linux=$(jq -r '."native-linux" | join(",")' <<< "$lanes")
          native_hosts=$(jq -r 'if .["native-hosts"] == [] and .["native-linux"] == [] then "false" else "true" end' <<< "$lanes")
          native_darwin=$(flag native-darwin)
          native_darwin_projects=$(jq -r '."native-darwin" | join(",")' <<< "$lanes")
          viewer_parity=$(flag viewer-parity)
          desktop=$(flag desktop)
          desktop_projects=$(jq -c '.desktop' <<< "$lanes")
          shell=$(flag shell)
          shell_projects=$(jq -c '.shell' <<< "$lanes")
          e2e_queue=$(flag e2e-queue)
          # One row per ratcheted suite of the selected projects: each entry of a project's `test:e2e:queue`
          # `dependsOn` is a target of that project, run unsharded (an `e2e-chat-logs` merge of shards is the
          # nightly's alone), so anything else fails the plan rather than drop a suite.
          e2e_queue_suites=$(jq -c --slurpfile graph "$RUNNER_TEMP/graph.json" '
            $graph[0].graph.nodes as $nodes
            | [."e2e-queue"[] as $project | $nodes[$project].data.targets as $targets
                | $targets["test:e2e:queue"].dependsOn // [] | .[]
                | if type != "string" or ($targets[.] == null) then
                    error("\($project):test:e2e:queue depends on \(tojson), which is not a target of \($project)")
                  elif ($targets[.].metadata.shards // 1) > 1 then
                    error("\($project):\(.) declares shards; the e2e-queue lane runs a suite as one job")
                  else {project: $project, target: ., label: "\($project) \(.)", slug: ("\($project)-\(.)" | gsub(":"; "-"))} end]' <<< "$lanes")
          # Package checks (`pkgcheck`): every affected project with a `pkgcheck`, `audit-public-surface` or
          # `readme-quickstart` target, under no pull-request or merge-queue rule (as the lane ran them before it
          # waited for this plan), dealt by measured seconds into one shard per 600 s, at most four. A push that
          # reuses the merge-queue run selects none, as every lane.
          pkgcheck_projects='[]'
          if [ -z "$REUSED" ]; then
            pkgcheck_projects=$(jq -c --argjson affected "$affected" '
              .graph.nodes as $nodes
              | [$affected[] | select($nodes[.].data.targets // {}
                  | has("pkgcheck") or has("audit-public-surface") or has("readme-quickstart"))] | sort' "$RUNNER_TEMP/graph.json")
          fi
          pkgcheck_shards=$(echo "$pkgcheck_projects" | node scripts/src/test-shard-dealer.ts --shard all --shards auto \
            --max-shards 4 --shard-seconds 600 --durations scripts/src/pkgcheck-shard-durations.json)
          echo "Package-check shards: $pkgcheck_shards"
          # Node floor shards (`node-floor`): the lane's packages as their `<project>:test` tasks (the snapshot's keys),
          # a package with `test:shard-<n>` targets as those tasks instead, as in the test lanes, dealt by measured
          # uncached test seconds into one shard per 600 s, at most four, as the package checks are.
          node_floor_units=$(jq -c --argjson projects "$(jq -c '."node-floor"' <<< "$lanes")" '
            .graph.nodes as $nodes
            | [$projects[] as $project
               | ([$nodes[$project].data.targets // {} | keys[] | select(test("^test:shard-[1-9][0-9]*$"))]) as $shards
               | if ($shards | length) > 0 then $shards[] | "\($project):\(.)" else "\($project):test" end]' "$RUNNER_TEMP/graph.json")
          node_floor_shards=$(echo "$node_floor_units" | node scripts/src/test-shard-dealer.ts --shard all --shards auto \
            --max-shards 4 --shard-seconds 600 --durations scripts/src/test-shard-durations.json)
          echo "Node floor shards: $node_floor_shards"
          # `api-image` keeps the PR-only Docker smoke test on the PRs that affect the API image.
          api_image=$(flag api-image)
          {
            echo "apps=$(jq -c '.apps' <<< "$lanes")"
            echo "browser-projects=$browser_projects"
            echo "api=$api"
            echo "api-image=$api_image"
            echo "billing=$billing"
            echo "cli-e2e=$cli_e2e"
            echo "size=$(flag size)"
            echo "formal=$formal"
            echo "formal-nightly=$formal_nightly"
            echo "formal-nightly-projects=$formal_nightly_projects"
            echo "browser=$browser"
            echo "geospec-examples=$geospec_examples"
            echo "native-hosts=$native_hosts"
            echo "native-darwin=$native_darwin"
            echo "native-darwin-projects=$native_darwin_projects"
            echo "native-linux=$native_linux"
            echo "viewer-parity=$viewer_parity"
            echo "desktop=$desktop"
            echo "desktop-projects=$desktop_projects"
            echo "shell=$shell"
            echo "shell-projects=$shell_projects"
            echo "e2e-queue=$e2e_queue"
            echo "e2e-queue-suites=$e2e_queue_suites"
            echo "pkgcheck=$(if [ "$pkgcheck_shards" = '[]' ]; then echo false; else echo true; fi)"
            echo "pkgcheck-shards=$pkgcheck_shards"
            echo "node-floor=$(if [ "$node_floor_shards" = '[]' ]; then echo false; else echo true; fi)"
            echo "node-floor-shards=$node_floor_shards"
            echo "compute-qualify=$(flag compute-qualify)"
          } >> "$GITHUB_OUTPUT"
          # `staging.yml` reads which service lanes `nx affected` selected (`api`, `billing-e2e`,
          # keyed by their job), before the reuse and pull-request rules above, and the merge-queue
          # run this push reused (`reused-run`): a lane skipped here is acceptable to a deploy only
          # when it was not selected, or when the reused run's gate passed it.
          # `desktop` and `desktop-projects` record the desktop lane, which no job runs (see above).
          mkdir -p out/ci-plan
          jq -n --argjson selected "$selected" --arg reused "$REUSED" \
            --arg desktop "$desktop" --argjson desktop_projects "$desktop_projects" \
            '{api: ($selected.api != [] | tostring), "billing-e2e": ($selected.billing != [] | tostring), "reused-run": $reused, desktop: $desktop, "desktop-projects": $desktop_projects}' \
            > out/ci-plan/lanes.json
          cat out/ci-plan/lanes.json

      - name: Upload the lane plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-plan
          path: out/ci-plan/lanes.json
          if-no-files-found: error
          retention-days: 7

  # Every workspace invariant is a `scripts:validate-*` target; `scripts:validate`
  # is the wildcard umbrella over all of them (frontmatter, workspace root,
  # project names and tags, tsgo runtime references, quickstart budget, license
  # partitions, formatting, dead code, license deps, workflows). A new validator
  # joins by adding the target — this job never changes.
  # A push to `main` whose identical commit passed the merge queue passes on that
  # verdict (`queue-verdict`); it still reports, so `staging.yml` reads it.
  workspace:
    name: Validate workspace
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    permissions:
      id-token: write # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Find the merge-queue verdict for this commit
        id: queue
        uses: ./.github/actions/queue-verdict
        with:
          github-token: ${{ github.token }}

      - name: Setup Nx Environment
        if: steps.queue.outputs.run-id == ''
        uses: ./.github/actions/setup-nx

      - name: Run workspace validators
        if: steps.queue.outputs.run-id == ''
        run: pnpm nx run scripts:validate

      # A change to the PicoGK browser host pin merges only once both dependency hosts, production
      # dependencies.tau.new and staging dependencies.taucad.dev, serve every blob it names with its
      # pinned digest, so `main` never names a digest either environment does not serve (charter
      # picogk-interim-digest-consumer, D9 and I2). It runs in this required check, on the pull
      # request and in the merge queue, only when the pin differs from the base.
      - name: Prove a changed PicoGK browser host pin is served on both hosts
        if: steps.queue.outputs.run-id == '' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PIN: packages/plugins/picogk/browser-host.pin.json
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- "$PIN"; then
            echo "$PIN is unchanged from the base; no blob to prove."
          else
            node scripts/src/picogk-browser-host-pin.ts check --pin "$PIN"
          fi

      # A change to the resolved `cadmpeg-ts` version merges only once both dependency hosts serve every
      # gzip engine its `cadmpeg-ts/digests` names, with that digest, so `main` never resolves engines
      # tau.new or staging cannot load (cadmpeg engine delivery charter, I4). It runs in this required
      # check, on the pull request and in the merge queue, and downloads only when the lockfile resolves
      # other `cadmpeg-ts` versions than the base. A failure names the dispatch that mirrors the version
      # (`dependency-files-publish.yml` with `cadmpeg-version`).
      - name: Prove a changed cadmpeg-ts version's engines are served on both hosts
        if: steps.queue.outputs.run-id == '' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is unchanged from the base; no engine to prove."
          else
            git show "$BASE_SHA:pnpm-lock.yaml" > "$RUNNER_TEMP/base-pnpm-lock.yaml"
            node scripts/src/check-cadmpeg-engine-mirror.ts --base-lockfile "$RUNNER_TEMP/base-pnpm-lock.yaml"
          fi

  # The affected tasks run as parallel lanes on separate standard runners: two lint, two typecheck,
  # two build and six test shards, and the package-check shards (`pkgcheck` below). One runner running
  # every task in turn took 1 h 40 min on a full graph (run 37221169741, 2026-10-04); the lanes bring
  # that down to the longest lane. Each lane keeps `--parallel=1`, which its own 16 GB runner still
  # needs (see `Run the lane's tasks`). Lint, typecheck and build each ended past 10 min at p90 as one
  # job (13.3, 17.8 and 13.4 min over 60 green queue runs), so each is two shards dealt by measured
  # task seconds (Brain research/ci-structural-decomposition-blueprint.md, ST-3).
  #
  # No `needs: plan`: every lane selects its own projects with `nx affected`, and the only
  # thing it read from the plan was the queue verdict, which it now finds itself, as
  # `workspace` does. Waiting for the plan put 2.1–3.9 min on every queue run's critical
  # path (Brain research/ci-decomposition-blueprint.md, X1). A push to `main` whose commit
  # passed the merge queue reuses that run's lanes: every step after the verdict skips, and
  # the required `affected` gate passes on the plan's own verdict. A push whose commit has a
  # merge-group run that did not pass runs the lanes against the queue's base (`affected-base`).
  affected-lane:
    name: Affected (${{ matrix.lane }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      id-token: 'write' # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }} # Merge queue: a failed row cancels its siblings (see `fail-fast-*`)
      matrix:
        lane:
          [lint-1, lint-2, typecheck-1, typecheck-2, build-1, build-2, test-1, test-2, test-3, test-4, test-5, test-6]
    env:
      # The build lanes' targets, in `nx affected` and the deal alike.
      BUILD_TARGETS: build size check-desktop-payload check-critical-budget check-static-shells check-server-output check-route-module-patch check-cadmpeg-engine-absence check-serve-ui-layer
    steps:
      # Two commits in a queue run, full history otherwise (see `plan`).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      # A no-op unless this is a push to `main`; on pull requests and in the merge queue
      # `run-id` is always empty, so every step below runs.
      - name: Find the merge-queue verdict for this commit
        id: queue
        uses: ./.github/actions/queue-verdict
        with:
          github-token: ${{ github.token }}

      - name: Setup Nx Environment
        if: steps.queue.outputs.run-id == ''
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
          affected-base: ${{ steps.queue.outputs.affected-base }}

      - name: Setup Linux sandbox prerequisites
        if: startsWith(matrix.lane, 'test-') && steps.queue.outputs.run-id == ''
        uses: ./.github/actions/setup-linux-sandbox

      # The PR gate documented in docs/policy/release-policy.md: under version plans,
      # a touched release project with no plan is an unreleased change. Base and head
      # come from NX_BASE/NX_HEAD, which `nrwl/nx-set-shas` exported above. Not run on
      # `push`, where the release commit itself touches every manifest after consuming
      # the plans.
      - name: Check version plans
        if: matrix.lane == 'build-1' && github.event_name == 'pull_request'
        run: pnpm nx release plan:check

      # Pinned third-party downloads come from the Actions cache, so only a pin change asks their
      # origin (Brain research/ci-flake-classes.md class 1, R3: during a GitHub Releases outage the
      # wasi-sdk of `prepare` and the CPython of `seed` failed 34 lane jobs in two days). The lane's
      # task graph, for the same targets as the step below, decides which entries it needs, so a
      # lane that runs neither task restores nothing (the kernel seeds are about 350 MB, the
      # wasi-sdk archive 125 MB); a shard reads its lane's whole affected graph, as the deal
      # happens in the step below (which the lint, typecheck and build shards read too).
      # Keys digest the pins themselves (scripts/src/ci-pinned-downloads.ts). The consumers
      # re-verify every byte against its pin, and on a miss they download as before;
      # `ci-pinned-downloads.yml` saves the entries from `main`, whose cache scope pull requests
      # and the merge queue restore from.
      - name: Find the lane's pinned downloads
        id: pins
        if: steps.queue.outputs.run-id == ''
        env:
          LANE: ${{ matrix.lane }}
        run: |
          graph="$RUNNER_TEMP/lane-graph.json"
          case "$LANE" in
            lint-*) pnpm nx affected -t lint --graph="$graph" > /dev/null ;;
            typecheck-*) pnpm nx affected -t typecheck --graph="$graph" > /dev/null ;;
            # shellcheck disable=SC2086 # BUILD_TARGETS is a word list
            build-*) pnpm nx affected -t $BUILD_TARGETS --graph="$graph" > /dev/null ;;
            test-*) pnpm nx affected -t test --exclude tag:scope:api,tag:ci:quarantined --graph="$graph" > /dev/null ;;
            *) echo "Unknown lane $LANE" >&2; exit 1 ;;
          esac
          node scripts/src/ci-pinned-downloads.ts --graph "$graph" >> "$GITHUB_OUTPUT"

      - name: Restore the Python kernel seeds
        if: steps.queue.outputs.run-id == '' && steps.pins.outputs.kernel-seeds-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pins.outputs.kernel-seeds-path }}
          key: ${{ steps.pins.outputs.kernel-seeds-key }}

      - name: Restore the wasi-sdk archive
        if: steps.queue.outputs.run-id == '' && steps.pins.outputs.wasi-sdk-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pins.outputs.wasi-sdk-path }}
          key: ${{ steps.pins.outputs.wasi-sdk-key }}

      # Nx Affected runs only tasks affected by the changes in this PR/commit.
      # Browser-backed targets are not in this list — they run nightly in
      # e2e-nightly.yml, the only workflow that installs Chromium.
      # Learn more: https://nx.dev/ci/features/affected
      #
      # `test` excludes `tag:scope:api`, because these lanes have no services. The API's
      # default suite carries the repository store, the git transport and the lifecycle
      # jobs (charter W1, W2, W4, W6), which drive real PostgreSQL and real MinIO and
      # refuse rather than skip when they are absent. The whole of `test` for that tag
      # runs in the `api` lane below, which has both; these lanes stay hermetic.
      #
      # The lint, typecheck and build shards deal from the graph the step above wrote (one `nx affected` per job,
      # ST-4), never from this file: it holds the lane's affected tasks and the project graph without running
      # anything (X8). Each shard computes the same deal, so the shards partition the lane's projects and the task
      # each project owns runs in exactly one shard (scripts/src/test-shard-dealer.test.ts and
      # scripts/src/affected-shard-union.test.ts). They deal projects by measured task seconds with the tasks
      # they depend on (`--graph`), so `ui` and the desktop build its payload check needs share a build shard
      # instead of building it twice. A task another shard's project also depends on may run in both; Nx caches it.
      #
      # The six test shards split the affected projects with a `test` target by
      # measured uncached seconds of their tests and the tasks those depend on, from the same graph
      # (scripts/src/test-shard-dealer.ts --graph and its duration snapshot, CI decomposition global
      # review G5). The project list comes from the graph at run time,
      # never from this file: one `nx affected -t test --graph=<file>` writes the affected
      # `test` tasks and the project graph (each project's tags and targets) without running
      # anything, in place of an `nx show projects --affected` and an `nx graph` (X8).
      # A project that declares `test:shard-<n>` targets is dealt as those tasks instead of
      # its whole `test`: `ui:test`, about 950 s uncached, is six `ui:test:shard-<n>` tasks of
      # about 160 s, so it no longer sets one lane's floor (CI throughput review ST-1,
      # decomposition rows DC-9/DC-10). Each is cacheable and keyed on its own `--shard`; its
      # Vitest config deals the files by measured seconds, and the six run every file once
      # (apps/ui/test-shards.test.ts). Locally, `ui:test` still runs every file.
      #
      # `--parallel=1`: ui:lint and ui:typecheck each peak near 9.5 GB, so any two of
      # them (or ui:build) together exhaust the 16 GB hosted runner, which then loses
      # its VM ("The runner has received a shutdown signal"). At Nx's default of three
      # this happened a few minutes in; at two it still happened once both overlapped.
      # `test` needs the same cap: overlapping WASM suites lost the VM the same way
      # a few minutes into `test` (tau#306 and tau#299, 2026-10-04).
      #
      # The build lanes also run `ui:check-desktop-payload`, the desktop renderer ownership
      # gate, whenever `ui` is affected: a renderer-only change no longer selects `desktop`,
      # so the desktop `package-*` targets that also depend on it never run for it (Brain
      # research/desktop-split-blueprint.md, D-DS2). Its `ui:build:desktop` and
      # `desktop:build` dependencies stay serial here under the same `--parallel=1`.
      #
      # They also run `ui:check-critical-budget`, the critical-path budget (progressive loading
      # guard G3): each route class's interactive tier in `ui:build`, the one adaptive build (adaptive
      # app deployment mode W12), against the `adaptive` entry. Its source guards (G1 lint, G2 graph
      # test) run in the lint and test lanes. `ui:check-static-shells` (PL3) renders each static shell through that build's
      # server output: neutral and deterministic bytes, the function's own document, its build id
      # and headers, no rendered placeholder.
      #
      # `size` selects `ui:size`, the SSR bundle budget on `ui:build`'s server output, and
      # `check-server-output` selects `ui:check-server-output` and `docs:check-server-output`
      # (React Router 8 migration RR0, RD8): no server output of the web, desktop, `tau serve`
      # or docs build holds a .wasm file, a worker bundle or a client asset. The ui check adds
      # `ui:build:serve` to the lane; its other builds are already here.
      # `check-route-module-patch` selects `ui:check-route-module-patch` (RR8, RD4): the web,
      # desktop and `tau serve` client builds ship React Router's route-module loader with
      # Tau's local patch. `check-cadmpeg-engine-absence` selects `ui:check-cadmpeg-engine-absence`
      # (cadmpeg engine delivery charter D16, I1): no web, desktop or `tau serve` build holds a file
      # whose SHA-256 is an engine digest of the installed `cadmpeg-ts`; its builds are already here.
      - name: Run the lane's tasks
        if: steps.queue.outputs.run-id == ''
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -o pipefail
          graph="$RUNNER_TEMP/lane-graph.json"
          case "$LANE" in
            lint-* | typecheck-* | build-*)
              kind=${LANE%-*}
              targets=$kind
              if [ "$kind" = build ]; then targets=$(tr ' ' ',' <<< "$BUILD_TARGETS"); fi
              projects=$(jq -c --arg targets "$targets" '
                ($targets | split(",")) as $mine
                | [.tasks.tasks[] | select(.target.target | IN($mine[])) | .target.project] | unique' "$graph")
              shard=$(echo "$projects" | node scripts/src/test-shard-dealer.ts --shard "${LANE##*-}" --shards 2 \
                --durations "scripts/src/$kind-shard-durations.json" --graph "$graph" --targets "$targets")
              if [ -z "$shard" ]; then
                echo "No affected $kind projects in this shard."
                exit 0
              fi
              echo "Shard projects: $shard"
              pnpm nx run-many -t "$targets" --projects "$shard" --parallel=1
              ;;
            test-*)
              # GeoSpec suites run here against the published `geospec-engine` prebuild for
              # this runner. `ci:quarantined` projects (runtime-e2e) run only in the nightly
              # workflow until their failing tests pass there: https://github.com/taucad/tau/issues/342
              pnpm nx affected -t test --exclude tag:scope:api,tag:ci:quarantined --graph="$RUNNER_TEMP/test-graph.json" > /dev/null
              # The task graph also holds the tasks `test` depends on (builds and the like),
              # so keep the `test` tasks, and drop an excluded tag again in case another
              # project's `test` ever depends on one of theirs.
              projects=$(jq -c '
                .graph.nodes as $nodes
                | [.tasks.tasks[] | select(.target.target == "test") | .target.project] | unique
                | map(select($nodes[.].data.tags // [] | any(. == "scope:api" or . == "ci:quarantined") | not))' "$RUNNER_TEMP/test-graph.json")
              # A project with `test:shard-<n>` targets enters the deal as its `<project>:test:shard-<n>`
              # tasks, every one of them, in place of the project; the rest enter as projects.
              units=$(jq -c --argjson projects "$projects" '
                .graph.nodes as $nodes
                | [$projects[] as $project
                   | ([$nodes[$project].data.targets // {} | keys[] | select(test("^test:shard-[1-9][0-9]*$"))]) as $shards
                   | if ($shards | length) > 0 then $shards[] | "\($project):\(.)" else $project end]' "$RUNNER_TEMP/test-graph.json")
              # Every lane deals the same list heaviest first by duration, so the shards partition it and the
              # slowest suites land apart. A unit weighs its own task and every task it depends on (`--graph`,
              # durations keyed by task), counted once per shard: a lane runs the builds and prepare tasks its
              # suites need uncached whenever the build lanes have not cached them yet (`cli:test`'s forty builds
              # took 137 s in queue run 45350462131), and units that share them land together.
              # `--shards` is the number of `test-<n>` rows in the matrix above.
              shard=$(echo "$units" | node scripts/src/test-shard-dealer.ts --shard "${LANE#test-}" --shards 6 \
                --graph "$RUNNER_TEMP/test-graph.json" --targets test)
              if [ -z "$shard" ]; then
                echo "No affected test projects in this shard."
                exit 0
              fi
              echo "Shard projects and tasks: $shard"
              projects=$(echo "$shard" | tr ',' '\n' | grep -v ':' | paste -sd, - || true)
              tasks=$(echo "$shard" | tr ',' '\n' | grep ':' || true)
              : > "$RUNNER_TEMP/affected-test.log"
              status=0
              # Streamed, not `static`: Nx holds a static task's output until the task ends and then
              # prints only its first 64–128 KiB into a pipe, so a long suite lost its Vitest summary and
              # every failing test's name (F3; `ui:test` in queue runs 43990460984, 44048796415,
              # 44050273147 and 44062740359 stopped mid-run in both the job log and this file).
              if [ -n "$projects" ]; then
                pnpm nx run-many -t test --projects "$projects" --parallel=1 --outputStyle=stream 2>&1 | tee -a "$RUNNER_TEMP/affected-test.log" || status=1
              fi
              # A project's dealt shard tasks run in one `run-many`, and every project's run even when
              # another failed, so a failed shard hides no other result.
              for project in $(echo "$tasks" | cut -d: -f1 | sort -u); do
                targets=$(echo "$tasks" | grep "^$project:" | cut -d: -f2- | paste -sd' ' -)
                # shellcheck disable=SC2086 # one word per target
                pnpm nx run-many -t $targets --projects "$project" --parallel=1 --outputStyle=stream 2>&1 | tee -a "$RUNNER_TEMP/affected-test.log" || status=1
              done
              exit "$status"
              ;;
            *) echo "Unknown lane $LANE" >&2; exit 1 ;;
          esac

      # The full log of a full-graph run is far longer than the API's log tail, so a failed
      # test phase repeats each failing test's file and name first, then each failing suite's
      # report (and the sandbox host facts the native suites depend on), as the job's last output.
      # The names come first and alone, so a long report can never push them out of the excerpt.
      - name: Summarize failed affected tests
        if: failure() && startsWith(matrix.lane, 'test-')
        run: |
          echo '::group::Sandbox host'
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces 2>&1 || true
          sudo grep -Ei 'bwrap|unshare|userns' /sys/kernel/security/apparmor/profiles || echo 'no bwrap, unshare or userns AppArmor profile loaded'
          findmnt -no FSTYPE /tmp || true
          bwrap --unshare-user --cap-drop ALL --ro-bind / / --dev /dev --unshare-pid --proc /proc -- \
            unshare --user --map-root-user --pid --fork --mount-proc true \
            && echo 'nested user namespace: ok' || echo 'nested user namespace: blocked'
          echo '::endgroup::'
          if [ -f "$RUNNER_TEMP/affected-test.log" ]; then
            # Vitest's `FAIL  <file> > <suite> > <test>` lines, without colour, Nx's project prefix kept.
            failing=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/affected-test.log" | grep -E '(^|[[:space:]])FAIL[[:space:]]' | sort -u | head -200 || true)
            echo 'Failing tests:'
            echo "${failing:-No Vitest FAIL line in the test log; see the task output above.}"
            awk '/Failed Tests [0-9]+|Failed Suites [0-9]+/ { keep = 1; n = 0 }
                 keep && n < 300 { print; n++ }
                 /Test Files / { keep = 0 }' "$RUNNER_TEMP/affected-test.log"
            grep -nE 'exited \([0-9]+\)|apply-seccomp|bwrap:|uid_map|ERR_|Unhandled|out of memory|Test timed out' \
              "$RUNNER_TEMP/affected-test.log" | head -100
          fi

      # The M3 verdict helpers left with `geospec` for taucad/geospec, which runs them in its own CI.
      - name: Check the affected GeoSpec consumer
        if: matrix.lane == 'build-1' && steps.queue.outputs.run-id == ''
        run: pnpm nx affected -t check-geospec-test-consumer

      - name: Check workspace root hygiene
        if: always() && steps.queue.outputs.run-id == ''
        run: pnpm nx run scripts:validate-workspace-root

      # FQ-1 (CI flake quarantine blueprint): the rows `@taucad/vitest-ci` wrote, one per test execution, for the
      # flake ledger. A task replayed from the cache restores its rows with the ids of the run that executed it.
      - name: Upload test outcomes
        if: always() && startsWith(matrix.lane, 'test-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-outcomes-${{ matrix.lane }}
          path: out/test-results/*/*.outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # The package checks (publint, attw, madge, the public-surface audit and the README quickstart) of the
  # affected projects that have one. The plan deals them by measured uncached `pkgcheck` seconds
  # (scripts/src/pkgcheck-shard-durations.json, with the test shards' dealer), one shard per 600 s and at most
  # four (`pkgcheck-shards`), so a narrow entry runs one job and a root package change four: as three fixed
  # shards each ended past 10 min at p90 (15.4, 12.5 and 14.8 min over 60 green queue runs) while a narrow
  # entry still started all three (Brain research/ci-structural-decomposition-blueprint.md, ST-3 and ST-4
  # "fewer jobs"). The plan's one graph names the projects, so this job builds no affected graph of its own;
  # it waits for the plan, which ends at about 2 min. The shards partition the selected projects
  # (scripts/src/test-shard-dealer.test.ts), and the required gate needs every shard.
  # They run on the `engines.node` floor, Node 24, with the `node-floor` lane: the checks exercise the packed packages
  # users install, and the compatibility policy asks for that evidence at the declared host floor.
  pkgcheck:
    name: Affected (pkgcheck-${{ matrix.shard.shard }})
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.pkgcheck == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      id-token: 'write' # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }} # Merge queue: a failed row cancels its siblings (see `fail-fast-*`)
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.pkgcheck-shards) }}
    steps:
      # Two commits in a queue run, full history otherwise (see `plan`).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.20.0' # The `engines.node` floor line, as in `node-floor`
          save-pnpm-store: 'false'
          affected-base: ${{ needs.plan.outputs.affected-base }}

      # The shard's task graph, for its pinned downloads (as in the affected lanes) and its builds below.
      - name: Find the shard's pinned downloads
        id: pins
        env:
          PROJECTS: ${{ matrix.shard.projects }}
        run: |
          graph="$RUNNER_TEMP/pkgcheck-graph.json"
          pnpm nx run-many -t pkgcheck audit-public-surface readme-quickstart --projects "$PROJECTS" --graph="$graph" > /dev/null
          node scripts/src/ci-pinned-downloads.ts --graph "$graph" >> "$GITHUB_OUTPUT"

      - name: Restore the Python kernel seeds
        if: steps.pins.outputs.kernel-seeds-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pins.outputs.kernel-seeds-path }}
          key: ${{ steps.pins.outputs.kernel-seeds-key }}

      - name: Restore the wasi-sdk archive
        if: steps.pins.outputs.wasi-sdk-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pins.outputs.wasi-sdk-path }}
          key: ${{ steps.pins.outputs.wasi-sdk-key }}

      - name: Run the shard's package checks
        env:
          PROJECTS: ${{ matrix.shard.projects }}
        run: |
          set -o pipefail
          graph="$RUNNER_TEMP/pkgcheck-graph.json"
          echo "Shard projects: $PROJECTS"
          # publint, attw, madge and the surface checks are light, so they run three at
          # a time once their builds exist. The builds stay serial and land in the local
          # cache, so the checks reuse them.
          built=$(jq -r --arg shard "$PROJECTS" '
            ($shard | split(",")) as $mine
            | [.tasks.tasks[] | select(.target.target == "pkgcheck") | .target.project]
            | unique | map(select(IN($mine[]))) | join(",")' "$graph")
          # A `build` without `^build` may run before the libraries its package bundles and
          # keep their specifiers in its declarations, and the local cache hands that build
          # to its check. The builds its checks depend on run first, and the shard's own
          # builds skip the remote cache, which may still hold such a build from before
          # this order: the hash does not see whether a dependency was built.
          deps=$(jq -r --arg built "$built" '
            ($built | split(",")) as $mine
            | [$mine[] as $p | .tasks.dependencies["\($p):pkgcheck"][]? | select(endswith(":build"))
               | split(":")[0] | select(IN($mine[]) | not)]
            | unique | join(",")' "$graph")
          if [ -n "$deps" ]; then
            pnpm nx run-many -t build --projects "$deps" --parallel=1
          fi
          if [ -n "$built" ]; then
            pnpm nx run-many -t build --projects "$built" --parallel=1 --skip-remote-cache
          fi
          pnpm nx run-many -t pkgcheck audit-public-surface readme-quickstart --projects "$PROJECTS" --parallel=3

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

  # The Node floor lane (Brain research/node-26-ci-migration.md, option (a), operator ruling 2026-11-24). setup-nx gives
  # every other lane Node 26 LTS, whose V8 14.6 has the wasm import-wrapper fix Node 24's 13.6 lacks
  # (nodejs/node#66366). The published packages still declare `engines.node >=24.0.0`, so the compatibility policy
  # asks for their tests at that floor ("Published-package tests at `engines.node` minimum") and for each universal
  # Wasm artifact to instantiate on Node 24. This lane runs the `test` of the affected published packages
  # (`type:package`) on Node 24.20.0, the 24.x line CI ran before. The kernel packages' suites load the wasm payloads
  # each package ships (replicad and opencascade OCCT, PicoVoxel and Manifold, in their `single` and `multi` builds),
  # so they are the Wasm instantiation smoke at the floor, run whenever a package or anything it depends on changes.
  # Their #2730 V8 flags apply on V8 13 only, that is here. The package checks run on the floor too (`pkgcheck`
  # above). The plan deals the packages by measured test seconds, as the package checks; API, UI, browser, end-to-end
  # and desktop suites stay off the floor (they ship on Tau-controlled runtimes, not on users' Node).
  node-floor:
    name: Node 24 floor (${{ matrix.shard.shard }})
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.node-floor == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      id-token: 'write' # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }} # Merge queue: a failed row cancels its siblings (see `fail-fast-*`)
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.node-floor-shards) }}
    steps:
      # Two commits in a queue run, full history otherwise (see `plan`).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.20.0' # The `engines.node` floor line, as in `pkgcheck`
          save-pnpm-store: 'false'
          affected-base: ${{ needs.plan.outputs.affected-base }}

      - name: Setup Linux sandbox prerequisites
        uses: ./.github/actions/setup-linux-sandbox

      # The shard's task graph, for its pinned downloads (as in the affected lanes).
      - name: Find the shard's pinned downloads
        id: pins
        env:
          UNITS: ${{ matrix.shard.projects }}
        run: |
          graph="$RUNNER_TEMP/node-floor-graph.json"
          projects=$(tr ',' '\n' <<< "$UNITS" | cut -d: -f1 | sort -u | paste -sd, -)
          pnpm nx run-many -t test --projects "$projects" --graph="$graph" > /dev/null
          node scripts/src/ci-pinned-downloads.ts --graph "$graph" >> "$GITHUB_OUTPUT"

      - name: Restore the Python kernel seeds
        if: steps.pins.outputs.kernel-seeds-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pins.outputs.kernel-seeds-path }}
          key: ${{ steps.pins.outputs.kernel-seeds-key }}

      - name: Restore the wasi-sdk archive
        if: steps.pins.outputs.wasi-sdk-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pins.outputs.wasi-sdk-path }}
          key: ${{ steps.pins.outputs.wasi-sdk-key }}

      # As the test lanes: the shard's whole `test` projects in one `run-many`, then each sharded package's dealt
      # `test:shard-<n>` tasks, every one run even when another failed. Streamed, so a long suite keeps its summary.
      - name: Run the shard's tests on the floor Node
        env:
          UNITS: ${{ matrix.shard.projects }}
        run: |
          set -o pipefail
          node --version
          echo "Shard projects and tasks: $UNITS"
          projects=$(tr ',' '\n' <<< "$UNITS" | grep -E '^[^:]+:test$' | cut -d: -f1 | paste -sd, - || true)
          tasks=$(tr ',' '\n' <<< "$UNITS" | grep -vE '^[^:]+:test$' || true)
          status=0
          if [ -n "$projects" ]; then
            pnpm nx run-many -t test --projects "$projects" --parallel=1 --outputStyle=stream || status=1
          fi
          for project in $(echo "$tasks" | cut -d: -f1 | sort -u); do
            targets=$(echo "$tasks" | grep "^$project:" | cut -d: -f2- | paste -sd' ' -)
            # shellcheck disable=SC2086 # one word per target
            pnpm nx run-many -t $targets --projects "$project" --parallel=1 --outputStyle=stream || status=1
          done
          exit "$status"

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

  browser:
    name: Browser, accessibility and Lighthouse
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    timeout-minutes: 20
    env:
      WWW_LAUNCH: 'true'
      WWW_ORIGIN: https://tau.new
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
      - name: Install Chromium (system dependencies)
        uses: ./.github/actions/apt-install
        with:
          playwright-browsers: chromium
      - name: Install Chromium
        run: ./.github/actions/apt-install/infra-retry.sh playwright-install pnpm exec playwright install chromium
      - name: Use the pinned browser for Lighthouse
        run: node --input-type=module -e "import { chromium } from 'playwright'; console.log('CHROME_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Verify affected browser applications
        env:
          BROWSER_PROJECTS: ${{ needs.plan.outputs.browser-projects }}
        run: |
          projects=$(jq -r 'join(",")' <<< "$BROWSER_PROJECTS")
          test -n "$projects"
          pnpm nx run-many -t verify-browser --projects "$projects" --parallel=1
      - name: Package the marketing SSR function
        if: contains(fromJSON(needs.plan.outputs.apps), 'www')
        working-directory: apps/www
        run: |
          "$GITHUB_WORKSPACE/scripts/node_modules/.bin/netlify" functions:build \
            --src "$GITHUB_WORKSPACE/apps/www/.netlify/v1/functions" \
            --functions "$GITHUB_WORKSPACE/out/reports/www/functions"
      - name: Upload browser and Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: out/reports/
          retention-days: 14

      # FQ-1 (CI flake quarantine blueprint): the rows `@taucad/vitest-ci` wrote, one per test execution, for the
      # flake ledger. A task replayed from the cache restores its rows with the ids of the run that executed it.
      - name: Upload test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-outcomes-browser
          path: out/test-results/*/*.outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # Standalone-project oracles, in `standalone-projects.yml` (also nightly): on every push to
  # `main` only. Not required checks, so they wait for the required gate rather than take three
  # runners while the required lanes still queue for one (X3); `!cancelled()` keeps them running
  # when a lane failed. Never in the merge queue: there they started after the gate, so the queue
  # run was still in progress when GitHub merged, `merge-queue-sweep.yml` cancelled it, and the
  # push found no queue verdict to reuse (Brain ci-audit 2026-11-12, F1 and F2). The push and the
  # nightly already run them on every commit that lands.
  standalone:
    name: Standalone projects
    needs: [plan, affected]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/standalone-projects.yml
    secrets: inherit

  # The native host rows (`native-hosts.yml`), in the merge queue and on a push the queue did not
  # prove, when the plan finds a `tag:ci:native-hosts` or `test:native-linux` project affected: the
  # Linux rows (`hosts: linux`) with the affected `test:native-linux` projects (CI throughput review Q-3).
  # The darwin-x64 rows run at the desktop candidate gate (`release-desktop-staging.yml` job `Intel native
  # gate`, INTEL-1), not here. Its plan job is skipped when called; a dispatch runs that workflow on its
  # own. The required check waits for it.
  native-hosts:
    name: Native hosts
    needs: [plan]
    if: needs.plan.outputs.native-hosts == 'true'
    permissions:
      contents: 'read'
    uses: ./.github/workflows/native-hosts.yml
    with:
      hosts: linux
      native-linux: ${{ needs.plan.outputs.native-linux }}

  # The darwin-arm64 native rows (`native-darwin.yml`), in the merge queue and on a push the queue did
  # not prove, when the plan finds a `test:native-darwin` project affected or a native darwin lane path
  # changed (CI throughput review Q-2). A pull request keeps the `native-darwin` label for early signal;
  # the desktop candidate gate runs the benchmarks. The required check waits for it.
  native-darwin:
    name: Native darwin
    needs: [plan]
    if: needs.plan.outputs.native-darwin == 'true'
    permissions: # The called workflow's plan job declares these
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    uses: ./.github/workflows/native-darwin.yml
    with:
      ref: ${{ github.sha }}
      projects: ${{ needs.plan.outputs.native-darwin-projects }}
      benchmarks: false
    secrets:
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}

  # The viewer parity gate (`viewer-parity.yml`, eight capture shards and one gate over every fixture), never in the
  # merge queue (VP-1, operator ruling 2026-11-18 "PR-side + release gate"): on a ready pull request whose own diff
  # touches a viewer-parity input, and on a push the queue did not prove when the graph finds `tau-examples` affected.
  # The required check waits for it, so a red parity run keeps the pull request from being enqueued (auto-merge
  # enqueues only once the pull request's checks pass). The release gate runs it on every candidate, uncached.
  viewer-parity:
    name: Viewer parity
    needs: [plan]
    if: needs.plan.outputs.viewer-parity == 'true'
    permissions:
      contents: 'read'
    uses: ./.github/workflows/viewer-parity.yml
    with:
      ref: ${{ github.sha }}

  # The shell conformance rows (`shell-conformance.yml`, semantics tier), in the merge queue only,
  # when the plan finds a `tag:ci:shell` project affected or a shell lane path changed: the affected
  # projects' targets on the three stock Linux guests and MAC-A, with no Electron build or application
  # tier. MAC-X runs at the desktop candidate gate. A pull request keeps the `shell-conformance` label for
  # early signal; a push to `main` reuses the queue verdict, and the candidate gate runs the full tier fresh.
  # The required check waits for it (shell split blueprint PR 4). It passes the read token alone, never
  # `secrets: inherit`; the called macOS job runs in `nx-cache-write`, whose write token replaces it, so the
  # queue reads and writes the fingerprinted verdicts (CF-1, CP-5b follow-up).
  shell:
    name: Shell conformance
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.shell == 'true' && github.event_name == 'merge_group' }}
    permissions:
      contents: read
    uses: ./.github/workflows/shell-conformance.yml
    with:
      ref: ${{ github.sha }}
      tier: semantics
      projects: ${{ needs.plan.outputs.shell-projects }}
    secrets:
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}

  # The formal nightly tiers (`formal-nightly.yml`: mutants, fresh-seed differentials and simulations, nightly
  # configs), in the merge queue only, one job per affected `formal:nightly` project and target, each with
  # its own 120-minute budget. The seed source is the queue commit's sha, so each landing explores a fresh
  # seed and a re-run of the same commit replays it. A pull request leaves the lane to the queue, a push to
  # `main` reuses the queue verdict, and the release gate (RG-1) runs every project with a seed of its own.
  # The required check waits for it (CI throughput review, Q-4 step 2). It passes the read token alone, never
  # `secrets: inherit`; the called jobs run in `nx-cache-write`, whose write token replaces it, so the queue
  # reuses an unchanged project's cached `formal:nightly:check` shards (CI throughput review, formal speed).
  formal-nightly:
    name: Formal nightly
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.formal-nightly == 'true' && github.event_name == 'merge_group' }}
    permissions: # Required for nrwl/nx-set-shas (in setup-nx) to read workflow runs
      actions: 'read'
      contents: 'read'
    uses: ./.github/workflows/formal-nightly.yml
    with:
      ref: ${{ github.sha }}
      projects: ${{ needs.plan.outputs.formal-nightly-projects }}
      seed: ${{ github.sha }}
    secrets:
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}

  # The end-to-end ratchet (operator ruling 2026-11-15): every end-to-end suite that passed five consecutive
  # e2e-nightly runs (two before 2026-11-17, MQ-3) leaves the nightly for good and runs here, in the merge queue (and on a push to `main` the
  # queue did not prove), whenever its project is affected. A project lists its ratcheted suites in its
  # `test:e2e:queue` target's `dependsOn`; the plan turns them into one row per suite and e2e-nightly.yml skips
  # them, so a later ratchet is a one-line `project.json` edit. A pull request runs the suites of the projects its
  # own diff touches (`pr: touched`, merge-queue defect MQ-5), so a deterministic failure is seen before it queues.
  # Each row is the nightly's job for that suite: one suite per runner (one after another they outlast a job,
  # run 37221169741), the same browsers, Pandoc, sandbox, software Vulkan and xvfb, and the same chat log
  # validation for a suite that opens a chat. The slowest first-batch suite took 10.4 min as a whole nightly job
  # (run 43752242587, `ui-e2e test:e2e:daemon-host`), so the bounds below sit at half the nightly's 120/150.
  # The required check waits for every row.
  e2e-queue:
    name: Browser end-to-end (${{ matrix.suite.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.e2e-queue == 'true' }}
    permissions:
      contents: 'read'
      actions: 'read'
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }} # Merge queue: a failed row cancels its siblings (see `fail-fast-*`)
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.e2e-queue-suites) }}
    env:
      # The suites that open no chat, so capture no chat log for the empty-capture rule to find: e2e-nightly.yml's list.
      SUITES_WITHOUT_CHAT: '["test:e2e:non-isolated", "test:e2e:deploy-skew", "test:e2e:service-worker", "test:e2e:filesystem-scenarios"]'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      # The ui-e2e matrix also has `firefox` and `webkit-smoke` instances, and
      # `test:e2e:non-isolated` runs PicoVoxel on Chromium and Firefox.
      - name: Install browsers for Vitest Browser (system dependencies)
        uses: ./.github/actions/apt-install
        with:
          playwright-browsers: chromium firefox webkit
      - name: Install browsers for Vitest Browser
        run: ./.github/actions/apt-install/infra-retry.sh playwright-install pnpm exec playwright install chromium firefox webkit

      # `scripts:test:e2e` converts HTML references with Pandoc 3.1.4 or newer, and
      # its expected Markdown follows current Pandoc; Ubuntu's package is 3.1.3.
      - name: Install Pandoc for reference conversion
        run: |
          ./.github/actions/apt-install/infra-retry.sh pandoc-download curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.12/pandoc-3.12-1-amd64.deb
          echo "91903ff19f1b1d4db4129797c7e18f71212990d7394fcff1787719aebf04e372  $RUNNER_TEMP/pandoc.deb" | sha256sum --check --quiet
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"

      # Sandboxed native kernel workers.
      - name: Setup Linux sandbox prerequisites
        uses: ./.github/actions/setup-linux-sandbox

      # Hosts that render under plain Node (the CLI and the daemon) need a Vulkan adapter, and the
      # runner has no GPU: lavapipe, Mesa's Vulkan CPU driver, as in e2e-nightly.yml.
      - name: Install a software Vulkan driver for native rendering
        uses: ./.github/actions/apt-install
        with:
          packages: mesa-vulkan-drivers
      - name: Select the software Vulkan driver
        run: echo 'VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json' >> "$GITHUB_ENV"

      # The development billing values a suite that boots the API reads, as in e2e-nightly.yml.
      - name: Prepare API env file
        run: cp apps/api/.env.example apps/api/.env

      # `--parallel=1`: the suites' ui:build, ui:build:serve and ui:build:desktop prerequisites each
      # peak near 10 GB. Streamed, because Nx holds a task's output until it ends and a timed-out
      # step loses it.
      - name: Run the end-to-end suite
        timeout-minutes: 60
        env:
          TAU_E2E_WEBGPU_PROFILE: software
          PROJECT: ${{ matrix.suite.project }}
          TARGET: ${{ matrix.suite.target }}
        run: xvfb-run --auto-servernum pnpm nx run-many -t "$TARGET" --projects "$PROJECT" --parallel=1 --outputStyle=stream

      # Field trace validation, as in e2e-nightly.yml: every events.jsonl the suite captured at teardown
      # is validated against ChatLog.tla, including after a failed suite.
      - name: Setup formal toolchains
        if: ${{ !cancelled() && !contains(fromJSON(env.SUITES_WITHOUT_CHAT), matrix.suite.target) }}
        uses: ./.github/actions/setup-formal
        with:
          tools: tlc

      - name: Validate captured chat logs
        if: ${{ !cancelled() && !contains(fromJSON(env.SUITES_WITHOUT_CHAT), matrix.suite.target) }}
        env:
          PROJECT: ${{ matrix.suite.project }}
        run: pnpm nx run-many -t formal:logs --projects "$PROJECT"

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

      - name: Upload Vitest Browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-queue-diagnostics-${{ matrix.suite.slug }}
          path: |
            out/test-results/vitest-browser
            out/test-results/filesystem-scenarios
            out/test-results/chat-logs
            out/reports/formal
          if-no-files-found: ignore
          retention-days: 7

      # FQ-1 (CI flake quarantine blueprint): the rows `@taucad/vitest-ci` wrote, one per test execution, for the
      # flake ledger. A task replayed from the cache restores its rows with the ids of the run that executed it.
      - name: Upload test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-outcomes-e2e-${{ matrix.suite.slug }}
          path: out/test-results/*/*.outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # Compute reuse qualification (audit R5): the cheap subset of the Replicad qualification matrix, run whenever the
  # plan's input check selects it. It asserts reuse-off GLB hashes, byte parity with reuse on across cache histories,
  # multi-thread WASM parity and the per-step work counts pinned in
  # `apps/runtime-e2e/src/compute-baseline/qualification-baselines.json`; timings are recorded, never asserted. Only
  # this target runs here; runtime-e2e's other suites stay quarantined.
  compute-qualify:
    name: Compute reuse qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.compute-qualify == 'true' }}
    permissions:
      contents: 'read'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Run the qualification subset
        timeout-minutes: 40
        # The plan selected the lane through the target; the one project that declares it runs.
        run: pnpm nx run-many -t compute-qualify-ci --parallel=1 --outputStyle=stream

      # FQ-1 (CI flake quarantine blueprint): the rows `@taucad/vitest-ci` wrote, one per test execution, for the
      # flake ledger. A task replayed from the cache restores its rows with the ids of the run that executed it.
      - name: Upload test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-outcomes-compute-qualify
          path: out/test-results/*/*.outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # The required check. It passes only when the plan and every affected lane passed, and every
  # lane the plan selects too when this run needed it (every package-check shard, browser, GeoSpec example
  # contracts, CLI end-to-end, the end-to-end ratchet, compute reuse qualification, native hosts, viewer parity, formal, API tests, billing
  # contracts, the Node 24 floor shards, and the shell rows and formal nightly tiers in the merge queue): a skip of a lane the plan selected
  # fails it. Viewer parity is planned on pull requests and pushes only (VP-1), so on a pull request that touches
  # its inputs this check, which the queue's auto-merge waits for, holds the pull request until parity passes. It
  # waits for every lane, so a merge-queue run whose gate passed proves every lane it selected, which is the one
  # proof `queue-verdict` reuses on the push (Brain ci-audit 2026-11-12, F1). API tests are a
  # required check of their own as well, so the queue already waited for them; in the ten latest
  # queue runs that ran formal and billing contracts (2026-11-12), both finished before the gate
  # or before API tests.
  #
  # In the merge queue the gate runs even in a cancelled run (`always()`), so the `fail-fast-*` jobs below can
  # end a failed run early: a lane they cancelled reports `cancelled`, which fails the gate's checks, and the
  # gate itself ends `failure`. Under `!cancelled()` it would be skipped instead, and GitHub counts a skipped
  # required check as passed. Pull requests and pushes keep `!cancelled()`, so a pull request run superseded
  # by a newer push still skips it.
  affected:
    name: Run affected tasks
    needs:
      [
        plan,
        affected-lane,
        pkgcheck,
        browser,
        geospec-examples,
        cli-e2e,
        native-hosts,
        native-darwin,
        viewer-parity,
        formal,
        api,
        billing-e2e,
        shell,
        formal-nightly,
        e2e-queue,
        compute-qualify,
        node-floor,
      ]
    if: ${{ github.event_name == 'merge_group' && always() || !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every affected lane
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LANES_RESULT: ${{ needs.affected-lane.result }}
          PKGCHECK_REQUIRED: ${{ needs.plan.outputs.pkgcheck }}
          PKGCHECK_RESULT: ${{ needs.pkgcheck.result }}
          BROWSER_REQUIRED: ${{ needs.plan.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          GEOSPEC_EXAMPLES_REQUIRED: ${{ needs.plan.outputs.geospec-examples }}
          GEOSPEC_EXAMPLES_RESULT: ${{ needs.geospec-examples.result }}
          CLI_E2E_REQUIRED: ${{ needs.plan.outputs.cli-e2e }}
          CLI_E2E_RESULT: ${{ needs.cli-e2e.result }}
          NATIVE_HOSTS_REQUIRED: ${{ needs.plan.outputs.native-hosts }}
          NATIVE_HOSTS_RESULT: ${{ needs.native-hosts.result }}
          NATIVE_DARWIN_REQUIRED: ${{ needs.plan.outputs.native-darwin }}
          NATIVE_DARWIN_RESULT: ${{ needs.native-darwin.result }}
          VIEWER_PARITY_REQUIRED: ${{ needs.plan.outputs.viewer-parity }}
          VIEWER_PARITY_RESULT: ${{ needs.viewer-parity.result }}
          FORMAL_REQUIRED: ${{ needs.plan.outputs.formal }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          API_REQUIRED: ${{ needs.plan.outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          BILLING_REQUIRED: ${{ needs.plan.outputs.billing }}
          BILLING_RESULT: ${{ needs.billing-e2e.result }}
          SHELL_REQUIRED: ${{ needs.plan.outputs.shell }}
          SHELL_RESULT: ${{ needs.shell.result }}
          FORMAL_NIGHTLY_REQUIRED: ${{ needs.plan.outputs.formal-nightly }}
          FORMAL_NIGHTLY_RESULT: ${{ needs.formal-nightly.result }}
          E2E_QUEUE_REQUIRED: ${{ needs.plan.outputs.e2e-queue }}
          E2E_QUEUE_RESULT: ${{ needs.e2e-queue.result }}
          COMPUTE_QUALIFY_REQUIRED: ${{ needs.plan.outputs.compute-qualify }}
          COMPUTE_QUALIFY_RESULT: ${{ needs.compute-qualify.result }}
          NODE_FLOOR_REQUIRED: ${{ needs.plan.outputs.node-floor }}
          NODE_FLOOR_RESULT: ${{ needs.node-floor.result }}
          EVENT: ${{ github.event_name }}
          REUSED: ${{ needs.plan.outputs.reused }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          if [ "$DRAFT" = true ]; then
            echo "Draft pull request: no CI runs until it is marked ready for review."
            exit 0
          fi
          test "$PLAN_RESULT" = success
          if [ -n "$REUSED" ]; then
            echo "Merge-queue run $REUSED passed every lane it selected on this commit."
            exit 0
          fi
          test "$LANES_RESULT" = success
          if [ "$PKGCHECK_REQUIRED" = true ]; then test "$PKGCHECK_RESULT" = success; fi
          if [ "$BROWSER_REQUIRED" = true ]; then test "$BROWSER_RESULT" = success; fi
          if [ "$GEOSPEC_EXAMPLES_REQUIRED" = true ]; then test "$GEOSPEC_EXAMPLES_RESULT" = success; fi
          if [ "$CLI_E2E_REQUIRED" = true ]; then test "$CLI_E2E_RESULT" = success; fi
          if [ "$NATIVE_HOSTS_REQUIRED" = true ]; then test "$NATIVE_HOSTS_RESULT" = success; fi
          if [ "$NATIVE_DARWIN_REQUIRED" = true ]; then test "$NATIVE_DARWIN_RESULT" = success; fi
          if [ "$VIEWER_PARITY_REQUIRED" = true ]; then test "$VIEWER_PARITY_RESULT" = success; fi
          if [ "$FORMAL_REQUIRED" = true ]; then test "$FORMAL_RESULT" = success; fi
          if [ "$API_REQUIRED" = true ]; then test "$API_RESULT" = success; fi
          if [ "$BILLING_REQUIRED" = true ]; then test "$BILLING_RESULT" = success; fi
          if [ "$SHELL_REQUIRED" = true ] && [ "$EVENT" = merge_group ]; then test "$SHELL_RESULT" = success; fi
          if [ "$FORMAL_NIGHTLY_REQUIRED" = true ] && [ "$EVENT" = merge_group ]; then test "$FORMAL_NIGHTLY_RESULT" = success; fi
          if [ "$E2E_QUEUE_REQUIRED" = true ]; then test "$E2E_QUEUE_RESULT" = success; fi
          if [ "$COMPUTE_QUALIFY_REQUIRED" = true ]; then test "$COMPUTE_QUALIFY_RESULT" = success; fi
          if [ "$NODE_FLOOR_REQUIRED" = true ]; then test "$NODE_FLOOR_RESULT" = success; fi

  # Merge-queue fail-fast (CI throughput review, merge-queue ejection review MQ-7). The queue builds five
  # entries at a time, and removes a failed entry and rebuilds every entry behind it only once the failed
  # run concludes. `Validate workspace` failed about 3 min into a run while the gate waited 25–35 min for
  # the slowest lane, holding the failed entry and each rebuild behind it (Brain
  # research/artifacts/ci-throughput-review/runs/2026-11-17-cloud/mq/queue-18h). So in the merge queue only,
  # one small job per required lane (each lane the gate needs, and `Validate workspace`) waits for that lane
  # alone and, when it failed, cancels the rest of this run. A matrix lane fails fast there for the same
  # reason, so its first failed row ends the lane. The gate still runs (`always()` above) and ends `failure`:
  # the failed lane fails it, and so does every lane the cancellation stopped. A job here fires only on its
  # own lane's `failure`: a lane skipped because the plan failed is the plan job's to report, and a lane
  # cancelled by the sweep or by another `fail-fast-*` job never fires one. Each cancels its own run
  # (`GITHUB_RUN_ID`) and nothing else, with the run cancel, never the force cancel, which would also stop
  # the gate. Only these jobs hold `actions: write`. Pull requests and pushes never run them.
  fail-fast-workspace:
    name: Fail fast (workspace)
    needs: [workspace]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.workspace.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: &fail-fast-permissions
      actions: write # Cancel this run, and only this run
    steps: &fail-fast-steps
      - name: Cancel the rest of this merge-queue run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" > /dev/null; then
            echo "::notice::A required lane failed; cancelled the rest of run ${GITHUB_RUN_ID}, so the queue removes the entry now."
          else
            echo "::warning::Could not cancel run ${GITHUB_RUN_ID}; it may already be cancelling."
          fi

  fail-fast-plan:
    name: Fail fast (plan)
    needs: [plan]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.plan.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-affected-lane:
    name: Fail fast (affected-lane)
    needs: [affected-lane]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.affected-lane.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-pkgcheck:
    name: Fail fast (pkgcheck)
    needs: [pkgcheck]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.pkgcheck.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-browser:
    name: Fail fast (browser)
    needs: [browser]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.browser.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-geospec-examples:
    name: Fail fast (geospec-examples)
    needs: [geospec-examples]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.geospec-examples.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-cli-e2e:
    name: Fail fast (cli-e2e)
    needs: [cli-e2e]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.cli-e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-native-hosts:
    name: Fail fast (native-hosts)
    needs: [native-hosts]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.native-hosts.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-native-darwin:
    name: Fail fast (native-darwin)
    needs: [native-darwin]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.native-darwin.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  # Viewer parity never runs in the merge queue (VP-1), so this job never fires; it stays while the gate needs the lane.
  fail-fast-viewer-parity:
    name: Fail fast (viewer-parity)
    needs: [viewer-parity]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.viewer-parity.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-formal:
    name: Fail fast (formal)
    needs: [formal]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.formal.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-api:
    name: Fail fast (api)
    needs: [api]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.api.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-billing-e2e:
    name: Fail fast (billing-e2e)
    needs: [billing-e2e]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.billing-e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-shell:
    name: Fail fast (shell)
    needs: [shell]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.shell.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-formal-nightly:
    name: Fail fast (formal-nightly)
    needs: [formal-nightly]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.formal-nightly.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-e2e-queue:
    name: Fail fast (e2e-queue)
    needs: [e2e-queue]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.e2e-queue.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-compute-qualify:
    name: Fail fast (compute-qualify)
    needs: [compute-qualify]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.compute-qualify.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  fail-fast-node-floor:
    name: Fail fast (node-floor)
    needs: [node-floor]
    if: ${{ failure() && github.event_name == 'merge_group' && needs.node-floor.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: *fail-fast-permissions
    steps: *fail-fast-steps

  # Formal lane (docs/policy/formal-verification-policy.md): the Java and Lean tiers
  # of every affected project with a `formal:tla` or `formal:lean` target. A known counterexample is an
  # expected verdict and never turns this red; a changed verdict, a stale generated
  # file, a missing tool or a watchdog does. Toolchains come from setup-formal,
  # pinned by sha256 in tools/formal/toolchain.lock, never from `pnpm install`.
  # Three shards deal the affected formal tasks by measured uncached seconds with the test
  # shards' dealer and its own snapshot (scripts/src/formal-shard-durations.json). A project
  # whose TLA+ specs sit in families below specs/ has one `formal:tla:<family>` task per
  # family and a `formal:tla` that only depends on them (tools/formal.plugin.ts), so its
  # families are dealt to runners of their own and run in parallel, each held to the Java
  # tier's 3 min per target (policy § 6, which names agent-host's unsplit `formal:tla` as over
  # it). A change to tools/formal makes every project affected, and on one runner that ran out
  # of 15 minutes with ui still to go (queue run 43190779343, job 131090042426: 3.5 min of
  # setup, then 11.7 min of checks). agent-host's `formal:tla`, about 6.7 min, is the floor of one shard.
  formal:
    name: Formal models (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    needs: [plan]
    if: needs.plan.outputs.formal == 'true'
    # The heaviest shard measures about 10 min (3.5 of setup, agent-host's 6.7); 20 allows
    # for the up-to-twofold runner variance the formal nightly showed (runs 43167548945 and 43178267338).
    timeout-minutes: 20
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }} # Merge queue: a failed row cancels its siblings (see `fail-fast-*`)
      matrix:
        shard: [1, 2, 3]
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      id-token: 'write' # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
          affected-base: ${{ needs.plan.outputs.affected-base }}

      - name: Deal affected formal tasks
        id: deal
        # The tasks are `<project>:<target>` ids (scripts/src/formal-tasks.ts). A `formal:tla` that is an
        # `nx:noop` over family tasks (tools/formal.plugin.ts) is left out: its families are dealt instead.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pnpm nx affected -t formal:tla formal:lean --graph="$RUNNER_TEMP/formal-graph.json" > /dev/null
          tasks=$(node scripts/src/formal-tasks.ts "$RUNNER_TEMP/formal-graph.json")
          shard=$(echo "$tasks" | node scripts/src/test-shard-dealer.ts --shard "$SHARD" --shards 3 \
            --durations scripts/src/formal-shard-durations.json)
          echo "tasks=$shard" >> "$GITHUB_OUTPUT"
          if [ -z "$shard" ]; then
            echo "No affected formal tasks in this shard."
          else
            echo "Shard tasks: $shard"
          fi

      - name: Setup formal toolchains
        if: steps.deal.outputs.tasks != ''
        uses: ./.github/actions/setup-formal
        with:
          tools: tlc,lean

      - name: Run affected formal tiers
        if: steps.deal.outputs.tasks != ''
        # FM-R15: at most two JVMs at once. The runner caps them per process, so one task at a time.
        env:
          TASKS: ${{ steps.deal.outputs.tasks }}
        run: |
          set -o pipefail
          failed=()
          log="$RUNNER_TEMP/formal-task.log"
          IFS=',' read -ra tasks <<< "$TASKS"
          for task in "${tasks[@]}"; do
            # `<project>:<target>`; project names hold no colon, target names may.
            project="${task%%:*}"
            target="${task#*:}"
            echo "::group::$task"
            # run-many exits 0 when the task does not exist, so a task id that resolved to nothing fails too.
            if ! pnpm nx run-many --targets="$target" --projects="$project" 2>&1 | tee "$log" || grep -q 'No tasks were run' "$log"; then
              failed+=("$task")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed formal tasks: ${failed[*]}"
            exit 1
          fi

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

      - name: Upload formal reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-reports-${{ matrix.shard }}
          path: out/reports/formal
          if-no-files-found: ignore
          retention-days: 14

  # Example suites as executable contracts (VER-5): each contract example runs through
  # the `geospec` CLI installed from the workspace build, and every row passes or stays
  # undecided for its pinned reason (`libs/tau-examples/scripts/geospec-contracts.ts`).
  geospec-examples:
    name: GeoSpec example contracts
    runs-on: ubuntu-latest
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    needs: [plan]
    if: needs.plan.outputs.geospec-examples == 'true'
    timeout-minutes: 30
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      id-token: 'write' # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
          affected-base: ${{ needs.plan.outputs.affected-base }}

      - name: Run affected example contracts
        run: pnpm nx affected -t test-geospec --parallel=1

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

  size-report:
    name: Bundle size report
    runs-on: ubuntu-latest
    needs: [plan]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (github.event_name == 'pull_request' && needs.plan.outputs.size == 'true')
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      # The budgets gate on this checkout alone. The action below also rebuilds the base branch
      # for its comparison comment, so the comparison only reports.
      - name: Enforce bundle size budgets
        run: |
          pnpm size:build
          pnpm size:check || {
            echo "::error title=Size check failed::If the output above shows an entry over its limit, raise that limit inside the docs/policy/npm-policy.md § 7 band yourself (growth merged from main counts): update its measured note, run pnpm size:raises and report the table row as an FYI. Ask the operator only when size:raises exits 1. Any other failure is a build or configuration error to fix, not a budget to raise."
            exit 1
          }

      # Before the comparison: the action below leaves the checkout on the base branch.
      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

      # The comparison rebuilds the base branch, which took 24 min on a full graph (run
      # 37221169741, 2026-10-04), so it runs only on PRs labelled `size-compare`. A label
      # alone does not start a run: push after adding it.
      # Keep the formatter outside the checkout: the comparison switches to the base branch.
      - name: Prepare compact size report
        id: size-report-format
        if: contains(github.event.pull_request.labels.*.name, 'size-compare')
        run: |
          cp scripts/src/compact-size-report.ts "$RUNNER_TEMP/compact-size-report.ts"
          echo "started-at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Compare bundle sizes with the base branch
        id: size-comparison
        if: contains(github.event.pull_request.labels.*.name, 'size-compare')
        continue-on-error: true
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: 'size:build'
          # The action runs `script` without a shell, so the `cd` lives in the package script.
          # `--silent` keeps pnpm's banner out of the JSON the action parses.
          script: pnpm --silent size:check --json
          package_manager: pnpm

      - name: Highlight bundle size increases
        if: steps.size-comparison.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SIZE_COMPARISON_STARTED_AT: ${{ steps.size-report-format.outputs.started-at }}
        with:
          script: |
            const { join } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { compactSizeReport } = await import(pathToFileURL(join(process.env.RUNNER_TEMP, 'compact-size-report.ts')).href);
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const report = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith('## size-limit report 📦 ') &&
              Date.parse(comment.updated_at) >= Number(process.env.SIZE_COMPARISON_STARTED_AT) * 1000
            );
            if (!report) {
              core.warning('No fresh size comparison comment found; leaving previous reports unchanged.');
              return;
            }
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: report.id,
              body: compactSizeReport(report.body),
            });

  performance:
    needs: [plan]
    name: Runtime performance gates
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' && vars.TAU_BENCHMARK_RUNNER_ENABLED == 'true')
    runs-on: [self-hosted, tau-benchmark]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Run invariant and microbenchmark gates
        env:
          GLB_WRITER_500K_BASELINE_MS: ${{ vars.GLB_WRITER_500K_BASELINE_MS }}
          TAU_BENCHMARK_GATE: '1'
        run: pnpm nx run-many -t performance-gate --parallel=1

      - name: Capture current runtime benchmark
        run: pnpm nx run-many -t benchmark -- --iterations=5 --filter='box,box-first-render,box-parameter-rerender' --output="${RUNNER_TEMP}/current"

      - name: Capture base runtime benchmark on the same runner
        run: |
          git worktree add "${RUNNER_TEMP}/tau-benchmark-baseline" "origin/${GITHUB_BASE_REF}"
          cd "${RUNNER_TEMP}/tau-benchmark-baseline"
          pnpm install --frozen-lockfile
          pnpm nx run-many -t benchmark -- --iterations=5 --filter='box,box-first-render,box-parameter-rerender' --output="${RUNNER_TEMP}/baseline"

      - name: Enforce matching-fingerprint median gate
        env:
          TAU_BENCHMARK_GATE: '1'
        run: pnpm nx run-many -t compare-benchmarks -- --compare="${RUNNER_TEMP}/baseline" --compare="${RUNNER_TEMP}/current"

  # T11 runtime span and operation-facts overhead (Runtime Observability), in the lean harness: plain
  # `node` on the compiled runtime build, never Vitest or a TypeScript loader. It runs the accepted
  # settings (102,500 spans per round, 15 rounds, 5 runs per sample) and enforces both gates: the
  # span path's A/A-corrected relative bounds and the facts p95 bounds. A mis-measured reference arm
  # and the absolute ceilings block in any mode. Gated with the performance job on the same runner
  # class; the pre-enable calibration (at least 60 samples per shape) is
  # `runtime-observability-calibration.yml`.
  observability-bench:
    needs: [plan]
    name: Runtime observability overhead gates
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' && vars.TAU_BENCHMARK_RUNNER_ENABLED == 'true')
    runs-on: [self-hosted, tau-benchmark]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Enforce the span-path and operation-facts gates
        env:
          TAU_SPAN_BENCH_GATE: enforce
          TAU_FACTS_BENCH_GATE: enforce
        run: pnpm nx run-many -t observability-bench --parallel=1 -- --mode=full --out="${RUNNER_TEMP}/observability-bench"

      - name: Upload the bench reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-observability-bench
          path: ${{ runner.temp }}/observability-bench/
          if-no-files-found: warn
          retention-days: 30

  # API Docker smoke test — catches Dockerfile regressions (multi-stage build,
  # `--parents` package-json copy, pnpm install filter, runtime user, etc.)
  # before they reach Fly.io. Boots the built image with placeholder env
  # values that satisfy schema validation, then polls `/health/live` until
  # the app reports ready (memory heap only — no external dependencies
  # required, so we don't need a real DB/Redis here; deploy.yml uses
  # `/health/ready` which does check those). Intentionally narrow: does not
  # validate runtime behaviour, only that the container starts and serves.
  # Kept out of the `api` lane because it needs Buildx and no Nx environment.
  api-docker-smoke:
    name: API Docker smoke test
    runs-on: ubuntu-latest
    needs: [plan]
    if: github.event_name == 'pull_request' && needs.plan.outputs.api-image == 'true'
    # A production API refuses to boot without Redis, a reachable database and a schema at
    # this build's migration head, so the smoke test brings both up and runs the image's
    # own release command before starting it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: tau_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          # Hosted runners are discarded; removing the builder cost 1.5 to 2 min a job.
          cleanup: false

      - name: Build API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: tau-api:smoke
          # Read-only: `api-docker-cache` below writes the dependency layers from
          # `main`, which every PR can read. A PR writing its own cache spent about
          # 4 minutes exporting layers that its own branch scope then rarely reused
          # (job 128576364405: 247 s of a 14-minute build). The Fly registry cache
          # needs a Fly login a PR does not have, so it is not read here.
          cache-from: type=gha,scope=api-deps
          # Read token only. Both are empty for fork and Dependabot PRs, and the
          # build then runs without the remote cache.
          secrets: |
            nx_cache_server=${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN != '' && vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER || '' }}
            nx_cache_token=${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}

      - name: Verify host dependency image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: packages/host/Dockerfile
          target: deps
          # Read-only, written from `main` by `api-docker-cache`; its export alone
          # took about 4 minutes per PR run.
          cache-from: type=gha,scope=host-deps

      - name: Migrate the smoke database
        run: |
          docker run --rm --network host \
            -e BILLING_DATABASE_URL=postgres://postgres:smoke@localhost:5432/tau_smoke \
            -e BILLING_ENVIRONMENT=smoke \
            tau-api:smoke node /app/dist/billing-command.js migrate --environment smoke

      - name: Start container
        run: |
          docker run -d --name tau-api-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL=postgres://postgres:smoke@localhost:5432/tau_smoke \
            -e DATABASE_RUNTIME_ROLE=tau_api_runtime \
            -e TAU_FRONTEND_URL=http://localhost \
            -e TAU_API_URL=https://api.smoke.example \
            -e LOG_LEVEL=info \
            -e OPENAI_API_KEY=sk-smoke \
            -e ANTHROPIC_API_KEY=sk-ant-smoke \
            -e GOOGLE_VERTEX_AI_CREDENTIALS='{"type":"service_account","project_id":"smoke","private_key_id":"smoke","private_key":"smoke","client_email":"smoke@example.com","client_id":"smoke","auth_uri":"https://example.com","token_uri":"https://example.com","auth_provider_x509_cert_url":"https://example.com","client_x509_cert_url":"https://example.com","universe_domain":"example.com"}' \
            -e AUTH_SECRET=smoke-secret \
            -e TAU_VIEW_COOKIE_SECRET=smoke-view-cookie-secret-32chars \
            -e AUTH_URL=http://localhost \
            -e GITHUB_CLIENT_ID=smoke \
            -e GITHUB_CLIENT_SECRET=smoke \
            -e REDIS_URL=redis://localhost:6379 \
            -e TAU_S3_ENDPOINT=https://000000000000000000000000.r2.cloudflarestorage.com \
            -e TAU_S3_PUBLIC_BASE_URL=https://cdn.tau.new \
            -e TAU_S3_REGION=auto \
            -e TAU_S3_ACCESS_KEY_ID=smoke \
            -e TAU_S3_SECRET_ACCESS_KEY=smoke \
            -e TAU_S3_FORCE_PATH_STYLE=false \
            -e TAU_S3_BUCKET=tau-smoke-content \
            tau-api:smoke

      - name: Poll /health/live
        run: |
          for i in $(seq 1 60); do
            if ! docker ps --format '{{.Names}}' | grep -q '^tau-api-smoke$'; then
              echo "::error::Container exited before becoming healthy"
              docker logs tau-api-smoke || true
              exit 1
            fi
            if curl --silent --fail --max-time 2 http://localhost:3000/health/live >/dev/null; then
              echo "Container healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health/live did not respond with 200 within 60s"
          docker logs tau-api-smoke || true
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f tau-api-smoke || true

  # Service lane: the suites that need Postgres + Redis + MinIO. Since the git
  # storage substrate landed, that is `test` for the affected `tag:scope:api` projects —
  # the `affected` lane above excludes the tag rather than trying to guess which
  # files reach a service — plus the service-backed targets (`test:models`,
  # `test:server-modes`, `test:git`) and the API's billing composition suites. Billing contracts
  # have their own job. Like every lane here it runs only when the plan finds it affected, on
  # `main` pushes too, and a push that reuses the merge-queue verdict skips it like every lane;
  # `staging.yml` accepts a skipped lane only when this run's plan says it was not selected or
  # names that reused run (`lanes.json`). The required gate waits for it.
  # Writes the dependency layers the PR-only `api-docker-smoke` job reads: the GHA cache
  # a branch writes is readable by pull requests into it, so one `main` writer replaces a
  # cold cache and a 4-minute export on every PR run. It rebuilds only when an input of
  # the `deps` stages, or this workflow, changed since the previous `main` commit, so most
  # pushes skip it.
  # After the required gate, so a rebuild never takes a runner the gating lanes wait for (X11).
  api-docker-cache:
    name: API Docker dependency cache
    runs-on: ubuntu-latest
    needs: [affected]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check whether the dependency stages changed
        id: inputs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BEFORE"
          git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
          if git diff --quiet "$base" HEAD -- pnpm-lock.yaml pnpm-workspace.yaml '*package.json' tools/pnpm apps/api/Dockerfile packages/host/Dockerfile .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'Dependency inputs unchanged; the cache from an earlier main commit still applies.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.inputs.outputs.changed == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          # Hosted runners are discarded; removing the builder cost 1.5 to 2 min a job.
          cleanup: false

      - name: Cache API dependency layers
        if: steps.inputs.outputs.changed == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: deps
          cache-from: type=gha,scope=api-deps
          cache-to: type=gha,scope=api-deps,mode=max,ignore-error=true

      - name: Cache host dependency layers
        if: steps.inputs.outputs.changed == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: packages/host/Dockerfile
          target: deps
          cache-from: type=gha,scope=host-deps
          cache-to: type=gha,scope=host-deps,mode=max,ignore-error=true

  # Writes the macOS pnpm store and pinned Node.js caches (`setup-nx`) the macOS rows read. Those
  # rows run only in the merge queue, where a saved cache is scoped to the queue's ref and reaches
  # no later run, and a push reuses the queue's verdict and skips them, so before this job no
  # `main` run ever saved a macOS store: every MAC-A, MAC-X and native darwin job installed cold
  # (5–11 minutes on `macos-26-intel`), and the cold install is where the Intel jobs hung in
  # setup until their timeout. A store saved on `main` is readable by the queue and pull requests,
  # like `api-docker-cache` above. It runs only when an install input changed since the previous
  # `main` commit, so most pushes start no macOS runner, and after the required gate (X11).
  macos-dependency-inputs:
    name: macOS dependency cache inputs
    runs-on: ubuntu-latest
    needs: [affected]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.inputs.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check whether the install inputs changed
        id: inputs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BEFORE"
          git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
          if git diff --quiet "$base" HEAD -- pnpm-lock.yaml pnpm-workspace.yaml .github/actions/setup-nx/action.yml .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'Install inputs unchanged; the macOS stores saved for an earlier main commit still apply.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  macos-dependency-cache:
    name: macOS dependency cache (${{ matrix.runner }})
    needs: [macos-dependency-inputs]
    if: ${{ !cancelled() && needs.macos-dependency-inputs.outputs.changed == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'true'

  # The API lane, in two shards on standard runners, each with its own PostgreSQL, Redis and MinIO: as one job
  # it ended at 10.2 / 12.2 min (p50 / p90, 60 green queue runs), past the 10 min lane budget (Brain
  # research/ci-structural-decomposition-blueprint.md, ST-3). Each shard runs its Vitest `--shard` half of every
  # affected API suite; shard 1 adds the git end-to-end tier (about 140 s) and shard 2 the server modes, billing
  # composition, edit bench, live-harness guards, migration injection and session cookie cases (about 110 s).
  # `API tests (Postgres + MinIO)` below is the required check: it passes only when both shards passed.
  api-shard:
    name: API tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      id-token: 'write' # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.api == 'true' }}
    strategy:
      fail-fast: ${{ github.event_name != 'merge_group' }} # Merge queue: a failed row cancels its siblings (see `fail-fast-*`)
      matrix:
        shard: [1, 2]
    steps:
      # Two commits in a queue run, full history otherwise (see `plan`): the suites step
      # selects its projects with `nx affected`.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
          affected-base: ${{ needs.plan.outputs.affected-base }}

      - name: Prepare API env file
        run: cp apps/api/.env.example apps/api/.env

      - name: Start Postgres + Redis + MinIO
        run: docker compose -f infra/docker-compose.yml up -d postgres redis minio minio-bootstrap

      - name: MinIO smoke (seed + RW)
        run: bash infra/docker-compose.test.sh

      # `api:db-migrate` is the release migration job: DDL, the billing protections and
      # the runtime role, plus the tariff sync when TAU_CLOUD_ENABLED=true (it is false in
      # `.env.example`, so these lanes get schema and protections only, as Fly does).
      - name: Apply the protected migration job
        run: BILLING_DATABASE_URL=postgresql://dev_user:dev_password@localhost:5432/tau_dev pnpm nx run-many -t db-migrate --projects tag:scope:api

      # The default suite of every affected `tag:scope:api` project (the `affected` lane
      # excludes the tag). `nx affected` diffs against the same NX_BASE/NX_HEAD as the
      # affected lanes, so a change to one API library runs that library's suites and its
      # dependents' (`api` and `api-e2e` depend on every one), not every API suite.
      # `nx affected` ignores `--projects`, so the tag is selected by excluding every
      # project but it: `--exclude '*,!tag:scope:api'`.
      # `--shard=<n>/2` reaches every suite's `vitest`, which sorts the suite's files by path hash and runs the
      # n-th half, so the two shards run every file of every suite once (scripts/src/api-shard-union.test.ts).
      # `--passWithNoTests` lets a suite with a single file run it in one shard and nothing in the other.
      # `--parallel=1`: the suites share this lane's one PostgreSQL, and concurrent suites
      # contend on it (DC-2 measured a 70,000-row purge suite going from 60 s to 120 s
      # beside two others); one at a time keeps each suite's timing its own. `DATABASE_URL`
      # is named here rather than left to `apps/api/.env` — which the step above
      # copies from `.env.example` and which carries the same URL — so the database
      # these suites talk to is stated at the place they run, not inherited from a
      # file three steps away. An inherited value wins over anything a Vitest config
      # loads, which is what makes naming it work at all.
      #
      # The R2 half of the repository-store conformance suite (charter D32) is an
      # operator run: its `TAU_S3_CONFORMANCE_*` scratch-bucket credentials are read
      # from Terraform outputs at run time and never reach CI, so no step here names
      # them and that half skips; the MinIO half runs on every push.
      - name: Run API suites (real PostgreSQL + MinIO)
        env:
          DATABASE_URL: postgresql://dev_user:dev_password@localhost:5432/tau_dev
        run: pnpm nx affected -t test --exclude '*,!tag:scope:api' --parallel=1 -- --shard=${{ matrix.shard }}/2 --passWithNoTests

      - name: Qualify API development and production servers
        if: matrix.shard == 2
        run: pnpm nx run-many -t test:server-modes

      # The Tau agent plane left the API at W3-CUT-2 (2026-09-02); the surviving
      # deterministic edit qualification is the Tier-D edit bench.
      # The two billing foundation suites that compose billing with the app's chat and
      # agent-observability code, on the launcher's own disposable PostgreSQL 17.
      # postgres:17-alpine pinned by digest; the billing-e2e job's step says how to refresh it.
      - name: Pull the billing foundation PostgreSQL image
        if: matrix.shard == 2
        run: |
          docker pull postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
          docker tag postgres@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac postgres:17-alpine

      - name: Run the API's billing composition contracts
        if: matrix.shard == 2
        run: pnpm nx run-many -t test:billing-composition

      - name: Run deterministic file-edit qualification (edit bench)
        if: matrix.shard == 2
        run: pnpm nx run-many -t test:models -- app/testing/edit-bench/edit-bench.test.ts

      # Hermetic guards on the live provider harness, which the credentialed live
      # suites cannot run here: a failing live row names the model's own answer,
      # and a prompt a model refuses as a jailbreak never reaches a provider
      # (docs/research/grok-4-7-live-suite-refusal-blueprint.md).
      - name: Run the live-harness guards
        if: matrix.shard == 2
        run: pnpm nx run-many -t test:models -- app/testing/live/live-assertions.test.ts app/testing/live/live-gateway.harness.test.ts

      # Testing policy §13 for the durable migration the release command applies:
      # interrupted part-way it leaves the schema where it was, and a re-run is a
      # no-op. Lives under `app/testing/**`, so it runs through the same target as
      # the edit bench and needs the PostgreSQL this lane starts.
      - name: Run the durable-migration failure injection
        if: matrix.shard == 2
        run: pnpm nx run-many -t test:models -- app/testing/git-storage-migration.integration.test.ts

      # Auth session cookie blueprint, harness H2: the cookie cache over the real
      # AuthModule, PostgreSQL and Redis (cases 2, 4, 5, 17 and 24). Lives under
      # `app/testing/**`, so it runs through `test:models` like the edit bench.
      - name: Run the session cookie cache cases on PostgreSQL
        if: matrix.shard == 2
        run: pnpm nx run-many -t test:models -- app/testing/session-cache.billing.integration.test.ts

      # Charter S2, end to end: two real API processes over one MinIO and one
      # PostgreSQL, driven by stock `git` and `git-lfs`. The target brings up its own
      # compose services (idempotent against the ones above) and migrates before it
      # boots either process.
      # Since DC1 the tier is two API processes and two tau-storage workers.
      - name: Run the git end-to-end tier (two API processes, two storage workers, one object store)
        if: matrix.shard == 1
        run: pnpm nx run-many -t test:git

      # DC1 (review FR20): no API or storage log line of the tier may carry a grant,
      # a receipt signature or a presigned `X-Amz-Signature`/`X-Amz-Credential`.
      # The same checker runs over a captured staging sample.
      - name: Check the git tier's logs for signed tokens
        if: ${{ !cancelled() && matrix.shard == 1 && hashFiles('out/test-results/api-e2e-git/*.log') != '' }}
        run: cat out/test-results/api-e2e-git/*.log | node apps/api/scripts/check-storage-log-sample.mts /dev/stdin

      # FQ-1 (CI flake quarantine blueprint): the rows `@taucad/vitest-ci` wrote, one per test execution, for the
      # flake ledger. A task replayed from the cache restores its rows with the ids of the run that executed it.
      - name: Upload test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-outcomes-api-${{ matrix.shard }}
          path: out/test-results/*/*.outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # The required check `API tests (Postgres + MinIO)` (main ruleset), and the job `staging.yml` and the gate read:
  # it passes only when both API shards passed, and is skipped exactly when they were.
  api:
    name: API tests (Postgres + MinIO)
    runs-on: ubuntu-latest
    needs: [plan, api-shard]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.api == 'true' }}
    steps:
      - name: Require both API shards
        env:
          SHARDS_RESULT: ${{ needs.api-shard.result }}
        run: test "$SHARDS_RESULT" = success

  # Credential-free database and Stripe adapter contracts, including fork PRs. Runs when
  # `api-billing` or a project it depends on is affected, on pull requests, in the merge
  # queue and on `main` pushes alike; a change under `apps/api/app/**` alone skips it. A push
  # that reuses the merge-queue verdict skips it, like every lane; the required gate waits for it.
  # Keep the job name stable: `staging.yml` gates the API deploy on its result.
  billing-e2e:
    name: Billing contracts (no Stripe credentials)
    runs-on: ubuntu-latest
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    timeout-minutes: 30
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.billing == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      # postgres:17-alpine pinned to the tag's OCI index digest, resolved 2026-11-09 from
      # registry-1.docker.io (`HEAD /v2/library/postgres/manifests/17-alpine`, Docker-Content-Digest).
      # The launcher (apps/libs/api-billing/scripts/test-billing-foundation.mts) runs `postgres:17-alpine`
      # with `pull_policy: never`, so the pinned image is tagged locally under that name. Refresh: resolve
      # the tag's current digest the same way and replace it in every pull step of ci.yml
      # (scripts/src/billing-stripe-lanes.test.ts requires one digest everywhere).
      - name: Pull the billing foundation PostgreSQL image
        run: |
          docker pull postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
          docker tag postgres@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac postgres:17-alpine

      - name: Run billing database and Stripe adapter contracts
        run: pnpm nx run-many -t test:billing-foundation

      # FQ-1 (CI flake quarantine blueprint): the rows `@taucad/vitest-ci` wrote, one per test execution, for the
      # flake ledger. A task replayed from the cache restores its rows with the ids of the run that executed it.
      - name: Upload test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-outcomes-billing-e2e
          path: out/test-results/*/*.outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # The CLI's end-to-end suites (`apps/cli-e2e`): the built binary, `tau serve`, `tau mcp` and
  # `tau agent` as real child processes against real kernels, 13 to 14 minutes on one runner.
  # Their own lane, out of the test shards, where they were the floor of one shard: it runs when
  # the plan finds a project with a `test:scenarios` target affected, and `Run affected tasks`
  # requires it then, every shard (the matrix result is success only when each shard is).
  # `TAU_CI_SHARD` names the shard; a `test:scenarios` target lists it among its inputs, so each
  # shard caches apart, and takes its share of the suites from it (its Vitest config deals the
  # files by measured seconds and splits the long fixture sweep).
  cli-e2e:
    name: CLI end-to-end (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.cli-e2e == 'true' }}
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }} # Merge queue: a failed row cancels its siblings (see `fail-fast-*`)
      matrix:
        shard: [1, 2]
    env:
      TAU_CI_SHARD: ${{ matrix.shard }}/2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      # The suites spawn sandboxed kernel workers, as the shards' native suites do.
      - name: Setup Linux sandbox prerequisites
        uses: ./.github/actions/setup-linux-sandbox

      - name: Run the CLI end-to-end suites
        run: pnpm nx run-many -t test:scenarios --parallel=1 --outputStyle=static

      # FQ-1 (CI flake quarantine blueprint): the rows `@taucad/vitest-ci` wrote, one per test execution, for the
      # flake ledger. A task replayed from the cache restores its rows with the ids of the run that executed it.
      - name: Upload test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-outcomes-cli-e2e-${{ matrix.shard }}
          path: out/test-results/*/*.outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 30
