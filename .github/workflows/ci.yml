name: CI

on:
  push:
    branches: [main] # Only run on pushes to main branch
  pull_request:
    # PRs vs `main`: the fast lanes (plan, workspace, the seven affected lanes and the
    # PR-only reports); the merge queue runs everything. A draft runs nothing until it is
    # marked ready (`ready_for_review`). PRs targeting `production` only (trail PR): skip
    # checks — release gate is staging smoke + human merge.
    types: [opened, synchronize, reopened, ready_for_review]
    branches-ignore:
      - production
  # The merge queue runs the required checks on the exact commit that will land:
  # the PR on top of current `main` and every PR queued ahead of it. A green PR run
  # only proves the PR against the `main` its run started from, and required checks
  # are not strict, so two individually green PRs could land as a red `main`
  # (2026-10-29: #1133 over #1239, incidents/2026-10-29-tau-main-red-revisions-tests).
  merge_group:
    types: [checks_requested]
env:
  pnpm_config_verify_deps_before_run: warn
  # Nx remote cache, provisioned by tau-cloud `tau-ci-cache`. The server is set only when a
  # token is present (fork and Dependabot runs get none, and Nx fails on a tokenless 403).
  # Same-repository pull request jobs granted `id-token: write` swap the read token for a session that
  # writes only their own pull request's entries (tau-cloud CP-5b; setup-nx `nx-guard.ts`, item 5).
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN != '' && vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
  TAU_API_URL: http://localhost:4000
  TAU_WEBSOCKET_URL: ws://localhost:4001
  TAU_FRONTEND_URL: http://localhost:3000

# A newer push to a pull request, Dependabot's included, cancels its outdated run;
# different PRs run side by side. Each push to `main` gets a group of its own and is
# never cancelled, so it neither waits for nor cancels another: in one shared group a
# run held the group until its last job ended,
# including a Darwin job waiting hours for a macOS runner, and each newer push was
# cancelled while pending, staging deploy and release commit included (2026-10-11,
# runs 38179340616 and 38183401821).
#
# Staging deploys live in `staging.yml`, not here: this workflow's result is the
# colour of `main` and the gate every release reads (`main-ci-success`), so it holds
# only checks a pull request also runs. Deploy-only failures (Netlify credits, Fly
# registry errors, a missing environment secret) made `main` red for 111 of 214 red
# hours in October 2026 with no code at fault
# (incidents/2026-10-29-tau-main-red-revisions-tests).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One affected computation for the lanes that need a project list or a flag: the
  # service, browser, formal, GeoSpec, native-host and viewer-parity lanes,
  # the PR-only reports, and
  # `staging.yml` (the `ci-plan` artifact). The seven `affected-lane` jobs do not wait
  # for it: they run their own `nx affected` and read the queue verdict themselves.
  # Every selector here is a tag, a target name or a project type — no job in this
  # workflow may name a project, except the shell lane's path check below, which names
  # `sandbox`, the project whose rows those paths feed (shell split blueprint rows 15, 17).
  plan:
    name: Plan affected lanes
    # A draft pull request runs no CI (the runner pool is the queue's bottleneck,
    # 2026-11-10); marking it ready runs this workflow.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      api: ${{ steps.plan.outputs.api }}
      api-image: ${{ steps.plan.outputs.api-image }}
      billing: ${{ steps.plan.outputs.billing }}
      cli-e2e: ${{ steps.plan.outputs.cli-e2e }}
      size: ${{ steps.plan.outputs.size }}
      formal: ${{ steps.plan.outputs.formal }}
      formal-nightly: ${{ steps.plan.outputs.formal-nightly }}
      formal-nightly-projects: ${{ steps.plan.outputs.formal-nightly-projects }}
      geospec-examples: ${{ steps.plan.outputs.geospec-examples }}
      browser: ${{ steps.plan.outputs.browser }}
      browser-projects: ${{ steps.plan.outputs.browser-projects }}
      native-hosts: ${{ steps.plan.outputs.native-hosts }}
      native-intel: ${{ steps.plan.outputs.native-intel }}
      native-linux: ${{ steps.plan.outputs.native-linux }}
      viewer-parity: ${{ steps.plan.outputs.viewer-parity }}
      desktop: ${{ steps.plan.outputs.desktop }}
      desktop-projects: ${{ steps.plan.outputs.desktop-projects }}
      shell: ${{ steps.plan.outputs.shell }}
      shell-projects: ${{ steps.plan.outputs.shell-projects }}
      reused: ${{ steps.queue.outputs.run-id }}
      affected-base: ${{ steps.queue.outputs.affected-base }}
    steps:
      # A queue run diffs against its first parent (`nx-set-shas` sets NX_BASE to `HEAD^1`
      # on `merge_group`), so two commits are enough; pushes and pull requests keep full
      # history, which `nx-set-shas` walks to find their base (a push with a merge-group run
      # on its commit diffs against `HEAD^1` instead, `queue-verdict`).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      # A push to `main` whose identical commit passed the merge queue reuses that
      # verdict: no lane runs again. A push whose commit has a merge-group run diffs
      # against that run's base (`affected-base`), so this plan selects what the queue did.
      - name: Find the merge-queue verdict for this commit
        id: queue
        uses: ./.github/actions/queue-verdict
        with:
          github-token: ${{ github.token }}

      # Only `workspace` saves a missed pnpm store in pull requests and the queue (a save
      # is a 12–15 s post step on the job's end, X10). On a push the plan saves too: it is
      # the one job that sets up Nx on every push, and a push that reuses the queue verdict
      # skips `workspace`'s setup, while a store saved in the queue is scoped to the queue's
      # ref and never reaches `main` or the pull requests that read it.
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: ${{ github.event_name == 'push' && 'true' || 'false' }}
          affected-base: ${{ steps.queue.outputs.affected-base }}

      # One `nx show projects --affected` and one graph, and each lane's projects selected
      # from them by the tags, targets and project type in LANE_SELECTORS (seven separate
      # `nx show projects --affected` calls took 31–50 s). A selector naming a tag or a
      # target that no project has fails the step, rather than leaving its lane off.
      - name: Compute affected lanes
        id: plan
        env:
          REUSED: ${{ steps.queue.outputs.run-id }}
          # Billing contracts: the project that owns them (`api-billing`) or one it depends on changed.
          # CLI end-to-end suites: the project that owns them or one it depends on (the CLI) changed.
          # API image: the project with the `docker:smoke` target (`api`) or one it depends on
          # changed, so a change to another `scope:api` project (an end-to-end suite, `files`)
          # does not rebuild the production image.
          # Native host rows (`native-hosts.yml`): a `tag:ci:native-hosts` project (Build123d, PicoGK,
          # the CLI) or a `test:native-linux` project is affected; the latter are also the linux-x64
          # native rows it runs, and the former start its Intel row (`native-intel`). Viewer parity (`viewer-parity.yml`): the project that owns the gate
          # (`test:viewer-parity`), or one it depends on, or the workflow its target lists, changed.
          # Desktop lane: a `tag:ci:desktop` project (the Electron app and, after the split, its services
          # host). No job here runs it: the packaged suite runs on every staging candidate instead
          # (operator decision D-DS1 (b), `desktop-packaged.yml`), so the lane is informational and
          # `lanes.json` records it for the observed desktop lane rate.
          # Shell lane: a `tag:ci:shell` project (the sandbox, native-process-core, the shell service, the
          # host and the Terminal concern), in the merge queue only; `shell-projects` names the rows' projects.
          # SHELL_LANE_PATHS select it too (with `sandbox`): the fixture producers and the workflow the graph
          # does not see, checked here rather than as target `inputs`, which would mark `sandbox` and every
          # project that depends on it affected in the ordinary lanes (shell split blueprint rows 15, 17).
          # Formal nightly lane (`formal-nightly.yml`, CI throughput review Q-4): a project with a `formal:nightly`
          # target is affected; the deep formal tiers run per project in the merge queue only, seeded by the commit.
          # `pr` is a lane's pull-request rule; without it a pull request runs the lane as the queue does.
          # "queue": the lane runs in the merge queue only. "touched": a pull request runs the lane only
          # for the selected projects that own a file of its own diff (Nx's file-to-project map: the
          # deepest project root above the file), never for one that is affected only through a dependency.
          LANE_SELECTORS: >-
            {"apps": {"type": "app"},
             "api": {"tags": ["scope:api"], "pr": "touched"},
             "api-image": {"targets": ["docker:smoke"]},
             "billing": {"targets": ["test:billing-foundation"], "pr": "queue"},
             "cli-e2e": {"targets": ["test:scenarios"], "pr": "queue"},
             "size": {"targets": ["size"]},
             "formal": {"targets": ["formal:tla"], "pr": "queue"},
             "formal-nightly": {"targets": ["formal:nightly"], "pr": "queue"},
             "geospec-examples": {"targets": ["test-geospec"], "pr": "queue"},
             "browser": {"tags": ["ci:browser"], "targets": ["verify-browser"], "pr": "queue"},
             "native-hosts": {"tags": ["ci:native-hosts"], "pr": "queue"},
             "native-linux": {"targets": ["test:native-linux"], "pr": "queue"},
             "viewer-parity": {"targets": ["test:viewer-parity"], "pr": "queue"},
             "desktop": {"tags": ["ci:desktop"]},
             "shell": {"tags": ["ci:shell"], "pr": "queue"}}
          SHELL_LANE_PATHS: >-
            [".github/workflows/shell-conformance.yml",
             "apps/desktop/scripts/hosted-linux-bwrap-fixture.mts",
             "apps/desktop/scripts/linux-apt-package.mts",
             "apps/desktop/scripts/runtime-stage.mts"]
        run: |
          # `pipefail` so a failing `nx` call fails the step instead of leaving an empty
          # output behind `tail`. `tail -1` keeps the JSON array and drops Nx's log lines.
          set -o pipefail
          affected=$(pnpm nx show projects --affected --json | tail -1)
          pnpm nx graph --file="$RUNNER_TEMP/graph.json" > /dev/null
          lanes=$(jq -c --argjson affected "$affected" --argjson selectors "$LANE_SELECTORS" '
            .graph.nodes as $nodes
            | ([$selectors[] | .tags[]?] - [$nodes[] | .data.tags[]?]) as $unknown_tags
            | ([$selectors[] | .targets[]?] - [$nodes[] | .data.targets // {} | keys[]]) as $unknown_targets
            | if ($unknown_tags + $unknown_targets) != [] then
                error("lane selectors name a tag or target no project has: \($unknown_tags + $unknown_targets | join(", "))")
              elif ([$selectors[] | .pr // empty] - ["queue", "touched"]) != [] then
                error("lane selectors name a pull-request rule other than queue or touched")
              else . end
            | $selectors | map_values(. as $selector
              | [$affected[] | . as $name | $nodes[$name] | select(. != null)
                  | select($selector.type == null or .type == $selector.type)
                  | select(all($selector.tags[]?; . as $tag | $nodes[$name].data.tags // [] | index([$tag]) != null))
                  | select(all($selector.targets[]?; . as $target | $nodes[$name].data.targets // {} | has($target)))
                  | $name] | sort)' "$RUNNER_TEMP/graph.json")
          # The shell lane's path check: a change to a fixture producer or to the shell workflow selects the
          # sandbox rows, whose guests install those fixtures (the reuse and pull-request rules below still apply).
          shell_paths=$(git diff --name-only --no-renames "$NX_BASE" "${NX_HEAD:-HEAD}" \
            | jq -cRn --argjson paths "$SHELL_LANE_PATHS" '[inputs | select(. as $file | $paths | index([$file]) != null)]')
          if [ "$shell_paths" != '[]' ]; then
            jq -e '.graph.nodes.sandbox.data.tags // [] | index(["ci:shell"]) != null' "$RUNNER_TEMP/graph.json" > /dev/null \
              || { echo "::error::the shell lane path check names sandbox, which is not a tag:ci:shell project"; exit 1; }
            lanes=$(jq -c '.shell |= (. + ["sandbox"] | unique)' <<< "$lanes")
            echo "Shell lane paths changed: $shell_paths"
          fi
          jq -r 'to_entries[] | "Affected \(.key): \(.value | tojson)"' <<< "$lanes"
          # What `nx affected` selected, for `lanes.json` below.
          selected=$lanes
          # A push that reuses the merge-queue run on this commit runs no lane again: that run's
          # required gate passed, and the gate waits for every lane and fails on any selected lane
          # that did not pass. One rule for every lane; this plan diffed against the queue's own
          # base, so what it selected is what the queue selected and passed.
          if [ -n "$REUSED" ]; then
            lanes=$(jq -c 'map_values([])' <<< "$lanes")
            echo "Reusing merge-queue run $REUSED: its required gate passed every lane it selected on this commit; no lane runs again."
          fi
          # A pull request applies each lane's `pr` rule. The "queue" lanes run on the exact commit that
          # lands: a PR run of them proved nothing the queue does not prove again, and PR runs held about six
          # times the queue's runner minutes when the 60-job pool was the queue's bottleneck (2026-11-10).
          # A "touched" lane runs for the projects the diff itself changes, where a deterministic failure
          # would otherwise first evict a queue entry and rebuild every entry behind it (F15). The files are
          # Nx's own (`git diff --no-renames --relative` from the merge base of NX_BASE and NX_HEAD).
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            head=${NX_HEAD:-HEAD}
            lanes=$(git diff --name-only --no-renames --relative "$(git merge-base "$NX_BASE" "$head")" "$head" \
              | jq -cRn --argjson lanes "$lanes" --argjson selectors "$LANE_SELECTORS" \
                  --slurpfile graph "$RUNNER_TEMP/graph.json" '
                ($graph[0].graph.nodes | with_entries({key: (.value.data.root | if . == "" then "." else rtrimstr("/") end), value: .key})) as $roots
                | def owner: split("/") as $parts
                    | [range($parts | length; 0; -1) as $depth | $parts[:$depth] | join("/")] + ["."]
                    | map($roots[.] // empty) | first // empty;
                [inputs | owner] as $touched
                | $lanes | with_entries(.key as $lane | $selectors[$lane].pr as $rule
                  | if $rule == "queue" then .value = []
                    elif $rule == "touched" then .value |= map(. as $name | select($touched | index([$name]) != null))
                    else . end)')
            jq -r --argjson selectors "$LANE_SELECTORS" \
              'to_entries[] | select($selectors[.key].pr != null) | "Pull request (\($selectors[.key].pr)) \(.key): \(.value | tojson)"' <<< "$lanes"
          fi
          flag() { jq -r --arg lane "$1" 'if .[$lane] == [] then "false" else "true" end' <<< "$lanes"; }
          api=$(flag api)
          billing=$(flag billing)
          formal=$(flag formal)
          formal_nightly=$(flag formal-nightly)
          formal_nightly_projects=$(jq -c '."formal-nightly"' <<< "$lanes")
          browser=$(flag browser)
          geospec_examples=$(flag geospec-examples)
          cli_e2e=$(flag cli-e2e)
          browser_projects=$(jq -c '.browser' <<< "$lanes")
          native_linux=$(jq -r '."native-linux" | join(",")' <<< "$lanes")
          native_hosts=$(jq -r 'if .["native-hosts"] == [] and .["native-linux"] == [] then "false" else "true" end' <<< "$lanes")
          native_intel=$(flag native-hosts)
          viewer_parity=$(flag viewer-parity)
          desktop=$(flag desktop)
          desktop_projects=$(jq -c '.desktop' <<< "$lanes")
          shell=$(flag shell)
          shell_projects=$(jq -c '.shell' <<< "$lanes")
          # `api-image` keeps the PR-only Docker smoke test on the PRs that affect the API image.
          api_image=$(flag api-image)
          {
            echo "apps=$(jq -c '.apps' <<< "$lanes")"
            echo "browser-projects=$browser_projects"
            echo "api=$api"
            echo "api-image=$api_image"
            echo "billing=$billing"
            echo "cli-e2e=$cli_e2e"
            echo "size=$(flag size)"
            echo "formal=$formal"
            echo "formal-nightly=$formal_nightly"
            echo "formal-nightly-projects=$formal_nightly_projects"
            echo "browser=$browser"
            echo "geospec-examples=$geospec_examples"
            echo "native-hosts=$native_hosts"
            echo "native-intel=$native_intel"
            echo "native-linux=$native_linux"
            echo "viewer-parity=$viewer_parity"
            echo "desktop=$desktop"
            echo "desktop-projects=$desktop_projects"
            echo "shell=$shell"
            echo "shell-projects=$shell_projects"
          } >> "$GITHUB_OUTPUT"
          # `staging.yml` reads which service lanes `nx affected` selected (`api`, `billing-e2e`,
          # keyed by their job), before the reuse and pull-request rules above, and the merge-queue
          # run this push reused (`reused-run`): a lane skipped here is acceptable to a deploy only
          # when it was not selected, or when the reused run's gate passed it.
          # `desktop` and `desktop-projects` record the desktop lane, which no job runs (see above).
          mkdir -p out/ci-plan
          jq -n --argjson selected "$selected" --arg reused "$REUSED" \
            --arg desktop "$desktop" --argjson desktop_projects "$desktop_projects" \
            '{api: ($selected.api != [] | tostring), "billing-e2e": ($selected.billing != [] | tostring), "reused-run": $reused, desktop: $desktop, "desktop-projects": $desktop_projects}' \
            > out/ci-plan/lanes.json
          cat out/ci-plan/lanes.json

      - name: Upload the lane plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-plan
          path: out/ci-plan/lanes.json
          if-no-files-found: error
          retention-days: 7

  # Every workspace invariant is a `scripts:validate-*` target; `scripts:validate`
  # is the wildcard umbrella over all of them (frontmatter, workspace root,
  # project names and tags, tsgo runtime references, quickstart budget, license
  # partitions, formatting, dead code, license deps, workflows). A new validator
  # joins by adding the target — this job never changes.
  # A push to `main` whose identical commit passed the merge queue passes on that
  # verdict (`queue-verdict`); it still reports, so `staging.yml` reads it.
  workspace:
    name: Validate workspace
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    permissions:
      id-token: write # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Find the merge-queue verdict for this commit
        id: queue
        uses: ./.github/actions/queue-verdict
        with:
          github-token: ${{ github.token }}

      - name: Setup Nx Environment
        if: steps.queue.outputs.run-id == ''
        uses: ./.github/actions/setup-nx

      - name: Run workspace validators
        if: steps.queue.outputs.run-id == ''
        run: pnpm nx run scripts:validate

      # A change to the PicoGK browser host pin merges only once both dependency hosts, production
      # dependencies.tau.new and staging dependencies.taucad.dev, serve every blob it names with its
      # pinned digest, so `main` never names a digest either environment does not serve (charter
      # picogk-interim-digest-consumer, D9 and I2). It runs in this required check, on the pull
      # request and in the merge queue, only when the pin differs from the base.
      - name: Prove a changed PicoGK browser host pin is served on both hosts
        if: steps.queue.outputs.run-id == '' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PIN: packages/plugins/picogk/browser-host.pin.json
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- "$PIN"; then
            echo "$PIN is unchanged from the base; no blob to prove."
          else
            node scripts/src/picogk-browser-host-pin.ts check --pin "$PIN"
          fi

  # The affected tasks run as parallel lanes on separate standard runners: lint,
  # typecheck, build, three package-check shards and three test shards. One runner running every
  # task in turn took 1 h 40 min on a full graph (run 37221169741, 2026-10-04); the
  # lanes bring that down to the longest lane. Each lane keeps `--parallel=1`, which
  # its own 16 GB runner still needs (see `Run the lane's tasks`).
  #
  # No `needs: plan`: every lane selects its own projects with `nx affected`, and the only
  # thing it read from the plan was the queue verdict, which it now finds itself, as
  # `workspace` does. Waiting for the plan put 2.1–3.9 min on every queue run's critical
  # path (Brain research/ci-decomposition-blueprint.md, X1). A push to `main` whose commit
  # passed the merge queue reuses that run's lanes: every step after the verdict skips, and
  # the required `affected` gate passes on the plan's own verdict. A push whose commit has a
  # merge-group run that did not pass runs the lanes against the queue's base (`affected-base`).
  affected-lane:
    name: Affected (${{ matrix.lane }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      id-token: 'write' # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    strategy:
      fail-fast: false
      matrix:
        lane: [lint, typecheck, build, pkgcheck-1, pkgcheck-2, pkgcheck-3, test-1, test-2, test-3]
    steps:
      # Two commits in a queue run, full history otherwise (see `plan`).
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      # A no-op unless this is a push to `main`; on pull requests and in the merge queue
      # `run-id` is always empty, so every step below runs.
      - name: Find the merge-queue verdict for this commit
        id: queue
        uses: ./.github/actions/queue-verdict
        with:
          github-token: ${{ github.token }}

      - name: Setup Nx Environment
        if: steps.queue.outputs.run-id == ''
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
          affected-base: ${{ steps.queue.outputs.affected-base }}

      - name: Setup Linux sandbox prerequisites
        if: startsWith(matrix.lane, 'test-') && steps.queue.outputs.run-id == ''
        uses: ./.github/actions/setup-linux-sandbox

      # The PR gate documented in docs/policy/release-policy.md: under version plans,
      # a touched release project with no plan is an unreleased change. Base and head
      # come from NX_BASE/NX_HEAD, which `nrwl/nx-set-shas` exported above. Not run on
      # `push`, where the release commit itself touches every manifest after consuming
      # the plans.
      - name: Check version plans
        if: matrix.lane == 'build' && github.event_name == 'pull_request'
        run: pnpm nx release plan:check

      # Pinned third-party downloads come from the Actions cache, so only a pin change asks their
      # origin (Brain research/ci-flake-classes.md class 1, R3: during a GitHub Releases outage the
      # wasi-sdk of `prepare` and the CPython of `seed` failed 34 lane jobs in two days). The lane's
      # task graph, for the same targets as the step below, decides which entries it needs, so a
      # lane that runs neither task restores nothing (the kernel seeds are about 350 MB, the
      # wasi-sdk archive 125 MB); the test shards read the whole affected `test` graph, as the
      # deal happens in the step below. Keys digest the pins themselves
      # (scripts/src/ci-pinned-downloads.ts). The consumers re-verify every byte against its pin,
      # and on a miss they download as before; `ci-pinned-downloads.yml` saves the entries from
      # `main`, whose cache scope pull requests and the merge queue restore from.
      - name: Find the lane's pinned downloads
        id: pins
        if: steps.queue.outputs.run-id == ''
        env:
          LANE: ${{ matrix.lane }}
        run: |
          graph="$RUNNER_TEMP/lane-graph.json"
          case "$LANE" in
            lint) pnpm nx affected -t lint --graph="$graph" > /dev/null ;;
            typecheck) pnpm nx affected -t typecheck --graph="$graph" > /dev/null ;;
            build) pnpm nx affected -t build size check-desktop-payload --graph="$graph" > /dev/null ;;
            pkgcheck-*) pnpm nx affected -t pkgcheck audit-public-surface readme-quickstart --graph="$graph" > /dev/null ;;
            test-*) pnpm nx affected -t test --exclude tag:scope:api,tag:ci:quarantined --graph="$graph" > /dev/null ;;
            *) echo "Unknown lane $LANE" >&2; exit 1 ;;
          esac
          node scripts/src/ci-pinned-downloads.ts --graph "$graph" >> "$GITHUB_OUTPUT"

      - name: Restore the Python kernel seeds
        if: steps.queue.outputs.run-id == '' && steps.pins.outputs.kernel-seeds-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pins.outputs.kernel-seeds-path }}
          key: ${{ steps.pins.outputs.kernel-seeds-key }}

      - name: Restore the wasi-sdk archive
        if: steps.queue.outputs.run-id == '' && steps.pins.outputs.wasi-sdk-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pins.outputs.wasi-sdk-path }}
          key: ${{ steps.pins.outputs.wasi-sdk-key }}

      # Nx Affected runs only tasks affected by the changes in this PR/commit.
      # Browser-backed targets are not in this list — they run nightly in
      # e2e-nightly.yml, the only workflow that installs Chromium.
      # Learn more: https://nx.dev/ci/features/affected
      #
      # `test` excludes `tag:scope:api`, because these lanes have no services. The API's
      # default suite carries the repository store, the git transport and the lifecycle
      # jobs (charter W1, W2, W4, W6), which drive real PostgreSQL and real MinIO and
      # refuse rather than skip when they are absent. The whole of `test` for that tag
      # runs in the `api` lane below, which has both; these lanes stay hermetic.
      #
      # The three test shards split the affected projects with a `test` target by
      # measured uncached test seconds (scripts/src/test-shard-dealer.ts and its
      # duration snapshot). The project list comes from the graph at run time,
      # never from this file: one `nx affected -t test --graph=<file>` writes the affected
      # `test` tasks and the project graph (each project's tags) without running
      # anything, in place of an `nx show projects --affected` and an `nx graph` (X8).
      #
      # `--parallel=1`: ui:lint and ui:typecheck each peak near 9.5 GB, so any two of
      # them (or ui:build) together exhaust the 16 GB hosted runner, which then loses
      # its VM ("The runner has received a shutdown signal"). At Nx's default of three
      # this happened a few minutes in; at two it still happened once both overlapped.
      # `test` needs the same cap: overlapping WASM suites lost the VM the same way
      # a few minutes into `test` (tau#306 and tau#299, 2026-10-04).
      #
      # The build lane also runs `ui:check-desktop-payload`, the desktop renderer ownership
      # gate, whenever `ui` is affected: a renderer-only change no longer selects `desktop`,
      # so the desktop `package-*` targets that also depend on it never run for it (Brain
      # research/desktop-split-blueprint.md, D-DS2). Its `ui:build:desktop` and
      # `desktop:build` dependencies stay serial here under the same `--parallel=1`.
      - name: Run the lane's tasks
        if: steps.queue.outputs.run-id == ''
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -o pipefail
          case "$LANE" in
            lint) pnpm nx affected -t lint --parallel=1 ;;
            typecheck) pnpm nx affected -t typecheck --parallel=1 ;;
            build) pnpm nx affected -t build size check-desktop-payload --parallel=1 ;;
            pkgcheck-*)
              # The three package-check shards deal the affected projects with a package
              # check by measured uncached `pkgcheck` seconds, with the test shards' dealer
              # and its own snapshot (scripts/src/pkgcheck-shard-durations.json): on a root
              # package change about 47 checks of 40 to 330 s ran on one runner for up to
              # 35 min. As for the test shards, the graph names the projects and every lane
              # computes the same deal, so the shards partition them.
              pnpm nx affected -t pkgcheck audit-public-surface readme-quickstart --graph="$RUNNER_TEMP/pkgcheck-graph.json" > /dev/null
              projects=$(jq -c '
                [.tasks.tasks[] | select(.target.target | IN("pkgcheck", "audit-public-surface", "readme-quickstart")) | .target.project]
                | unique' "$RUNNER_TEMP/pkgcheck-graph.json")
              shard=$(echo "$projects" | node scripts/src/test-shard-dealer.ts --shard "${LANE#pkgcheck-}" --shards 3 \
                --durations scripts/src/pkgcheck-shard-durations.json)
              if [ -z "$shard" ]; then
                echo "No affected package checks in this shard."
                exit 0
              fi
              echo "Shard projects: $shard"
              # publint, attw, madge and the surface checks are light, so they run three at
              # a time once their builds exist. The builds stay serial and land in the local
              # cache, so the checks reuse them.
              built=$(jq -r --arg shard "$shard" '
                ($shard | split(",")) as $mine
                | [.tasks.tasks[] | select(.target.target == "pkgcheck") | .target.project]
                | unique | map(select(IN($mine[]))) | join(",")' "$RUNNER_TEMP/pkgcheck-graph.json")
              # A `build` without `^build` may run before the libraries its package bundles and
              # keep their specifiers in its declarations, and the local cache hands that build
              # to its check. The builds its checks depend on run first, and the shard's own
              # builds skip the remote cache, which may still hold such a build from before
              # this order: the hash does not see whether a dependency was built.
              deps=$(jq -r --arg built "$built" '
                ($built | split(",")) as $mine
                | [$mine[] as $p | .tasks.dependencies["\($p):pkgcheck"][]? | select(endswith(":build"))
                   | split(":")[0] | select(IN($mine[]) | not)]
                | unique | join(",")' "$RUNNER_TEMP/pkgcheck-graph.json")
              if [ -n "$deps" ]; then
                pnpm nx run-many -t build --projects "$deps" --parallel=1
              fi
              if [ -n "$built" ]; then
                pnpm nx run-many -t build --projects "$built" --parallel=1 --skip-remote-cache
              fi
              pnpm nx run-many -t pkgcheck audit-public-surface readme-quickstart --projects "$shard" --parallel=3
              ;;
            test-*)
              # GeoSpec suites run here against the published `geospec-engine` prebuild for
              # this runner. `ci:quarantined` projects (runtime-e2e) run only in the nightly
              # workflow until their failing tests pass there: https://github.com/taucad/tau/issues/342
              pnpm nx affected -t test --exclude tag:scope:api,tag:ci:quarantined --graph="$RUNNER_TEMP/test-graph.json" > /dev/null
              # The task graph also holds the tasks `test` depends on (builds and the like),
              # so keep the `test` tasks, and drop an excluded tag again in case another
              # project's `test` ever depends on one of theirs.
              projects=$(jq -c '
                .graph.nodes as $nodes
                | [.tasks.tasks[] | select(.target.target == "test") | .target.project] | unique
                | map(select($nodes[.].data.tags // [] | any(. == "scope:api" or . == "ci:quarantined") | not))' "$RUNNER_TEMP/test-graph.json")
              # Every lane deals the same list heaviest first to the lightest shard by
              # duration, so the shards partition it and the slowest suites land apart.
              shard=$(echo "$projects" | node scripts/src/test-shard-dealer.ts --shard "${LANE#test-}" --shards 3)
              if [ -z "$shard" ]; then
                echo "No affected test projects in this shard."
                exit 0
              fi
              echo "Shard projects: $shard"
              pnpm nx run-many -t test --projects "$shard" --parallel=1 --outputStyle=static 2>&1 | tee "$RUNNER_TEMP/affected-test.log"
              ;;
            *) echo "Unknown lane $LANE" >&2; exit 1 ;;
          esac

      # The full log of a full-graph run is far longer than the API's log tail, so a failed
      # test phase repeats each failing suite's report (and the sandbox host facts the native
      # suites depend on) as the job's last output.
      - name: Summarize failed affected tests
        if: failure() && startsWith(matrix.lane, 'test-')
        run: |
          echo '::group::Sandbox host'
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces 2>&1 || true
          sudo grep -Ei 'bwrap|unshare|userns' /sys/kernel/security/apparmor/profiles || echo 'no bwrap, unshare or userns AppArmor profile loaded'
          findmnt -no FSTYPE /tmp || true
          bwrap --unshare-user --cap-drop ALL --ro-bind / / --dev /dev --unshare-pid --proc /proc -- \
            unshare --user --map-root-user --pid --fork --mount-proc true \
            && echo 'nested user namespace: ok' || echo 'nested user namespace: blocked'
          echo '::endgroup::'
          if [ -f "$RUNNER_TEMP/affected-test.log" ]; then
            awk '/Failed Tests [0-9]+|Failed Suites [0-9]+/ { keep = 1; n = 0 }
                 keep && n < 300 { print; n++ }
                 /Test Files / { keep = 0 }' "$RUNNER_TEMP/affected-test.log"
            grep -nE 'exited \([0-9]+\)|apply-seccomp|bwrap:|uid_map|ERR_|Unhandled|out of memory|Test timed out' \
              "$RUNNER_TEMP/affected-test.log" | head -100
          fi

      # The M3 verdict helpers left with `geospec` for taucad/geospec, which runs them in its own CI.
      - name: Check the affected GeoSpec consumer
        if: matrix.lane == 'build' && steps.queue.outputs.run-id == ''
        run: pnpm nx affected -t check-geospec-test-consumer

      - name: Check workspace root hygiene
        if: always() && steps.queue.outputs.run-id == ''
        run: pnpm nx run scripts:validate-workspace-root

  browser:
    name: Browser, accessibility and Lighthouse
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    timeout-minutes: 20
    env:
      WWW_LAUNCH: 'true'
      WWW_ORIGIN: https://tau.new
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Use the pinned browser for Lighthouse
        run: node --input-type=module -e "import { chromium } from 'playwright'; console.log('CHROME_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Verify affected browser applications
        env:
          BROWSER_PROJECTS: ${{ needs.plan.outputs.browser-projects }}
        run: |
          projects=$(jq -r 'join(",")' <<< "$BROWSER_PROJECTS")
          test -n "$projects"
          pnpm nx run-many -t verify-browser --projects "$projects" --parallel=1
      - name: Package the marketing SSR function
        if: contains(fromJSON(needs.plan.outputs.apps), 'www')
        working-directory: apps/www
        run: |
          "$GITHUB_WORKSPACE/scripts/node_modules/.bin/netlify" functions:build \
            --src "$GITHUB_WORKSPACE/apps/www/.netlify/v1/functions" \
            --functions "$GITHUB_WORKSPACE/out/reports/www/functions"
      - name: Upload browser and Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: out/reports/
          retention-days: 14

  # Standalone-project oracles, in `standalone-projects.yml` (also nightly): on every push to
  # `main` only. Not required checks, so they wait for the required gate rather than take three
  # runners while the required lanes still queue for one (X3); `!cancelled()` keeps them running
  # when a lane failed. Never in the merge queue: there they started after the gate, so the queue
  # run was still in progress when GitHub merged, `merge-queue-sweep.yml` cancelled it, and the
  # push found no queue verdict to reuse (Brain ci-audit 2026-11-12, F1 and F2). The push and the
  # nightly already run them on every commit that lands.
  standalone:
    name: Standalone projects
    needs: [plan, affected]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/standalone-projects.yml
    secrets: inherit

  # The native host rows (`native-hosts.yml`), in the merge queue and on a push the queue did not
  # prove, when the plan finds a `tag:ci:native-hosts` or `test:native-linux` project affected: the
  # Linux rows with the affected `test:native-linux` projects, and the Intel row when a
  # `tag:ci:native-hosts` project is affected (CI throughput review Q-3). Its plan job is skipped when
  # called; the nightly and a dispatch run that workflow on their own. The required check waits for it.
  native-hosts:
    name: Native hosts
    needs: [plan]
    if: needs.plan.outputs.native-hosts == 'true'
    permissions:
      contents: 'read'
    uses: ./.github/workflows/native-hosts.yml
    with:
      native-linux: ${{ needs.plan.outputs.native-linux }}
      intel: ${{ needs.plan.outputs.native-intel }}

  # The viewer parity gate (`viewer-parity.yml`), in the merge queue and on a push the queue did
  # not prove, when the plan finds a `test:viewer-parity` project affected. The required check
  # waits for it.
  viewer-parity:
    name: Viewer parity
    needs: [plan]
    if: needs.plan.outputs.viewer-parity == 'true'
    permissions:
      contents: 'read'
    uses: ./.github/workflows/viewer-parity.yml

  # The shell conformance rows (`shell-conformance.yml`, semantics tier), in the merge queue only,
  # when the plan finds a `tag:ci:shell` project affected or a shell lane path changed: the affected
  # projects' targets on the three stock Linux guests and the two macOS rows, with no Electron build
  # or application tier. A pull request keeps the `shell-conformance` label for early signal; a push
  # to `main` reuses the queue verdict, and the desktop candidate gate runs the full tier fresh.
  # The required check waits for it (shell split blueprint PR 4). It passes the read token alone, never
  # `secrets: inherit`; the called macOS job runs in `nx-cache-write`, whose write token replaces it, so the
  # queue reads and writes the fingerprinted verdicts (CF-1, CP-5b follow-up).
  shell:
    name: Shell conformance
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.shell == 'true' && github.event_name == 'merge_group' }}
    permissions:
      contents: read
    uses: ./.github/workflows/shell-conformance.yml
    with:
      ref: ${{ github.sha }}
      tier: semantics
      projects: ${{ needs.plan.outputs.shell-projects }}
    secrets:
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}

  # The formal nightly tiers (`formal-nightly.yml`: mutants, fresh-seed differentials and simulations, nightly
  # configs), in the merge queue only, one job per affected `formal:nightly` project and target, each with
  # its own 120-minute budget. The seed source is the queue commit's sha, so each landing explores a fresh
  # seed and a re-run of the same commit replays it. A pull request leaves the lane to the queue, a push to
  # `main` reuses the queue verdict, and the release gate (RG-1) runs every project with a seed of its own.
  # The required check waits for it (CI throughput review, Q-4 step 2).
  formal-nightly:
    name: Formal nightly
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.formal-nightly == 'true' && github.event_name == 'merge_group' }}
    permissions: # Required for nrwl/nx-set-shas (in setup-nx) to read workflow runs
      actions: 'read'
      contents: 'read'
    uses: ./.github/workflows/formal-nightly.yml
    with:
      ref: ${{ github.sha }}
      projects: ${{ needs.plan.outputs.formal-nightly-projects }}
      seed: ${{ github.sha }}

  # The required check. It passes only when the plan and every affected lane passed, and every
  # lane the plan selects too when this run needed it (browser, GeoSpec example contracts, CLI
  # end-to-end, native hosts, viewer parity, formal, API tests, billing contracts, and the shell
  # rows and formal nightly tiers in the merge queue): a skip of a lane the plan selected fails it. It waits for every
  # lane, so a merge-queue run whose gate passed proves every lane it selected, which is the one
  # proof `queue-verdict` reuses on the push (Brain ci-audit 2026-11-12, F1). API tests are a
  # required check of their own as well, so the queue already waited for them; in the ten latest
  # queue runs that ran formal and billing contracts (2026-11-12), both finished before the gate
  # or before API tests.
  affected:
    name: Run affected tasks
    needs:
      [
        plan,
        affected-lane,
        browser,
        geospec-examples,
        cli-e2e,
        native-hosts,
        viewer-parity,
        formal,
        api,
        billing-e2e,
        shell,
        formal-nightly,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every affected lane
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LANES_RESULT: ${{ needs.affected-lane.result }}
          BROWSER_REQUIRED: ${{ needs.plan.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          GEOSPEC_EXAMPLES_REQUIRED: ${{ needs.plan.outputs.geospec-examples }}
          GEOSPEC_EXAMPLES_RESULT: ${{ needs.geospec-examples.result }}
          CLI_E2E_REQUIRED: ${{ needs.plan.outputs.cli-e2e }}
          CLI_E2E_RESULT: ${{ needs.cli-e2e.result }}
          NATIVE_HOSTS_REQUIRED: ${{ needs.plan.outputs.native-hosts }}
          NATIVE_HOSTS_RESULT: ${{ needs.native-hosts.result }}
          VIEWER_PARITY_REQUIRED: ${{ needs.plan.outputs.viewer-parity }}
          VIEWER_PARITY_RESULT: ${{ needs.viewer-parity.result }}
          FORMAL_REQUIRED: ${{ needs.plan.outputs.formal }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          API_REQUIRED: ${{ needs.plan.outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          BILLING_REQUIRED: ${{ needs.plan.outputs.billing }}
          BILLING_RESULT: ${{ needs.billing-e2e.result }}
          SHELL_REQUIRED: ${{ needs.plan.outputs.shell }}
          SHELL_RESULT: ${{ needs.shell.result }}
          FORMAL_NIGHTLY_REQUIRED: ${{ needs.plan.outputs.formal-nightly }}
          FORMAL_NIGHTLY_RESULT: ${{ needs.formal-nightly.result }}
          EVENT: ${{ github.event_name }}
          REUSED: ${{ needs.plan.outputs.reused }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          if [ "$DRAFT" = true ]; then
            echo "Draft pull request: no CI runs until it is marked ready for review."
            exit 0
          fi
          test "$PLAN_RESULT" = success
          if [ -n "$REUSED" ]; then
            echo "Merge-queue run $REUSED passed every lane it selected on this commit."
            exit 0
          fi
          test "$LANES_RESULT" = success
          if [ "$BROWSER_REQUIRED" = true ]; then test "$BROWSER_RESULT" = success; fi
          if [ "$GEOSPEC_EXAMPLES_REQUIRED" = true ]; then test "$GEOSPEC_EXAMPLES_RESULT" = success; fi
          if [ "$CLI_E2E_REQUIRED" = true ]; then test "$CLI_E2E_RESULT" = success; fi
          if [ "$NATIVE_HOSTS_REQUIRED" = true ]; then test "$NATIVE_HOSTS_RESULT" = success; fi
          if [ "$VIEWER_PARITY_REQUIRED" = true ]; then test "$VIEWER_PARITY_RESULT" = success; fi
          if [ "$FORMAL_REQUIRED" = true ]; then test "$FORMAL_RESULT" = success; fi
          if [ "$API_REQUIRED" = true ]; then test "$API_RESULT" = success; fi
          if [ "$BILLING_REQUIRED" = true ]; then test "$BILLING_RESULT" = success; fi
          if [ "$SHELL_REQUIRED" = true ] && [ "$EVENT" = merge_group ]; then test "$SHELL_RESULT" = success; fi
          if [ "$FORMAL_NIGHTLY_REQUIRED" = true ] && [ "$EVENT" = merge_group ]; then test "$FORMAL_NIGHTLY_RESULT" = success; fi

  # Formal lane (docs/policy/formal-verification-policy.md): the Java and Lean tiers
  # of every affected project with a `formal:tla` or `formal:lean` target. A known counterexample is an
  # expected verdict and never turns this red; a changed verdict, a stale generated
  # file, a missing tool or a watchdog does. Toolchains come from setup-formal,
  # pinned by sha256 in tools/formal/toolchain.lock, never from `pnpm install`.
  # Two shards deal the affected projects by measured uncached seconds with the test
  # shards' dealer and its own snapshot (scripts/src/formal-shard-durations.json): a
  # change to tools/formal makes every project affected, and on one runner that ran out
  # of 15 minutes with ui still to go (queue run 43190779343, job 131090042426: 3.5 min
  # of setup, then 11.7 min of checks). agent-host's 7.3 min is the floor of one shard.
  formal:
    name: Formal models (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    needs: [plan]
    if: needs.plan.outputs.formal == 'true'
    # The heavier shard measures about 11 min (3.5 of setup, agent-host's 7.3); 20 allows
    # for the up-to-twofold runner variance the formal nightly showed (runs 43167548945 and 43178267338).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      id-token: 'write' # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
          affected-base: ${{ needs.plan.outputs.affected-base }}

      - name: Setup formal toolchains
        uses: ./.github/actions/setup-formal
        with:
          tools: tlc,lean

      - name: Run affected formal tiers
        # FM-R15: at most two JVMs at once. The runner caps them per process, so one project at a time.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pnpm nx affected -t formal:tla formal:lean --graph="$RUNNER_TEMP/formal-graph.json" > /dev/null
          projects=$(jq -c '
            [.tasks.tasks[] | select(.target.target | IN("formal:tla", "formal:lean")) | .target.project]
            | unique' "$RUNNER_TEMP/formal-graph.json")
          shard=$(echo "$projects" | node scripts/src/test-shard-dealer.ts --shard "$SHARD" --shards 2 \
            --durations scripts/src/formal-shard-durations.json)
          if [ -z "$shard" ]; then
            echo "No affected formal projects in this shard."
            exit 0
          fi
          echo "Shard projects: $shard"
          pnpm nx run-many -t formal:tla formal:lean --projects "$shard" --parallel=1

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

      - name: Upload formal reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-reports-${{ matrix.shard }}
          path: out/reports/formal
          if-no-files-found: ignore
          retention-days: 14

  # Example suites as executable contracts (VER-5): each contract example runs through
  # the `geospec` CLI installed from the workspace build, and every row passes or stays
  # undecided for its pinned reason (`libs/tau-examples/scripts/geospec-contracts.ts`).
  geospec-examples:
    name: GeoSpec example contracts
    runs-on: ubuntu-latest
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    needs: [plan]
    if: needs.plan.outputs.geospec-examples == 'true'
    timeout-minutes: 30
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      id-token: 'write' # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
          affected-base: ${{ needs.plan.outputs.affected-base }}

      - name: Run affected example contracts
        run: pnpm nx affected -t test-geospec --parallel=1

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

  size-report:
    name: Bundle size report
    runs-on: ubuntu-latest
    needs: [plan]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (github.event_name == 'pull_request' && needs.plan.outputs.size == 'true')
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      # The budgets gate on this checkout alone. The action below also rebuilds the base branch
      # for its comparison comment, so the comparison only reports.
      - name: Enforce bundle size budgets
        run: |
          pnpm size:build
          pnpm size:check || {
            echo "::error title=Size check failed::If the output above shows an entry over its limit, raise that limit inside the docs/policy/npm-policy.md § 7 band yourself (growth merged from main counts): update its measured note, run pnpm size:raises and report the table row as an FYI. Ask the operator only when size:raises exits 1. Any other failure is a build or configuration error to fix, not a budget to raise."
            exit 1
          }

      # Before the comparison: the action below leaves the checkout on the base branch.
      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

      # The comparison rebuilds the base branch, which took 24 min on a full graph (run
      # 37221169741, 2026-10-04), so it runs only on PRs labelled `size-compare`. A label
      # alone does not start a run: push after adding it.
      # Keep the formatter outside the checkout: the comparison switches to the base branch.
      - name: Prepare compact size report
        id: size-report-format
        if: contains(github.event.pull_request.labels.*.name, 'size-compare')
        run: |
          cp scripts/src/compact-size-report.ts "$RUNNER_TEMP/compact-size-report.ts"
          echo "started-at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Compare bundle sizes with the base branch
        id: size-comparison
        if: contains(github.event.pull_request.labels.*.name, 'size-compare')
        continue-on-error: true
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: 'size:build'
          # The action runs `script` without a shell, so the `cd` lives in the package script.
          # `--silent` keeps pnpm's banner out of the JSON the action parses.
          script: pnpm --silent size:check --json
          package_manager: pnpm

      - name: Highlight bundle size increases
        if: steps.size-comparison.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SIZE_COMPARISON_STARTED_AT: ${{ steps.size-report-format.outputs.started-at }}
        with:
          script: |
            const { join } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { compactSizeReport } = await import(pathToFileURL(join(process.env.RUNNER_TEMP, 'compact-size-report.ts')).href);
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const report = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith('## size-limit report 📦 ') &&
              Date.parse(comment.updated_at) >= Number(process.env.SIZE_COMPARISON_STARTED_AT) * 1000
            );
            if (!report) {
              core.warning('No fresh size comparison comment found; leaving previous reports unchanged.');
              return;
            }
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: report.id,
              body: compactSizeReport(report.body),
            });

  performance:
    needs: [plan]
    name: Runtime performance gates
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' && vars.TAU_BENCHMARK_RUNNER_ENABLED == 'true')
    runs-on: [self-hosted, tau-benchmark]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Run invariant and microbenchmark gates
        env:
          GLB_WRITER_500K_BASELINE_MS: ${{ vars.GLB_WRITER_500K_BASELINE_MS }}
          TAU_BENCHMARK_GATE: '1'
        run: pnpm nx run-many -t performance-gate --parallel=1

      - name: Capture current runtime benchmark
        run: pnpm nx run-many -t benchmark -- --iterations=5 --filter='box,box-first-render,box-parameter-rerender' --output="${RUNNER_TEMP}/current"

      - name: Capture base runtime benchmark on the same runner
        run: |
          git worktree add "${RUNNER_TEMP}/tau-benchmark-baseline" "origin/${GITHUB_BASE_REF}"
          cd "${RUNNER_TEMP}/tau-benchmark-baseline"
          pnpm install --frozen-lockfile
          pnpm nx run-many -t benchmark -- --iterations=5 --filter='box,box-first-render,box-parameter-rerender' --output="${RUNNER_TEMP}/baseline"

      - name: Enforce matching-fingerprint median gate
        env:
          TAU_BENCHMARK_GATE: '1'
        run: pnpm nx run-many -t compare-benchmarks -- --compare="${RUNNER_TEMP}/baseline" --compare="${RUNNER_TEMP}/current"

  # T11 runtime span and operation-facts overhead (Runtime Observability), in the lean harness: plain
  # `node` on the compiled runtime build, never Vitest or a TypeScript loader. It runs the accepted
  # settings (102,500 spans per round, 15 rounds, 5 runs per sample) and enforces both gates: the
  # span path's A/A-corrected relative bounds and the facts p95 bounds. A mis-measured reference arm
  # and the absolute ceilings block in any mode. Gated with the performance job on the same runner
  # class; the pre-enable calibration (at least 60 samples per shape) is
  # `runtime-observability-calibration.yml`.
  observability-bench:
    needs: [plan]
    name: Runtime observability overhead gates
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' && vars.TAU_BENCHMARK_RUNNER_ENABLED == 'true')
    runs-on: [self-hosted, tau-benchmark]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Enforce the span-path and operation-facts gates
        env:
          TAU_SPAN_BENCH_GATE: enforce
          TAU_FACTS_BENCH_GATE: enforce
        run: pnpm nx run-many -t observability-bench --parallel=1 -- --mode=full --out="${RUNNER_TEMP}/observability-bench"

      - name: Upload the bench reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-observability-bench
          path: ${{ runner.temp }}/observability-bench/
          if-no-files-found: warn
          retention-days: 30

  # API Docker smoke test — catches Dockerfile regressions (multi-stage build,
  # `--parents` package-json copy, pnpm install filter, runtime user, etc.)
  # before they reach Fly.io. Boots the built image with placeholder env
  # values that satisfy schema validation, then polls `/health/live` until
  # the app reports ready (memory heap only — no external dependencies
  # required, so we don't need a real DB/Redis here; deploy.yml uses
  # `/health/ready` which does check those). Intentionally narrow: does not
  # validate runtime behaviour, only that the container starts and serves.
  # Kept out of the `api` lane because it needs Buildx and no Nx environment.
  api-docker-smoke:
    name: API Docker smoke test
    runs-on: ubuntu-latest
    needs: [plan]
    if: github.event_name == 'pull_request' && needs.plan.outputs.api-image == 'true'
    # A production API refuses to boot without Redis, a reachable database and a schema at
    # this build's migration head, so the smoke test brings both up and runs the image's
    # own release command before starting it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: tau_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          # Hosted runners are discarded; removing the builder cost 1.5 to 2 min a job.
          cleanup: false

      - name: Build API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: tau-api:smoke
          # Read-only: `api-docker-cache` below writes the dependency layers from
          # `main`, which every PR can read. A PR writing its own cache spent about
          # 4 minutes exporting layers that its own branch scope then rarely reused
          # (job 128576364405: 247 s of a 14-minute build). The Fly registry cache
          # needs a Fly login a PR does not have, so it is not read here.
          cache-from: type=gha,scope=api-deps
          # Read token only. Both are empty for fork and Dependabot PRs, and the
          # build then runs without the remote cache.
          secrets: |
            nx_cache_server=${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN != '' && vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER || '' }}
            nx_cache_token=${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}

      - name: Verify host dependency image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: packages/host/Dockerfile
          target: deps
          # Read-only, written from `main` by `api-docker-cache`; its export alone
          # took about 4 minutes per PR run.
          cache-from: type=gha,scope=host-deps

      - name: Migrate the smoke database
        run: |
          docker run --rm --network host \
            -e BILLING_DATABASE_URL=postgres://postgres:smoke@localhost:5432/tau_smoke \
            -e BILLING_ENVIRONMENT=smoke \
            tau-api:smoke node /app/dist/billing-command.js migrate --environment smoke

      - name: Start container
        run: |
          docker run -d --name tau-api-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL=postgres://postgres:smoke@localhost:5432/tau_smoke \
            -e DATABASE_RUNTIME_ROLE=tau_api_runtime \
            -e TAU_FRONTEND_URL=http://localhost \
            -e TAU_API_URL=https://api.smoke.example \
            -e LOG_LEVEL=info \
            -e OPENAI_API_KEY=sk-smoke \
            -e ANTHROPIC_API_KEY=sk-ant-smoke \
            -e GOOGLE_VERTEX_AI_CREDENTIALS='{"type":"service_account","project_id":"smoke","private_key_id":"smoke","private_key":"smoke","client_email":"smoke@example.com","client_id":"smoke","auth_uri":"https://example.com","token_uri":"https://example.com","auth_provider_x509_cert_url":"https://example.com","client_x509_cert_url":"https://example.com","universe_domain":"example.com"}' \
            -e AUTH_SECRET=smoke-secret \
            -e TAU_VIEW_COOKIE_SECRET=smoke-view-cookie-secret-32chars \
            -e AUTH_URL=http://localhost \
            -e GITHUB_CLIENT_ID=smoke \
            -e GITHUB_CLIENT_SECRET=smoke \
            -e REDIS_URL=redis://localhost:6379 \
            -e TAU_S3_ENDPOINT=https://000000000000000000000000.r2.cloudflarestorage.com \
            -e TAU_S3_PUBLIC_BASE_URL=https://cdn.tau.new \
            -e TAU_S3_REGION=auto \
            -e TAU_S3_ACCESS_KEY_ID=smoke \
            -e TAU_S3_SECRET_ACCESS_KEY=smoke \
            -e TAU_S3_FORCE_PATH_STYLE=false \
            -e TAU_S3_BUCKET=tau-smoke-content \
            tau-api:smoke

      - name: Poll /health/live
        run: |
          for i in $(seq 1 60); do
            if ! docker ps --format '{{.Names}}' | grep -q '^tau-api-smoke$'; then
              echo "::error::Container exited before becoming healthy"
              docker logs tau-api-smoke || true
              exit 1
            fi
            if curl --silent --fail --max-time 2 http://localhost:3000/health/live >/dev/null; then
              echo "Container healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health/live did not respond with 200 within 60s"
          docker logs tau-api-smoke || true
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f tau-api-smoke || true

  # Service lane: the suites that need Postgres + Redis + MinIO. Since the git
  # storage substrate landed, that is `test` for the affected `tag:scope:api` projects —
  # the `affected` lane above excludes the tag rather than trying to guess which
  # files reach a service — plus the service-backed targets (`test:models`,
  # `test:server-modes`, `test:git`) and the API's billing composition suites. Billing contracts
  # have their own job. Like every lane here it runs only when the plan finds it affected, on
  # `main` pushes too, and a push that reuses the merge-queue verdict skips it like every lane;
  # `staging.yml` accepts a skipped lane only when this run's plan says it was not selected or
  # names that reused run (`lanes.json`). The required gate waits for it.
  # Writes the dependency layers the PR-only `api-docker-smoke` job reads: the GHA cache
  # a branch writes is readable by pull requests into it, so one `main` writer replaces a
  # cold cache and a 4-minute export on every PR run. It rebuilds only when an input of
  # the `deps` stages, or this workflow, changed since the previous `main` commit, so most
  # pushes skip it.
  # After the required gate, so a rebuild never takes a runner the gating lanes wait for (X11).
  api-docker-cache:
    name: API Docker dependency cache
    runs-on: ubuntu-latest
    needs: [affected]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check whether the dependency stages changed
        id: inputs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BEFORE"
          git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
          if git diff --quiet "$base" HEAD -- pnpm-lock.yaml pnpm-workspace.yaml '*package.json' tools/pnpm apps/api/Dockerfile packages/host/Dockerfile .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'Dependency inputs unchanged; the cache from an earlier main commit still applies.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.inputs.outputs.changed == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          # Hosted runners are discarded; removing the builder cost 1.5 to 2 min a job.
          cleanup: false

      - name: Cache API dependency layers
        if: steps.inputs.outputs.changed == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: deps
          cache-from: type=gha,scope=api-deps
          cache-to: type=gha,scope=api-deps,mode=max,ignore-error=true

      - name: Cache host dependency layers
        if: steps.inputs.outputs.changed == 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: packages/host/Dockerfile
          target: deps
          cache-from: type=gha,scope=host-deps
          cache-to: type=gha,scope=host-deps,mode=max,ignore-error=true

  api:
    name: API tests (Postgres + MinIO)
    runs-on: ubuntu-latest
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      id-token: 'write' # CP-5b: a pull request job trades its OIDC token for its own cache session (setup-nx nx-guard)
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.api == 'true' }}
    steps:
      # Two commits in a queue run, full history otherwise (see `plan`): the suites step
      # selects its projects with `nx affected`.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && 2 || 0 }}

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
          affected-base: ${{ needs.plan.outputs.affected-base }}

      - name: Prepare API env file
        run: cp apps/api/.env.example apps/api/.env

      - name: Start Postgres + Redis + MinIO
        run: docker compose -f infra/docker-compose.yml up -d postgres redis minio minio-bootstrap

      - name: MinIO smoke (seed + RW)
        run: bash infra/docker-compose.test.sh

      # `api:db-migrate` is the release migration job: DDL, the billing protections and
      # the runtime role, plus the tariff sync when TAU_CLOUD_ENABLED=true (it is false in
      # `.env.example`, so these lanes get schema and protections only, as Fly does).
      - name: Apply the protected migration job
        run: BILLING_DATABASE_URL=postgresql://dev_user:dev_password@localhost:5432/tau_dev pnpm nx run-many -t db-migrate --projects tag:scope:api

      # The default suite of every affected `tag:scope:api` project (the `affected` lane
      # excludes the tag). `nx affected` diffs against the same NX_BASE/NX_HEAD as the
      # affected lanes, so a change to one API library runs that library's suites and its
      # dependents' (`api` and `api-e2e` depend on every one), not every API suite.
      # `nx affected` ignores `--projects`, so the tag is selected by excluding every
      # project but it: `--exclude '*,!tag:scope:api'`.
      # `--parallel=1`: the suites share this lane's one PostgreSQL, and concurrent suites
      # contend on it (DC-2 measured a 70,000-row purge suite going from 60 s to 120 s
      # beside two others); one at a time keeps each suite's timing its own. `DATABASE_URL`
      # is named here rather than left to `apps/api/.env` — which the step above
      # copies from `.env.example` and which carries the same URL — so the database
      # these suites talk to is stated at the place they run, not inherited from a
      # file three steps away. An inherited value wins over anything a Vitest config
      # loads, which is what makes naming it work at all.
      #
      # The R2 half of the repository-store conformance suite (charter D32) is an
      # operator run: its `TAU_S3_CONFORMANCE_*` scratch-bucket credentials are read
      # from Terraform outputs at run time and never reach CI, so no step here names
      # them and that half skips; the MinIO half runs on every push.
      - name: Run API suites (real PostgreSQL + MinIO)
        env:
          DATABASE_URL: postgresql://dev_user:dev_password@localhost:5432/tau_dev
        run: pnpm nx affected -t test --exclude '*,!tag:scope:api' --parallel=1

      - name: Qualify API development and production servers
        run: pnpm nx run-many -t test:server-modes

      # The Tau agent plane left the API at W3-CUT-2 (2026-09-02); the surviving
      # deterministic edit qualification is the Tier-D edit bench.
      # The two billing foundation suites that compose billing with the app's chat and
      # agent-observability code, on the launcher's own disposable PostgreSQL 17.
      # postgres:17-alpine pinned by digest; the billing-e2e job's step says how to refresh it.
      - name: Pull the billing foundation PostgreSQL image
        run: |
          docker pull postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
          docker tag postgres@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac postgres:17-alpine

      - name: Run the API's billing composition contracts
        run: pnpm nx run-many -t test:billing-composition

      - name: Run deterministic file-edit qualification (edit bench)
        run: pnpm nx run-many -t test:models -- app/testing/edit-bench/edit-bench.test.ts

      # Hermetic guards on the live provider harness, which the credentialed live
      # suites cannot run here: a failing live row names the model's own answer,
      # and a prompt a model refuses as a jailbreak never reaches a provider
      # (docs/research/grok-4-7-live-suite-refusal-blueprint.md).
      - name: Run the live-harness guards
        run: pnpm nx run-many -t test:models -- app/testing/live/live-assertions.test.ts app/testing/live/live-gateway.harness.test.ts

      # Testing policy §13 for the durable migration the release command applies:
      # interrupted part-way it leaves the schema where it was, and a re-run is a
      # no-op. Lives under `app/testing/**`, so it runs through the same target as
      # the edit bench and needs the PostgreSQL this lane starts.
      - name: Run the durable-migration failure injection
        run: pnpm nx run-many -t test:models -- app/testing/git-storage-migration.integration.test.ts

      # Charter S2, end to end: two real API processes over one MinIO and one
      # PostgreSQL, driven by stock `git` and `git-lfs`. The target brings up its own
      # compose services (idempotent against the ones above) and migrates before it
      # boots either process.
      # Since DC1 the tier is two API processes and two tau-storage workers.
      - name: Run the git end-to-end tier (two API processes, two storage workers, one object store)
        run: pnpm nx run-many -t test:git

      # DC1 (review FR20): no API or storage log line of the tier may carry a grant,
      # a receipt signature or a presigned `X-Amz-Signature`/`X-Amz-Credential`.
      # The same checker runs over a captured staging sample.
      - name: Check the git tier's logs for signed tokens
        if: ${{ !cancelled() && hashFiles('out/test-results/api-e2e-git/*.log') != '' }}
        run: cat out/test-results/api-e2e-git/*.log | node apps/api/scripts/check-storage-log-sample.mts /dev/stdin

  # Credential-free database and Stripe adapter contracts, including fork PRs. Runs when
  # `api-billing` or a project it depends on is affected, on pull requests, in the merge
  # queue and on `main` pushes alike; a change under `apps/api/app/**` alone skips it. A push
  # that reuses the merge-queue verdict skips it, like every lane; the required gate waits for it.
  # Keep the job name stable: `staging.yml` gates the API deploy on its result.
  billing-e2e:
    name: Billing contracts (no Stripe credentials)
    runs-on: ubuntu-latest
    # Writes the remote cache on `main` pushes and in `main`'s merge queue, like the affected lanes; pull requests read.
    environment: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))) && 'nx-cache-write' || null }}
    timeout-minutes: 30
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.billing == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      # postgres:17-alpine pinned to the tag's OCI index digest, resolved 2026-11-09 from
      # registry-1.docker.io (`HEAD /v2/library/postgres/manifests/17-alpine`, Docker-Content-Digest).
      # The launcher (apps/libs/api-billing/scripts/test-billing-foundation.mts) runs `postgres:17-alpine`
      # with `pull_policy: never`, so the pinned image is tagged locally under that name. Refresh: resolve
      # the tag's current digest the same way and replace it in every pull step of ci.yml and
      # billing-nightly.yml (scripts/src/billing-stripe-lanes.test.ts requires one digest everywhere).
      - name: Pull the billing foundation PostgreSQL image
        run: |
          docker pull postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
          docker tag postgres@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac postgres:17-alpine

      - name: Run billing database and Stripe adapter contracts
        run: pnpm nx run-many -t test:billing-foundation

  # The CLI's end-to-end suites (`apps/cli-e2e`): the built binary, `tau serve`, `tau mcp` and
  # `tau agent` as real child processes against real kernels, 13 to 14 minutes on one runner.
  # Their own lane, out of the test shards, where they were the floor of one shard: it runs when
  # the plan finds a project with a `test:scenarios` target affected, and `Run affected tasks`
  # requires it then, every shard (the matrix result is success only when each shard is).
  # `TAU_CI_SHARD` names the shard; a `test:scenarios` target lists it among its inputs, so each
  # shard caches apart, and takes its share of the suites from it (its Vitest config deals the
  # files by measured seconds and splits the long fixture sweep).
  cli-e2e:
    name: CLI end-to-end (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.cli-e2e == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TAU_CI_SHARD: ${{ matrix.shard }}/2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      # The suites spawn sandboxed kernel workers, as the shards' native suites do.
      - name: Setup Linux sandbox prerequisites
        uses: ./.github/actions/setup-linux-sandbox

      - name: Run the CLI end-to-end suites
        run: pnpm nx run-many -t test:scenarios --parallel=1 --outputStyle=static
