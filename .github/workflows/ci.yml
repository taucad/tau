name: CI

on:
  push:
    branches: [main] # Only run on pushes to main branch
  pull_request:
    # PRs vs `main`: full CI. PRs targeting `production` only (trail PR): skip
    # checks — release gate is staging smoke + human merge.
    branches-ignore:
      - production
env:
  pnpm_config_verify_deps_before_run: warn
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  TAU_API_URL: http://localhost:4000
  TAU_WEBSOCKET_URL: ws://localhost:4001
  TAU_FRONTEND_URL: http://localhost:3000

# Cancel in-progress runs when a new workflow with the same group name is triggered
# This can save 10-50% on CI compute costs.
# For pull requests, include the head ref to allow different PRs to run concurrently
# while still canceling outdated runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}

jobs:
  # One affected computation for every downstream lane. Every selector here is a
  # tag or a target name — no job in this workflow may name a project.
  plan:
    name: Plan affected lanes
    runs-on: ubuntu-latest
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      api: ${{ steps.plan.outputs.api }}
      e2e: ${{ steps.plan.outputs.e2e }}
      size: ${{ steps.plan.outputs.size }}
      formal: ${{ steps.plan.outputs.formal }}
      geospec-required: ${{ steps.geospec.outputs.geospec-required }}
      geospec-darwin-tests: ${{ steps.geospec.outputs.geospec-darwin-tests }}
      geospec-key: ${{ steps.geospec-key.outputs.key }}
      geospec-cached: ${{ steps.geospec-cache.outputs.cache-hit == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Compute affected lanes
        id: plan
        run: |
          # `tail -1` keeps the JSON array and drops Nx's log lines.
          apps=$(pnpm nx show projects --affected --type=app --json | tail -1)
          api=$(pnpm nx show projects --affected --projects tag:scope:api --json | tail -1)
          e2e=$(pnpm nx show projects --affected --projects tag:type:e2e --json | tail -1)
          size=$(pnpm nx show projects --affected --with-target size --json | tail -1)
          formal=$(pnpm nx show projects --affected --with-target formal --json | tail -1)
          echo "Affected apps: $apps"
          echo "Affected tag:scope:api: $api"
          echo "Affected tag:type:e2e: $e2e"
          echo "Affected with a size target: $size"
          echo "Affected with a formal target: $formal"
          {
            echo "apps<<EOF"
            echo "$apps"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          for lane in "api=$api" "e2e=$e2e" "size=$size" "formal=$formal"; do
            if [ "${lane#*=}" = '[]' ]; then
              echo "${lane%%=*}=false" >> "$GITHUB_OUTPUT"
            else
              echo "${lane%%=*}=true" >> "$GITHUB_OUTPUT"
            fi
          done

      # --graph expands dependencies without executing any selected task. In
      # particular, an affected consumer can reach an unaffected native build.
      - name: Plan artifact prerequisites from expanded tasks
        id: geospec
        env:
          # Planning only expands the graph. On the hosted runner these graph commands
          # segfault intermittently as they exit; the same commands without Nx Cloud
          # never crashed locally. Planning needs neither Nx Cloud nor the task database.
          NX_NO_CLOUD: 'true'
          NX_DISABLE_DB: 'true'
          PLAN_API: ${{ steps.plan.outputs.api == 'true' || (github.ref == 'refs/heads/main' && github.event_name == 'push') }}
          PLAN_E2E: ${{ steps.plan.outputs.e2e == 'true' }}
          PLAN_SIZE: ${{ github.event_name == 'pull_request' && steps.plan.outputs.size == 'true' }}
          PLAN_PERFORMANCE: ${{ github.event_name == 'pull_request' && vars.TAU_BENCHMARK_RUNNER_ENABLED == 'true' }}
          PLAN_BILLING: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && steps.plan.outputs.api == 'true') }}
          PLAN_LIVE: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && steps.plan.outputs.e2e == 'true') }}
        run: |
          mkdir -p out/artifacts/geospec-native-engine/plan
          pnpm nx affected -t lint build typecheck size pkgcheck audit-public-surface readme-quickstart lint-benchmark-entry typecheck-benchmark-entry test-benchmark-entry test-benchmark-statistics check-ci-artifacts check-delivery-environment check-conformance-profile check-geospec-test-consumer test-m3-verdicts check-coverage-gate prepare-legacy-reference typecheck-legacy-reference --graph=out/artifacts/geospec-native-engine/plan/affected.json
          pnpm nx affected -t test --exclude tag:scope:api --graph=out/artifacts/geospec-native-engine/plan/tests.json
          if [ "$PLAN_E2E" = true ]; then
            pnpm nx affected -t test:e2e test:e2e:development test:e2e:webgpu --graph=out/artifacts/geospec-native-engine/plan/e2e.json
          fi
          if [ "$PLAN_API" = true ]; then
            pnpm nx run-many -t test --projects tag:scope:api --graph=out/artifacts/geospec-native-engine/plan/api-tests.json
            pnpm nx run-many -t test:server-modes test:models test:git test:billing-foundation --graph=out/artifacts/geospec-native-engine/plan/api.json
          fi
          if [ "$PLAN_SIZE" = true ]; then
            # size:build builds every project with a size configuration.
            pnpm nx run-many -t size --graph=out/artifacts/geospec-native-engine/plan/size-report.json
          fi
          if [ "$PLAN_PERFORMANCE" = true ]; then
            pnpm nx run-many -t performance-gate benchmark compare-benchmarks --graph=out/artifacts/geospec-native-engine/plan/performance.json
          fi
          if [ "$PLAN_BILLING" = true ]; then
            pnpm nx run-many -t test:billing-stripe --graph=out/artifacts/geospec-native-engine/plan/billing.json
          fi
          if [ "$PLAN_LIVE" = true ]; then
            pnpm nx run-many -t test:e2e:desktop:live --graph=out/artifacts/geospec-native-engine/plan/live.json
          fi
          pnpm nx run scripts:plan-geospec-ci -- out/artifacts/geospec-native-engine/plan/*.json

      # The engine products depend only on the native source closure, which `product-key`
      # digests without building. When an earlier run on this ref, this pull request's base
      # branch or `main` already produced that closure, every lane restores its products
      # and the Mac producer is skipped: no runner queue and no OCCT build.
      - name: Identify the GeoSpec engine product closure
        id: geospec-key
        if: steps.geospec.outputs.geospec-required == 'true'
        run: echo "key=geospec-transport-v1-$(node packages/geospec-engine-native/scripts/ci-artifacts.mjs product-key)" >> "$GITHUB_OUTPUT"

      - name: Look for GeoSpec engine products from an earlier run
        id: geospec-cache
        if: steps.geospec.outputs.geospec-required == 'true'
        uses: ./.github/actions/geospec-transport
        with:
          key: ${{ steps.geospec-key.outputs.key }}
          mode: lookup

  # Every workspace invariant is a `scripts:validate-*` target; `scripts:validate`
  # is the wildcard umbrella over all of them (frontmatter, workspace root,
  # project names and tags, tsgo runtime references, quickstart budget, license
  # partitions, formatting, dead code, license deps, workflows). A new validator
  # joins by adding the target — this job never changes.
  workspace:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Run workspace validators
        run: pnpm nx run scripts:validate

  # Builds the products only when no earlier run produced this closure. Its Darwin
  # host suites run here when it builds, and in `geospec-darwin` when it does not, so
  # the Linux lanes never wait for a Mac merely to run those suites.
  geospec-producer:
    name: Produce current GeoSpec artifacts
    needs: [plan]
    if: needs.plan.outputs.geospec-required == 'true' && needs.plan.outputs.geospec-cached != 'true'
    runs-on: macos-15
    steps:
      - &checkout-darwin
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - &setup-nx-darwin
        name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'

      - &prepare-geospec
        name: Prepare GeoSpec engine products
        id: prepare
        uses: ./.github/actions/geospec-producer

      - name: Upload complete current-source transport
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: geospec-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            packages/geospec-engine-native/bindings/node/generated/index.d.ts
            packages/geospec-engine-native/bindings/node/generated/index.js
            packages/geospec-engine-native/bindings/node/generated/geospec-engine-native.darwin-arm64.node
            packages/geospec-engine-native/bindings/emscripten/generated/geospec_engine_native.mjs
            packages/geospec-engine-native/bindings/emscripten/generated/geospec_engine_native.wasm
            out/artifacts/geospec-native-engine/ci
          if-no-files-found: error
          retention-days: 7

      - name: Keep the products for later runs of this closure
        uses: ./.github/actions/geospec-transport
        with:
          key: ${{ needs.plan.outputs.geospec-key }}
          mode: save

      - &prepare-geospec-consumer
        name: Prepare current installed GeoSpec consumer
        if: needs.plan.outputs.geospec-darwin-tests == 'true'
        env:
          GEOSPEC_NATIVE_ASSEMBLY_ROOT: ${{ github.workspace }}/out/artifacts/geospec-native-engine/ci/assembly
        run: |
          pnpm nx run-many -t require-geospec-delivery --parallel=1
          pnpm nx run scripts:prepare-geospec-test-consumer
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const {consumerRoot}=JSON.parse(readFileSync("out/artifacts/geospec-test-consumer/receipt.json", "utf8")); appendFileSync(process.env.GITHUB_ENV, `GEOSPEC_INSTALLED_CONSUMER_ROOT=${consumerRoot}\n`);'

      - &darwin-host-suites
        name: Run complete affected Darwin host suites
        if: needs.plan.outputs.geospec-darwin-tests == 'true'
        run: pnpm nx run-many -t test --projects tag:host:darwin-arm64 --exclude tag:scope:api --skip-nx-cache

      - &retain-geospec-preparation
        name: Retain the OCCT and toolchain preparation
        if: always() && steps.prepare.outcome == 'success' && github.event_name != 'pull_request'
        uses: ./.github/actions/geospec-preparation-save
        with:
          generation: ${{ steps.prepare.outputs.generation }}
          preparation-hit: ${{ steps.prepare.outputs.preparation-hit }}
          cargo-hit: ${{ steps.prepare.outputs.cargo-hit }}

  # Restored products: the Darwin host suites still need a delivery assembled from this
  # checkout's source kit, which `prepare-geospec-ci-artifacts` reassembles around them.
  geospec-darwin:
    name: Run GeoSpec Darwin host suites
    needs: [plan]
    if: >-
      needs.plan.outputs.geospec-required == 'true' && needs.plan.outputs.geospec-cached == 'true' &&
      needs.plan.outputs.geospec-darwin-tests == 'true'
    runs-on: macos-15
    steps:
      - *checkout-darwin
      - *setup-nx-darwin

      - name: Restore GeoSpec engine products from an earlier run
        uses: ./.github/actions/geospec-transport
        with:
          key: ${{ needs.plan.outputs.geospec-key }}
          mode: restore

      - *prepare-geospec
      - *prepare-geospec-consumer
      - *darwin-host-suites
      - *retain-geospec-preparation

  affected:
    name: Run affected tasks
    needs: [plan, geospec-producer]
    if: always()
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'nx-cloud-write' || null }}
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    steps:
      # Preserve failure in this existing required job when a needed producer
      # (including its host suites) fails. An unneeded producer may be skipped, and so
      # may one whose products an earlier run already made (see `plan`).
      - name: Require artifact producer success
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PRODUCER_RESULT: ${{ needs.geospec-producer.result }}
          PRODUCER_REQUIRED: ${{ needs.plan.outputs.geospec-required }}
          PRODUCTS_CACHED: ${{ needs.plan.outputs.geospec-cached }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$PRODUCER_REQUIRED" = true ] && [ "$PRODUCTS_CACHED" != true ]; then test "$PRODUCER_RESULT" = success; fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: ${{ needs.plan.outputs.geospec-required == 'true' && '24.10.0' || '24' }}

      - &download-geospec
        name: Download same-run GeoSpec transport
        if: needs.plan.outputs.geospec-required == 'true' && needs.plan.outputs.geospec-cached != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: geospec-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: .

      - &restore-geospec
        name: Restore GeoSpec engine products from an earlier run
        if: needs.plan.outputs.geospec-required == 'true' && needs.plan.outputs.geospec-cached == 'true'
        uses: ./.github/actions/geospec-transport
        with:
          key: ${{ needs.plan.outputs.geospec-key }}
          mode: restore

      # Linux lanes consume the products, never the Darwin delivery archives, so they
      # verify the products against this checkout's native source closure.
      - &verify-geospec
        name: Verify GeoSpec products against this checkout
        if: needs.plan.outputs.geospec-required == 'true'
        run: pnpm nx run-many -t require-geospec-artifacts --parallel=1

      # Native kernel workers run inside the operating-system sandbox on every host,
      # including CI; a Linux runner needs the Bubblewrap toolchain and capability-bearing
      # user namespaces, which Ubuntu 24.04 restricts through AppArmor by default.
      - name: Install Linux sandbox prerequisites
        run: |
          sudo apt-get update -qq && sudo apt-get install -y bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The PR gate documented in docs/policy/release-policy.md: under version plans,
      # a touched release project with no plan is an unreleased change. Base and head
      # come from NX_BASE/NX_HEAD, which `nrwl/nx-set-shas` exported above. Not run on
      # `push`, where the release commit itself touches every manifest after consuming
      # the plans.
      - name: Check version plans
        if: github.event_name == 'pull_request'
        run: pnpm nx release plan:check

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this
      # - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Nx Affected runs only tasks affected by the changes in this PR/commit.
      # Browser-backed targets are not in this list — they run in the `e2e` lane,
      # which is the only job that installs Chromium.
      # Learn more: https://nx.dev/ci/features/affected
      #
      # `test` is invoked separately with `tag:scope:api` excluded, because this lane
      # has no services. The API's default suite now carries the repository store, the
      # git transport and the lifecycle jobs (charter W1, W2, W4, W6), which drive real
      # PostgreSQL and real MinIO and refuse rather than skip when they are absent. The
      # whole of `test` for that tag runs in the `api` lane below, which has both; this
      # lane stays hermetic. The selector is a tag, never a project name.
      #
      # `--parallel=1`: ui:lint and ui:typecheck each peak near 9.5 GB, so any two of
      # them (or ui:build) together exhaust the 16 GB hosted runner, which then loses
      # its VM ("The runner has received a shutdown signal"). At Nx's default of three
      # this happened a few minutes in; at two it still happened once both overlapped.
      - name: Run affected tasks
        run: |
          pnpm nx affected -t lint build typecheck size pkgcheck audit-public-surface readme-quickstart --parallel=1
          pnpm nx affected -t test --exclude tag:scope:api,tag:host:darwin-arm64

      - name: Select affected Python checks
        id: benchmark-statistics
        run: |
          projects=$(pnpm nx show projects --affected --with-target test-benchmark-statistics --json | tail -1)
          delivery_projects=$(pnpm nx show projects --affected --with-target check-delivery-environment --json | tail -1)
          verdict_projects=$(pnpm nx show projects --affected --with-target test-m3-verdicts --json | tail -1)
          if [ "$projects" = '[]' ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$projects" != '[]' ] || [ "$delivery_projects" != '[]' ] || [ "$verdict_projects" != '[]' ]; then
            echo "python-required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup affected checks Python
        if: steps.benchmark-statistics.outputs.python-required == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'

      - name: Check affected pure artifact and delivery helpers
        run: pnpm nx affected -t check-ci-artifacts check-delivery-environment check-conformance-profile check-geospec-test-consumer test-m3-verdicts

      - name: Prepare benchmark statistics dependencies
        if: steps.benchmark-statistics.outputs.required == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/geospec-benchmark-analysis"
          "$RUNNER_TEMP/geospec-benchmark-analysis/bin/python" -m pip install --disable-pip-version-check numpy==2.3.5

      - name: Check affected benchmark harnesses
        env:
          GEOSPEC_BENCH_ANALYSIS_PYTHON: ${{ runner.temp }}/geospec-benchmark-analysis/bin/python
        run: pnpm nx affected -t lint-benchmark-entry typecheck-benchmark-entry test-benchmark-entry test-benchmark-statistics

      - name: Check affected critical coverage gates
        run: pnpm nx affected -t check-coverage-gate

      - name: Check affected legacy reference fixtures
        run: pnpm nx affected -t prepare-legacy-reference typecheck-legacy-reference

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

  # Formal lane (docs/policy/formal-verification-policy.md): the Java and Lean tiers
  # of every affected project with a `formal` target. A known counterexample is an
  # expected verdict and never turns this red; a changed verdict, a stale generated
  # file, a missing tool or a watchdog does. Toolchains come from setup-formal,
  # pinned by sha256 in tools/formal/toolchain.lock, never from `pnpm install`.
  formal:
    name: Formal models
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.formal == 'true'
    timeout-minutes: 15
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Setup formal toolchains
        uses: ./.github/actions/setup-formal
        with:
          tools: tlc,lean

      - name: Run affected formal tiers
        # FM-R15: at most two JVMs at once. The runner caps them per process, so one project at a time.
        run: pnpm nx affected -t formal formal:lean --parallel=1

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

      - name: Upload formal reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-reports
          path: out/reports/formal
          if-no-files-found: ignore
          retention-days: 14

  # Browser lane: every `type:e2e` project's Vitest Browser matrices and
  # development-server qualifications. `nx affected` picks the projects — their
  # `implicitDependencies` make the selection correct — and target existence
  # picks the suites, so a new e2e project joins by declaring the targets.
  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: [plan, geospec-producer]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.geospec-required != 'true' || needs.plan.outputs.geospec-cached == 'true' || needs.geospec-producer.result == 'success') &&
      (needs.plan.outputs.e2e == 'true')
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    steps:
      # `nx affected` below diffs against the PR base, so the checkout needs its history.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - *download-geospec
      - *restore-geospec
      - *verify-geospec

      # The ui-e2e matrix also has `firefox` and `webkit-smoke` instances, and
      # `test:e2e:non-isolated` runs PicoVoxel on Chromium and Firefox.
      - name: Install browsers for Vitest Browser
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # `desktop-e2e:test:e2e` boots a real API, which reads this file for its
      # `BILLING_*` development values; without them it refuses to start. Same
      # step, same source file, as the `billing-e2e` lane below.
      - name: Prepare API env file
        run: cp apps/api/.env.example apps/api/.env

      # `desktop-e2e:test:e2e` joins this fan-in (D19). It launches the *unpackaged*
      # Electron shell, which is why xvfb is enough and `desktop:package-macos` is
      # not in its dependency chain; it brings up its own Postgres/Redis/MinIO and
      # publishes the development billing policy before its specs.
      # `test:e2e:non-isolated` serves the UI without COOP/COEP: the mode production
      # web runs in until go-live row X-5 closes (D19), so kernels must degrade to
      # their serial builds there.
      # `--parallel=1`: the suites' ui:build, ui:build:serve and ui:build:desktop
      # prerequisites each peak near the same 10 GB as above, so building them together
      # loses the runner ("The operation was canceled.") a few minutes in.
      - name: Run affected end-to-end suites
        env:
          TAU_E2E_WEBGPU_PROFILE: software
        run: xvfb-run --auto-servernum pnpm nx affected -t test:e2e test:e2e:development test:e2e:browser-host test:e2e:daemon-host test:e2e:non-isolated --parallel=1

      # Field trace validation: every events.jsonl the suites above captured at
      # teardown is validated against ChatLog.tla, including after a failed suite.
      - name: Setup formal toolchains
        if: always()
        uses: ./.github/actions/setup-formal
        with:
          tools: tlc

      - name: Validate captured chat logs
        if: always()
        run: pnpm nx affected -t formal:logs

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

      - name: Upload Vitest Browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-browser-diagnostics
          path: |
            out/test-results/vitest-browser
            out/test-results/desktop-e2e
            out/test-results/chat-logs
            out/reports/formal
          if-no-files-found: ignore
          retention-days: 7

  # Required real-device qualification. The runner label is an infrastructure
  # contract: this lane must never silently fall back to SwiftShader.
  webgpu-hardware:
    name: WebGPU hardware qualification
    runs-on: [self-hosted, tau-webgpu]
    needs: [plan, geospec-producer]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.geospec-required != 'true' || needs.plan.outputs.geospec-cached == 'true' || needs.geospec-producer.result == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.plan.outputs.e2e == 'true')
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      contents: 'read'
      actions: 'read'
      pull-requests: 'read'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - *download-geospec
      - *restore-geospec
      - *verify-geospec

      - name: Install managed Chromium for Vitest Browser
        run: pnpm exec playwright install chromium

      - name: Run affected hardware WebGPU qualification
        env:
          TAU_E2E_WEBGPU_PROFILE: hardware
        run: xvfb-run --auto-servernum pnpm nx affected -t test:e2e:webgpu

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

      - name: Upload hardware WebGPU diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-browser-webgpu-hardware-diagnostics
          path: out/test-results/vitest-browser
          if-no-files-found: error
          retention-days: 14

  size-report:
    name: Bundle size report
    runs-on: ubuntu-latest
    needs: [plan, geospec-producer]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.geospec-required != 'true' || needs.plan.outputs.geospec-cached == 'true' || needs.geospec-producer.result == 'success') &&
      (github.event_name == 'pull_request' && needs.plan.outputs.size == 'true')
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - *download-geospec
      - *restore-geospec
      - *verify-geospec

      # The budgets gate on this checkout alone. The action below also rebuilds the base branch
      # for its comparison comment, and that build fails whenever the restored GeoSpec products
      # belong to this head rather than the base, so the comparison only reports.
      - name: Enforce bundle size budgets
        run: pnpm size:build && pnpm size:check

      - name: Compare bundle sizes with the base branch
        continue-on-error: true
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: 'size:build'
          # The action runs `script` without a shell, so the `cd` lives in the package script.
          # `--silent` keeps pnpm's banner out of the JSON the action parses.
          script: pnpm --silent size:check --json
          package_manager: pnpm

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

  performance:
    needs: [plan, geospec-producer]
    name: Runtime performance gates
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.geospec-required != 'true' || needs.plan.outputs.geospec-cached == 'true' || needs.geospec-producer.result == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' && vars.TAU_BENCHMARK_RUNNER_ENABLED == 'true')
    runs-on: [self-hosted, tau-benchmark]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - *download-geospec
      - *restore-geospec
      - *verify-geospec

      - name: Run invariant and microbenchmark gates
        env:
          GLB_WRITER_500K_BASELINE_MS: ${{ vars.GLB_WRITER_500K_BASELINE_MS }}
          TAU_BENCHMARK_GATE: '1'
        run: pnpm nx run-many -t performance-gate --parallel=1

      - name: Capture current runtime benchmark
        run: pnpm nx run-many -t benchmark -- --iterations=5 --filter='box,box-first-render,box-parameter-rerender' --output="${RUNNER_TEMP}/current"

      - name: Capture base runtime benchmark on the same runner
        run: |
          git worktree add "${RUNNER_TEMP}/tau-benchmark-baseline" "origin/${GITHUB_BASE_REF}"
          cd "${RUNNER_TEMP}/tau-benchmark-baseline"
          pnpm install --frozen-lockfile
          pnpm nx run-many -t benchmark -- --iterations=5 --filter='box,box-first-render,box-parameter-rerender' --output="${RUNNER_TEMP}/baseline"

      - name: Enforce matching-fingerprint median gate
        env:
          TAU_BENCHMARK_GATE: '1'
        run: pnpm nx run-many -t compare-benchmarks -- --compare="${RUNNER_TEMP}/baseline" --compare="${RUNNER_TEMP}/current"

  # API Docker smoke test — catches Dockerfile regressions (multi-stage build,
  # `--parents` package-json copy, pnpm install filter, runtime user, etc.)
  # before they reach Fly.io. Boots the built image with placeholder env
  # values that satisfy schema validation, then polls `/health/live` until
  # the app reports ready (memory heap only — no external dependencies
  # required, so we don't need a real DB/Redis here; deploy.yml uses
  # `/health/ready` which does check those). Intentionally narrow: does not
  # validate runtime behaviour, only that the container starts and serves.
  # Kept out of the `api` lane because it needs Buildx and no Nx environment.
  api-docker-smoke:
    name: API Docker smoke test
    runs-on: ubuntu-latest
    needs: [plan]
    if: github.event_name == 'pull_request' && needs.plan.outputs.api == 'true'
    # A production API refuses to boot without Redis, a reachable database and a schema at
    # this build's migration head, so the smoke test brings both up and runs the image's
    # own release command before starting it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: tau_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: tau-api:smoke
          # Read-through both caches so the smoke test benefits from the
          # production deploy's registry cache when available. Cache-to
          # writes only to GHA — PRs from forks can't push to registry.fly.io
          # and we don't want to invalidate the production cache from a PR.
          cache-from: |
            type=gha
            type=registry,ref=registry.fly.io/tau-api-staging:buildcache
          cache-to: type=gha,mode=max
          # Secret may be unset for fork PRs. The Dockerfile tolerates a
          # missing nx_cloud_token secret (Nx falls back to local cache).
          secrets: |
            nx_cloud_token=${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

      - name: Migrate the smoke database
        run: |
          docker run --rm --network host \
            -e BILLING_DATABASE_URL=postgres://postgres:smoke@localhost:5432/tau_smoke \
            -e BILLING_ENVIRONMENT=smoke \
            tau-api:smoke node /app/dist/billing-command.js migrate --environment smoke

      - name: Start container
        run: |
          docker run -d --name tau-api-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL=postgres://postgres:smoke@localhost:5432/tau_smoke \
            -e DATABASE_RUNTIME_ROLE=tau_api_runtime \
            -e TAU_FRONTEND_URL=http://localhost \
            -e TAU_API_URL=https://api.smoke.example \
            -e LOG_LEVEL=info \
            -e OPENAI_API_KEY=sk-smoke \
            -e ANTHROPIC_API_KEY=sk-ant-smoke \
            -e GOOGLE_VERTEX_AI_CREDENTIALS='{"type":"service_account","project_id":"smoke","private_key_id":"smoke","private_key":"smoke","client_email":"smoke@example.com","client_id":"smoke","auth_uri":"https://example.com","token_uri":"https://example.com","auth_provider_x509_cert_url":"https://example.com","client_x509_cert_url":"https://example.com","universe_domain":"example.com"}' \
            -e AUTH_SECRET=smoke-secret \
            -e TAU_VIEW_COOKIE_SECRET=smoke-view-cookie-secret-32chars \
            -e AUTH_URL=http://localhost \
            -e GITHUB_CLIENT_ID=smoke \
            -e GITHUB_CLIENT_SECRET=smoke \
            -e REDIS_URL=redis://localhost:6379 \
            -e TAU_S3_ENDPOINT=https://000000000000000000000000.r2.cloudflarestorage.com \
            -e TAU_S3_PUBLIC_BASE_URL=https://cdn.tau.new \
            -e TAU_S3_REGION=auto \
            -e TAU_S3_ACCESS_KEY_ID=smoke \
            -e TAU_S3_SECRET_ACCESS_KEY=smoke \
            -e TAU_S3_FORCE_PATH_STYLE=false \
            -e TAU_S3_BUCKET=tau-smoke-content \
            tau-api:smoke

      - name: Poll /health/live
        run: |
          for i in $(seq 1 60); do
            if ! docker ps --format '{{.Names}}' | grep -q '^tau-api-smoke$'; then
              echo "::error::Container exited before becoming healthy"
              docker logs tau-api-smoke || true
              exit 1
            fi
            if curl --silent --fail --max-time 2 http://localhost:3000/health/live >/dev/null; then
              echo "Container healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health/live did not respond with 200 within 60s"
          docker logs tau-api-smoke || true
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f tau-api-smoke || true

  # Service lane: the suites that need Postgres + Redis + MinIO. Since the git
  # storage substrate landed, that is the whole of `test` for `tag:scope:api` —
  # the `affected` lane above excludes the tag rather than trying to guess which
  # files reach a service — plus the service-backed targets (`test:models`,
  # `test:server-modes`, `test:git`, the billing foundation). Always runs on `main`
  # pushes so the deploy gate is never green off a stale service check.
  api:
    name: API tests (Postgres + MinIO)
    runs-on: ubuntu-latest
    needs: [plan, geospec-producer]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.geospec-required != 'true' || needs.plan.outputs.geospec-cached == 'true' || needs.geospec-producer.result == 'success') &&
      (needs.plan.outputs.api == 'true' || (github.ref == 'refs/heads/main' && github.event_name == 'push'))
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - *download-geospec
      - *restore-geospec
      - *verify-geospec

      - name: Prepare API env file
        run: cp apps/api/.env.example apps/api/.env

      - name: Start Postgres + Redis + MinIO
        run: docker compose -f infra/docker-compose.yml up -d postgres redis minio minio-bootstrap

      - name: MinIO smoke (seed + RW)
        run: bash infra/docker-compose.test.sh

      # `api:db-migrate` is the release migration job: DDL, the billing protections and
      # the runtime role, plus the tariff sync when TAU_CLOUD_ENABLED=true (it is false in
      # `.env.example`, so these lanes get schema and protections only, as Fly does).
      - name: Apply the protected migration job
        run: BILLING_DATABASE_URL=postgresql://dev_user:dev_password@localhost:5432/tau_dev pnpm nx run-many -t db-migrate --projects tag:scope:api

      # The default suite, moved here whole from the `affected` lane. `DATABASE_URL`
      # is named here rather than left to `apps/api/.env` — which the step above
      # copies from `.env.example` and which carries the same URL — so the database
      # these suites talk to is stated at the place they run, not inherited from a
      # file three steps away. An inherited value wins over anything a Vitest config
      # loads, which is what makes naming it work at all.
      #
      # The `TAU_S3_CONFORMANCE_*` family is the env gate on the R2 half of the
      # repository-store conformance suite (charter D32). These secrets deliberately
      # do not exist in this repository: the scratch-bucket credentials are read from
      # Terraform outputs at run time and are never placed in CI. Absent, they expand
      # to empty strings, `conformanceAccountFromEnvironment` answers `undefined` and
      # that half skips; the MinIO half above it still runs on every push. The suite
      # itself refuses any bucket outside the scratch allowlist before a credential is
      # used, so this can never be pointed at a staging content bucket.
      - name: Run API suites (real PostgreSQL + MinIO)
        env:
          DATABASE_URL: postgresql://dev_user:dev_password@localhost:5432/tau_dev
          TAU_S3_CONFORMANCE_ENDPOINT: ${{ secrets.TAU_S3_CONFORMANCE_ENDPOINT }}
          TAU_S3_CONFORMANCE_BUCKET: ${{ secrets.TAU_S3_CONFORMANCE_BUCKET }}
          TAU_S3_CONFORMANCE_ACCESS_KEY_ID: ${{ secrets.TAU_S3_CONFORMANCE_ACCESS_KEY_ID }}
          TAU_S3_CONFORMANCE_SECRET_ACCESS_KEY: ${{ secrets.TAU_S3_CONFORMANCE_SECRET_ACCESS_KEY }}
        run: pnpm nx run-many -t test --projects tag:scope:api

      - name: Qualify API development and production servers
        run: pnpm nx run-many -t test:server-modes

      # The Tau agent plane left the API at W3-CUT-2 (2026-09-02); the surviving
      # deterministic edit qualification is the Tier-D edit bench.
      - name: Run deterministic file-edit qualification (edit bench)
        run: pnpm nx run-many -t test:models -- app/testing/edit-bench/edit-bench.test.ts

      # Hermetic guards on the live provider harness, which the credentialed live
      # suites cannot run here: a failing live row names the model's own answer,
      # and a prompt a model refuses as a jailbreak never reaches a provider
      # (docs/research/grok-4-7-live-suite-refusal-blueprint.md).
      - name: Run the live-harness guards
        run: pnpm nx run-many -t test:models -- app/testing/live/live-assertions.test.ts app/testing/live/live-gateway.harness.test.ts

      # Testing policy §13 for the durable migration the release command applies:
      # interrupted part-way it leaves the schema where it was, and a re-run is a
      # no-op. Lives under `app/testing/**`, so it runs through the same target as
      # the edit bench and needs the PostgreSQL this lane starts.
      - name: Run the durable-migration failure injection
        run: pnpm nx run-many -t test:models -- app/testing/git-storage-migration.integration.test.ts

      # Charter S2, end to end: two real API processes over one MinIO and one
      # PostgreSQL, driven by stock `git` and `git-lfs`. The target brings up its own
      # compose services (idempotent against the ones above) and migrates before it
      # boots either process.
      - name: Run the git end-to-end tier (two API processes, one object store)
        run: pnpm nx run-many -t test:git

      # The L2 fixture starts its own PostgreSQL with pull_policy "never", so
      # the image must already be on the runner.
      - name: Pull the billing foundation PostgreSQL image
        run: docker pull postgres:17-alpine

      # L2 billing lane (every PR, zero Stripe credentials): the complete local
      # PostgreSQL/Redis foundation, including signed webhook settlement.
      - name: Run billing foundation (L2)
        run: pnpm nx run-many -t test:billing-foundation

  # L3 billing e2e: real Stripe test-mode objects + `stripe listen` forwarding
  # the live event stream into the app under test. External forks do not run
  # this job. Until the payments work adds the isolated restricted credentials,
  # the lane skips with a notice when none is set (operator ruling, 2026-10-02);
  # a partial set still fails, because that is a misconfiguration.
  billing-e2e:
    name: Billing e2e (Stripe test mode)
    runs-on: ubuntu-latest
    needs: [plan, geospec-producer]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.geospec-required != 'true' || needs.plan.outputs.geospec-cached == 'true' || needs.geospec-producer.result == 'success') &&
      ((github.event_name == 'push') || (github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.api == 'true'))
    concurrency:
      group: stripe-test-account
      cancel-in-progress: false
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_CREATE_RESTRICTED_KEY }}
      STRIPE_READ_SECRET_KEY: ${{ secrets.STRIPE_TEST_READ_RESTRICTED_KEY }}
      STRIPE_REFUND_SECRET_KEY: ${{ secrets.STRIPE_TEST_REFUND_RESTRICTED_KEY }}
      STRIPE_ACCOUNT_ID: ${{ secrets.STRIPE_TEST_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Skip without isolated Stripe acceptance credentials
        id: gate
        run: |
          set=0
          for value in "$STRIPE_SECRET_KEY" "$STRIPE_READ_SECRET_KEY" "$STRIPE_REFUND_SECRET_KEY" "$STRIPE_ACCOUNT_ID"; do
            if [ -n "$value" ]; then set=$((set + 1)); fi
          done
          if [ "$set" -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Billing e2e skipped::No STRIPE_TEST_* secret is configured; the real Stripe lane runs once the payments work adds them."
          elif [ "$set" -eq 4 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Only $set of the four STRIPE_TEST_* secrets are set; set all four or none."
            exit 1
          fi

      - name: Setup Nx Environment
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/setup-nx

      - name: Download same-run GeoSpec transport
        if: steps.gate.outputs.enabled == 'true' && needs.plan.outputs.geospec-required == 'true' && needs.plan.outputs.geospec-cached != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: geospec-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: .

      - name: Restore GeoSpec engine products from an earlier run
        if: steps.gate.outputs.enabled == 'true' && needs.plan.outputs.geospec-required == 'true' && needs.plan.outputs.geospec-cached == 'true'
        uses: ./.github/actions/geospec-transport
        with:
          key: ${{ needs.plan.outputs.geospec-key }}
          mode: restore

      - name: Verify GeoSpec products against this checkout
        if: steps.gate.outputs.enabled == 'true' && needs.plan.outputs.geospec-required == 'true'
        run: pnpm nx run-many -t require-geospec-artifacts --parallel=1

      - name: Install Stripe CLI
        if: steps.gate.outputs.enabled == 'true'
        run: |
          curl -fsSL https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee -a /etc/apt/sources.list.d/stripe.list
          sudo apt-get update -qq && sudo apt-get install -y stripe

      - name: Prepare API env file
        if: steps.gate.outputs.enabled == 'true'
        run: cp apps/api/.env.example apps/api/.env

      - name: Start Postgres + Redis + MinIO
        if: steps.gate.outputs.enabled == 'true'
        run: docker compose -f infra/docker-compose.yml up -d postgres redis minio minio-bootstrap

      # `api:db-migrate` is the release migration job: DDL, the billing protections and
      # the runtime role, plus the tariff sync when TAU_CLOUD_ENABLED=true (it is false in
      # `.env.example`, so these lanes get schema and protections only, as Fly does).
      - name: Apply the protected migration job
        if: steps.gate.outputs.enabled == 'true'
        run: BILLING_DATABASE_URL=postgresql://dev_user:dev_password@localhost:5432/tau_dev pnpm nx run-many -t db-migrate --projects tag:scope:api

      - name: Run real Stripe billing acceptance (L3)
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm nx run-many -t test:billing-stripe

  # D19's funded cell: one real frontier turn placed on launcher 2, against a local
  # API with real provider keys. Secrets-gated exactly like `billing-e2e` above and
  # never a required check — the deterministic half of D19 runs in the `e2e` job,
  # which stubs the provider upstream. Only the OpenAI key is needed: the seam stays
  # armed for the Anthropic host in this tier, so the home composer's seeding turn
  # lands on the suite's stub, and only the live turn spends on the frontier row the
  # credit delta measures.
  desktop-e2e-live:
    name: Desktop live LLM (launcher 2)
    runs-on: ubuntu-latest
    needs: [plan, geospec-producer]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.geospec-required != 'true' || needs.plan.outputs.geospec-cached == 'true' || needs.geospec-producer.result == 'success') &&
      ((github.event_name == 'push') || (github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.e2e == 'true'))
    env:
      OPENAI_API_KEY: ${{ secrets.TAU_E2E_OPENAI_API_KEY }}
      TAU_E2E_WEBGPU_PROFILE: software
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Skip without live provider keys
        id: gate
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "TAU_E2E_OPENAI_API_KEY not configured — skipping the live desktop lane."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Nx Environment
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/setup-nx

      - name: Download same-run GeoSpec transport
        if: >-
          steps.gate.outputs.enabled == 'true' && needs.plan.outputs.geospec-required == 'true' &&
          needs.plan.outputs.geospec-cached != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: geospec-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: .

      - name: Restore GeoSpec engine products from an earlier run
        if: >-
          steps.gate.outputs.enabled == 'true' && needs.plan.outputs.geospec-required == 'true' &&
          needs.plan.outputs.geospec-cached == 'true'
        uses: ./.github/actions/geospec-transport
        with:
          key: ${{ needs.plan.outputs.geospec-key }}
          mode: restore

      - name: Verify GeoSpec products against this checkout
        if: steps.gate.outputs.enabled == 'true' && needs.plan.outputs.geospec-required == 'true'
        run: pnpm nx run-many -t require-geospec-artifacts --parallel=1

      - name: Prepare API env file
        if: steps.gate.outputs.enabled == 'true'
        run: cp apps/api/.env.example apps/api/.env

      - name: Run the live launcher-2 turn
        if: steps.gate.outputs.enabled == 'true'
        run: xvfb-run --auto-servernum pnpm nx run-many -t test:e2e:desktop:live

      - name: Upload desktop diagnostics
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-e2e-live-diagnostics
          path: out/test-results/desktop-e2e
          if-no-files-found: ignore
          retention-days: 7

  # Staging deployments — deploy after builds pass so the Nx Cloud cache is populated.
  # The API ships to Fly here (`tau-api-staging`); the UI is built here and published
  # to Netlify (`taucad` site, `taucad.dev`) by `deploy-ui-staging` below. Netlify
  # no longer builds from Git and there are no PR deploy previews.
  # `api` is in `needs` because the API's own suites left the `affected` lane: since
  # the git storage substrate landed, `test` for `tag:scope:api` — the repository
  # store, the commit protocol, the git transport, the lifecycle jobs and the git
  # e2e tier — runs only in the `api` job, and a deploy gated on `affected` alone
  # would ship with all of them red. No `always()` gating is needed and none is
  # wanted: the `api` job's own `if` (above) carries
  # `(github.ref == 'refs/heads/main' && github.event_name == 'push')`, so on the
  # only event that can reach this job it is unconditional and can never be skipped
  # into skipping the deploy. A docs-only push to `main` still runs `api`, and this
  # job still skips on its own `contains(…, 'api')` condition, so nothing is blocked.
  deploy-api-staging:
    name: Deploy API (Staging)
    needs: [workspace, affected, plan, api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(fromJSON(needs.plan.outputs.apps), 'api')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      app: api
    secrets: inherit

  # The staging UI: built in Actions with this run's GeoSpec products (Netlify
  # cannot produce them), from the producer's artifact or, when the native source
  # matched an earlier build, from the products cache, and published by the Netlify CLI. It waits for the same
  # gates as a merge plus the browser suites when they ran.
  deploy-ui-staging:
    name: Deploy UI (Staging)
    needs: [workspace, affected, plan, geospec-producer, e2e]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      contains(fromJSON(needs.plan.outputs.apps), 'ui') &&
      needs.workspace.result == 'success' && needs.affected.result == 'success' &&
      (needs.geospec-producer.result == 'success' || needs.plan.outputs.geospec-cached == 'true') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-ui.yml
    with:
      environment: staging
      transport: ${{ needs.plan.outputs.geospec-cached == 'true' && 'cache' || 'this-run' }}
      geospec-key: ${{ needs.plan.outputs.geospec-key }}
    secrets: inherit
