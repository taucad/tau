# Throwaway diagnostic workflow for the D8 G4 hang on LNX-P. Scratch branch only; never merged.
name: D8 G4 probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  pnpm_config_verify_deps_before_run: warn

jobs:
  probe:
    name: D8 G4 probe (stock ubuntu-24.04 runner, pinned libfuse 3.17.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBFUSE_VERSION: '3.17.2'
      LIBFUSE_SHA256: 3d932431ad94e86179e5265cddde1d67aa3bb2fb09a5bd35c641f86f2b5ed06f
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Build pinned libfuse
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y meson ninja-build
          work="$RUNNER_TEMP/libfuse"
          mkdir -p "$work/headers"
          curl -fsSL --retry 3 -o "$work/fuse.tar.gz" \
            "https://github.com/libfuse/libfuse/releases/download/fuse-${LIBFUSE_VERSION}/fuse-${LIBFUSE_VERSION}.tar.gz"
          echo "${LIBFUSE_SHA256}  $work/fuse.tar.gz" | sha256sum --check --strict
          tar -xzf "$work/fuse.tar.gz" -C "$work"
          meson setup "$work/build" "$work/fuse-${LIBFUSE_VERSION}" --prefix=/usr/local --buildtype=release \
            -Dexamples=false -Dtests=false -Dutils=true
          ninja -C "$work/build"
          sudo install -o root -g root -m 4755 "$work/build/util/fusermount3" /usr/local/bin/fusermount3
          cp "$work/fuse-${LIBFUSE_VERSION}/include/"{fuse_lowlevel.h,fuse_common.h,fuse_opt.h,fuse_log.h} "$work/headers/"
          cp "$work/build/libfuse_config.h" "$work/headers/"
          library="$(readlink -f "$work/build/lib/libfuse3.so.4")"
          {
            echo "TAU_PROJECTION_NODE_HEADERS=$(dirname "$(dirname "$(command -v node)")")/include/node"
            echo "TAU_PROJECTION_FUSE_HEADERS=$work/headers"
            echo "TAU_PROJECTION_FUSE_LIBRARY=$library"
            echo "TAU_PROJECTION_FUSE_SHA256=$(sha256sum "$library" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"
          ls -l /dev/fuse /usr/local/bin/fusermount3
          id

      - name: Build the bridge
        working-directory: packages/core/native-process
        run: |
          node scripts/build-shell-projection.mts \
            --node-headers "$TAU_PROJECTION_NODE_HEADERS" \
            --fuse-headers "$TAU_PROJECTION_FUSE_HEADERS" \
            --fuse-library "$TAU_PROJECTION_FUSE_LIBRARY" \
            --fuse-sha256 "$TAU_PROJECTION_FUSE_SHA256"

      - name: Run only the G4 rows with instrumentation
        working-directory: packages/core/native-process
        env:
          TAU_SHELL_PROJECTION_CONFORMANCE: '1'
          TAU_PROJECTION_TRACE: '1'
        run: |
          ../../../node_modules/.bin/vitest run --config vitest.config.ts \
            --reporter=verbose --no-file-parallelism \
            -t 'G4' src/shell/shell-projection-native.test.ts 2>&1 | tee /tmp/g4.log || true
          echo '===== marker / trace timeline ====='
          grep -E '^\[(mark|dump|wrap|brdg)' /tmp/g4.log || echo 'no instrumentation lines captured'

      - name: Post-run kernel state
        if: always()
        run: |
          echo '--- fuse mounts ---'; grep fuse /proc/self/mountinfo || true
          echo '--- connections ---'
          for c in /sys/fs/fuse/connections/*; do [ -d "$c" ] && echo "$c waiting=$(cat "$c/waiting" 2>/dev/null)"; done
          for m in $(grep -o '/tmp/tau-projection-[^ ]*' /proc/self/mountinfo | sort -u); do
            fusermount3 -u -z "$m" 2>/dev/null || true
          done
