# Builds the marketing site (`apps/www`) in GitHub Actions and publishes it to
# the separate taucad-marketing-review Netlify site, which the UI's marketing
# edge function proxies on staging (`MARKETING_ORIGIN` in tau-cloud).
#
# `staging.yml` → `deploy-www-staging` calls this workflow on a push to `main` that
# affects `www` since its last staging deploy, once the same checks as the
# staging UI pass. Netlify does not build the site from Git (`deploy_mode =
# "ci"` in tau-cloud's `marketing-review.tf`). Each run publishes to the site's
# `staging` alias, a draft deploy that costs no Netlify credits, and only when
# the built site differs from what that alias already serves.
#
# The build matches `apps/www/netlify.toml`: launch metadata on, canonical
# origin https://tau.new.
#
# Manual redeploy: `gh workflow run deploy-www-review.yml` from `main`.

name: Deploy marketing review site to Netlify

on:
  workflow_call:
  workflow_dispatch:

# `actions: read` lets the deploy see whether a newer run already deployed.
permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy marketing review site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: deploy-www-review
      cancel-in-progress: false
    env:
      WWW_INSTALLER_CATALOG: 'true'
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE_ID: 17066c91-5b08-4cc0-b45c-32b0ea08b4e9
      URL: https://staging--taucad-marketing-review.netlify.app
    steps:
      - name: Require the Netlify token
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not set on the staging environment. Set netlify_auth_token_staging on tau-cloud's tau-repo HCP workspace and apply it."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      # Each push to `main` runs on its own, so an older run can reach this queue
      # after a newer one has deployed; it must not put its commit back.
      - name: Skip a staging deploy a newer commit has superseded
        id: superseded
        uses: ./.github/actions/staging-deploy-superseded
        with:
          job-name: Deploy marketing review site
          github-token: ${{ github.token }}

      # Match the established UI adapter/CLI path workaround: both the build and
      # deploy resolve the same function directory without omitting the server build.
      - name: Point the Netlify CLI package path at the marketing functions
        working-directory: apps/www
        run: mkdir -p apps/www && ln -sfn ../../.netlify apps/www/.netlify

      # Most pushes mark www affected without changing a published byte, so the
      # job first builds the site as the production context does
      # (`apps/www/netlify.toml`) and skips publishing output the `staging` alias
      # already serves. `netlify deploy` reuses this build from the Nx cache.
      - name: Build the marketing site
        id: build
        if: steps.superseded.outputs.superseded != 'true'
        env:
          NODE_OPTIONS: --import tsx
          NX_PREFER_NODE_STRIP_TYPES: 'true'
          WWW_LAUNCH: 'true'
          WWW_ORIGIN: https://tau.new
        run: pnpm nx build www

      - name: Compare the marketing build with staging
        id: content
        if: steps.build.outcome == 'success'
        uses: ./.github/actions/netlify-staging-content
        with:
          site-id: ${{ env.SITE_ID }}
          path: apps/www/build

      # The `staging` alias is a draft deploy, which costs no Netlify credits.
      # The UI's marketing edge function proxies to it (`MARKETING_ORIGIN` in
      # tau-cloud is https://staging--taucad-marketing-review.netlify.app).
      - name: Build and deploy with the Netlify CLI
        if: steps.superseded.outputs.superseded != 'true' && steps.content.outputs.unchanged != 'true'
        working-directory: apps/www
        env:
          MESSAGE: ${{ github.workflow }} ${{ github.sha }} [staging] content:${{ steps.content.outputs.hash }}
        run: |
          "$GITHUB_WORKSPACE/scripts/node_modules/.bin/netlify" deploy \
            --alias staging --context production --filter @taucad/www \
            --site "$SITE_ID" --message "$MESSAGE"

      # The plan of the next push to `main` diffs `www` against this commit.
      - name: Record this staging deploy
        if: steps.superseded.outputs.superseded != 'true'
        uses: ./.github/actions/staging-deploy-history
        with:
          mode: record
          app: www

      - name: Check the site answers
        if: steps.superseded.outputs.superseded != 'true'
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --output /dev/null "$URL"
