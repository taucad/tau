# Builds the marketing site (`apps/www`) in GitHub Actions and publishes it to
# the separate taucad-marketing-review Netlify site, which the UI's marketing
# edge function proxies on staging (`MARKETING_ORIGIN` in tau-cloud).
#
# That site is Git-linked in tau-cloud (`marketing-review.tf`), but its Git
# builds stopped after the 2026-10-05 Netlify credit outage and it kept serving
# an older build. `ci.yml` → `deploy-www-staging` calls this workflow on a push
# to `main` that affects `www` since its last staging deploy, once the same
# checks as the staging UI pass, so staging marketing tracks `main` either way.
# The site sets `prevent_non_git_prod_deploys = false`, which allows CLI
# production deploys.
#
# The build matches `apps/www/netlify.toml`: launch metadata on, canonical
# origin https://tau.new.
#
# Manual redeploy: `gh workflow run deploy-www-review.yml` from `main`.

name: Deploy marketing review site to Netlify

on:
  workflow_call:
  workflow_dispatch:

# `actions: read` lets the deploy see whether a newer run already deployed.
permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy marketing review site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: deploy-www-review
      cancel-in-progress: false
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE_ID: 17066c91-5b08-4cc0-b45c-32b0ea08b4e9
      URL: https://taucad-marketing-review.netlify.app
    steps:
      - name: Require the Netlify token
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not set on the staging environment. Set netlify_auth_token_staging on tau-cloud's tau-repo HCP workspace and apply it."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      # Shows why Netlify's own Git builds stopped, without failing the deploy.
      - name: List the site's recent deploys
        continue-on-error: true
        run: |
          "$GITHUB_WORKSPACE/scripts/node_modules/.bin/netlify" api listSiteDeploys \
            --data "{\"site_id\": \"$SITE_ID\", \"per_page\": 10}" |
            jq -r '.[] | [.created_at, .state, .context, .branch, (.commit_ref // "-"), (.error_message // "-")] | @tsv'

      # Each push to `main` runs on its own, so an older run can reach this queue
      # after a newer one has deployed; it must not put its commit back.
      - name: Skip a staging deploy a newer commit has superseded
        id: superseded
        uses: ./.github/actions/staging-deploy-superseded
        with:
          job-name: Deploy marketing review site
          github-token: ${{ github.token }}

      - name: Build the marketing site
        if: steps.superseded.outputs.superseded != 'true'
        env:
          WWW_LAUNCH: 'true'
          WWW_ORIGIN: https://tau.new
        run: node apps/www/scripts/build.mjs

      # From the repository root the CLI finds every workspace package and stops
      # unless `--filter` names the one being deployed.
      - name: Deploy with the Netlify CLI
        if: steps.superseded.outputs.superseded != 'true'
        env:
          MESSAGE: ${{ github.workflow }} ${{ github.sha }}
        run: |
          "$GITHUB_WORKSPACE/scripts/node_modules/.bin/netlify" deploy \
            --prod --no-build --filter @taucad/www \
            --dir "$GITHUB_WORKSPACE/apps/www/dist" \
            --site "$SITE_ID" --message "$MESSAGE"

      # The plan of the next push to `main` diffs `www` against this commit.
      - name: Record this staging deploy
        if: steps.superseded.outputs.superseded != 'true'
        uses: ./.github/actions/staging-deploy-history
        with:
          mode: record
          app: www

      - name: Check the site answers
        if: steps.superseded.outputs.superseded != 'true'
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --output /dev/null "$URL"
