name: Intel Mac beta DMG

# Intel Macs have no qualifying host (hosted Intel runners have no WebGL), so the Intel DMG is offered as beta,
# outside the qualified installer catalog: it is never in `latest/installers.json`, qualification or promote-routes.
# It wraps the same signed, notarized Intel app as the release's `Tau-macos-x64.zip` (desktop-installer-candidate.mts
# verifies the exact archive, its identity and its staple before signing), and publishes
# `releases/<tag>/Tau-macos-x64.dmg` plus `latest/Tau-macos-x64.dmg` while the tag is the channel's promoted release.
# Run it after a full release build (production `desktop@*` tags always package Intel).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Desktop release tag whose release-build.yml run packaged the Intel archive
        required: true
        type: string
      release_run_id:
        description: That tag's successful release-build.yml run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-intel-beta-dmg-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # The full scope is the one that stages the Intel archive; nothing else of the full candidate runs here.
  TAU_DESKTOP_QUALIFICATION_SCOPE: all
  NX_NO_CLOUD: 'true'
  pnpm_config_verify_deps_before_run: error

jobs:
  resolve:
    if: github.ref == 'refs/heads/main' && vars.DESKTOP_INSTALLER_CANDIDATES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      source: ${{ steps.identity.outputs.source }}
      channel: ${{ steps.identity.outputs.channel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - name: Bind the source archive to the exact successful release run
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_TAG: ${{ inputs.tag }}
          DESKTOP_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: pnpm nx run desktop:installer-candidate --args=resolve
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: out/installer-preflight
      - name: Require the release's Intel archive
        env:
          DESKTOP_RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          TAU_DESKTOP_SOURCE_SHA: ${{ steps.identity.outputs.source }}
          DESKTOP_CANDIDATE_ARCHIVES: out/installer-preflight
        run: pnpm nx run desktop:installer-candidate --args=preflight

  dmg:
    needs: resolve
    name: Wrap the Intel app in a signed notarized DMG
    runs-on: macos-26
    timeout-minutes: 90
    # Signs with the channel's Developer ID; publishes nothing.
    environment: desktop-installers-${{ needs.resolve.outputs.channel }}
    env:
      DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      TAU_DESKTOP_SOURCE_SHA: ${{ needs.resolve.outputs.source }}
      DESKTOP_CANDIDATE_TARGET: darwin-x64
      DESKTOP_CANDIDATE_ARCHIVES: ${{ github.workspace }}/out/installer-input
      DESKTOP_CANDIDATE_STAGE: ${{ github.workspace }}/out/installer-stage
      TAU_DESKTOP_PACKAGE_OUTPUT_ROOT: ${{ github.workspace }}/out/installer-output
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      TAU_DESKTOP_NOTARIZE: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-darwin-x64
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: out/installer-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: out/installer-input
      - name: Verify finalized source identity and notarization before signing setup
        run: pnpm nx run desktop:installer-candidate --args=stage
      # Mirrors desktop-installer-candidate.yml.
      - name: Import the Developer ID identity and notary credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ENVIRONMENT: desktop-installers-${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          names=(MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID)
          if [ "$TAU_DESKTOP_NOTARIZE" = true ]; then
            names+=(APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID)
          fi
          for name in "${names[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the $ENVIRONMENT environment"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/tau-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          search_list=("$keychain")
          while IFS= read -r entry; do
            entry=${entry//\"/}
            search_list+=("${entry#"${entry%%[![:space:]]*}"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"
          security default-keychain -d user -s "$keychain"
          rm -f "$certificate"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE "s/.*\"(Developer ID Application: .*\($APPLE_TEAM_ID\))\".*/\1/p" | head -1)
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity for team $APPLE_TEAM_ID in the imported certificate"
            exit 1
          fi
          # package-macos.mts notarizes through this keychain profile.
          if [ "$TAU_DESKTOP_NOTARIZE" = true ]; then
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key"
          xcrun notarytool store-credentials tau-notary --key "$api_key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --keychain "$keychain"
          rm -f "$api_key"
          fi
          {
            echo "TAU_CODESIGN_IDENTITY=$identity"
            echo "TAU_NOTARYTOOL_PROFILE=tau-notary"
            echo "TAU_SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Install uv for the DMG layout builder
        run: |
          command -v uv || pipx install uv
          uv --version
      - name: Wrap the exact finalized ZIP application in a signed notarized DMG
        run: pnpm nx run desktop:installer-candidate --args=dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intel-beta-dmg
          path: out/installer-output/Tau-macos-x64.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tau-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/tau-signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

  publish:
    needs: [resolve, dmg]
    name: Publish the Intel beta DMG
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The environment that holds the channel's download credential. Production is release-manager reviewed.
    environment:
      name: ${{ needs.resolve.outputs.channel == 'production' && 'desktop-promotion-production' || 'desktop-installers-staging' }}
      deployment: false
    env:
      DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      DESKTOP_ASSETS_DIR: out/intel-beta-dmg
      DESKTOP_R2_BUCKET: ${{ vars.DESKTOP_R2_BUCKET }}
      DESKTOP_R2_ENDPOINT: ${{ vars.DESKTOP_R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: intel-beta-dmg
          path: out/intel-beta-dmg
      - name: Publish and read back the DMG
        run: pnpm nx run desktop:publish-intel-beta-dmg
