# Packaged desktop end-to-end on Windows x64 (Windows readiness R4 and the R5 WebGL measurement, programme lane L4).
#
# The macOS packaged gate (`desktop-packaged.yml`) proves the darwin-arm64 package; nothing ran a packaged Windows
# app beyond the packaging assembly checks. This workflow packages the unpacked win32-x64 test package from this
# commit (`desktop:package-windows-e2e`: no archive, so it honours the run's own API and the `TAU_E2E_*` switches)
# and runs, against it on a hosted `windows-2025` runner:
# - `desktop-webgl-renderer.spec.ts`: records which WebGL the packaged renderer gets on a GPU-less hosted runner
#   (WARP, SwiftShader or none) and fails only without WebGL 2;
# - `desktop-build123d.spec.ts`: sign-in through the packaged handoff, a project created on disk, a Build123d kernel
#   run with its first-use download, render, parameters, model tree, a STEP export saved to the project, reopening
#   the project from its card, and a real quit with exit code 0.
#
# Services run as host processes (start-windows-services.sh), because the runner's Docker runs Windows containers
# only. It is not yet a release gate: once it has been green on main it joins `desktop-packaged.yml`'s callers.
name: Packaged desktop end-to-end (Windows)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/desktop-packaged-windows.yml'
      - 'apps/desktop-e2e/scripts/start-windows-services.sh'
      - 'apps/desktop-e2e/src/desktop-webgl-renderer.spec.ts'
  workflow_call:
    inputs:
      ref:
        description: Commit to package and test
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to package and test; defaults to the head of main'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-packaged-windows-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  pnpm_config_verify_deps_before_run: warn
  NX_NO_CLOUD: 'true'
  # No Nx remote cache: setup-nx's guard that falls back when the cache faults is Linux-only, and on this runner a
  # failed cache request ended the whole packaging run (runs 44004901402 attempts 1 and 2), while hits saved almost
  # nothing (2 of 45 tasks).
  TAU_API_URL: http://localhost:4000
  TAU_WEBSOCKET_URL: ws://localhost:4001
  TAU_FRONTEND_URL: http://localhost:3000

jobs:
  packaged:
    name: Packaged desktop end-to-end (win32-x64)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      GEOSPEC_WORKERS: 1
    defaults:
      run:
        shell: bash
    steps:
      # Windows checkouts default to CRLF, which breaks the lockfile parse; keep the committed bytes.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'
          save-pnpm-store: 'false'

      # prepare-build123d-python resolves its wheels with uv.
      - name: Install uv
        run: |
          command -v uv || pipx install uv
          uv --version

      # desktop:prepare-windows-sandbox builds the sandbox helper with the toolchain its crate pins.
      - name: Install the pinned Rust toolchain
        working-directory: libs/sandbox/windows-sandbox
        run: |
          set -euo pipefail
          test -f rust-toolchain.toml || { echo 'libs/sandbox/windows-sandbox/rust-toolchain.toml is missing' >&2; exit 1; }
          rustup toolchain install
          rustup show active-toolchain

      - name: Record package source identity
        run: echo "TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare API env file
        run: cp apps/api/.env.example apps/api/.env

      # MinIO is source-only; its pinned build is cached by the script's own hash, which pins the module versions.
      - name: Restore the MinIO build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/minio-bin
          key: minio-win32-x64-${{ hashFiles('apps/desktop-e2e/scripts/start-windows-services.sh') }}

      - name: Start PostgreSQL, Redis and MinIO on the host
        run: apps/desktop-e2e/scripts/start-windows-services.sh

      # The archive step is skipped (no --archive), but bsdtar ordering matches the release leg for safety.
      - name: Package the win32-x64 test app and build the API
        run: |
          set -euo pipefail
          export PATH="/c/Windows/System32:$PATH"
          pnpm nx run-many -p desktop api -t package-windows-e2e build --parallel=1 --outputStyle=stream

      # The packaged app runs Build123d's worker in the Windows sandbox (TAU_WINDOWS_SHELL_SANDBOX=1 below). The runner's
      # account is already elevated, so the helper's one-time setup runs here, for that account, where a person would
      # approve one UAC prompt.
      - name: Set up the Windows sandbox for the runner's account (elevated)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $helper = 'apps/desktop/package-out/Tau-win32-x64/resources/windows-sandbox/win32-x64/tau-windows-sandbox.exe'
          if (-not (Test-Path -LiteralPath $helper)) { throw "the package has no $helper" }
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & $helper setup --for-user $sid
          if ($LASTEXITCODE -ne 0) { throw "the sandbox setup exited $LASTEXITCODE" }
          & $helper status
          if ($LASTEXITCODE -ne 0) { throw "the sandbox status exited $LASTEXITCODE" }

      - name: Run the packaged Windows suite
        id: packaged
        timeout-minutes: 90
        working-directory: apps/desktop-e2e
        env:
          TAU_E2E_SERVICES: host
          # Each launch's user data (and its dependency store) lives under the temporary folder. The runner's own
          # (C:\Users\RUNNER~1\AppData\Local\Temp) leaves too little of Windows' 259-character library path for
          # Build123d's closure, so use the runner's short temp folder.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          # Contain native kernels and the Terminal in the Windows sandbox the step above set up (Q15 gate).
          TAU_WINDOWS_SHELL_SANDBOX: '1'
          # The API listens on IPv4 only. On windows-2025 the packaged app's services process failed every gateway
          # call to `localhost:4014` with a network error while the renderer reached it (run 44008138089), so name
          # the loopback address the API binds.
          TAU_E2E_API_URL: http://127.0.0.1:4014
          PGUSER: dev_user
          PGPASSWORD: dev_password
        run: |
          set -o pipefail
          ./scripts/ensure-services.sh
          TAU_E2E_DESKTOP_EXECUTABLE="$(cygpath -w "$PWD/../desktop/package-out/Tau-win32-x64/Tau.exe")" \
            ../../node_modules/.bin/vitest run --config vitest.config.ts \
            src/desktop-webgl-renderer.spec.ts src/desktop-build123d.spec.ts \
            | tee "$RUNNER_TEMP/desktop-packaged-windows.log"

      - name: Record the Windows sandbox and crash evidence
        if: failure()
        shell: pwsh
        run: |
          # The sandbox setup grants volume roots and adds firewall and WFP rules; a failed run keeps what the helper
          # reports now, the top-level ACLs it touched, and Windows' own crash records (faulting module and code).
          $out = Join-Path $env:RUNNER_TEMP 'desktop-e2e-services/windows-sandbox-diagnostics.log'
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
          $helper = 'apps/desktop/package-out/Tau-win32-x64/resources/windows-sandbox/win32-x64/tau-windows-sandbox.exe'
          & {
            '--- helper status ---'
            & $helper status 2>&1
            "exit $LASTEXITCODE"
            '--- volume root ACLs ---'
            icacls 'C:\' 2>&1
            icacls 'D:\' 2>&1
            icacls $env:TEMP 2>&1
            '--- application crashes (Event 1000, 1001) ---'
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001; StartTime = (Get-Date).AddHours(-2) } -ErrorAction SilentlyContinue |
              Select-Object -First 40 | Format-List TimeCreated, Id, ProviderName, Message
            '--- sandbox processes still running ---'
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'tau-windows-sandbox|python|Tau' } |
              Format-Table Id, Name, StartTime -AutoSize
          } *> $out
          Get-Content $out -TotalCount 400

      - name: Summarise the packaged suite and the WebGL measurement
        if: always()
        env:
          OUTCOME: ${{ steps.packaged.outcome }}
        run: |
          counts=$( { sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/desktop-packaged-windows.log" 2>/dev/null || true; } \
            | grep -E '^ +Tests ' | tail -1 | sed -E 's/^ +Tests +//' || true)
          {
            echo "- Packaged desktop end-to-end (win32-x64, windows-2025) on \`$TAU_DESKTOP_SOURCE_SHA\`: ${OUTCOME}${counts:+, ${counts}}"
            if [ -f out/test-results/desktop-e2e/webgl-renderer.json ]; then
              echo '- WebGL renderer on this host:'
              echo '```json'
              cat out/test-results/desktop-e2e/webgl-renderer.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the packaged Windows diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-packaged-windows-diagnostics
          path: |
            out/test-results/desktop-e2e
            ${{ runner.temp }}/desktop-e2e-services/*.log
            ${{ runner.temp }}/desktop-packaged-windows.log
          if-no-files-found: ignore
          retention-days: 7
