# The operator rehearsal as a candidate gate: T-REH.2 of the desktop resilient startup blueprint (Brain
# research/desktop-resilient-startup-and-scroll-blueprint.md, infrastructure change I2). `release-desktop-staging.yml`
# calls this on the commit it is about to tag, beside the packaged gate, and tags a candidate only when it is green.
# `workflow_dispatch` runs it on any commit.
#
# The update as the data sees it: the unpackaged app built at the release's base commit produces the incident's profile
# (29 granted folders, one composer location, a Home project), 28 folders are deleted, and the candidate opens that
# profile. The base commit is the newest *published* staging release, the build people update from. A release package
# cannot be the producer: it is locked, so it ignores `--user-data-dir` and the harness's switches, and its inspect fuse
# is off (blueprint D7). Both builds serve the page from `app://tau`, so the candidate reads the databases the older
# build wrote. The operator's own Mac remains the check of the real updater (blueprint, Acceptance plan).
#
# The row runs `desktop-e2e:test:e2e:rehearsal-gate`, which refuses to run without the base build. Until the packages
# that fix the incident land, the row is marked `it.fails` in `desktop-missing-folder-recovery.spec.ts` (the
# repository's form for a known-red test), so this gate passes while the base build's profile still breaks the
# candidate, and holds the candidate the moment the mark is removed and the rehearsal does not pass.
name: Desktop rehearsal gate

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (a desktop candidate's commit)
        type: string
        required: true
    secrets:
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN:
        description: Read token of the Nx remote cache; without it every build dependency runs
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to test; defaults to the head of main'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Keyed by commit and never `github.workflow`, which in a called workflow is the caller's name and would cancel the
# call; a second request for the same commit waits for the first.
concurrency:
  group: desktop-rehearsal-gate-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  pnpm_config_verify_deps_before_run: warn
  NX_NO_CLOUD: 'true'
  # Nx remote cache, read only (no environment, no `id-token: write`); the server is set only when a token is present.
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN != '' && vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
  # The e2e fixture both builds are made for, as ci.yml sets it workflow-wide. `TAU_CLOUD_ENABLED` is not set here, so
  # both desktop builds carry the shipped (self-host) renderer; the target sets it for its own cloud web UI build, and
  # builds the adaptive renderer beside the shipped one (adaptive app deployment mode W6) until the flip (W8).
  TAU_API_URL: http://localhost:4000
  TAU_WEBSOCKET_URL: ws://localhost:4001
  TAU_FRONTEND_URL: http://localhost:3000

jobs:
  rehearsal:
    name: Rehearsal over the base release's profile (T-REH.2)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false
          fetch-depth: 0
      # The checkout above can be a commit older than this workflow, so the apt installer comes from this
      # workflow's own commit (scripts/src/apt-resilience.test.ts).
      - name: Check out this workflow's apt installer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .tau-ci
          sparse-checkout: .github/actions/apt-install
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Find the base release
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(gh release list --exclude-drafts --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("desktop-staging@"))][0].tagName // ""')
          if [ -z "$tag" ]; then
            echo '::error::No published desktop-staging release exists to produce the rehearsal profile.'
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          sha=$(git rev-parse "$tag^{commit}")
          echo "Producer: $tag ($sha); candidate: $(git rev-parse HEAD)."
          {
            echo "tag=$tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      # The producer's own checkout, dependencies and unpackaged build (`desktop:build` builds `ui:build:desktop` first),
      # in a second worktree beside this one. pnpm links both installs from the one store.
      - name: Build the base release's unpackaged app in a second worktree
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/rehearsal-base"
          git worktree add --detach "$worktree" "$BASE"
          cd "$worktree"
          pnpm install --frozen-lockfile
          pnpm nx run desktop:build --outputStyle=stream
          test -f apps/ui/desktop/build/client/index.html
          echo "TAU_E2E_REHEARSAL_BASE_DESKTOP_ROOT=$worktree/apps/desktop" >> "$GITHUB_ENV"

      # Sandboxed native kernel workers, as the desktop e2e lanes in e2e-nightly.yml and ci.yml.
      - name: Setup Linux sandbox prerequisites
        uses: ./.github/actions/setup-linux-sandbox

      # The services utility renders under plain Node, and the runner has no GPU: lavapipe, as in e2e-nightly.yml.
      - name: Install a software Vulkan driver for native rendering
        uses: ./.tau-ci/.github/actions/apt-install
        with:
          packages: mesa-vulkan-drivers
      - name: Select the software Vulkan driver
        run: echo 'VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json' >> "$GITHUB_ENV"

      # The rehearsal boots a real API, which reads this file for its `BILLING_*` development values.
      - name: Prepare API env file
        run: cp apps/api/.env.example apps/api/.env

      - name: Run the rehearsal over the base release's profile
        id: rehearsal
        timeout-minutes: 120
        run: |
          set -o pipefail
          xvfb-run --auto-servernum pnpm nx run desktop-e2e:test:e2e:rehearsal-gate --outputStyle=stream \
            | tee "$RUNNER_TEMP/desktop-rehearsal.log"

      - name: Summarise the rehearsal
        if: always()
        env:
          OUTCOME: ${{ steps.rehearsal.outcome }}
          TAG: ${{ steps.base.outputs.tag }}
        run: |
          counts=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/desktop-rehearsal.log" 2>/dev/null \
            | grep -E '^ +Tests ' | tail -1 | sed -E 's/^ +Tests +//')
          echo "- Rehearsal gate (T-REH.2), profile by \`${TAG:-unknown}\`, opened by \`$(git rev-parse HEAD)\`: ${OUTCOME}${counts:+, ${counts}}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

      - name: Upload the rehearsal diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-rehearsal-gate-diagnostics
          path: out/test-results/desktop-e2e
          if-no-files-found: ignore
          retention-days: 7
