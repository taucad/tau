name: Qualified desktop installer publication

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [staging, production]
        required: true
      operation:
        type: choice
        options: [promote-routes, renew-routes]
        required: true
      scope:
        description: All qualified routes, or one platform's catalog (Apple silicon ZIP/DMG, or Linux APT/AppImage) on either channel (D-H5, promotion only)
        type: choice
        options: [all, macos, linux]
        default: all
      tag:
        description: Exact candidate tag (promotion only)
        type: string
      candidate-run-id:
        description: Successful trusted installer candidate run (promotion only)
        type: string
      ci-run-id:
        description: Trusted native qualification run (W9, promotion only)
        type: string
      vm-run-id:
        description: Trusted operator VM acceptance run (W10, promotion only; may be left empty only for a Mac-only (scope macos) promotion on either channel, which then publishes its routes as clean-host pending)
        type: string
      manifest-sha256:
        description: Reviewed canonical manifest digest (promotion only)
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  actions: read

jobs:
  # Operator decision D-DS3 (desktop split blueprint DS-3): Intel is packaged where it ships, not on a
  # schedule. Automatic staging candidates are Apple silicon only, so promoting all routes of one asks
  # `release-desktop-staging.yml` for a full candidate (`intel`) of the same commit and stops: the
  # operator promotes that tag once its installer candidate and qualification runs are green. A
  # production tag (`desktop@*`) always packages both. Only the `all` scope asks for Intel, so a
  # per-platform scope (`macos` or `linux`) never does.
  candidate:
    name: Require a full candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Request a full candidate for an Apple silicon-only one
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote-routes' && inputs.scope == 'all'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            desktop-staging@*) ;;
            *) echo "$TAG is not a staging candidate; nothing to request."; exit 0 ;;
          esac
          object=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object | "\(.type) \(.sha)"')
          sha=${object#* }
          if [ "${object%% *}" = tag ]; then
            message=$(gh api "repos/${GH_REPO}/git/tags/${sha}" --jq .message)
            if grep -qx 'Mac architectures: arm64 x64' <<< "$message"; then
              echo "$TAG is a full candidate (Apple silicon and Intel)."
              exit 0
            fi
            sha=$(gh api "repos/${GH_REPO}/git/tags/${sha}" --jq .object.sha)
          fi
          gh workflow run release-desktop-staging.yml --repo "$GH_REPO" --ref main -f intel=true -f sha="$sha"
          echo "::error::$TAG is Apple silicon only. Requested a full candidate of $sha (release-desktop-staging.yml, intel); promote that tag once its installer candidate and qualification runs are green."
          exit 1

  publication:
    needs: [candidate]
    # Each channel has its own repository gate, read before any environment is selected:
    # a dispatch runs only for an enabled channel, and the nightly schedule renews only enabled channels.
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'schedule' && (vars.DESKTOP_INSTALLER_PUBLICATION_STAGING == 'true' || vars.DESKTOP_INSTALLER_PUBLICATION_PRODUCTION == 'true')) ||
        (github.event_name == 'workflow_dispatch' && (
          (inputs.channel == 'staging' && vars.DESKTOP_INSTALLER_PUBLICATION_STAGING == 'true') ||
          (inputs.channel == 'production' && vars.DESKTOP_INSTALLER_PUBLICATION_PRODUCTION == 'true'))))
    strategy:
      fail-fast: false
      matrix:
        channel: >-
          ${{ github.event_name == 'schedule' && fromJSON(format('[{0}{1}{2}]',
            vars.DESKTOP_INSTALLER_PUBLICATION_STAGING == 'true' && '"staging"' || '',
            vars.DESKTOP_INSTALLER_PUBLICATION_STAGING == 'true' && vars.DESKTOP_INSTALLER_PUBLICATION_PRODUCTION == 'true' && ',' || '',
            vars.DESKTOP_INSTALLER_PUBLICATION_PRODUCTION == 'true' && '"production"' || '')) || fromJSON(format('["{0}"]', inputs.channel)) }}
    # The same lock covers promotion, renewal and recovery, across all runs.
    concurrency:
      group: desktop-installer-publication-${{ matrix.channel }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ (github.event_name == 'schedule' || inputs.operation == 'renew-routes') && 'desktop-installer-renewal' || 'desktop-installers' }}-${{ matrix.channel }}
      deployment: false
    permissions:
      contents: read
      actions: write # read runs, and dispatch the release gate for a candidate that has no verdict
      id-token: write
    env:
      pnpm_config_verify_deps_before_run: error
      NX_NO_CLOUD: 'true'
      GH_TOKEN: ${{ github.token }}
      # The scripts re-check the gate of the channel they publish (desktop-publication-authority.mts).
      DESKTOP_INSTALLER_PUBLICATION_STAGING: ${{ vars.DESKTOP_INSTALLER_PUBLICATION_STAGING }}
      DESKTOP_INSTALLER_PUBLICATION_PRODUCTION: ${{ vars.DESKTOP_INSTALLER_PUBLICATION_PRODUCTION }}
      DESKTOP_ASSETS_DIR: out/desktop/installer-publication
      DESKTOP_R2_BUCKET: ${{ vars.DESKTOP_R2_BUCKET }}
      DESKTOP_R2_ENDPOINT: ${{ vars.DESKTOP_R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      TAU_APPIMAGE_KEY_ID: ${{ vars.TAU_APPIMAGE_KEY_ID }}
      TAU_APT_SIGNING_FINGERPRINT: ${{ vars.TAU_APT_SIGNING_FINGERPRINT }}
      TAU_INSTALLER_CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
      TAU_ROUTE_CI_RUN_ID: ${{ inputs.ci-run-id }}
      TAU_ROUTE_VM_RUN_ID: ${{ inputs.vm-run-id }}
      # Scheduled renewal has no inputs and renews the completed catalog whatever scope promoted it.
      TAU_DESKTOP_QUALIFICATION_SCOPE: ${{ inputs.scope || 'all' }}
    steps:
      - name: Select requested channel
        id: selected
        env:
          REQUESTED: ${{ inputs.channel }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$REQUESTED" = "$CHANNEL" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.selected.outputs.run == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
        if: steps.selected.outputs.run == 'true'
      # Operator decision D3 (2026-11-08, Brain research/ci-throughput-review.md): production promotes
      # only a candidate whose own commit has five green shell conformance rows. They come from the
      # staging gate that created the tag (its run is named in the release notes) or from a green
      # `shell-conformance.yml` run on that commit. This reads results; it never runs the rows again.
      # Only the workflow's own fresh full-tier triggers count (the nightly and a dispatch). A `pull_request` run may
      # reuse a cached verdict (CF-1), and a labelled PR whose head is a `main` commit (the `production` trail PR) would
      # otherwise satisfy this lookup; the merge queue's semantics-tier call may reuse too and runs a subset of rows.
      - name: Require green shell conformance on the candidate's commit
        if: steps.selected.outputs.run == 'true' && matrix.channel == 'production' && inputs.operation == 'promote-routes'
        env:
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo '::error::A production promotion names its candidate tag.'; exit 1; }
          sha=$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)
          green=$(gh api "repos/${GH_REPO}/actions/workflows/shell-conformance.yml/runs?head_sha=${sha}&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")] | length')
          if [ "$green" -gt 0 ]; then
            echo "Shell conformance passed on ${sha} in a shell-conformance.yml run."
            exit 0
          fi
          gate=$(gh release view "$TAG" --repo "$GH_REPO" --json body --jq .body | sed -n 's/^Shell conformance gate: run \([0-9][0-9]*\)$/\1/p' | head -n 1)
          if [ -n "$gate" ]; then
            passed=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${gate}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name | startswith("Shell gate / Shell conformance on ")) | select(.conclusion == "success") | .name' | sort -u | wc -l)
            if [ "$passed" -ge 5 ]; then
              echo "Shell conformance passed on ${sha}: all five rows of the staging gate run ${gate}."
              exit 0
            fi
          fi
          echo "::error::No green shell conformance on ${sha} (${TAG}). Dispatch shell-conformance.yml on the tag, or cut a new candidate."
          exit 1
      # The release gate (CI throughput review RG-1, `release-gate.yml`): a promotion on either channel
      # needs a green gate verdict on the candidate's own commit (the uncached sweep, the formal matrix and the
      # cross-root read lint). The newest candidate's gate started by itself when `release-build.yml` ran for
      # its tag. Running or red blocks and names the run; no verdict dispatches the gate for the commit and
      # blocks naming it, and the operator promotes again once it passes. Nothing here waits on it. A renewal
      # publishes nothing new and does not read it.
      - name: Find the candidate's commit
        id: candidate-commit
        if: steps.selected.outputs.run == 'true' && inputs.operation == 'promote-routes'
        env:
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo '::error::A promotion names its candidate tag.'; exit 1; }
          echo "sha=$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)" >> "$GITHUB_OUTPUT"
      - name: Require a green release gate on the candidate's commit
        if: steps.selected.outputs.run == 'true' && inputs.operation == 'promote-routes'
        uses: ./.github/actions/release-gate-verdict
        with:
          sha: ${{ steps.candidate-commit.outputs.sha }}
          github-token: ${{ github.token }}
          require: 'true'
          dispatch: 'true'
      - name: Load protected signing inputs
        if: steps.selected.outputs.run == 'true'
        env:
          APPIMAGE_PRIVATE_KEY: ${{ inputs.scope != 'macos' && secrets.TAU_APPIMAGE_PRIVATE_KEY || '' }}
          APPIMAGE_PUBLIC_KEYS: ${{ inputs.scope != 'macos' && vars.TAU_APPIMAGE_PUBLIC_KEYS || '' }}
          APT_PRIVATE_KEY_BASE64: ${{ inputs.scope != 'macos' && secrets.TAU_APT_PRIVATE_KEY_BASE64 || '' }}
          ROUTE_TRUST: ${{ vars.TAU_ROUTE_TRUST }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/desktop-signing" out/desktop
          printf '%s' "$ROUTE_TRUST" > "$RUNNER_TEMP/desktop-signing/route-trust.json"
          mkdir -m 700 "$RUNNER_TEMP/desktop-signing/gnupg"
          # A Mac-only promotion admits no AppImage or APT route, so Linux signing material is never materialized.
          if [ "$TAU_DESKTOP_QUALIFICATION_SCOPE" != macos ]; then
            printf '%s' "$APPIMAGE_PRIVATE_KEY" > "$RUNNER_TEMP/desktop-signing/appimage.pem"
            printf '%s' "$APPIMAGE_PUBLIC_KEYS" > "$RUNNER_TEMP/desktop-signing/public-keys.json"
            if [ -n "$APT_PRIVATE_KEY_BASE64" ]; then
              printf '%s' "$APT_PRIVATE_KEY_BASE64" | base64 --decode | gpg --homedir "$RUNNER_TEMP/desktop-signing/gnupg" --batch --import
            fi
          fi
          {
            echo "TAU_APPIMAGE_PRIVATE_KEY_FILE=$RUNNER_TEMP/desktop-signing/appimage.pem"
            echo "TAU_APPIMAGE_PUBLIC_KEYS_FILE=$RUNNER_TEMP/desktop-signing/public-keys.json"
            echo "TAU_ROUTE_TRUST_FILE=$RUNNER_TEMP/desktop-signing/route-trust.json"
            echo "TAU_APT_GNUPGHOME=$RUNNER_TEMP/desktop-signing/gnupg"
            echo "TAU_UPDATE_ISSUED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          } >> "$GITHUB_ENV"
      - name: Retrieve qualified candidate or completed metadata
        if: steps.selected.outputs.run == 'true'
        env:
          CHANNEL: ${{ matrix.channel }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_TAG: ${{ inputs.tag }}
          APPROVED_DIGEST: ${{ inputs.manifest-sha256 }}
        run: pnpm nx run desktop:route-workflow --args=prepare
      - name: Publish or renew under the shared channel lock
        if: steps.selected.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ "$TAU_ROUTE_OPERATION" != renew-routes ]; then
            pnpm nx run desktop:publish --args="$TAU_ROUTE_OPERATION"
            exit 0
          fi
          # Renewal renews every promoted lane (the all-platform catalog, or each platform of a composed one, D-H5),
          # each from its own completed candidate and directory.
          [ -n "${TAU_RENEWAL_LANES:-}" ] || { echo '::error::No promoted lane to renew.'; exit 1; }
          for entry in $TAU_RENEWAL_LANES; do
            IFS=: read -r lane tag source <<< "$entry"
            TAU_PUBLICATION_LANE="$lane" DESKTOP_RELEASE_TAG="$tag" TAU_DESKTOP_SOURCE_SHA="$source" \
              DESKTOP_ASSETS_DIR="$DESKTOP_ASSETS_DIR/$lane" pnpm nx run desktop:publish --args=renew-routes
          done
      - name: Clean ephemeral signing files
        if: always() && steps.selected.outputs.run == 'true'
        run: rm -rf "$RUNNER_TEMP/desktop-signing"
      - name: Report failed metadata renewal or publication
        if: failure() && steps.selected.outputs.run == 'true'
        run: |
          echo '::error::Desktop installer metadata publication failed. Check the last completed receipt and recover the same candidate before seven-day descriptor/APT validity expires.'
          echo 'Public promotion remains unqualified unless every pointer has a completed readback receipt. Follow the desktop release handbook.' >> "$GITHUB_STEP_SUMMARY"
