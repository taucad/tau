name: Desktop installed route qualification

on:
  workflow_dispatch:
    inputs:
      scope:
        description: All platforms, or one platform's evidence (Linux APT/AppImage, Apple silicon ZIP/DMG, or Windows NSIS) on either channel (D-H5)
        required: true
        default: all
        type: choice
        options: [all, linux, macos, windows]
      channel:
        description: Exact candidate channel; all three candidates must agree
        required: true
        type: choice
        options: [staging, production]
      graphics:
        description: Stock GPU acceptance, or isolated Linux software CI that cannot produce release receipts
        type: choice
        default: stock
        options: [stock, isolated-software]
      candidate_a:
        description: Successful trusted installer-candidate run for baseline A
        required: true
        type: string
      candidate_b:
        description: Successful trusted installer-candidate run for explicit update B
        required: true
        type: string
      candidate_c:
        description: Successful trusted C run; the Mac, Windows and Linux platform scopes may pin a trusted ancestor (bound by qualification-binding.json)
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Every Linux-scoped run, on either channel, holds the one Linux GPU lock that clean-host acceptance shares: the
# project's spot T4 quota covers one Linux matrix at a time.
concurrency:
  group: ${{ inputs.scope == 'linux' && 'desktop-route-qualification-staging-linux' || format('desktop-route-qualification-{0}-{1}', inputs.channel, inputs.scope) }}
  cancel-in-progress: false

env:
  TAU_DESKTOP_QUALIFICATION_SCOPE: ${{ inputs.scope }}
  TAU_QUALIFICATION_GRAPHICS: ${{ inputs.graphics }}
  NX_NO_CLOUD: 'true'
  pnpm_config_verify_deps_before_run: error

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      canary: ${{ steps.selection.outputs.canary }}
    steps:
      - name: Fail closed when qualification has not been enabled by its operator
        env:
          QUALIFICATION_ENABLED: ${{ vars.DESKTOP_ROUTE_QUALIFICATION_ENABLED }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$QUALIFICATION_ENABLED" != true ]; then
            echo '::error::Qualification not run: requires protected main and explicit operator enablement.'
            exit 1
          fi
      - name: Select the complete requested host set
        id: selection
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const scope = process.env.TAU_DESKTOP_QUALIFICATION_SCOPE;
          if (!['all', 'linux', 'macos', 'windows'].includes(scope) || !['staging', 'production'].includes(process.env.CHANNEL)) throw new Error('Invalid qualification scope/channel');
          const graphics = process.env.TAU_QUALIFICATION_GRAPHICS;
          if (!['stock', 'isolated-software'].includes(graphics) || (graphics === 'isolated-software' && (scope !== 'linux' || process.env.CHANNEL !== 'staging'))) throw new Error('Software CI requires Linux staging');
          const rows = [
            {"id": "macos-zip-arm64", "route": "macos-zip", "host": "[\"macos-26\"]"},
            {"id": "macos-dmg-arm64", "route": "macos-dmg", "host": "[\"macos-26\"]"},
            {"id": "macos-zip-x64", "route": "macos-zip", "host": "[\"macos-26-intel\"]"},
            {"id": "macos-dmg-x64", "route": "macos-dmg", "host": "[\"macos-26-intel\"]"},
            {"id": "windows-nsis-x64", "route": "windows-nsis", "host": "[\"windows-2025\"]"},
            {"id": "ubuntu-apt-x11", "route": "linux-apt", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-ubuntu2404-x11\"]"},
            {"id": "ubuntu-appimage-x11", "route": "linux-appimage", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-ubuntu2404-x11\"]"},
            {"id": "ubuntu2604-apt-x11", "route": "linux-apt", "distro": "ubuntu2604", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-ubuntu2604-x11\"]"},
            {"id": "ubuntu2604-appimage-x11", "route": "linux-appimage", "distro": "ubuntu2604", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-ubuntu2604-x11\"]"},
            {"id": "debian-apt-x11", "route": "linux-apt", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-debian13-x11\"]"},
            {"id": "debian-appimage-x11", "route": "linux-appimage", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-debian13-x11\"]"},
            // T-B22.4 (desktop resilient startup blueprint, I2): one recovery row per route that installs without a
            // renderer. Each runs on its own disposable host: A starts with a renderer that cannot load and must reach B
            // by the guarded automatic install through the recovery window alone (qualification-recovery.mts). The
            // receipts job admits them before any receipt is published, so they gate Windows and Linux promotion.
            {"id": "windows-nsis-recovery-x64", "route": "windows-nsis", "scenario": "recovery", "host": "[\"windows-2025\"]"},
            {"id": "ubuntu-apt-recovery-x11", "route": "linux-apt", "scenario": "recovery", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-ubuntu2404-x11\"]"},
            {"id": "ubuntu-appimage-recovery-x11", "route": "linux-appimage", "scenario": "recovery", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-ubuntu2404-x11\"]"},
          ];
          // A scoped run selects exactly its own platform's rows. Mac-only is ZIP and DMG on Apple silicon: hosted Intel
          // Macs have no WebGL, so Intel is out of the Mac-only scope by operator ruling. Windows-only is the NSIS row.
          // Isolated software CI produces no receipts, so it has no recovery rows to admit either.
          const eligible = graphics === 'isolated-software' ? rows.filter(row => row.scenario !== 'recovery') : rows;
          const selected = scope === 'all' ? eligible : eligible.filter(row => row.route.startsWith(`${scope}-`) && (scope !== 'macos' || row.id.endsWith('-arm64')));
          // Canary first (D-H8): a Linux run starts with one row alone and holds the rest until it passes, so a defect
          // costs one row instead of the whole serial matrix. Other scopes have no canary.
          const canary = scope === 'linux' ? selected.slice(0, 1) : [];
          appendFileSync(process.env.GITHUB_OUTPUT, `canary=${JSON.stringify(canary)}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(selected.slice(canary.length))}\n`);
          NODE

  # The Linux canary row runs alone first and the rest of the matrix waits for it (D-H8); it shares the row steps below.
  canary:
    if: inputs.scope == 'linux'
    needs: admission
    environment: desktop-qualification-${{ inputs.channel }}
    timeout-minutes: 120
    # id-token lets stock Linux rows sign in to Google Cloud keylessly; tau-ci admits only this repository's main
    # branch in a desktop qualification environment (tau-cloud stacks/gcp).
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.admission.outputs.canary) }}
    runs-on: ${{ inputs.scope == 'linux' && 'ubuntu-24.04' || fromJSON(matrix.host) }}
    env: &row-env
      GH_TOKEN: ${{ github.token }}
      TAU_QUALIFICATION_DISPOSABLE_HOST: '1'
      TAU_QUALIFICATION_DIRECTORY: ${{ github.workspace }}/out/route-qualification
      TAU_QUALIFICATION_ROUTE: ${{ matrix.route }}
      # `recovery` runs T-B22.4 instead of the A→B→C chain (qualification-recovery.mts).
      TAU_QUALIFICATION_SCENARIO: ${{ matrix.scenario || 'chain' }}
      TAU_QUALIFICATION_CHANNEL: ${{ inputs.channel }}
      TAU_QUALIFICATION_RUN_A: ${{ inputs.candidate_a }}
      TAU_QUALIFICATION_RUN_B: ${{ inputs.candidate_b }}
      TAU_QUALIFICATION_RUN_C: ${{ inputs.candidate_c }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      TAU_WINDOWS_PUBLISHER: ${{ vars.TAU_WINDOWS_PUBLISHER }}
      # Linux trust is only read by Linux rows; other rows get an inert empty key set instead of a Linux prerequisite.
      TAU_APPIMAGE_PUBLIC_KEYS: ${{ !startsWith(matrix.route, 'linux-') && '{}' || vars.TAU_APPIMAGE_PUBLIC_KEYS }}
      TAU_APPIMAGE_KEY_ID: ${{ vars.TAU_APPIMAGE_KEY_ID }}
      TAU_APT_PRIMARY_FINGERPRINT: ${{ vars.TAU_APT_PRIMARY_FINGERPRINT }}
      TAU_APT_SIGNING_FINGERPRINT: ${{ vars.TAU_APT_SIGNING_FINGERPRINT }}
    steps: &row-steps # Windows checkouts default to CRLF, which breaks the lockfile parse; keep the committed bytes.
      - name: Keep committed line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      # Hosted runners have no GPU, so stock Linux graphics runs on a disposable Google Cloud T4 host instead of a
      # nested QEMU guest. The token is short-lived and scoped to creating, reaching and deleting those hosts.
      - name: Sign in to Google Cloud for a disposable GPU host
        if: inputs.scope == 'linux' && inputs.graphics == 'stock'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/274078410041/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ci-gpu-runner@tau-ci.iam.gserviceaccount.com
      - name: Run Linux staging inside a disposable full guest
        if: inputs.scope == 'linux'
        env:
          TAU_VM_MODE: qualification
          TAU_VM_HOST: ${{ inputs.graphics == 'stock' && 'gcp' || 'qemu' }}
          TAU_GCP_PROJECT: tau-ci
          TAU_GCP_ZONES: us-central1-a us-central1-b us-central1-c us-central1-f us-east1-b us-east1-c us-east1-d us-west1-a us-west1-b us-west1-c europe-west4-a europe-west4-b europe-west4-c europe-west1-b europe-west1-c europe-west1-d
          TAU_VM_DISTRO: ${{ matrix.distro || (startsWith(matrix.id, 'ubuntu-') && 'ubuntu' || 'debian') }}
        run: bash apps/desktop/scripts/hosted-linux-vm.sh
      # The AppImage recovery row rebuilds A's managed image around a broken renderer entry (T-B22.4).
      - name: Install squashfs tools for the AppImage recovery row
        if: inputs.scope != 'linux' && matrix.scenario == 'recovery' && matrix.route == 'linux-appimage'
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends squashfs-tools
      - name: Run installed shipping renderer, explicit update and latest-feed update
        if: inputs.scope != 'linux'
        run: pnpm nx run desktop:qualify-installed-route
      - name: Remove only this run's temporary TLS trust even after failure
        if: always() && inputs.scope != 'linux'
        run: pnpm nx run desktop:cleanup-qualification-trust
      - name: Preserve diagnostic observations without private TLS keys or app profile contents
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.graphics == 'isolated-software' && 'desktop-linux-software-ci-diagnostics' || 'desktop-route-diagnostics' }}-${{ matrix.id }}
          path: |
            out/route-qualification/qualification-*.json
            out/route-qualification/renderer-*.json
            out/route-qualification/renderer-*.png
            out/route-qualification/renderer-*.txt
            out/route-qualification/mirror-trust.json
          if-no-files-found: warn
      # A recovery row keeps its T-B22.4 receipt apart from the route receipts, which only chain rows produce.
      - name: Keep passed row separate until every required host succeeds
        if: inputs.graphics != 'isolated-software'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.scenario == 'recovery' && 'desktop-route-recovery' || 'desktop-route-row' }}-${{ matrix.id }}
          path: out/route-qualification/${{ matrix.scenario == 'recovery' && 'recovery-receipt.json' || 'route-receipts.json' }}
          if-no-files-found: error
      - name: Retain isolated software CI observations without acceptance receipts
        if: inputs.graphics == 'isolated-software'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-linux-software-ci-${{ matrix.id }}
          path: |
            out/route-qualification/software-ci-evidence.json
            out/route-qualification/qualification-evidence.json
          if-no-files-found: error

  installed:
    needs: [admission, canary]
    # Runs after a passed Linux canary, or at once for a scope that has none.
    if: ${{ !cancelled() && needs.admission.result == 'success' && (needs.canary.result == 'success' || (inputs.scope != 'linux' && needs.canary.result == 'skipped')) }}
    environment: desktop-qualification-${{ inputs.channel }}
    timeout-minutes: 120
    # id-token lets stock Linux rows sign in to Google Cloud keylessly; tau-ci admits only this repository's main
    # branch in a desktop qualification environment (tau-cloud stacks/gcp).
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      # Stock Linux rows each hold the project's one spot T4 (tau-cloud GPU quota), so they run one at a time.
      max-parallel: ${{ inputs.scope == 'linux' && inputs.graphics == 'stock' && 1 || 4 }}
      matrix:
        include: ${{ fromJSON(needs.admission.outputs.matrix) }}
    runs-on: ${{ inputs.scope == 'linux' && 'ubuntu-24.04' || fromJSON(matrix.host) }}
    env: *row-env
    steps: *row-steps

  receipts:
    if: ${{ !cancelled() && inputs.graphics != 'isolated-software' && needs.installed.result == 'success' }}
    needs: [canary, installed]
    environment: desktop-qualification-${{ inputs.channel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAU_INSTALLER_CANDIDATE_RUN_ID: ${{ inputs.candidate_c }}
      TAU_QUALIFICATION_CHANNEL: ${{ inputs.channel }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      TAU_WINDOWS_PUBLISHER: ${{ vars.TAU_WINDOWS_PUBLISHER }}
      TAU_APPIMAGE_KEY_ID: ${{ vars.TAU_APPIMAGE_KEY_ID }}
      TAU_APT_PRIMARY_FINGERPRINT: ${{ vars.TAU_APT_PRIMARY_FINGERPRINT }}
      TAU_APT_SIGNING_FINGERPRINT: ${{ vars.TAU_APT_SIGNING_FINGERPRINT }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-route-row-*
          path: out/qualification-rows
      # T-B22.4: no route receipt is published unless every recovery row of the scope passed on one A and B.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: inputs.scope != 'macos'
        with:
          pattern: desktop-route-recovery-*
          path: out/qualification-recovery
      - name: Require every T-B22.4 recovery row of the scope
        run: pnpm nx run desktop:collect-qualification-recovery
      - name: Require every native row and bind all receipts to final source
        run: pnpm nx run desktop:collect-qualification-rows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.scope == 'all' && 'desktop-route-host-matrix' || format('desktop-{0}-host-matrix', inputs.scope) }}
          path: out/qualification-receipts/host-matrix.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.scope == 'all' && 'desktop-route-ci-receipts' || format('desktop-{0}-ci-receipts', inputs.scope) }}
          path: |
            out/qualification-receipts/route-receipts.json
            ${{ inputs.scope != 'all' && 'out/qualification-receipts/qualification-binding.json' || '' }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.scope == 'all' && 'desktop-route-recovery-receipts' || format('desktop-{0}-recovery-receipts', inputs.scope) }}
          path: out/qualification-recovery-receipts/recovery-receipts.json
          if-no-files-found: error
