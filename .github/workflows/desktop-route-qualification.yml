name: Desktop installed route qualification

on:
  workflow_dispatch:
    inputs:
      scope:
        description: All platforms, Linux-only staging evidence (not public promotion), or Mac-only staging ZIP/DMG evidence
        required: true
        default: all
        type: choice
        options: [all, linux, macos]
      channel:
        description: Exact candidate channel; all three candidates must agree
        required: true
        type: choice
        options: [staging, production]
      graphics:
        description: Stock GPU acceptance, or isolated Linux software CI that cannot produce release receipts
        type: choice
        default: stock
        options: [stock, isolated-software]
      candidate_a:
        description: Successful trusted installer-candidate run for baseline A
        required: true
        type: string
      candidate_b:
        description: Successful trusted installer-candidate run for explicit update B
        required: true
        type: string
      candidate_c:
        description: Successful trusted C run; staging Mac CI and Linux may pin a trusted ancestor
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-route-qualification-${{ inputs.channel }}
  cancel-in-progress: false

env:
  TAU_DESKTOP_QUALIFICATION_SCOPE: ${{ inputs.scope }}
  TAU_QUALIFICATION_GRAPHICS: ${{ inputs.graphics }}
  NX_NO_CLOUD: 'true'
  pnpm_config_verify_deps_before_run: error

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - name: Fail closed when qualification has not been enabled by its operator
        env:
          QUALIFICATION_ENABLED: ${{ vars.DESKTOP_ROUTE_QUALIFICATION_ENABLED }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$QUALIFICATION_ENABLED" != true ]; then
            echo '::error::Qualification not run: requires protected main and explicit operator enablement.'
            exit 1
          fi
      - name: Select the complete requested host set
        id: selection
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const scope = process.env.TAU_DESKTOP_QUALIFICATION_SCOPE;
          if (!['all', 'linux', 'macos'].includes(scope) || (scope !== 'all' && process.env.CHANNEL !== 'staging')) throw new Error('Invalid qualification scope/channel');
          const graphics = process.env.TAU_QUALIFICATION_GRAPHICS;
          if (!['stock', 'isolated-software'].includes(graphics) || (graphics === 'isolated-software' && (scope !== 'linux' || process.env.CHANNEL !== 'staging'))) throw new Error('Software CI requires Linux staging');
          const rows = [
            {"id": "macos-zip-arm64", "route": "macos-zip", "host": "[\"macos-26\"]"},
            {"id": "macos-dmg-arm64", "route": "macos-dmg", "host": "[\"macos-26\"]"},
            {"id": "macos-zip-x64", "route": "macos-zip", "host": "[\"macos-26-intel\"]"},
            {"id": "macos-dmg-x64", "route": "macos-dmg", "host": "[\"macos-26-intel\"]"},
            {"id": "windows-nsis-x64", "route": "windows-nsis", "host": "[\"windows-2025\"]"},
            {"id": "ubuntu-apt-x11", "route": "linux-apt", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-ubuntu2404-x11\"]"},
            {"id": "ubuntu-appimage-x11", "route": "linux-appimage", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-ubuntu2404-x11\"]"},
            {"id": "ubuntu2604-apt-x11", "route": "linux-apt", "distro": "ubuntu2604", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-ubuntu2604-x11\"]"},
            {"id": "ubuntu2604-appimage-x11", "route": "linux-appimage", "distro": "ubuntu2604", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-ubuntu2604-x11\"]"},
            {"id": "debian-apt-x11", "route": "linux-apt", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-debian13-x11\"]"},
            {"id": "debian-appimage-x11", "route": "linux-appimage", "host": "[\"self-hosted\", \"linux\", \"x64\", \"tau-disposable-debian13-x11\"]"},
          ];
          // A scoped run selects exactly its own platform's rows: Mac-only is ZIP and DMG on both native architectures.
          const selected = scope === 'all' ? rows : rows.filter(row => row.route.startsWith(scope === 'linux' ? 'linux-' : 'macos-'));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(selected)}\n`);
          NODE

  installed:
    needs: admission
    environment: desktop-qualification-${{ inputs.channel }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.admission.outputs.matrix) }}
    runs-on: ${{ inputs.scope == 'linux' && 'ubuntu-24.04' || fromJSON(matrix.host) }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAU_QUALIFICATION_DISPOSABLE_HOST: '1'
      TAU_QUALIFICATION_DIRECTORY: ${{ github.workspace }}/out/route-qualification
      TAU_QUALIFICATION_ROUTE: ${{ matrix.route }}
      TAU_QUALIFICATION_CHANNEL: ${{ inputs.channel }}
      TAU_QUALIFICATION_RUN_A: ${{ inputs.candidate_a }}
      TAU_QUALIFICATION_RUN_B: ${{ inputs.candidate_b }}
      TAU_QUALIFICATION_RUN_C: ${{ inputs.candidate_c }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      TAU_WINDOWS_PUBLISHER: ${{ vars.TAU_WINDOWS_PUBLISHER }}
      # Linux trust is only read by Linux rows; other rows get an inert empty key set instead of a Linux prerequisite.
      TAU_APPIMAGE_PUBLIC_KEYS: ${{ !startsWith(matrix.route, 'linux-') && '{}' || vars.TAU_APPIMAGE_PUBLIC_KEYS }}
      TAU_APPIMAGE_KEY_ID: ${{ vars.TAU_APPIMAGE_KEY_ID }}
      TAU_APT_PRIMARY_FINGERPRINT: ${{ vars.TAU_APT_PRIMARY_FINGERPRINT }}
      TAU_APT_SIGNING_FINGERPRINT: ${{ vars.TAU_APT_SIGNING_FINGERPRINT }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - name: Run Linux staging inside a disposable full guest
        if: inputs.scope == 'linux'
        env:
          TAU_VM_MODE: qualification
          TAU_VM_DISTRO: ${{ matrix.distro || (startsWith(matrix.id, 'ubuntu-') && 'ubuntu' || 'debian') }}
        run: bash apps/desktop/scripts/hosted-linux-vm.sh
      - name: Run installed shipping renderer, explicit update and latest-feed update
        if: inputs.scope != 'linux'
        run: pnpm nx run desktop:qualify-installed-route
      - name: Remove only this run's temporary TLS trust even after failure
        if: always() && inputs.scope != 'linux'
        run: pnpm nx run desktop:cleanup-qualification-trust
      - name: Preserve diagnostic observations without private TLS keys or app profile contents
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.graphics == 'isolated-software' && 'desktop-linux-software-ci-diagnostics' || 'desktop-route-diagnostics' }}-${{ matrix.id }}
          path: |
            out/route-qualification/qualification-*.json
            out/route-qualification/renderer-*.json
            out/route-qualification/renderer-*.png
            out/route-qualification/mirror-trust.json
          if-no-files-found: warn
      - name: Keep passed row separate until every required host succeeds
        if: inputs.graphics != 'isolated-software'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-route-row-${{ matrix.id }}
          path: out/route-qualification/route-receipts.json
          if-no-files-found: error
      - name: Retain isolated software CI observations without acceptance receipts
        if: inputs.graphics == 'isolated-software'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-linux-software-ci-${{ matrix.id }}
          path: |
            out/route-qualification/software-ci-evidence.json
            out/route-qualification/qualification-evidence.json
          if-no-files-found: error

  receipts:
    if: inputs.graphics != 'isolated-software'
    needs: installed
    environment: desktop-qualification-${{ inputs.channel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAU_INSTALLER_CANDIDATE_RUN_ID: ${{ inputs.candidate_c }}
      DESKTOP_ASSETS_DIR: ${{ github.workspace }}/out/qualification-candidate
      TAU_QUALIFICATION_CHANNEL: ${{ inputs.channel }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      TAU_WINDOWS_PUBLISHER: ${{ vars.TAU_WINDOWS_PUBLISHER }}
      TAU_APPIMAGE_KEY_ID: ${{ vars.TAU_APPIMAGE_KEY_ID }}
      TAU_APT_PRIMARY_FINGERPRINT: ${{ vars.TAU_APT_PRIMARY_FINGERPRINT }}
      TAU_APT_SIGNING_FINGERPRINT: ${{ vars.TAU_APT_SIGNING_FINGERPRINT }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-route-row-*
          path: out/qualification-rows
      - name: Require every native row and bind all receipts to final source
        run: pnpm nx run desktop:collect-qualification-rows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.scope == 'linux' && 'desktop-linux-host-matrix' || inputs.scope == 'macos' && 'desktop-macos-host-matrix' || 'desktop-route-host-matrix' }}
          path: out/qualification-receipts/host-matrix.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.scope == 'linux' && 'desktop-linux-ci-receipts' || inputs.scope == 'macos' && 'desktop-macos-ci-receipts' || 'desktop-route-ci-receipts' }}
          path: |
            out/qualification-receipts/route-receipts.json
            ${{ inputs.scope == 'macos' && 'out/qualification-receipts/qualification-binding.json' || '' }}
          if-no-files-found: error
