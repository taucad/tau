# Clean-host ("vm") Mac acceptance: the only producer `desktop-receipt-provenance.mts` admits for `vm` receipts.
#
# Each row runs the shipping A→B→C installed-route chain (`desktop:qualify-installed-route`) in clean-host mode on a
# self-hosted, SIP-enabled, Gatekeeper-enabled native Mac: the candidate bytes arrive through a real Chromium download
# that keeps com.apple.quarantine, the DMG is mounted, Tau.app is copied to /Applications and the image is ejected
# (or the ZIP is extracted with ditto and moved), Gatekeeper must accept it as Notarized Developer ID, the stapled
# ticket must validate with network denied, and the app is launched from /Applications through LaunchServices.
# Updates A→B and B→C run through the shipping ZIP updater against the run's loopback mirror, as in CI qualification.
#
# GitHub-hosted macOS reports SIP disabled (ruling X19), so it can never run this workflow: every row fails closed in
# its preflight unless the host shows SIP and Gatekeeper enabled, native architecture (no Rosetta) and no prior Tau
# installation, profile or ShipIt cache. `desktop-macos-vm-receipts` is uploaded only by a Mac-scoped staging dispatch
# on main whose every row passed that preflight and its run. No Intel clean host exists yet: without `x64_runner_label`
# the run covers Apple silicon only (the `local-mac` runner) and uploads no receipt set, so clean-host stays unqualified.
name: Desktop clean-host route acceptance

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Staging consumer-host evidence; Windows remains qualification-only
        required: true
        default: macos
        type: choice
        options: [macos, windows]
      candidate_a:
        description: Successful trusted installer-candidate run for baseline A
        required: true
        type: string
      candidate_b:
        description: Successful trusted installer-candidate run for explicit update B
        required: true
        type: string
      candidate_c:
        description: Successful trusted installer-candidate run C; its source must equal this dispatch's main commit
        required: true
        type: string
      runner_group:
        description: 'Mac scope only: self-hosted runner group holding the clean-host Macs'
        required: true
        default: local-mac-trusted
        type: string
      arm64_runner_label:
        description: 'Mac scope only: label of the SIP-enabled Apple silicon clean host'
        required: true
        default: local-mac
        type: string
      x64_runner_label:
        description: 'Mac scope only: label of a SIP-enabled Intel clean host; empty (no Intel host exists) runs Apple silicon only and uploads no receipt set'
        required: false
        default: ''
        type: string
      windows_runner_group:
        description: Existing trusted group for the interactive standard-user Windows 11 host
        required: false
        default: ''
        type: string
      windows_runner_label:
        description: Existing native AMD64 consumer host; no runner is provisioned by this workflow
        required: false
        default: ''
        type: string
      reset_host:
        description: "Mac scope only: delete Tau applications, profiles and ShipIt caches (destroys that account's Tau data); ignored for Windows"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# One clean-host window at a time: rows share physical hosts, /Applications and the runner account's profile.
concurrency:
  group: desktop-route-vm-acceptance
  cancel-in-progress: false

env:
  TAU_DESKTOP_QUALIFICATION_SCOPE: ${{ inputs.scope }}
  TAU_DESKTOP_ACCEPTANCE_KIND: vm
  NX_NO_CLOUD: 'true'
  pnpm_config_verify_deps_before_run: error

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      windows_host: ${{ steps.selection.outputs.windows_host }}
    steps:
      - name: Fail closed unless this is an operator-enabled platform staging dispatch on main
        env:
          QUALIFICATION_ENABLED: ${{ vars.DESKTOP_ROUTE_QUALIFICATION_ENABLED }}
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] || [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$QUALIFICATION_ENABLED" != true ] || { [ "$SCOPE" != macos ] && [ "$SCOPE" != windows ]; }; then
            echo '::error::Clean-host acceptance not run: requires a platform-scoped main dispatch and explicit operator enablement.'
            exit 1
          fi
      - name: Select the clean-host rows for the available hosts
        id: selection
        env:
          SCOPE: ${{ inputs.scope }}
          WINDOWS_GROUP: ${{ inputs.windows_runner_group }}
          WINDOWS_LABEL: ${{ inputs.windows_runner_label }}
          RUNNER_GROUP: ${{ inputs.runner_group }}
          ARM64_LABEL: ${{ inputs.arm64_runner_label }}
          X64_LABEL: ${{ inputs.x64_runner_label }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const { RUNNER_GROUP: group, ARM64_LABEL: arm64, X64_LABEL: x64 } = process.env;
          const label = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/;
          if (process.env.SCOPE === 'windows') {
            if (!label.test(process.env.WINDOWS_GROUP) || !label.test(process.env.WINDOWS_LABEL)) throw new Error('Explicit Windows group and label required');
            appendFileSync(process.env.GITHUB_OUTPUT, `windows_host=${JSON.stringify({ group: process.env.WINDOWS_GROUP, labels: ['self-hosted', 'Windows', 'X64', process.env.WINDOWS_LABEL] })}\n`);
            process.exit(0);
          }
          if (!label.test(group) || !label.test(arm64) || (x64 !== '' && !label.test(x64))) {
            throw new Error('Invalid runner group or label');
          }
          // Self-hosted only: a GitHub-hosted image can never satisfy the clean-host contract.
          const host = (arch, name) => ({ group, labels: ['self-hosted', 'macOS', arch === 'arm64' ? 'ARM64' : 'X64', name] });
          const rows = [
            { id: 'macos-zip-arm64', route: 'macos-zip', arch: 'arm64', host: host('arm64', arm64) },
            { id: 'macos-dmg-arm64', route: 'macos-dmg', arch: 'arm64', host: host('arm64', arm64) },
            { id: 'macos-zip-x64', route: 'macos-zip', arch: 'x64', host: host('x64', x64) },
            { id: 'macos-dmg-x64', route: 'macos-dmg', arch: 'x64', host: host('x64', x64) },
          ].filter((row) => row.arch === 'arm64' || x64 !== '');
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(rows)}\n`);
          NODE

  installed:
    if: inputs.scope == 'macos'
    needs: admission
    environment: desktop-qualification-staging
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Rows of one architecture share one physical host and its /Applications.
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.admission.outputs.matrix) }}
    runs-on: ${{ matrix.host }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAU_QUALIFICATION_DIRECTORY: ${{ github.workspace }}/out/route-qualification
      TAU_QUALIFICATION_ROUTE: ${{ matrix.route }}
      TAU_QUALIFICATION_CHANNEL: staging
      TAU_QUALIFICATION_RUN_A: ${{ inputs.candidate_a }}
      TAU_QUALIFICATION_RUN_B: ${{ inputs.candidate_b }}
      TAU_QUALIFICATION_RUN_C: ${{ inputs.candidate_c }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      # Mac rows never read Linux trust; an inert key set keeps the shared orchestrator's contract.
      TAU_APPIMAGE_PUBLIC_KEYS: '{}'
    steps:
      - name: Reset prior Tau state (operator opt-in only)
        if: inputs.reset_host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "/Applications/Tau.app" "/Applications/Tau Staging.app"
          find "$HOME/Library/Application Support" -maxdepth 1 -name 'Tau*' -exec rm -rf {} +
          find "$HOME/Library/Caches" -maxdepth 1 -name 'com.taucad.tau.desktop*' -exec rm -rf {} +
      - name: Preflight — fail closed unless SIP, Gatekeeper, native architecture and a clean host are observed
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/tau-clean-host-owned"
          rm -f "$marker"
          fail() { echo "::error::Clean-host preflight failed: $1"; exit 1; }
          test "$(uname -s)" = Darwin || fail 'not macOS'
          sip="$(/usr/bin/csrutil status)"
          [ "$sip" = 'System Integrity Protection status: enabled.' ] || fail "SIP: $sip"
          gatekeeper="$(/usr/sbin/spctl --status 2>&1 || true)"
          [ "$gatekeeper" = 'assessments enabled' ] || fail "Gatekeeper: $gatekeeper"
          machine="$(uname -m)"
          arm64="$(/usr/sbin/sysctl -n hw.optional.arm64 2>/dev/null || echo absent)"
          translated="$(/usr/sbin/sysctl -n sysctl.proc_translated 2>/dev/null || echo absent)"
          if [ "$ARCH" = arm64 ]; then
            [ "$machine" = arm64 ] && [ "$arm64" = 1 ] && [ "$translated" = 0 ] || fail "not native arm64 ($machine/$arm64/$translated)"
          else
            [ "$machine" = x86_64 ] && { [ "$arm64" = 0 ] || [ "$arm64" = absent ]; } && { [ "$translated" = 0 ] || [ "$translated" = absent ]; } || fail "not native Intel ($machine/$arm64/$translated)"
          fi
          residue="$( { ls -d /Applications/Tau.app "/Applications/Tau Staging.app" 2>/dev/null || true
            find "$HOME/Library/Application Support" -maxdepth 1 -name 'Tau*' 2>/dev/null || true
            find "$HOME/Library/Caches" -maxdepth 1 -name 'com.taucad.tau.desktop*' 2>/dev/null || true; } )"
          [ -z "$residue" ] || fail "host is not clean: $residue (re-run with reset_host only on a dedicated runner account)"
          # Anything at those paths after this point was created by this job, so the final cleanup may remove it.
          touch "$marker"
          {
            echo "### Clean host ${RUNNER_NAME} (${ARCH})"
            echo "- macOS $(sw_vers -productVersion), uname -m ${machine}, hw.optional.arm64 ${arm64}, proc_translated ${translated}"
            echo "- ${sip}"
            echo "- Gatekeeper: ${gatekeeper}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
      - name: Install the download browser
        run: pnpm exec playwright install chromium
      - name: Run clean-host install, shipping renderer, explicit update and latest-feed update
        env:
          # Authorizes only the run's own loopback TLS trust entry, granted after the preflight above passed.
          TAU_QUALIFICATION_DISPOSABLE_HOST: '1'
        run: pnpm nx run desktop:qualify-installed-route
      - name: Remove only this run's temporary TLS trust even after failure
        if: always()
        env:
          TAU_QUALIFICATION_DISPOSABLE_HOST: '1'
        run: pnpm nx run desktop:cleanup-qualification-trust
      - name: Remove only the Tau state this job created
        if: always()
        shell: bash
        run: |
          marker="$RUNNER_TEMP/tau-clean-host-owned"
          if [ -f "$marker" ]; then
            rm -rf "/Applications/Tau.app" "/Applications/Tau Staging.app"
            find "$HOME/Library/Application Support" -maxdepth 1 -name 'Tau*' -exec rm -rf {} +
            find "$HOME/Library/Caches" -maxdepth 1 -name 'com.taucad.tau.desktop*' -exec rm -rf {} +
            rm -f "$marker"
          fi
      - name: Preserve diagnostic observations without private TLS keys or app profile contents
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-clean-host-diagnostics-${{ matrix.id }}
          path: |
            out/route-qualification/qualification-*.json
            out/route-qualification/renderer-*.json
            out/route-qualification/renderer-*.png
            out/route-qualification/mirror-trust.json
          if-no-files-found: warn
      - name: Keep passed row separate until every required host succeeds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-route-row-${{ matrix.id }}
          path: out/route-qualification/route-receipts.json
          if-no-files-found: error

  receipts:
    needs: installed
    # Without an Intel clean host the run is Apple silicon evidence only and never yields the receipt set publication admits.
    if: inputs.x64_runner_label != '' && inputs.scope == 'macos'
    environment: desktop-qualification-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAU_INSTALLER_CANDIDATE_RUN_ID: ${{ inputs.candidate_c }}
      DESKTOP_ASSETS_DIR: ${{ github.workspace }}/out/qualification-candidate
      TAU_QUALIFICATION_CHANNEL: staging
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - name: Re-admit the exact final candidate
        run: pnpm nx run desktop:fetch-installer-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-route-row-*
          path: out/qualification-rows
      - name: Require all four clean-host rows and bind every receipt to the final source
        run: pnpm nx run desktop:collect-qualification-rows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-macos-vm-host-matrix
          path: out/qualification-receipts/host-matrix.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-macos-vm-receipts
          path: out/qualification-receipts/route-receipts.json
          if-no-files-found: error

  windows:
    if: inputs.scope == 'windows'
    needs: admission
    environment: desktop-qualification-staging
    runs-on: ${{ fromJSON(needs.admission.outputs.windows_host) }}
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TAU_QUALIFICATION_DIRECTORY: ${{ github.workspace }}/out/route-qualification
      TAU_QUALIFICATION_ROUTE: windows-nsis
      TAU_QUALIFICATION_CHANNEL: staging
      TAU_QUALIFICATION_RUN_A: ${{ inputs.candidate_a }}
      TAU_QUALIFICATION_RUN_B: ${{ inputs.candidate_b }}
      TAU_QUALIFICATION_RUN_C: ${{ inputs.candidate_c }}
      TAU_WINDOWS_PUBLISHER: ${{ vars.TAU_WINDOWS_PUBLISHER }}
      TAU_APPIMAGE_PUBLIC_KEYS: '{}'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
      - name: Install the download browser
        run: pnpm exec playwright install chromium
      - name: Observe consumer host and run visible installation with operator evidence
        env:
          TAU_QUALIFICATION_DISPOSABLE_HOST: '1'
        run: pnpm nx run desktop:qualify-installed-route
      - name: Remove only this run's temporary TLS trust
        if: always()
        env:
          TAU_QUALIFICATION_DISPOSABLE_HOST: '1'
        run: pnpm nx run desktop:cleanup-qualification-trust
      - name: Preserve bound observations without profile contents or TLS keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-clean-host-diagnostics-windows-nsis-x64
          path: |
            out/route-qualification/qualification-*.json
            out/route-qualification/renderer-*.json
            out/route-qualification/renderer-*.png
            out/route-qualification/clean-host/**/*.json
            out/route-qualification/clean-host/**/*.png
            out/route-qualification/clean-host/**/*.jpg
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-route-row-windows-nsis-x64
          path: out/route-qualification/route-receipts.json
          if-no-files-found: error

  windows-receipts:
    needs: windows
    environment: desktop-qualification-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAU_INSTALLER_CANDIDATE_RUN_ID: ${{ inputs.candidate_c }}
      DESKTOP_ASSETS_DIR: ${{ github.workspace }}/out/qualification-candidate
      TAU_QUALIFICATION_CHANNEL: staging
      TAU_WINDOWS_PUBLISHER: ${{ vars.TAU_WINDOWS_PUBLISHER }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - run: pnpm nx run desktop:fetch-installer-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-route-row-windows-nsis-x64
          path: out/qualification-rows
      - name: Bind the consumer row to the exact final source
        run: pnpm nx run desktop:collect-qualification-rows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows-vm-receipts
          path: out/qualification-receipts/*.json
          if-no-files-found: error
