name: Desktop tooling portability

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-tooling.yml'
      - '.github/actions/setup-nx/**'
      - 'tools/tsgo.plugin.ts'
      - 'scripts/src/typecheck-projects*'
      - 'scripts/src/tsgo-plugin-target.test.ts'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# A newer push to a pull request cancels its outdated run; a dispatch is never cancelled.
concurrency:
  group: desktop-tooling-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-runner:
    name: Typecheck runner (${{ matrix.runner }})
    strategy:
      fail-fast: false
      # A pull request, from any actor, requests no macOS runner from the shared pool; it
      # runs the Linux and Windows legs only. macOS portability runs by dispatch: dispatch
      # this workflow on the branch before a desktop release, and after a change to the
      # compiler runner, tsgo plugin or Nx setup it exercises. A dispatch runs all four legs.
      matrix:
        runner: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('["ubuntu-24.04", "windows-2025"]')
          || fromJSON('["ubuntu-24.04", "windows-2025", "macos-26", "macos-26-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
      # Real compiler subprocesses prove failure accumulation and paths with spaces.
      # This is tooling qualification, not a desktop package or signing result.
      - name: Exercise portable compiler runner
        run: pnpm nx run scripts:test --watch=false src/typecheck-projects.test.ts src/tsgo-plugin-target.test.ts
