# Real-GPU viewer smoke (closeout package W12, operator decision D2).
#
# The software lane (SwiftShader, e2e-nightly.yml and the merge queue) asserts the work the viewer controls: frames
# requested, draws, passes, allocations and uploads. Millisecond frame budgets, a WebGPU canvas that presents with no
# fallback, and pixel claims at 2560 px and 5K are hardware claims, so they run here: weekly and by dispatch, never as
# a merge gate, on the disposable Google Cloud GPU host desktop qualification already rents (tau-cloud stacks/gcp,
# `ci-gpu-*` templates). The host is created for the run, reached over an IAP tunnel, and deleted on exit; it also
# deletes itself after four hours. The job runs every `test:e2e:webgpu` target with TAU_E2E_WEBGPU_PROFILE=hardware.
#
# There is one GPU: the smoke shares route qualification's Linux GPU concurrency group, so it waits for a running
# qualification instead of competing for capacity, and hosted-linux-vm.sh waits for zone capacity as qualification does.
name: E2E GPU smoke

on:
  schedule:
    # Mondays 06:00 UTC, after the weekend's nightlies.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-route-qualification-staging-linux
  cancel-in-progress: false

jobs:
  gpu-smoke:
    name: Real-GPU viewer smoke
    if: github.ref == 'refs/heads/main' && github.repository == 'taucad/tau'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: gpu-smoke
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - name: Sign in to Google Cloud for a disposable GPU host
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/274078410041/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ci-gpu-runner@tau-ci.iam.gserviceaccount.com
      - name: Run the hardware rows on a GPU host
        env:
          TAU_VM_MODE: gpu-smoke
          TAU_VM_HOST: gcp
          TAU_VM_DISTRO: ubuntu
          TAU_GCP_PROJECT: tau-ci
          TAU_GCP_ZONES: us-central1-a us-central1-b us-central1-c us-central1-f us-east1-b us-east1-c us-east1-d us-west1-a us-west1-b us-west1-c europe-west4-a europe-west4-b europe-west4-c europe-west1-b europe-west1-c europe-west1-d
        run: bash apps/desktop/scripts/hosted-linux-vm.sh
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpu-smoke-diagnostics
          path: |
            out/test-results/vitest-browser
            out/test-results/hosted-linux-vm/ubuntu
          if-no-files-found: warn
          retention-days: 14
