name: E2E nightly

# The browser-backed suites, out of pull request and `main` CI: every `type:e2e`
# project's Vitest Browser matrices and development-server qualifications, the
# real-device WebGPU qualification, the funded desktop live turn and the live GitHub
# account rows (C10, A4); each secret-gated lane skips until its secrets exist. Its
# summary ends with the W22 consumer parity table. Each
# night they run against the head of `main`, with the GeoSpec engine installed from
# npm at the workspace's `geospec-engine` catalog pin. A failure here is a red
# nightly, never a merge gate.
# `workflow_dispatch` takes an optional commit to run against instead. The packaged desktop
# suite runs on every staging candidate (`desktop-packaged.yml`, called from
# `release-desktop-staging.yml`), not here (DS-4).

on:
  schedule:
    - cron: '23 13 * * *' # 13:23 UTC, 02:23 in New Zealand
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to test; defaults to the head of main'
        required: false
        default: ''

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

env:
  pnpm_config_verify_deps_before_run: warn
  # Nx remote cache, provisioned by tau-cloud `tau-ci-cache`. The server is set only when a
  # token is present (fork and Dependabot runs get none, and Nx fails on a tokenless 403).
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN != '' && vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
  TAU_API_URL: http://localhost:4000
  TAU_WEBSOCKET_URL: ws://localhost:4001
  TAU_FRONTEND_URL: http://localhost:3000
  # End-to-end suites that open no chat, so capture no chat log for the empty-capture rule to find.
  SUITES_WITHOUT_CHAT: '["test:e2e:non-isolated", "test:e2e:deploy-skew", "test:e2e:filesystem-scenarios"]'

jobs:
  # Picks the commit and lists every suite. Selectors are target names, so a new e2e
  # project joins by declaring the targets; no job in this workflow names a project.
  plan:
    name: Plan nightly suites
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      actions: 'read'
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      suites: ${{ steps.suites.outputs.suites }}
      sharded: ${{ steps.suites.outputs.sharded }}
      webgpu: ${{ steps.suites.outputs.webgpu }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha || 'main' }}
          persist-credentials: false

      - name: Pin the commit under test
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: List the end-to-end suites
        id: suites
        run: |
          # `tail -1` keeps the JSON array and drops Nx's log lines. A target splits into
          # `metadata.shards` jobs when it declares that count; each job passes
          # `--shard=<index>/<count>` to the target, which forwards it to its test runner.
          suites='[]'
          add_suite() {
            suites=$(jq -c --arg project "$1" --arg target "$2" --argjson shards "$3" \
              '. + [range(1; $shards + 1) as $i | {project: $project, target: $target}
                + if $shards > 1
                  then {shard: "\($i)/\($shards)", label: "\($project) \($target) \($i)/\($shards)", slug: ("\($project)-\($target)--shard-\($i)-of-\($shards)" | gsub(":"; "-"))}
                  else {shard: "", label: "\($project) \($target)", slug: ("\($project)-\($target)" | gsub(":"; "-"))}
                  end
                + {group: ("\($project)-\($target)" | gsub(":"; "-"))}]' <<< "$suites")
          }
          for target in test:e2e test:e2e:development test:e2e:browser-host test:e2e:daemon-host test:e2e:non-isolated test:e2e:deploy-skew test:e2e:filesystem-scenarios; do
            for project in $(pnpm nx show projects --with-target "$target" --json | tail -1 | jq -r '.[]'); do
              shards=$(pnpm nx show project "$project" --json | tail -1 | jq --arg target "$target" '.targets[$target].metadata.shards // 1')
              add_suite "$project" "$target" "$shards"
            done
          done
          webgpu=$(pnpm nx show projects --with-target test:e2e:webgpu --json | tail -1)
          echo "End-to-end suites: $suites"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          # The sharded suites whose chat logs `e2e-chat-logs` validates once, across their shards.
          sharded=$(jq -c --argjson without "$SUITES_WITHOUT_CHAT" \
            '[.[] | select(.shard != "" and (.target | IN($without[]) | not)) | {project, target, group}] | unique' <<< "$suites")
          echo "Sharded suites with chat logs: $sharded"
          echo "sharded=$sharded" >> "$GITHUB_OUTPUT"
          echo "webgpu=$([ "$webgpu" = '[]' ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  # One job per project and suite target: in one job they ran one after another for
  # over 105 min (run 37221169741, 2026-10-04). A target too long for one job declares
  # `metadata.shards` and runs as that many jobs, named `<project> <target> <i>/<n>`.
  e2e:
    name: Browser end-to-end (${{ matrix.suite.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs: [plan]
    if: needs.plan.outputs.suites != '[]'
    permissions:
      contents: 'read'
      actions: 'read'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - &setup-nx
        name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      # The ui-e2e matrix also has `firefox` and `webkit-smoke` instances, and
      # `test:e2e:non-isolated` runs PicoVoxel on Chromium and Firefox.
      - name: Install browsers for Vitest Browser
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # `scripts:test:e2e` converts HTML references with Pandoc 3.1.4 or newer, and
      # its expected Markdown follows current Pandoc; Ubuntu's package is 3.1.3.
      - name: Install Pandoc for reference conversion
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.12/pandoc-3.12-1-amd64.deb
          echo "91903ff19f1b1d4db4129797c7e18f71212990d7394fcff1787719aebf04e372  $RUNNER_TEMP/pandoc.deb" | sha256sum --check --quiet
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"

      # Sandboxed native kernel workers, and uv for desktop-e2e's build123d wheels.
      - name: Setup Linux sandbox prerequisites
        uses: ./.github/actions/setup-linux-sandbox

      # Hosts that render under plain Node (nanoraster: the desktop services utility's
      # MCP `screenshot`, the CLI and the daemon) need a Vulkan adapter, and the runner
      # has no GPU. lavapipe, Mesa's Vulkan CPU driver, is their counterpart of the
      # browsers' SwiftShader (`TAU_E2E_WEBGPU_PROFILE: software`); viewer-parity.yml
      # runs both side by side the same way.
      - name: Install a software Vulkan driver for native rendering
        run: |
          sudo apt-get install -y mesa-vulkan-drivers
          echo 'VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json' >> "$GITHUB_ENV"

      # `desktop-e2e:test:e2e` boots a real API, which reads this file for its
      # `BILLING_*` development values; without them it refuses to start.
      - name: Prepare API env file
        run: cp apps/api/.env.example apps/api/.env

      # `desktop-e2e:test:e2e` launches the *unpackaged* Electron shell, which is why
      # xvfb is enough and `desktop:package-macos` is not in its dependency chain; it
      # brings up its own Postgres/Redis/MinIO and publishes the development billing
      # policy before its specs. `test:e2e:non-isolated` serves the UI without
      # COOP/COEP: the mode production web runs in until go-live row X-5 closes (D19),
      # so kernels must degrade to their serial builds there.
      # `--parallel=1`: the suites' ui:build, ui:build:serve and ui:build:desktop
      # prerequisites each peak near 10 GB, so building them together loses the runner.
      # A step-level bound: a hung suite otherwise holds the job for the 6 h default
      # with no logs, while this still runs the always() diagnostics below. Streamed,
      # because Nx holds a task's output until it ends and a timed-out step loses it.
      - name: Run the end-to-end suite
        timeout-minutes: 120
        env:
          TAU_E2E_WEBGPU_PROFILE: software
          PROJECT: ${{ matrix.suite.project }}
          TARGET: ${{ matrix.suite.target }}
          SHARD: ${{ matrix.suite.shard }}
        run: xvfb-run --auto-servernum pnpm nx run-many -t "$TARGET" --projects "$PROJECT" --parallel=1 --outputStyle=stream ${SHARD:+"--shard=$SHARD"}

      # Field trace validation: every events.jsonl the suites above captured at
      # teardown is validated against ChatLog.tla, including after a failed suite.
      # `SUITES_WITHOUT_CHAT` names the suites that open no chat: `test:e2e:non-isolated` runs
      # only PicoVoxel specs, `test:e2e:deploy-skew` only the TAU-UI-6 deploy check and
      # `test:e2e:filesystem-scenarios` only the filesystem scenario harness (Chromium, small profile).
      # A shard holds only part of its suite's logs, so `e2e-chat-logs` validates those
      # once all its shards finish: alone, a shard that opens no chat would fail the
      # empty-capture rule and a known defect another shard exercises would read as fixed.
      - name: Setup formal toolchains
        if: always() && matrix.suite.shard == '' && !contains(fromJSON(env.SUITES_WITHOUT_CHAT), matrix.suite.target)
        uses: ./.github/actions/setup-formal
        with:
          tools: tlc

      - name: Validate captured chat logs
        if: always() && matrix.suite.shard == '' && !contains(fromJSON(env.SUITES_WITHOUT_CHAT), matrix.suite.target)
        env:
          PROJECT: ${{ matrix.suite.project }}
        run: pnpm nx run-many -t formal:logs --projects "$PROJECT"

      - &root-hygiene
        name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

      - name: Upload Vitest Browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-browser-diagnostics-${{ matrix.suite.slug }}
          path: |
            out/test-results/vitest-browser
            out/test-results/desktop-e2e
            out/test-results/filesystem-scenarios
            out/test-results/chat-logs
            out/reports/formal
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the shard's chat logs
        if: always() && matrix.suite.shard != '' && !contains(fromJSON(env.SUITES_WITHOUT_CHAT), matrix.suite.target)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-logs-${{ matrix.suite.slug }}
          path: out/test-results/chat-logs
          if-no-files-found: ignore
          retention-days: 7

  # Field trace validation for a sharded suite: its shards' chat logs together, so the
  # empty-capture and vanished-defect rules judge the whole suite as they do unsharded.
  e2e-chat-logs:
    name: Validate chat logs (${{ matrix.suite.project }} ${{ matrix.suite.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [plan, e2e]
    if: always() && needs.plan.outputs.sharded != '[]' && needs.plan.outputs.sharded != ''
    permissions:
      contents: 'read'
      actions: 'read'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.sharded) }}
    steps:
      - *checkout
      - *setup-nx

      - name: Download the shards' chat logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chat-logs-${{ matrix.suite.group }}--shard-*
          path: out/test-results/chat-logs
          merge-multiple: true

      - name: Setup formal toolchains
        uses: ./.github/actions/setup-formal
        with:
          tools: tlc

      - name: Validate captured chat logs
        env:
          PROJECT: ${{ matrix.suite.project }}
        run: pnpm nx run-many -t formal:logs --projects "$PROJECT"

      - name: Upload chat log verdicts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-log-verdicts-${{ matrix.suite.group }}
          path: out/reports/formal
          if-no-files-found: ignore
          retention-days: 7

  # Real-device qualification. The runner label is an infrastructure contract: this
  # lane must never silently fall back to SwiftShader. No `tau-webgpu` runner is
  # registered yet, so the lane waits for `TAU_WEBGPU_RUNNER_ENABLED` rather than
  # queueing until GitHub cancels it (the benchmark lane's pattern).
  webgpu-hardware:
    name: WebGPU hardware qualification
    runs-on: [self-hosted, tau-webgpu]
    needs: [plan]
    if: needs.plan.outputs.webgpu == 'true' && vars.TAU_WEBGPU_RUNNER_ENABLED == 'true'
    permissions:
      contents: 'read'
      actions: 'read'
    steps:
      - *checkout
      - *setup-nx

      - name: Install managed Chromium for Vitest Browser
        run: pnpm exec playwright install chromium

      - name: Run hardware WebGPU qualification
        env:
          TAU_E2E_WEBGPU_PROFILE: hardware
        run: xvfb-run --auto-servernum pnpm nx run-many -t test:e2e:webgpu

      - *root-hygiene

      - name: Upload hardware WebGPU diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-browser-webgpu-hardware-diagnostics
          path: out/test-results/vitest-browser
          if-no-files-found: error
          retention-days: 14

  # The cloud-build load tier (app state orchestration A0.11): the loading rows a self-host
  # build cannot show, on the cloud UI variant with stand-ins answering the API by
  # interception, so it needs no API, database or secret. Each row pins a known defect as
  # an expected failure: the job is green while the defects stand, and goes red when a fix
  # lands without flipping its row or when a row stops failing on its own assertion.
  cloud-load:
    name: Cloud-build load tier
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [plan]
    permissions:
      contents: 'read'
      actions: 'read'
    steps:
      - *checkout
      - *setup-nx

      - name: Install Chromium for Vitest Browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the cloud-build load tier
        timeout-minutes: 45
        run: xvfb-run --auto-servernum pnpm nx run-many -t test:e2e:cloud-load --parallel=1 --outputStyle=stream

      - *root-hygiene

      - name: Upload Vitest Browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-browser-diagnostics-cloud-load
          path: out/test-results/vitest-browser
          if-no-files-found: ignore
          retention-days: 7

  # Consumer parity (charter D33, W22, gate T16): one row per consumer of native dependency
  # resolution, in this run's summary. It runs no suite: each row reads the latest conclusion of
  # the jobs that already run its oracles, this run's for the nightly's own (or the latest nightly
  # on `main` when this run skipped them), `main`'s for ci.yml and native-darwin.yml, and the latest
  # on any ref for the path-filtered pull-request workflows. A consumer whose oracle runs nowhere
  # is a failing row, and any failing row fails this job.
  consumer-parity:
    name: Consumer parity (W22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [plan, e2e]
    if: always() && needs.plan.result == 'success'
    permissions:
      contents: 'read'
      actions: 'read'
    steps:
      - *checkout

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Write the consumer parity table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/src/consumer-parity-summary.ts --summary "$GITHUB_STEP_SUMMARY"

  # runtime-e2e's Darwin host suite, quarantined out of ci.yml until its 11 failing
  # tests pass here: https://github.com/taucad/tau/issues/342. The engine's
  # darwin-arm64 binding installs with the workspace from the catalog pin.
  runtime-e2e-darwin:
    name: Runtime end-to-end on Darwin (quarantined, #342)
    runs-on: macos-26
    timeout-minutes: 150
    needs: [plan]
    permissions:
      contents: 'read'
      actions: 'read'
    steps:
      - *checkout

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'

      - name: Prepare current installed GeoSpec consumer
        run: |
          pnpm nx run scripts:prepare-geospec-test-consumer
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const {consumerRoot}=JSON.parse(readFileSync("out/artifacts/geospec-test-consumer/receipt.json", "utf8")); appendFileSync(process.env.GITHUB_ENV, `GEOSPEC_INSTALLED_CONSUMER_ROOT=${consumerRoot}\n`);'

      - name: Run the runtime end-to-end suite
        run: pnpm nx run-many -t test --projects tag:ci:quarantined --skip-nx-cache

  # D19's funded cell: one real frontier turn placed on launcher 2, against a local
  # API with real provider keys. Skipped without the key; the deterministic half of
  # D19 runs in the `e2e` job, which stubs the provider upstream. Only the OpenAI key
  # is needed: the seam stays armed for the Anthropic host in this tier, so the home
  # composer's seeding turn lands on the suite's stub, and only the live turn spends
  # on the frontier row the credit delta measures.
  desktop-e2e-live:
    name: Desktop live LLM (launcher 2)
    runs-on: ubuntu-latest
    needs: [plan]
    permissions:
      contents: 'read'
      actions: 'read'
    env:
      OPENAI_API_KEY: ${{ secrets.TAU_E2E_OPENAI_API_KEY }}
      TAU_E2E_WEBGPU_PROFILE: software
    steps:
      - name: Skip without live provider keys
        id: gate
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "TAU_E2E_OPENAI_API_KEY not configured — skipping the live desktop lane."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Setup Nx Environment
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/setup-nx

      - name: Prepare API env file
        if: steps.gate.outputs.enabled == 'true'
        run: cp apps/api/.env.example apps/api/.env

      - name: Run the live launcher-2 turn
        if: steps.gate.outputs.enabled == 'true'
        run: xvfb-run --auto-servernum pnpm nx run-many -t test:e2e:desktop:live

      - name: Upload desktop diagnostics
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-live-diagnostics
          path: out/test-results/desktop-e2e
          if-no-files-found: ignore
          retention-days: 7

  # GitHub capability audit C10 and A4 (R17): *Add account* with one GitHub account
  # connected, and GitHub sign-in refused in words for an account whose email is not
  # the Tau account's. Both rows sign in to github.com as two test identities, against
  # a cloud API started here with the development GitHub App and the development
  # sign-in OAuth App. That API listens on localhost:4000 because both apps' registered
  # callbacks are there, and the Chromium on this runner follows GitHub's redirect back
  # to it. Skipped, with a notice naming each missing secret, until all eleven are set.
  # Each secret reaches only the step that needs it: the identities the rows, the
  # app credentials the API. The API's AUTH_SECRET and connection key are made per run.
  live-github:
    name: Live GitHub accounts (C10, A4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [plan]
    permissions:
      contents: 'read'
      actions: 'read'
    steps:
      - name: Skip without the live GitHub secrets
        id: gate
        env:
          TAU_E2E_GITHUB_USERNAME: ${{ secrets.TAU_E2E_GITHUB_USERNAME }}
          TAU_E2E_GITHUB_PASSWORD: ${{ secrets.TAU_E2E_GITHUB_PASSWORD }}
          TAU_E2E_GITHUB_TOTP_SECRET: ${{ secrets.TAU_E2E_GITHUB_TOTP_SECRET }}
          TAU_E2E_GITHUB_SECOND_USERNAME: ${{ secrets.TAU_E2E_GITHUB_SECOND_USERNAME }}
          TAU_E2E_GITHUB_SECOND_PASSWORD: ${{ secrets.TAU_E2E_GITHUB_SECOND_PASSWORD }}
          TAU_E2E_GITHUB_SECOND_TOTP_SECRET: ${{ secrets.TAU_E2E_GITHUB_SECOND_TOTP_SECRET }}
          TAU_E2E_GITHUB_APP_CLIENT_ID: ${{ secrets.TAU_E2E_GITHUB_APP_CLIENT_ID }}
          TAU_E2E_GITHUB_APP_CLIENT_SECRET: ${{ secrets.TAU_E2E_GITHUB_APP_CLIENT_SECRET }}
          TAU_E2E_GITHUB_APP_SLUG: ${{ secrets.TAU_E2E_GITHUB_APP_SLUG }}
          TAU_E2E_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.TAU_E2E_GITHUB_OAUTH_CLIENT_ID }}
          TAU_E2E_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.TAU_E2E_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          missing=()
          for name in TAU_E2E_GITHUB_USERNAME TAU_E2E_GITHUB_PASSWORD TAU_E2E_GITHUB_TOTP_SECRET \
            TAU_E2E_GITHUB_SECOND_USERNAME TAU_E2E_GITHUB_SECOND_PASSWORD TAU_E2E_GITHUB_SECOND_TOTP_SECRET \
            TAU_E2E_GITHUB_APP_CLIENT_ID TAU_E2E_GITHUB_APP_CLIENT_SECRET TAU_E2E_GITHUB_APP_SLUG \
            TAU_E2E_GITHUB_OAUTH_CLIENT_ID TAU_E2E_GITHUB_OAUTH_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            list=$(printf '%s, ' "${missing[@]}")
            echo "::notice title=Live GitHub rows skipped::Add these repository secrets to run C10 and A4: ${list%, }."
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Setup Nx Environment
        if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/setup-nx

      - name: Install Chromium for Vitest Browser
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare API env file
        if: steps.gate.outputs.enabled == 'true'
        run: cp apps/api/.env.example apps/api/.env

      # Named containers, not job services: the rows verify each Tau test account with
      # `docker exec tau-postgres psql`, as every ui-e2e tier against an API does.
      - name: Start Postgres + Redis + MinIO
        if: steps.gate.outputs.enabled == 'true'
        run: docker compose -f infra/docker-compose.yml up -d postgres redis minio minio-bootstrap

      # With TAU_CLOUD_ENABLED=true the migration job also publishes the development
      # tariff, which funding each row's Tau test account needs.
      - name: Apply the protected migration job
        if: steps.gate.outputs.enabled == 'true'
        env:
          TAU_CLOUD_ENABLED: 'true'
        run: pnpm nx run-many -t db-migrate --projects tag:scope:api

      # `vite build` alone, as desktop-e2e's global setup does: the API bundle needs
      # none of `build`'s dependency chain.
      - name: Build the API
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/api
        run: pnpm exec vite build

      # A cloud API whose only trusted origin is the rows' UI (test:e2e:live:github's
      # PORT). `.env` supplies the development billing values and Stripe placeholders;
      # the process environment wins over it. The log stays on the runner: it is
      # printed only when the API never answers, before any GitHub round trip.
      - name: Start the API
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/api
        env:
          PORT: '4000'
          AUTH_URL: http://localhost:4000
          TAU_API_URL: http://localhost:4000
          TAU_FRONTEND_URL: http://localhost:3018
          TAU_CLOUD_ENABLED: 'true'
          GITHUB_CLIENT_ID: ${{ secrets.TAU_E2E_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.TAU_E2E_GITHUB_OAUTH_CLIENT_SECRET }}
          GITHUB_REPOSITORY_APP_CLIENT_ID: ${{ secrets.TAU_E2E_GITHUB_APP_CLIENT_ID }}
          GITHUB_REPOSITORY_APP_CLIENT_SECRET: ${{ secrets.TAU_E2E_GITHUB_APP_CLIENT_SECRET }}
          GITHUB_REPOSITORY_APP_SLUG: ${{ secrets.TAU_E2E_GITHUB_APP_SLUG }}
          GITHUB_REPOSITORY_APP_CALLBACK_URL: http://localhost:4000/v1/github/callback
        run: |
          AUTH_SECRET=$(openssl rand -base64 32)
          GITHUB_REPOSITORY_CONNECTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')
          echo "::add-mask::$AUTH_SECRET"
          echo "::add-mask::$GITHUB_REPOSITORY_CONNECTION_KEY"
          export AUTH_SECRET GITHUB_REPOSITORY_CONNECTION_KEY
          nohup node --env-file-if-exists=.env --import @oxc-node/core/register dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:4000/health/live; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The API did not answer /health/live within 120 s."
          tail -n 40 "$RUNNER_TEMP/api.log"
          exit 1

      # TAU_E2E_LIVE_GITHUB=true is this job's statement that the API above carries
      # the GitHub App and GitHub sign-in for the rows' origin.
      - name: Run the live GitHub rows
        if: steps.gate.outputs.enabled == 'true'
        timeout-minutes: 45
        env:
          TAU_E2E_LIVE_GITHUB: 'true'
          TAU_E2E_WEBGPU_PROFILE: software
          TAU_E2E_GITHUB_USERNAME: ${{ secrets.TAU_E2E_GITHUB_USERNAME }}
          TAU_E2E_GITHUB_PASSWORD: ${{ secrets.TAU_E2E_GITHUB_PASSWORD }}
          TAU_E2E_GITHUB_TOTP_SECRET: ${{ secrets.TAU_E2E_GITHUB_TOTP_SECRET }}
          TAU_E2E_GITHUB_SECOND_USERNAME: ${{ secrets.TAU_E2E_GITHUB_SECOND_USERNAME }}
          TAU_E2E_GITHUB_SECOND_PASSWORD: ${{ secrets.TAU_E2E_GITHUB_SECOND_PASSWORD }}
          TAU_E2E_GITHUB_SECOND_TOTP_SECRET: ${{ secrets.TAU_E2E_GITHUB_SECOND_TOTP_SECRET }}
        run: xvfb-run --auto-servernum pnpm nx run-many -t test:e2e:live:github --parallel=1 --outputStyle=stream

      # The rows stop the context's trace before they type a credential (`uiAuthorizeGithub`).
      - name: Upload Vitest Browser diagnostics
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-browser-diagnostics-live-github
          path: out/test-results/vitest-browser
          if-no-files-found: ignore
          retention-days: 7
