# Flaky-regression detection and bisect under stress (CI flake quarantine blueprint, FQ-12; Brain
# research/ci-flake-quarantine-blueprint.md, D4's flaky-regression class and D7).
#
# After each flake ledger ingestion this reads the ledger state (`ledger.json` on the `flake-ledger` branch, read
# only) and finds the tests that ran 300 or more times without a flake event and then met the entry rule (two events
# in 80 executions, or three in 230). Such a test is a regression with a culprit, not an ordinary flake: it is never
# quarantined automatically (`isFlakyRegression` in `scripts/src/flake-regression.ts` is the entry automation's
# check). Its issue is flagged for the operator (`flake`, `flake:regression`, `flake:needs-operator`; opened if the
# identity has none), and one candidate per run is bisected between the last push to `main` the CI ran before the
# onset and the onset's commit. The culprit, or the range the bisect narrowed to, is a comment on the issue.
#
# Guardrails:
# - Each probe is a dispatch of `flake-repro.yml` at one commit, so that workflow's gate keeps every probe inside its
#   limits: three runs at once, 3,000 runner-minutes a week and the per-dispatch cap of 120 minutes. One bisect runs
#   at a time (the concurrency group below), so it holds at most one of the three slots.
# - One bisect is bounded at 10 probes and 300 runner-minutes (D7's per-flake budget) over a window of 250 commits;
#   whatever the bounds cut short is reported with the narrowed range. The job's own timeout bounds the waiting.
# - The workflow's token only: `contents: read` for the state, history and project roots, `issues: write` for the
#   flag and the comments, `actions: write` to dispatch `flake-repro.yml` and read its runs and reports. No secret,
#   no environment, no cache. Ledger rows and repro reports are parsed as data, never executed.
# - Kill switch: the same `FLAKE_AGENT_ENABLED` repository variable as `flake-repro.yml`; unset is enabled, `false`
#   skips the job.
name: Flake regression

on:
  workflow_run:
    workflows: [Flake ledger]
    types: [completed]
  workflow_dispatch:
    inputs:
      id:
        description: Ledger identity to bisect (blank detects the candidates)
        type: string
        default: ''
      good:
        description: Last stable commit (blank uses the last push to main before the onset)
        type: string
        default: ''
      bad:
        description: First flaky commit (blank uses the onset's commit)
        type: string
        default: ''
      modes:
        description: Modes of the first probe
        type: string
        default: repeat,cpu,parallel
      dry-run:
        description: Detect and report only
        type: boolean
        default: false

permissions: {}

jobs:
  bisect:
    name: Detect and bisect flaky regressions
    if: >-
      vars.FLAKE_AGENT_ENABLED != 'false' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: flake-regression
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # 300 runner-minutes of probes run one after another, plus their queueing and the gate's waits.
    timeout-minutes: 360
    permissions:
      actions: write # dispatch flake-repro.yml, read its runs and reports
      contents: read # the ledger state branch, main's history, project roots
      issues: write # flag the identity's issue and name the culprit
    steps:
      - name: Checkout the scripts and project roots
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            project.json
            scripts/package.json
            scripts/src/ci-flake-ledger.ts
            scripts/src/ci-flake-ledger-state.ts
            scripts/src/ci-flake-ledger-store.ts
            scripts/src/ci-github-client.ts
            scripts/src/ci-queue-health.ts
            scripts/src/ci-shadow-rows.ts
            scripts/src/flake-repro.ts
            scripts/src/flake-regression.ts
            scripts/src/flake-regression-cli.ts

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.13.1'

      - name: Detect and bisect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ID: ${{ inputs.id || '' }}
          GOOD: ${{ inputs.good || '' }}
          BAD: ${{ inputs.bad || '' }}
          MODES: ${{ inputs.modes || 'repeat,cpu,parallel' }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          # shellcheck disable=SC2086 # DRY_RUN is one flag or nothing
          node scripts/src/flake-regression-cli.ts --id "$ID" --good "$GOOD" --bad "$BAD" --modes "$MODES" $DRY_RUN
