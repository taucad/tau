# Flake reproduction under stress (Brain research/ci-flake-quarantine-blueprint.md, D7, work package FQ-7).
#
# The flake agent (a Claude Code cloud scheduled task, operator decision O4) dispatches this workflow with one
# test's identity and a list of modes, polls the run and reads the JSON report from the artifact. It is the agent's
# only accepted source of proof: a reproduction (k failures in m attempts per mode) before a fix, and n straight
# passes with (1 − k/m)ⁿ ≤ 1 % and n ≥ 100 after it. A container run of the test is never evidence.
#
# `scripts/src/flake-repro-cli.ts` runs the test in fresh Vitest processes with no retry, in the modes of D7:
# repeat, suite (file, project), shuffle over seeds with a polluter bisect (file, project), CPU contention (every
# core busy, or pinned to one), parallel copies, clock (far time zones; a year boundary and a DST change through
# libfaketime), network (fetch latency and one failed request) and a tight heap. `modes` takes `mode` for all of a
# mode's variants or `mode:variant` for one; `attempts` is per variant. The harness is checked out from this
# workflow's own commit, not from `ref`, so a fix under test cannot change the instrument measuring it.
#
# Guardrails:
# - Read-only token (`contents: read`, `actions: read` for the gate), no secrets, no environment, no Nx remote
#   cache and no Actions cache writes.
# - At most three runs at once and 3,000 runner-minutes of this workflow in seven days: the gate step counts the
#   earlier runs still going and the week's minutes, and refuses past either (dispatch again later). The week's
#   minutes are in the job summary for the agent's budget check (300 runner-minutes per flake is the agent's to keep).
# - Per-dispatch minute cap: `minutes` (at most 120) is the job's timeout; the harness stops starting attempts three
#   minutes before it, so the report is still written and uploaded.
# - Kill switch: the flake agent's Claude Code cloud scheduled task's enabled state is the kill switch; pausing the
#   task stops new dispatches. This workflow gates only on `vars.FLAKE_AGENT_ENABLED != 'false'`: unset means
#   enabled, so it works with no manual setup, and setting the repository variable to `false` skips the job.
name: Flake repro
run-name: Flake repro ${{ inputs.project }}:${{ inputs.target }} ${{ inputs.modes }} @ ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test
        type: string
        default: main
      project:
        description: Nx project that runs the test
        type: string
        required: true
      target:
        description: The project's Vitest target
        type: string
        default: test
      file:
        description: Test file, relative to the repository root
        type: string
        required: true
      test:
        description: Vitest full name (describe titles and test title, joined by spaces)
        type: string
        required: true
      modes:
        description: 'Modes: repeat, suite, shuffle, cpu, parallel, clock, net, mem; mode:variant for one variant'
        type: string
        default: repeat
      attempts:
        description: Attempts per variant
        type: number
        default: 20
      seed:
        description: First seed; attempt i uses seed + i
        type: number
        default: 1
      minutes:
        description: Job time limit in minutes (5-120)
        type: number
        default: 60
      command-index:
        description: Which of the target's Vitest commands to use, when it has one per browser (blank picks the one naming the file)
        type: string
        default: ''

permissions:
  contents: read
  actions: read # the gate reads this workflow's runs

jobs:
  reproduce:
    name: Reproduce under stress
    # The CI test lanes' runner class.
    # The only kill-switch gate: unset is enabled (no setup needed); `false` skips the job.
    if: vars.FLAKE_AGENT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.minutes <= 120 && inputs.minutes || 120 }}
    steps:
      - name: Set the attempt deadline
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          minutes=$(( MINUTES < 120 ? MINUTES : 120 ))
          echo "DEADLINE=$(( $(date +%s) + minutes * 60 - 180 ))" >> "$GITHUB_ENV"

      - name: Checkout the ref under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Checkout the harness from this workflow's commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .flake-repro-harness
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/package.json
            scripts/src/flake-repro.ts
            scripts/src/flake-repro-cli.ts

      # Out of the workspace, so neither Nx nor Vitest sees it.
      - name: Move the harness out of the workspace
        run: mv .flake-repro-harness "$RUNNER_TEMP/flake-repro"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'

      - name: Admit the run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODES: ${{ inputs.modes }}
          ATTEMPTS: ${{ inputs.attempts }}
          MINUTES: ${{ inputs.minutes }}
        run: node "$RUNNER_TEMP/flake-repro/scripts/src/flake-repro-cli.ts" gate --modes "$MODES" --attempts "$ATTEMPTS" --minutes "$MINUTES" --summary "$GITHUB_STEP_SUMMARY"

      # The ref under test can be older than this workflow, so the apt installer comes from this workflow's own
      # commit (scripts/src/apt-resilience.test.ts).
      - name: Check out this workflow's apt installer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .tau-ci
          sparse-checkout: .github/actions/apt-install
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Name the browsers the target runs
        id: browsers
        env:
          PROJECT: ${{ inputs.project }}
          TARGET: ${{ inputs.target }}
          TEST_FILE: ${{ inputs.file }}
          TEST_NAME: ${{ inputs.test }}
          COMMAND_INDEX: ${{ inputs.command-index }}
        run: |
          node "$RUNNER_TEMP/flake-repro/scripts/src/flake-repro-cli.ts" browsers \
            --project "$PROJECT" --target "$TARGET" --file "$TEST_FILE" --test "$TEST_NAME" --command-index "$COMMAND_INDEX"

      - name: Install the browsers' system dependencies
        if: steps.browsers.outputs.browsers != ''
        uses: ./.tau-ci/.github/actions/apt-install
        with:
          playwright-browsers: ${{ steps.browsers.outputs.browsers }}
      - name: Install the browsers
        if: steps.browsers.outputs.browsers != ''
        env:
          BROWSERS: ${{ steps.browsers.outputs.browsers }}
        run: |
          read -r -a browsers <<<"$BROWSERS"
          pnpm exec playwright install "${browsers[@]}"

      # libfaketime for the clock mode's year-end and DST variants. Without it those variants are reported as not run.
      - name: Install libfaketime
        if: contains(inputs.modes, 'clock')
        continue-on-error: true
        uses: ./.tau-ci/.github/actions/apt-install
        with:
          packages: faketime

      - name: Reproduce
        env:
          PROJECT: ${{ inputs.project }}
          TARGET: ${{ inputs.target }}
          TEST_FILE: ${{ inputs.file }}
          TEST_NAME: ${{ inputs.test }}
          MODES: ${{ inputs.modes }}
          ATTEMPTS: ${{ inputs.attempts }}
          SEED: ${{ inputs.seed }}
          COMMAND_INDEX: ${{ inputs.command-index }}
          REF: ${{ inputs.ref }}
        run: |
          node "$RUNNER_TEMP/flake-repro/scripts/src/flake-repro-cli.ts" run \
            --project "$PROJECT" --target "$TARGET" --file "$TEST_FILE" --test "$TEST_NAME" \
            --modes "$MODES" --attempts "$ATTEMPTS" --seed "$SEED" --command-index "$COMMAND_INDEX" \
            --deadline "$DEADLINE" --ref "$REF" --sha "$(git rev-parse HEAD)" \
            --out out/flake-repro --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-repro-${{ github.run_id }}
          path: |
            out/flake-repro/report.json
            out/flake-repro/attempts/
          if-no-files-found: warn
          retention-days: 30
