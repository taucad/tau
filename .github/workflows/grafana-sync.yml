# Sync infra/grafana dashboards and alert rule groups to Grafana Cloud.
#
# Runs on every `main` push that changes them, and by hand. One Grafana Cloud
# stack reads Fly's managed Prometheus for the whole org, so one sync covers
# staging and production series. The job uses the `staging` environment, which
# admits `main` only. tau-cloud `stacks/repo/tau` writes its GRAFANA_URL
# variable and GRAFANA_API_KEY secret (the `dashboard-sync` service account of
# `stacks/observability`). Until both exist the job does nothing and passes.

name: Grafana Sync

on:
  push:
    branches: [main]
    paths:
      - infra/grafana/dashboards/**
      - infra/grafana/alerts/**
      - apps/api/scripts/sync-grafana-dashboards.sh
      - .github/workflows/grafana-sync.yml
  workflow_dispatch:

permissions:
  contents: read

# A cancelled run can stop between deleting a rule and re-creating its group.
concurrency:
  group: grafana-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Grafana Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    env:
      GRAFANA_URL: ${{ vars.GRAFANA_URL }}
      GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
    steps:
      - name: Require the Grafana Cloud stack
        id: stack
        run: |
          if [ -z "$GRAFANA_URL" ] || [ -z "$GRAFANA_API_KEY" ]; then
            echo "::notice::No Grafana Cloud stack configured (GRAFANA_URL or GRAFANA_API_KEY unset in the staging environment); nothing to sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.stack.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            infra/grafana
            apps/api/scripts

      - name: Sync dashboards and alert rule groups
        if: steps.stack.outputs.ready == 'true'
        run: bash apps/api/scripts/sync-grafana-dashboards.sh
