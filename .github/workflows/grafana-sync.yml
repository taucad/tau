# Sync infra/grafana dashboards and alert rule groups to Grafana Cloud.
#
# Runs on every `main` push that changes them, and by hand. One Grafana Cloud
# stack reads Fly's managed Prometheus for the whole org, so one sync covers
# staging and production series. The job uses the `staging` environment, which
# admits `main` only, and reads its GRAFANA_URL variable and GRAFANA_API_KEY
# secret: a token of an Admin service account in the stack, since alert
# provisioning is Admin-only by default. Both belong in tau-cloud
# `stacks/repo/tau`, never `gh secret set`. Until both exist the job does
# nothing and passes. It only creates and updates: a dashboard or rule group
# removed from infra/grafana must also be deleted in Grafana by hand.

name: Grafana Sync

on:
  push:
    branches: [main]
    paths:
      - infra/grafana/dashboards/**
      - infra/grafana/alerts/**
      - apps/api/scripts/sync-grafana-dashboards.sh
      - .github/workflows/grafana-sync.yml
  workflow_dispatch:

permissions:
  contents: read

# A cancelled run can stop between deleting a rule and re-creating its group.
concurrency:
  group: grafana-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Grafana Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    env:
      GRAFANA_URL: ${{ vars.GRAFANA_URL }}
      GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            infra/grafana
            apps/api/scripts

      - name: Sync dashboards and alert rule groups
        run: |
          if [ -z "$GRAFANA_URL" ] || [ -z "$GRAFANA_API_KEY" ]; then
            echo "::notice::No Grafana Cloud stack configured (GRAFANA_URL or GRAFANA_API_KEY unset in the staging environment); nothing to sync."
            exit 0
          fi
          bash apps/api/scripts/sync-grafana-dashboards.sh
