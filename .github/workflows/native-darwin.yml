# The darwin-arm64 native rows (charter D27, D30, the Stage A objective): from an empty store,
# `tau mcp` and `tau serve` each prepare Build123d and PicoGK with real bytes and evaluate a
# real `.py` and `.cs` model to geometry, with no egress from the workers; Build123d's closure
# sealed from the digest-keyed seed and PicoGK's pinned closure each equal their golden receipt,
# and the kernels' native suites run on them. A consumer row (charter W22, tier 8) joins by declaring
# the `test:native-darwin` target.
#
# The same job then runs the nuget row of the standalone-project oracles (charter W23, D34, I14;
# go-live row PRJ-1), whose other rows run in `ci.yml`: the PicoGK project Tau creates restores and
# runs outside Tau with the .NET SDK alone and matches `tau export` of the same project. Its selection
# was always this row's, so it shares the runner (ruling X60).
#
# The projects with a `benchmark-native` target run it as a gate (D23): each script exits non-zero on
# an integrity, runtime or budget failure.
#
# Placement (CI throughput review Q-2, 2026-11-13):
# - Rows: `ci.yml` calls this workflow (`workflow_call`) in the merge queue, and on a push to `main` the
#   queue did not already prove, with the affected `test:native-darwin` projects as `projects` (its plan
#   lane `native-darwin`, which also selects every such project when a nuget oracle source outside the
#   graph changes). The required check fails when the row does. A push that reuses the queue verdict runs
#   nothing again, and the push trigger is gone. A pull request runs the affected rows only while it
#   carries the `native-darwin` label, for early signal before it queues; Dependabot pull requests get
#   their rows in the queue like any other.
# - Benchmarks: `release-desktop-staging.yml` calls this workflow with `benchmarks` on the commit it is
#   about to tag, so no desktop candidate exists without green benchmark gates on its own commit. The
#   15:41 nightly stays until two candidates have run them green (resume § 4, § 5b); a dispatch runs them
#   with `benchmarks`.
#
# When called, `ref` is set: the plan takes the rows from the caller instead of selecting them.
name: Native darwin

on:
  pull_request:
    # `ready_for_review` so a labelled draft, which requests no macOS runner, gets its rows once it is
    # ready; `labeled` so adding the `native-darwin` label starts them.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches-ignore:
      - production
  schedule:
    - cron: '41 15 * * *' # 15:41 UTC, after the e2e nightly has its macOS runner
  workflow_dispatch:
    inputs:
      benchmarks:
        description: 'Also run the benchmark-native gates'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: The commit the rows and gates check out (the queue's, a push's or a desktop candidate's).
        type: string
        required: true
      projects:
        description: The `test:native-darwin` projects to run, comma-separated; empty runs no row.
        type: string
        required: true
      benchmarks:
        description: Also run the `benchmark-native` gates.
        type: boolean
        required: true
    secrets:
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN:
        description: Read token of the Nx remote cache; without it every build dependency runs
        required: false

permissions:
  contents: read

env:
  pnpm_config_verify_deps_before_run: warn
  NX_NO_CLOUD: 'true'
  # `NX_NO_CLOUD` turns off Nx Cloud only; the self-hosted cache below is Nx's HTTP remote cache, which it
  # leaves on. Nx remote cache, provisioned by tau-cloud `tau-ci-cache`, read with the read token only: no job
  # here has an environment or `id-token: write`, so none can write (`ci.yml` writes, from `main` and its queue).
  # The server is set only when a token is present (fork and Dependabot runs get none, and Nx fails on
  # a tokenless 403).
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN != '' && vars.NX_SELF_HOSTED_REMOTE_CACHE_SERVER || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}

# A labelled pull request's newer push cancels its outdated run, and another label added to it starts a
# run whose jobs skip, in a group of its own so it cannot cancel the rows already running. A run called
# from `ci.yml` or the candidate gate (`inputs.ref` set) gets a group of its own (`github.run_id`) and is
# never cancelled; the nightly and each dispatch keep groups of their own. The group names this workflow
# literally: called, `github.workflow` is the caller's, and a group equal to the caller's would cancel the
# call.
concurrency:
  group: native-darwin-${{ inputs.ref != '' && github.run_id || format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}${{ github.event.action == 'labeled' && github.event.label.name != 'native-darwin' && '-other-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select the native rows
    # A pull request only while it carries the `native-darwin` label; `ci.yml` never calls this on one
    # (its `native-darwin` lane is `pr: queue`), so a call never meets the label guard.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'native-darwin') &&
      (github.event.action != 'labeled' || github.event.label.name == 'native-darwin') &&
      github.triggering_actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: # Required for nrwl/nx-set-shas to read workflow runs
      contents: read
      actions: read
      pull-requests: read
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
      benchmarks: ${{ steps.plan.outputs.benchmarks }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      # Called (`CALLED_REF` set), the caller's projects. Otherwise every project on a dispatch, the
      # affected ones on a labelled pull request, and none on the nightly (it runs only the gates).
      # `pipefail` so a failing `nx show projects` fails the step; `tail -1` drops Nx's log lines.
      - name: Select the projects with a test:native-darwin target
        id: plan
        env:
          CALLED_REF: ${{ inputs.ref }}
          CALLED_PROJECTS: ${{ inputs.projects }}
          BENCHMARKS: ${{ github.event_name == 'schedule' || inputs.benchmarks == true }}
        run: |
          set -o pipefail
          if [ -n "$CALLED_REF" ]; then
            echo "Native darwin-arm64 rows from the caller: ${CALLED_PROJECTS:-none}"
            echo "projects=$CALLED_PROJECTS" >> "$GITHUB_OUTPUT"
          else
            case "$GITHUB_EVENT_NAME" in
              workflow_dispatch) projects=$(pnpm nx show projects --with-target test:native-darwin --json | tail -1) ;;
              pull_request) projects=$(pnpm nx show projects --affected --with-target test:native-darwin --json | tail -1) ;;
              *) projects='[]' ;;
            esac
            echo "Native darwin-arm64 rows: $projects"
            echo "projects=$(jq -r 'join(",")' <<< "$projects")" >> "$GITHUB_OUTPUT"
          fi
          benchmarks='[]'
          if [ "$BENCHMARKS" = true ]; then
            benchmarks=$(pnpm nx show projects --with-target benchmark-native --json | tail -1)
          fi
          echo "Benchmark gates: $benchmarks"
          echo "benchmarks=$(jq -r 'join(",")' <<< "$benchmarks")" >> "$GITHUB_OUTPUT"

  native-darwin:
    name: Native kernels on darwin-arm64
    needs: [plan]
    # Not on a draft pull request: the row runs once it is marked ready for review.
    if: needs.plan.outputs.projects != '' && !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # The SDK Tau's own PicoGK build pins (apps/desktop/scripts/prepare-picogk-dotnet.mts), checked by its sha512.
      DOTNET_SDK_URL: https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.400/dotnet-sdk-10.0.400-osx-arm64.tar.gz
      DOTNET_SDK_SHA512: e440e9a58d4ff7741c8342ac3e086fa9ee2dadc25e01c0449a88317a74cfbd63625b8092c3b2a131ae14b16ab3401e9cc470e578e4c65a72a0b5786bd2308cde
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Start the row stopwatch
        run: echo "ROW_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Restore-only on pull requests: saving a missed 1.1 GB macOS store adds about 2.5 minutes.
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'
          save-pnpm-store: ${{ github.event_name == 'push' }}

      # Build123d's pinned darwin-arm64 closure (about 230 MB of wheels and CPython) is the seed,
      # cached under its digests in the manifest and the runner's macOS major version, so a seed
      # saved on one image is never restored on another. PicoGK's runtime and layer are
      # downloaded from their pinned origins on every run.
      - name: Identify the Build123d darwin-arm64 closure
        id: seed-key
        run: |
          digest=$(node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("packages/plugins/build123d/tau-plugin.json", "utf8"));
            const pins = Object.values(manifest.dependencies).flat()
              .filter(({ target }) => target.os === "darwin" && target.arch === "arm64")
              .flatMap(({ files }) => files.map(({ integrity }) => integrity))
              .toSorted();
            if (pins.length === 0) throw new Error("The manifest pins no darwin-arm64 dependency file.");
            console.log(createHash("sha256").update(pins.join("\n")).digest("hex"));
          ')
          macos=$(sw_vers -productVersion | cut -d. -f1)
          echo "key=native-seed-v2-macos${macos}-build123d-darwin-arm64-$digest" >> "$GITHUB_OUTPUT"

      - name: Restore the seed
        id: seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/cache/build123d-seed
          key: ${{ steps.seed-key.outputs.key }}

      # Every `seed` target fills its dependency seed for this host. On a hit this only re-verifies
      # each blob against its pin; on a miss it downloads the closure from its origins, every
      # blob checked before it is written.
      - name: Fill the seed from the pinned origins
        run: pnpm nx run-many -t seed --outputStyle=static

      # A cache saved in the merge queue is scoped to the queue's ref and reaches no later run.
      - name: Save the seed
        if: steps.seed.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: out/cache/build123d-seed
          key: ${{ steps.seed-key.outputs.key }}

      # Each closure test appends its golden comparison to TAU_GOLDEN_SUMMARY_FILE (and fails on
      # a mismatch), so two runs, a cache hit and a cache miss, compare by one string.
      - name: Run the darwin-arm64 native rows
        id: rows
        env:
          PROJECTS: ${{ needs.plan.outputs.projects }}
          TAU_TEST_FRAME_LOG_DIR: ${{ runner.temp }}/native-darwin-frames
          TAU_GOLDEN_SUMMARY_FILE: ${{ runner.temp }}/golden-receipts.md
          # Declaration bundling exceeds Node 24's default 2 GiB heap on this runner.
          # One Nx task at a time keeps the 4 GiB heaps from competing on the 7 GiB host.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          printf '%s\n' '| Closure | Target | treeIntegrity | Golden | Files | Result |' '| --- | --- | --- | --- | ---: | --- |' \
            > "$TAU_GOLDEN_SUMMARY_FILE"
          pnpm nx run-many -t test:native-darwin --projects "$PROJECTS" --parallel=1 --outputStyle=static

      - name: Publish the golden receipts
        if: always()
        env:
          TAU_GOLDEN_SUMMARY_FILE: ${{ runner.temp }}/golden-receipts.md
        run: |
          if [ -f "$TAU_GOLDEN_SUMMARY_FILE" ] && [ "$(wc -l < "$TAU_GOLDEN_SUMMARY_FILE")" -gt 2 ]; then
            { echo '### Golden receipts'; echo; cat "$TAU_GOLDEN_SUMMARY_FILE"; echo; } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^\| @' "$TAU_GOLDEN_SUMMARY_FILE" | while IFS='|' read -r _ closure target tree _ _ result _; do
              echo "::notice title=golden ${closure// /}::${target// /} ${tree// /} (${result// /})"
            done
          else
            echo 'No closure test ran: the selected rows prepare no plugin closure.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report the row time
        if: always()
        env:
          SEED_HIT: ${{ steps.seed.outputs.cache-hit == 'true' }}
        run: |
          row=$(( $(date +%s) - ROW_STARTED ))
          echo "::notice title=native-darwin row::${row} s from job start (seed cache hit: ${SEED_HIT})"
          echo "native-darwin row: ${row} s from job start; seed cache hit: ${SEED_HIT}" >> "$GITHUB_STEP_SUMMARY"

      # The standalone nuget row runs whether or not the native rows passed, so each oracle reports
      # on its own; it is skipped only when the job failed before the rows. The SDK is installed
      # after the rows, and after their stopwatch, so its DOTNET_ROOT never reaches them.
      - name: Install the .NET 10 SDK
        id: dotnet
        if: ${{ !cancelled() && steps.rows.outcome != 'skipped' }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dotnet-sdk.tar.gz" "$DOTNET_SDK_URL"
          echo "$DOTNET_SDK_SHA512  $RUNNER_TEMP/dotnet-sdk.tar.gz" | shasum -a 512 -c -
          mkdir -p "$RUNNER_TEMP/dotnet"
          tar -xzf "$RUNNER_TEMP/dotnet-sdk.tar.gz" -C "$RUNNER_TEMP/dotnet"
          echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"

      - name: Check every nuget template outside Tau
        if: ${{ !cancelled() && steps.dotnet.outcome == 'success' }}
        run: node scripts/src/check-standalone-project.ts --ecosystem nuget --work "$RUNNER_TEMP/standalone"

      - name: Upload the MCP and daemon logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-darwin-logs
          path: ${{ runner.temp }}/native-darwin-frames
          if-no-files-found: ignore
          retention-days: 7

  # The two benchmark-native scripts as gates (charter D23, W15): on each desktop candidate's commit,
  # nightly and on dispatch, on a macos-26 runner of their own so a long soak never delays a row. Build123d's
  # benchmark runs the closure sealed from the cached seed; PicoGK's builds its worker first.
  benchmarks:
    name: Native benchmark gates on darwin-arm64
    needs: [plan]
    if: needs.plan.outputs.benchmarks != ''
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'
          save-pnpm-store: 'false'

      - name: Run the benchmark gates
        env:
          PROJECTS: ${{ needs.plan.outputs.benchmarks }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/benchmarks"
          status=0
          for project in ${PROJECTS//,/ }; do
            echo "::group::$project:benchmark-native"
            if pnpm nx run "$project:benchmark-native" --outputStyle=static | tee "$RUNNER_TEMP/benchmarks/$project.log"; then
              result=pass
            else
              result=fail
              status=1
            fi
            echo '::endgroup::'
            echo "- \`$project:benchmark-native\`: $result" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

      - name: Upload the benchmark output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-benchmarks
          path: ${{ runner.temp }}/benchmarks
          if-no-files-found: ignore
          retention-days: 30
