name: Staging observability

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Staging deploy, Deploy UI to Netlify]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  deployed:
    name: Confirm a successful staging deploy
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    outputs:
      # A manual run inspects whatever staging serves; a deploy-triggered run also needs staging to serve its commit.
      ready: ${{ steps.deploy.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || steps.served.outputs.serving == 'true') }}
    steps:
      - name: Check staging deploy job
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            # Reusable deploy names are prefixed by the calling job. A skipped
            # unaffected UI deploy must not start an observability check.
            ready=$(gh api --paginate --slurp "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" | jq 'any(.[].jobs[]; (.name | endswith("Deploy UI to staging")) and .conclusion == "success" and any(.steps[]; .name == "Record this staging deploy" and .conclusion == "success"))')
            if [ "$ready" = true ]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      # Pushes land minutes apart, so staging has often moved on to a newer deploy before this run starts. Read the
      # commit staging serves before the harness's setup and 18-minute suites: a newer one means a later run owns the
      # check, so this one ends with the harness skipped instead of red. An older commit is polled until the deploy
      # is served and fails after the bound, as does an unreadable page; the harness asserts the commit again.
      - name: Check staging serves the triggering commit
        id: served
        if: steps.deploy.outputs.ready == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          STAGING_PAGE: https://taucad.dev/__debug/observability
          ATTEMPTS: '20'
          INTERVAL_SECONDS: '30'
        run: |
          set -euo pipefail
          attempt=1
          while :; do
            # Only the public release label is read from the page; nothing else is printed.
            served=$(curl -fsS --max-time 30 --cookie 'tau-entry=app' "$STAGING_PAGE" | grep -oE '"TAU_RELEASE":"[0-9a-f]{7,40}"' | head -n 1 | cut -d '"' -f 4 || true)
            if [ -n "$served" ]; then
              case "$HEAD_SHA" in
                "$served"*)
                  echo "Staging serves the triggering commit $served."
                  echo 'serving=true' >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
              # `ahead`: the served commit descends from the trigger, so a newer deploy replaced this one.
              status=$(gh api "repos/$GH_REPO/compare/$HEAD_SHA...$served" --jq .status || true)
              if [ "$status" = ahead ]; then
                echo "::notice title=Superseded::Staging serves $served, newer than ${HEAD_SHA:0:12}; the run for that deploy checks the harness."
                exit 0
              fi
            fi
            if [ "$attempt" -ge "$ATTEMPTS" ]; then
              echo "::error::Staging serves ${served:-no readable release}, not ${HEAD_SHA:0:12} or a newer commit, after $ATTEMPTS reads."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep "$INTERVAL_SECONDS"
          done

  harness:
    name: P1 harness availability (signal acceptance pending)
    needs: deployed
    if: needs.deployed.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    # The staging acceptance suites run serially (`--no-file-parallelism`) against the
    # deployed site, and each case can spend up to 180 s polling Sentry for its own
    # `e2e_run` id. One measured pass over the four suites needs well over 20 minutes,
    # so the former budget cancelled the job mid-suite and threw away its report.
    timeout-minutes: 45
    # A newer deploy's harness replaces an older one still running: the older one would fail on the commit check.
    # The group sits on this job, not the workflow, so a trigger that deployed nothing never cancels a real check.
    concurrency:
      group: staging-observability-harness
      cancel-in-progress: true
    environment: staging
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Validate polling helpers
        run: pnpm nx run ui-e2e:test:observability-helpers
      - name: Check deployed harness
        env:
          # Read-only event token belongs only to this staging environment step.
          SENTRY_E2E_READ_TOKEN: ${{ secrets.SENTRY_E2E_READ_TOKEN }}
          # Manual runs inspect the current deployment without assuming main has deployed.
          TAU_OBSERVABILITY_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          if [ -z "$SENTRY_E2E_READ_TOKEN" ]; then
            echo '::error::Configure SENTRY_E2E_READ_TOKEN in the staging environment.'
            exit 1
          fi
          pnpm nx run ui-e2e:test:e2e:observability-staging
