# Qualify private PicoGK browser archives without publishing or changing desktop payloads.
name: PicoGK browser archives
on:
  pull_request:
    branches-ignore: [production]
    paths:
      - packages/plugins/picogk/dotnet/**
      - .github/workflows/picogk-browser-archive.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: picogk-browser-archive-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  archive:
    uses: taucad/picovoxel/.github/workflows/dotnet-archive.yml@6441ec547355dfea64d032646f39ef67d59f8f33
    with:
      picovoxel-ref: 6441ec547355dfea64d032646f39ef67d59f8f33
      adapter-path: packages/plugins/picogk/dotnet/native
