# The PicoGK browser host producer (charter picogk-interim-digest-consumer, W2; D1, D7–D9; I2–I4).
#
# On `main` (a push that touches the host's inputs, or a dispatch) it computes the inputs key the way
# `picogk-browser-host.yml` keys its cache and compares it with `packages/plugins/picogk/browser-host.pin.json`:
#   - Pinned: the run ends green and builds nothing.
#   - Already tagged (`payload@picogk-browser-<16 hex>` exists for this key): nothing is built again; the
#     tagged pin is carried to the pin pull request below.
#   - Otherwise: the host is prepared twice and refused unless both builds are byte-identical (I4); the
#     tau-release-bot commits the pin on `bot/picogk-browser-host-pin` and tags that commit. The tag's
#     own run of this workflow publishes; once it has, and every blob reads back from cdn.tau.new with its
#     digest, the bot opens or updates the pin pull request. CI's "Validate workspace" proves the blobs
#     again on that pull request and in the merge queue, so `main` never names a digest the mirror does
#     not serve (D9, I2).
#
# On a `payload@picogk-browser-*` tag (created only by the release bot) it takes the bundle of the tagged
# commit's inputs (the cache the producer saved, or a rebuild), refuses unless the tag, the key and every
# byte match the tagged pin, and writes every file and then the manifest once under
# `blobs/sha256/<hex>` of the payload bucket with `If-None-Match: *` and immutable caching (D7, I3). A
# blob that already exists is left as it is, so a second publish of the same digest writes nothing. The
# upload credential lives on the `payloads` environment, which admits only `payload@*` and release tags (I6).
#
# This file is not one of the key's inputs: changing how the host is published does not rebuild it.
name: PicoGK browser host publish
run-name: ${{ github.ref_name }}

on:
  push:
    branches: [main]
    # Path filters do not apply to tag pushes.
    tags: ['payload@picogk-browser-*']
    paths:
      - packages/plugins/picogk/dotnet/**
      - packages/plugins/picogk/scripts/**
      - packages/plugins/picogk/src/**
      - packages/plugins/picogk/project.json
      - packages/plugins/picogk/browser-host.pin.json
      - pnpm-lock.yaml
      - scripts/src/picogk-browser-host-pin.ts
      - .github/workflows/picogk-browser-host.yml
      - .github/workflows/picogk-browser-host-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: picogk-browser-host-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PIN: packages/plugins/picogk/browser-host.pin.json
  PIN_BRANCH: bot/picogk-browser-host-pin

jobs:
  # ---- Producer, on main -------------------------------------------------------------------------

  key:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/picogk-browser-host.yml
    with:
      key-only: true

  decide:
    needs: key
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pinned: ${{ steps.status.outputs.pinned }}
      tag: ${{ steps.status.outputs.tag }}
      tagged: ${{ steps.tagged.outputs.tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'
      - name: Compare the inputs key with the pin
        id: status
        env:
          KEY: ${{ needs.key.outputs.key }}
        run: |
          set -euo pipefail
          node scripts/src/picogk-browser-host-pin.ts status --pin "$PIN" --key "$KEY" | tee -a "$GITHUB_OUTPUT"
      - name: Look for this key's payload tag
        id: tagged
        if: steps.status.outputs.pinned != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.status.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2> /dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize the decision
        env:
          KEY: ${{ needs.key.outputs.key }}
          PINNED: ${{ steps.status.outputs.pinned }}
          TAGGED: ${{ steps.tagged.outputs.tagged }}
          TAG: ${{ steps.status.outputs.tag }}
        run: |
          if [ "$PINNED" = true ]; then
            message="The inputs key is pinned; nothing is built."
          elif [ "$TAGGED" = true ]; then
            message="$TAG already exists for this key; its pin is carried to the pin pull request without a rebuild."
          else
            message="The inputs key is not pinned; the host is built twice, compared and pinned as $TAG."
          fi
          echo "::notice title=PicoGK browser host::$message"
          printf '### PicoGK browser host\n\n- inputs key `%s`\n- %s\n' "$KEY" "$message" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: decide
    if: needs.decide.outputs.pinned != 'true' && needs.decide.outputs.tagged != 'true'
    uses: ./.github/workflows/picogk-browser-host.yml
    with:
      reproduce: true

  pin:
    needs: [key, decide, build]
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.pinned != 'true' && (needs.decide.outputs.tagged == 'true' || needs.build.result == 'success') }}
    name: Pin the published host in a pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment:
      name: release-pr
      deployment: false
    env:
      KEY: ${{ needs.key.outputs.key }}
      TAG: ${{ needs.decide.outputs.tag }}
      TAGGED: ${{ needs.decide.outputs.tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.TAGGED != 'true'
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: out/picogk-browser-host
      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      # The tag is created with the App token, so its push starts this workflow's publish jobs; a
      # GITHUB_TOKEN tag would start nothing.
      - name: Commit the pin and tag it
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "tau-release-bot[bot]"
          git config user.email "tau-release-bot[bot]@users.noreply.github.com"
          if [ "$TAGGED" = true ]; then
            # An earlier run built, pinned and tagged this key: carry that commit, whose bytes are published.
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --quiet --detach "$TAG^{commit}"
            node scripts/src/picogk-browser-host-pin.ts status --pin "$PIN" --key "$KEY" | grep -qx 'pinned=true'
          else
            node scripts/src/picogk-browser-host-pin.ts write --key "$KEY" --bundle out/picogk-browser-host --out "$PIN"
            git add -- "$PIN"
            manifest=$(jq -r .manifest.sha256 "$PIN")
            # Contributor hooks do not apply to this generated commit.
            git commit --quiet --no-verify -m "chore(picogk): Pin the PicoGK browser host to manifest ${manifest:0:12}"
          fi
          # The bot branch carries only the generated pin commit; it is rewritten for each new key. It is
          # pushed first, so the tag below names a commit the repository already has.
          git push --force "$remote" "HEAD:refs/heads/$PIN_BRANCH"
          if [ "$TAGGED" != true ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$(git rev-parse HEAD)" --silent
          fi
      - name: Wait for the tag's publish run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          run_id=""
          for attempt in $(seq 1 30); do
            # Only the tag's push runs this workflow on the pin commit: the bot branch's push does not.
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow picogk-browser-host-publish.yml --event push \
              --commit "$commit" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 20
          done
          if [ -z "$run_id" ]; then
            echo "::error::No publish run started for $TAG; check that the release-tags ruleset admits payload@* tags."
            exit 1
          fi
          echo "Publish run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          if ! gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 60 > /dev/null; then
            echo "::error::The publish run for $TAG did not succeed ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id). Rerun it, then dispatch this workflow on main."
            exit 1
          fi
      - name: Prove every pinned blob is served
        run: node scripts/src/picogk-browser-host-pin.ts check --pin "$PIN"
      - name: Open or update the pin pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          manifest=$(jq -r .manifest.sha256 "$PIN")
          subject="chore(picogk): Pin the PicoGK browser host to manifest ${manifest:0:12}"
          {
            echo "Pins the PicoGK browser host the UI loads by digest from \`cdn.tau.new\`."
            echo
            echo "- inputs key \`$KEY\`"
            echo "- manifest \`$manifest\`, $(jq -r .manifest.byteLength "$PIN") bytes"
            echo "- $(jq -r .files.count "$PIN") files, $(jq -r .files.byteLength "$PIN") bytes"
            echo "- published from \`$TAG\`; every blob read back from \`https://cdn.tau.new/blobs/sha256/<hex>\` with its digest"
            echo
            echo "---"
            echo
            echo "- This pull request is **bot-managed** by \`picogk-browser-host-publish.yml\`: a new inputs key"
            echo "  rewrites \`$PIN_BRANCH\`. Do not push to it."
            echo "- \"Validate workspace\" proves every blob again before it can merge."
          } > "$RUNNER_TEMP/body.md"
          number=$(gh pr list --base main --head "$PIN_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --base main --head "$PIN_BRANCH" --title "$subject" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$number" --title "$subject" --body-file "$RUNNER_TEMP/body.md"
          fi
          printf -- '- pin pull request: %s\n' "$subject" >> "$GITHUB_STEP_SUMMARY"

  # ---- Publish, on a payload@picogk-browser-* tag ------------------------------------------------

  bundle:
    if: startsWith(github.ref, 'refs/tags/payload@picogk-browser-')
    uses: ./.github/workflows/picogk-browser-host.yml

  publish:
    needs: bundle
    name: Write the pinned host once under its digests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: payloads
      deployment: false
    env:
      PAYLOAD_R2_ENDPOINT: ${{ vars.PAYLOAD_R2_ENDPOINT }}
      PAYLOAD_R2_BUCKET: ${{ vars.PAYLOAD_R2_BUCKET || 'tau-prod-content' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.bundle.outputs.artifact }}
          path: out/picogk-browser-host
      - name: Verify the bundle against the tagged pin
        env:
          KEY: ${{ needs.bundle.outputs.key }}
        run: |
          node scripts/src/picogk-browser-host-pin.ts plan --pin "$PIN" --key "$KEY" \
            --bundle out/picogk-browser-host --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/plan.tsv"
      - name: Write every blob once, the manifest last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PAYLOAD_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PAYLOAD_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          missing=()
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY PAYLOAD_R2_ENDPOINT; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The payloads environment lacks ${missing[*]} (secrets PAYLOAD_R2_ACCESS_KEY_ID, PAYLOAD_R2_SECRET_ACCESS_KEY, variable PAYLOAD_R2_ENDPOINT); nothing is published."
            exit 1
          fi
          written=0
          present=0
          while IFS=$'\t' read -r sha path type; do
            # If-None-Match makes the bucket refuse to replace a blob: 412 means this digest's bytes are already there.
            if aws --endpoint-url "$PAYLOAD_R2_ENDPOINT" s3api put-object --bucket "$PAYLOAD_R2_BUCKET" \
              --key "blobs/sha256/$sha" --body "out/picogk-browser-host/$path" --content-type "$type" \
              --cache-control 'public, max-age=31536000, immutable' --if-none-match '*' \
              > /dev/null 2> "$RUNNER_TEMP/put-error"; then
              written=$((written + 1))
            elif grep -Eq 'PreconditionFailed|\(412\)' "$RUNNER_TEMP/put-error"; then
              present=$((present + 1))
            else
              cat "$RUNNER_TEMP/put-error" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/plan.tsv"
          echo "::notice title=PicoGK browser host published::$written blobs written, $present already present."
          printf '### PicoGK browser host: %s\n\n- %s blobs written, %s already present\n' \
            "$GITHUB_REF_NAME" "$written" "$present" >> "$GITHUB_STEP_SUMMARY"
      - name: Read every blob back from cdn.tau.new
        run: node scripts/src/picogk-browser-host-pin.ts check --pin "$PIN"
