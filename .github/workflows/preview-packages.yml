name: Preview packages

# The pkg.pr.new full run: publishes every publishable workspace package for one
# commit, so the agent plugin and the CLI it starts can be installed without npm
# (`pnpm plugin:dev preview --sha <commit>`), then installs what it published by
# URL into a clean npm application on Linux and macOS and exports a GLB with the
# installed `tau`, then runs `pnpm plugin:dev doctor --smoke` against the installed
# agent plugin. It rehearses the npm release train before each train.
#
# Runs on a dispatch from `main`, and on a same-repository pull request carrying
# the `preview` label (each push to it publishes again). The packages carry the
# preview version 0.0.0-preview-<sha>; pkg.pr.new rewrites their @taucad/* and
# geospec dependencies to the same run's URLs, and such peers to that version
# (--peerDeps), which no registry range would admit.
# --no-compact keeps every URL in its long form: the npm name @taucad/replicad
# still belongs to the retired replicad fork, whose repository field compact URLs
# would follow. @taucad/geospec-engine is published too: @taucad/cli depends on
# it (audit H-01). Needs the pkg.pr.new GitHub App
# (https://github.com/apps/pkg-pr-new) installed on this repository.
on:
  workflow_dispatch:
    inputs:
      wait-minutes:
        description: "How long to wait for the commit's ci.yml run on main to finish; previews publish only a passed commit"
        required: false
        default: '90'
  pull_request:
    types: [labeled, opened, reopened, synchronize]

permissions:
  contents: read
  actions: read

# A new push to a labelled pull request replaces its running preview; a label other than
# `preview` gets its own group, so adding it never cancels one.
concurrency:
  group: preview-packages-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && github.run_id || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  pnpm_config_verify_deps_before_run: warn

jobs:
  preview:
    name: Publish previews to pkg.pr.new
    # A dispatch publishes only from main; a pull request only when labelled `preview`, from
    # this repository (never a fork), and a `labeled` event only for that label.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'preview') &&
        (github.event.action != 'labeled' || github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      # A dispatch publishes only a commit whose main CI run passed; a pull request's
      # own CI checks its commit.
      - name: Require this commit's main CI run to have passed
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/main-ci-success
        with:
          wait-minutes: ${{ inputs.wait-minutes || '90' }}
          github-token: ${{ github.token }}

      - name: Build every publishable package
        run: pnpm nx run-many -t build --projects=tag:type:package

      - name: List the publishable package folders
        id: packages
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync, existsSync } from "node:fs";
            import { execFileSync } from "node:child_process";
            const projects = JSON.parse(execFileSync("pnpm", ["-r", "--depth", "-1", "ls", "--json"], { encoding: "utf8" }));
            const folders = projects
              .filter(({ path }) => existsSync(`${path}/project.json`))
              .filter(({ path }) => (JSON.parse(readFileSync(`${path}/project.json`, "utf8")).tags ?? []).includes("type:package"))
              .filter(({ path }) => JSON.parse(readFileSync(`${path}/package.json`, "utf8")).private !== true)
              .map(({ path }) => path.slice(process.cwd().length + 1))
              .sort();
            console.log(`Publishing ${folders.length} packages:\n${folders.join("\n")}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `folders=${folders.join(" ")}\ncount=${folders.length}\n`);
          '

      # --pnpm packs with pnpm, which applies publishConfig and resolves workspace: and catalog: specifiers.
      # A labelled pull request gets one pkg.pr.new comment, updated on each push; a dispatch none.
      - name: Publish to pkg.pr.new
        env:
          FOLDERS: ${{ steps.packages.outputs.folders }}
          COMMENT: ${{ github.event_name == 'pull_request' && 'update' || 'off' }}
        run: |
          # shellcheck disable=SC2086 # one argument per folder
          pnpm dlx pkg-pr-new@0.0.88 publish --pnpm --previewVersion --peerDeps --no-compact \
            --comment="$COMMENT" --json preview.json $FOLDERS

      - name: Check every folder published
        env:
          EXPECTED: ${{ steps.packages.outputs.count }}
        run: |
          node -e '
            const packages = require("./preview.json").packages ?? [];
            console.log(`pkg.pr.new published ${packages.length} of ${process.env.EXPECTED} folders.`);
            if (packages.length !== Number(process.env.EXPECTED)) process.exit(1);
          '

      - name: Summarise the install
        run: |
          {
            echo "## Preview packages for ${GITHUB_SHA::7}"
            echo
            echo '```bash'
            echo "pnpm plugin:dev preview --sha ${GITHUB_SHA::7}"
            echo '```'
            echo
            node -e 'for (const { name, url } of require("./preview.json").packages ?? []) console.log(`- ${name}: ${url}`)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the preview list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-pr-new-preview-${{ github.sha }}
          path: preview.json
          if-no-files-found: error

  consumer:
    name: Install the previews (${{ matrix.os }})
    needs: preview
    strategy:
      fail-fast: false
      # A run Dependabot triggered requests no macOS runner from the shared pool; a
      # maintainer's label, push or re-run, and every dispatch, keeps the macOS leg.
      matrix:
        os: >-
          ${{ github.event_name == 'pull_request' && github.triggering_actor == 'dependabot[bot]'
          && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # The checkout supplies only the checker and its tools (TypeScript, esbuild, Playwright):
      # the consumer application lives under the OS temp dir and installs nothing from it.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Install Chromium for the browser checks
        run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: Download the preview list
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pkg-pr-new-preview-${{ github.sha }}
          path: ${{ runner.temp }}/preview

      - name: Install every preview by URL and export a GLB
        run: |
          set -o pipefail
          node scripts/src/check-pack-install.ts --from-urls "$RUNNER_TEMP/preview/preview.json" 2>&1 \
            | tee "$RUNNER_TEMP/consumer-${{ matrix.os }}.log"

      # The agent plugins' consumer oracle (charter D33, W22): the published plugin folder, installed
      # with every preview of this run into a clean npm application, starts its launcher as a host
      # would, with the installed `tau` as its CLI, and `doctor --smoke` evaluates, tests,
      # screenshots, exports and shows a block through it. It runs whether or not the install
      # check above passed, so each oracle reports on its own. The consumer parity table in
      # e2e-nightly.yml reads this step by name. macOS only: `screenshot` needs a graphics adapter,
      # which GitHub's Ubuntu runners lack. The app then pins the CLI's own Zod, as
      # check-pack-install.ts does: with a second, newer Zod hoisted beside the CLI's, `tau mcp`
      # fails converting its tool schemas.
      - name: Smoke the preview agent plugin with doctor
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 30
        env:
          PLUGIN_APP: ${{ runner.temp }}/plugin-preview
          PREVIEW_JSON: ${{ runner.temp }}/preview/preview.json
          LOG: ${{ runner.temp }}/doctor-${{ matrix.os }}.log
        run: |
          set -o pipefail
          mkdir -p "$PLUGIN_APP"
          (cd "$PLUGIN_APP" && npm init -y > /dev/null)
          # A read loop, not mapfile: macOS runs bash 3.2.
          urls=()
          while IFS= read -r url; do urls+=("$url"); done < <(jq -r '.packages[].url' "$PREVIEW_JSON")
          npm install --prefix "$PLUGIN_APP" --no-audit --no-fund "${urls[@]}"
          zod=$(node -p 'require(process.argv[1]).dependencies.zod' "$PLUGIN_APP/node_modules/@taucad/cli/package.json")
          npm install --prefix "$PLUGIN_APP" --no-audit --no-fund "zod@$zod"
          TAU_CLI="$PLUGIN_APP/node_modules/.bin/tau" pnpm plugin:dev doctor --smoke \
            --plugin "$PLUGIN_APP/node_modules/@taucad/agent-plugin" 2>&1 | tee "$LOG"

      - name: Upload the consumer log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-pr-new-consumer-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/consumer-${{ matrix.os }}.log
            ${{ runner.temp }}/doctor-${{ matrix.os }}.log
          if-no-files-found: ignore
