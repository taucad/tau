# Temporary probe (removed before review): which non-interactive macOS trust-root install a hosted runner accepts.
name: Probe macOS trust root
on:
  push:
    branches: [claude/project-thread-770c3z]
    paths: [.github/workflows/probe-macos-trust.yml]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        host: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 15
    steps:
      - shell: bash
        run: |
          set +e -u
          d="$RUNNER_TEMP/probe"; mkdir -p "$d"; cd "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 1 -subj "/CN=Tau probe $RANDOM" \
            -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout s.key -out s.csr -subj /CN=127.0.0.1 2>/dev/null
          printf 'subjectAltName=IP:127.0.0.1\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n' > s.ext
          openssl x509 -req -in s.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out s.crt -days 1 -extfile s.ext 2>/dev/null
          fp=$(openssl x509 -in ca.crt -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)
          run() { echo "::group::$*"; /usr/bin/time -p perl -e 'alarm 30; exec @ARGV' "$@"; echo "exit=$?"; echo "::endgroup::"; }
          sw_vers; id; sudo -n true && echo sudo-ok
          run security authorizationdb read com.apple.trust-settings.admin
          run security verify-cert -c s.crt -p ssl -s 127.0.0.1
          echo '### A: sudo -n admin domain, System keychain'
          run sudo -n security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain ca.crt
          run security verify-cert -c s.crt -p ssl -s 127.0.0.1
          run security dump-trust-settings -d
          run sudo -n security remove-trusted-cert -d ca.crt
          run sudo -n security delete-certificate -Z "$fp" /Library/Keychains/System.keychain
          run security verify-cert -c s.crt -p ssl -s 127.0.0.1
          echo '### B: authorizationdb allow, then A'
          run sh -c 'security authorizationdb read com.apple.trust-settings.admin > orig.plist'
          run sudo -n security authorizationdb write com.apple.trust-settings.admin allow
          run sudo -n security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain ca.crt
          run security verify-cert -c s.crt -p ssl -s 127.0.0.1
          run sudo -n security remove-trusted-cert -d ca.crt
          run sudo -n security delete-certificate -Z "$fp" /Library/Keychains/System.keychain
          run sh -c 'sudo -n security authorizationdb write com.apple.trust-settings.admin < orig.plist'
          run security authorizationdb read com.apple.trust-settings.admin
          run security verify-cert -c s.crt -p ssl -s 127.0.0.1
          exit 0
