# Build application releases from their exact tags. UI/API deploy through their
# existing production jobs. Desktop candidates publish immutable GitHub assets,
# mirror them to isolated channel R2 buckets, and advance public downloads/feeds
# only after a real signed macOS A→B replacement and installed-payload verification.
# Staging keeps Developer ID signing and release hardening but skips notarization;
# production also notarizes and staples. Both retain source/relink release assets.
# The first mirrored candidate establishes a baseline without changing live feeds.
# Signing credentials stay in desktop/desktop-staging; R2 credentials are separately
# scoped to each download bucket. Nothing here publishes npm packages.
name: Release build
run-name: ${{ github.event.release.tag_name || inputs.tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rebuild, e.g. desktop@0.2.0 or desktop-staging@0.2.0-staging.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  pnpm_config_verify_deps_before_run: warn
  NX_NO_CLOUD: 'true'

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      project: ${{ steps.tag.outputs.project }}
      version: ${{ steps.tag.outputs.version }}
      kind: ${{ steps.tag.outputs.kind }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT: ${{ github.event_name }}
          AUTHOR: ${{ github.event.release.author.login }}
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN || 'tau-release-bot[bot]' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel=production
          if [[ "$TAG" =~ ^desktop-staging@([0-9]+\.[0-9]+\.[0-9]+)-staging\.[0-9]+$ ]]; then
            # A staging desktop prerelease builds the desktop app at its manifest version.
            project=desktop
            version=${BASH_REMATCH[1]}
            channel=staging
          elif [[ "$TAG" =~ ^([a-z0-9-]+)@([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            project=${BASH_REMATCH[1]}
            version=${BASH_REMATCH[2]}
          else
            echo "::notice::$TAG is not an application release; nothing to build."
            echo "kind=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kind=app
          if [ "$project" = desktop ]; then kind=desktop; fi

          # Only build what release.yml released: a release the bot published,
          # whose tag names a commit already on main. Anyone with write access
          # can publish a release, and a desktop build signs and ships it.
          if [ "$EVENT" = release ] && [ "$AUTHOR" != "$RELEASE_BOT_LOGIN" ]; then
            echo "::error::$TAG was published by $AUTHOR, not $RELEASE_BOT_LOGIN; refusing to build it."
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$TAG" --jq .status)
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::$TAG is not on main (compare status: $status); refusing to build it."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "project=$project"
            echo "version=$version"
            echo "kind=$kind"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

  verify-app:
    needs: resolve
    if: needs.resolve.outputs.kind == 'app' || needs.resolve.outputs.kind == 'desktop'
    name: Verify ${{ needs.resolve.outputs.tag }}
    runs-on: ubuntu-24.04
    # Includes waiting for the release commit's main CI run, which starts with
    # the same merge and whose macOS GeoSpec producer takes over an hour.
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Require a release application at the released version
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # pnpm can print warnings ahead of the JSON, which is always the last line.
          pnpm nx show project "$PROJECT" --json | tail -1 > "$RUNNER_TEMP/project.json"
          jq -e '.tags | index("release:app")' "$RUNNER_TEMP/project.json" > /dev/null \
            || { echo "::error::$PROJECT is not tagged release:app"; exit 1; }
          root=$(jq -r .root "$RUNNER_TEMP/project.json")
          actual=$(jq -r .version "$root/package.json")
          test "$actual" = "$VERSION" \
            || { echo "::error::$root/package.json is $actual, the tag says $VERSION"; exit 1; }

      # The UI, desktop and API builds need the GeoSpec engine products, which
      # only main CI's macOS producer makes. Waiting for that run also means a
      # release is built only once main is green on its commit.
      - name: Take the GeoSpec artifact from the release commit's main CI run
        uses: ./.github/actions/geospec-artifact-from-main
        with:
          wait-minutes: '180'
          github-token: ${{ github.token }}

      - name: Lint, typecheck, test and build the release
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
        run: pnpm nx run-many -t lint typecheck test build --projects="$PROJECT" --parallel=2

  # OCCT (LGPL-2.1 with the Open CASCADE exception) is compiled into the GeoSpec
  # engine that the UI serves as Wasm and the desktop app bundles, so each UI
  # and desktop release carries the complete source and relink kit, the OCCT
  # licence and exception, and the GeoSpec notices as release assets. The kit
  # comes from the release commit's main CI run and must match the receipt in
  # packages/geospec-engine-native/licenses/SOURCE-RELINK.json.
  source-kit:
    needs: [resolve, verify-app]
    if: needs.resolve.outputs.project == 'ui' || needs.resolve.outputs.project == 'desktop'
    name: Attach the GeoSpec source and relink kit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    environment:
      name: release-pr
      deployment: false
    steps:
      - name: Checkout the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Take the GeoSpec artifact from the release commit's main CI run
        uses: ./.github/actions/geospec-artifact-from-main
        with:
          github-token: ${{ github.token }}

      - name: Check the kit against its receipt
        run: |
          set -euo pipefail
          # The build writes the receipt and notices into the package it ships, so
          # take them from there: committed copies describe an earlier build.
          tarballs=out/artifacts/geospec-native-engine/ci/assembly/tarballs
          tar -xzf "$tarballs/root.tgz" -C "$RUNNER_TEMP" package/licenses
          licenses="$RUNNER_TEMP/package/licenses"
          receipt="$licenses/SOURCE-RELINK.json"
          name=$(jq -r .artifact.fileName "$receipt")
          kit="$tarballs/$name"
          expected=$(jq -r .artifact.sha256 "$receipt")
          actual=$(sha256sum "$kit" | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::$name is $actual; SOURCE-RELINK.json records $expected."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/source-kit"
          cp "$kit" "$RUNNER_TEMP/source-kit/"
          cp "$licenses/OCCT-LGPL-2.1.txt" "$licenses/OCCT-LGPL-exception.txt" "$RUNNER_TEMP/source-kit/"
          cp "$licenses/NOTICE.txt" "$RUNNER_TEMP/source-kit/GeoSpec-NOTICE.txt"
          cp "$licenses/THIRD-PARTY-NOTICES.txt" "$RUNNER_TEMP/source-kit/GeoSpec-THIRD-PARTY-NOTICES.txt"
          cp "$licenses/SOURCE-RELINK.md" "$RUNNER_TEMP/source-kit/GeoSpec-SOURCE-RELINK.md"

      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Attach the kit and notices
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        working-directory: ${{ runner.temp }}/source-kit
        run: gh release upload "$TAG" ./* --clobber

  desktop-macos:
    needs: [resolve, verify-app]
    if: needs.resolve.outputs.kind == 'desktop'
    name: Package macOS ${{ matrix.arch }} (signed)
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            machine: arm64
            package-target: package-macos-release
          - arch: x64
            runner: macos-15-intel
            machine: x86_64
            package-target: package-macos-release-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    environment:
      name: ${{ needs.resolve.outputs.channel == 'staging' && 'desktop-staging' || 'desktop' }}
    env:
      GEOSPEC_WORKERS: 1
      TAU_DESKTOP_CHANNEL: ${{ needs.resolve.outputs.channel }}
      TAU_DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      TAU_MACOS_PACKAGE_OUTPUT_ROOT: ${{ github.workspace }}/out/desktop/macos-${{ matrix.arch }}
    steps:
      - name: Checkout the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'

      # The GeoSpec native payload is produced on this host, as publish.yml does.
      - name: Setup producer Python
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.14'

      - name: Setup selected CPython 3.13 tooling
        if: matrix.arch == 'arm64'
        id: python313
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.14'
          update-environment: false

      - name: Setup selected CPython 3.14 tooling
        if: matrix.arch == 'arm64'
        id: python314
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          update-environment: false

      - name: Check host, capacity and installed tools
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = "${{ matrix.machine }}"
          node --input-type=module -e 'import {statfsSync} from "node:fs"; const s=statfsSync("."); const available=s.bavail*s.bsize; const required=19*1024**3; console.log({available,required}); if(available<required) throw new Error("Desktop packaging capacity unavailable");'
          cmake --version
          ninja --version
          xcrun --find clang++

      - name: Provision pinned Python wrapper tooling
        if: matrix.arch == 'arm64'
        env:
          GEOSPEC_PYTHON313: ${{ steps.python313.outputs.python-path }}
          GEOSPEC_PYTHON314: ${{ steps.python314.outputs.python-path }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          project = Path('packages/geospec-engine-native/bindings/python/pyproject.toml')
          requirements = tomllib.loads(project.read_text())['build-system']['requires']
          assert len(requirements) == 1 and re.fullmatch(r'maturin==[0-9]+\.[0-9]+\.[0-9]+', requirements[0])
          for selector, name in [('GEOSPEC_PYTHON313', 'python-venv'), ('GEOSPEC_PYTHON314', 'python314-venv')]:
              environment = Path('node_modules/.cache/geospec-engine-native') / name
              subprocess.run([os.environ[selector], '-m', 'venv', str(environment)], check=True)
              subprocess.run([str(environment / 'bin/python'), '-m', 'pip', 'install',
                              '--disable-pip-version-check', '--only-binary=:all:', '--no-deps', requirements[0]], check=True)
          PYTHON

      - name: Install the selected native Rust toolchain
        if: matrix.arch == 'arm64'
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup run 1.88 rustc --version

      # prepare-build123d-python resolves its wheels with uv, as on the
      # portable hosts.
      - name: Install uv
        run: |
          command -v uv || pipx install uv
          uv --version

      # A throwaway keychain holds the Developer ID identity and the notary
      # profile for this job only; it is deleted in the last step.
      - name: Take the verified same-source GeoSpec products
        uses: ./.github/actions/geospec-artifact-from-main
        with:
          github-token: ${{ github.token }}

      - name: Record package source identity
        shell: bash
        run: echo "TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Import the Developer ID identity and notary credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ENVIRONMENT: ${{ needs.resolve.outputs.channel == 'staging' && 'desktop-staging' || 'desktop' }}
        run: |
          set -euo pipefail
          names=(MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID)
          if [ "$TAU_DESKTOP_CHANNEL" = production ]; then
            names+=(APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID)
          fi
          for name in "${names[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the $ENVIRONMENT environment"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/tau-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          search_list=("$keychain")
          while IFS= read -r entry; do
            entry=${entry//\"/}
            search_list+=("${entry#"${entry%%[![:space:]]*}"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"
          security default-keychain -d user -s "$keychain"
          rm -f "$certificate"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE "s/.*\"(Developer ID Application: .*\($APPLE_TEAM_ID\))\".*/\1/p" | head -1)
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity for team $APPLE_TEAM_ID in the imported certificate"
            exit 1
          fi
          # package-macos.mts notarizes through this keychain profile.
          if [ "$TAU_DESKTOP_CHANNEL" = production ]; then
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key"
          xcrun notarytool store-credentials tau-notary --key "$api_key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --keychain "$keychain"
          rm -f "$api_key"
          fi
          {
            echo "TAU_CODESIGN_IDENTITY=$identity"
            echo "TAU_NOTARYTOOL_PROFILE=tau-notary"
            echo "TAU_SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Package and sign; notarize production
        run: |
          config=()
          if [ "$TAU_DESKTOP_CHANNEL" = staging ]; then config+=(--configuration=staging); fi
          pnpm nx run desktop:${{ matrix.package-target }} --parallel=1 "${config[@]}"

      # Uploaded before verification so a failed verify leaves the signed app
      # for verify-desktop-macos.yml. Publishing still needs this whole job.
      - name: Upload the macOS archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-darwin-${{ matrix.arch }}
          path: ${{ env.TAU_MACOS_PACKAGE_OUTPUT_ROOT }}/Tau-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Verify the signed package
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          config=()
          if [ "$TAU_DESKTOP_CHANNEL" = staging ]; then config+=(--configuration=staging); fi
          pnpm nx run desktop:verify-macos-release "${config[@]}"

      - name: Delete the signing keychain
        if: always()
        run: |
          if [ -n "${TAU_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$TAU_SIGNING_KEYCHAIN" || true
          fi

  desktop-portable:
    needs: [resolve, verify-app]
    if: needs.resolve.outputs.kind == 'desktop'
    name: Package ${{ matrix.platform }} (unsigned)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            target: package-linux
            archive: Tau-linux-x64.tar.gz
          - platform: win32-x64
            runner: windows-2025
            target: package-windows
            archive: Tau-win32-x64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      TAU_DESKTOP_CHANNEL: ${{ needs.resolve.outputs.channel }}
      TAU_DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      TAU_DESKTOP_PACKAGE_OUTPUT_ROOT: ${{ github.workspace }}/out/desktop/${{ matrix.platform }}
    steps:
      # Windows checkouts default to CRLF, which changes the GeoSpec product key
      # main CI computed and breaks its lockfile parse; keep the committed bytes.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false

      - name: Checkout the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Take the GeoSpec artifact from the release commit's main CI run
        uses: ./.github/actions/geospec-artifact-from-main
        with:
          github-token: ${{ github.token }}

      # prepare-build123d-python resolves its wheels with uv on both hosts;
      # prepare-git builds git on Linux against libcurl and zlib.
      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          pipx install uv
          uv --version
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
          fi

      # On Windows the archive and the Python payload use the inbox bsdtar,
      # which must come before Git Bash's GNU tar on PATH.
      - name: Record package source identity
        shell: bash
        run: echo "TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="/c/Windows/System32:$PATH"
          fi
          pnpm nx run "desktop:${{ matrix.target }}" --parallel=1

      - name: Upload the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ env.TAU_DESKTOP_PACKAGE_OUTPUT_ROOT }}/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  desktop-publish:
    needs: [resolve, desktop-macos, desktop-portable, source-kit]
    if: needs.resolve.outputs.kind == 'desktop'
    name: Attach immutable candidate assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release-pr
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: out/desktop/assets
          merge-multiple: true
      - name: Prepare and attach the immutable candidate
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DESKTOP_ASSETS_DIR: out/desktop/assets
          FEED_TAG: ${{ needs.resolve.outputs.channel == 'staging' && 'desktop-staging-feed' || 'desktop-feed' }}
        run: |
          set -euo pipefail
          TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)
          export TAU_DESKTOP_SOURCE_SHA
          pnpm nx run desktop:publish --args=prepare
          # A rerun never replaces signed bytes under an existing release/version.
          gh release upload "$DESKTOP_RELEASE_TAG" out/desktop/assets/Tau-* out/desktop/assets/*.json out/desktop/assets/SHA256SUMS.txt
          if ! gh api "repos/$GH_REPO/releases/tags/$FEED_TAG" --silent 2> "$RUNNER_TEMP/feed-error"; then
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/feed-error"; then cat "$RUNNER_TEMP/feed-error" >&2; exit 1; fi
            gh release create "$FEED_TAG" --target "$TAU_DESKTOP_SOURCE_SHA" --prerelease --latest=false \
              --title "Desktop update feed" --notes "Channel pointer. Assets advance only after native OTA acceptance."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: out/desktop/assets/*.json
          retention-days: 30

  desktop-mirror:
    needs: [resolve, desktop-publish]
    name: Mirror candidate to R2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    environment:
      name: ${{ needs.resolve.outputs.channel == 'staging' && 'desktop-staging' || 'desktop' }}
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - name: Mirror and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DESKTOP_ASSETS_DIR: out/desktop/assets
          DESKTOP_R2_BUCKET: ${{ vars.DESKTOP_R2_BUCKET }}
          DESKTOP_R2_ENDPOINT: ${{ vars.DESKTOP_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)
          export TAU_DESKTOP_SOURCE_SHA
          gh release download "$DESKTOP_RELEASE_TAG" --dir "$DESKTOP_ASSETS_DIR" --pattern 'Tau-*' --pattern '*.json' --pattern SHA256SUMS.txt
          pnpm nx run desktop:publish --args=mirror
          jq '{tag, sourceCommit, verified: true}' "$DESKTOP_ASSETS_DIR/download.json" > "$DESKTOP_ASSETS_DIR/mirror-receipt.json"
          gh release upload "$DESKTOP_RELEASE_TAG" "$DESKTOP_ASSETS_DIR/mirror-receipt.json"

  desktop-ota:
    needs: [resolve, desktop-mirror]
    name: Verify native macOS ${{ matrix.arch }} OTA replacement
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'
      - name: Find a qualified older candidate or establish the first baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          TARGET: darwin-${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p out/desktop/assets
          gh release download "$TAG" --dir out/desktop/assets --pattern 'Tau-macos-${{ matrix.arch }}.zip' --pattern download.json
          version=$(jq -r .version out/desktop/assets/download.json)
          prefix=desktop@
          if [ "$CHANNEL" = staging ]; then prefix=desktop-staging@; fi
          found=false
          origin=https://downloads.tau.new
          if [ "$CHANNEL" = staging ]; then origin=https://downloads.taucad.dev; fi
          status=$(curl --silent --show-error --retry 3 --output "$RUNNER_TEMP/current.json" --write-out '%{http_code}' "$origin/latest/download.json")
          if [ "$status" != 200 ] && [ "$status" != 404 ]; then echo "Current download pointer returned $status" >&2; exit 1; fi
          # Prefer the actual installed channel baseline. Only initial bootstrap
          # (or a retry of an already-promoted tag) falls back to mirrored candidates.
          if [ "$status" = 200 ]; then jq -r .tag "$RUNNER_TEMP/current.json" > "$RUNNER_TEMP/baselines"; else : > "$RUNNER_TEMP/baselines"; fi
          gh release list --limit 100 --json tagName --jq ".[] | select(.tagName | startswith(\"$prefix\")) | .tagName" >> "$RUNNER_TEMP/baselines"
          while IFS= read -r previous; do
            if [ "$previous" = "$TAG" ]; then continue; fi
            mkdir -p "$RUNNER_TEMP/previous"
            if ! gh release download "$previous" --pattern mirror-receipt.json --dir "$RUNNER_TEMP/previous" --clobber 2> "$RUNNER_TEMP/previous-error"; then
              # Publication is not qualification: only completely mirrored candidates can bootstrap.
              if grep -q 'no assets match' "$RUNNER_TEMP/previous-error"; then continue; fi
              cat "$RUNNER_TEMP/previous-error" >&2; exit 1
            fi
            gh release download "$previous" --pattern download.json --output "$RUNNER_TEMP/previous.json" --clobber
            jq --exit-status --arg tag "$previous" '.verified == true and .tag == $tag' "$RUNNER_TEMP/previous/mirror-receipt.json" > /dev/null
            old=$(jq -r .version "$RUNNER_TEMP/previous.json")
            if [ "$old" = "$version" ] || [ "$(printf '%s\n%s\n' "$old" "$version" | sort -V | tail -1)" != "$version" ]; then continue; fi
            sha=$(jq -r .sourceCommit "$RUNNER_TEMP/previous.json")
            test "$sha" = "$(jq -r .sourceCommit "$RUNNER_TEMP/previous/mirror-receipt.json")"
            if ! git merge-base --is-ancestor "$sha" HEAD; then continue; fi
            # Older ARM-only releases cannot serve as an Intel baseline.
            if ! jq -e --arg target "$TARGET" '.assets[$target]' "$RUNNER_TEMP/previous.json" > /dev/null; then continue; fi
            url=$(jq -r --arg target "$TARGET" '.assets[$target].url' "$RUNNER_TEMP/previous.json")
            curl --fail --location --retry 3 "$url" --output "$RUNNER_TEMP/baseline.zip"
            expected=$(jq -r --arg target "$TARGET" '.assets[$target].sha256' "$RUNNER_TEMP/previous.json")
            printf '%s  %s\n' "$expected" "$RUNNER_TEMP/baseline.zip" | shasum -a 256 -c -
            found=true
            break
          done < "$RUNNER_TEMP/baselines"
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" = false ]; then
            echo 'First OTA-capable candidate established as baseline. Publish a second candidate to exercise native OTA; no live feed or website pointer was changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Observe the actual signed A to B update
        if: steps.baseline.outputs.found == 'true'
        env:
          DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DESKTOP_ASSETS_DIR: out/desktop/assets
          OTA_BASELINE_ZIP: ${{ runner.temp }}/baseline.zip
        run: |
          TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)
          export TAU_DESKTOP_SOURCE_SHA
          pnpm nx run desktop:verify-ota
      - name: Record architecture qualification
        env:
          ACCEPTED: ${{ steps.baseline.outputs.found }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: darwin-${{ matrix.arch }}
        run: |
          if [ "$ACCEPTED" = true ]; then test -f "out/desktop/assets/ota-receipt-$TARGET.json"; fi
          jq -n --arg tag "$TAG" --arg target "$TARGET" --argjson accepted "$ACCEPTED" \
            '{tag:$tag,target:$target,accepted:$accepted}' > "out/desktop/assets/ota-qualification-$TARGET.json"
      - name: Retain OTA receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ota-acceptance-${{ matrix.arch }}
          path: |
            out/desktop/assets/ota-receipt-*.json
            out/desktop/assets/ota-qualification-*.json
            ~/Library/Application Support/Tau Staging/ota-probe*.json
            ~/Library/Application Support/Tau Staging/logs/
            ~/Library/Application Support/Tau/ota-probe*.json
            ~/Library/Application Support/Tau/logs/
          if-no-files-found: ignore
          retention-days: 30

  desktop-promote:
    needs: [resolve, desktop-ota]
    name: Promote the tested channel release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: desktop-promotion-${{ needs.resolve.outputs.channel }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.resolve.outputs.channel == 'staging' && 'desktop-staging' || 'desktop' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ota-acceptance-*
          merge-multiple: true
          path: out/desktop/acceptance
      - name: Require qualification for both Mac architectures
        id: qualification
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          accepted=true
          for target in darwin-arm64 darwin-x64; do
            file=$(find out/desktop/acceptance -name "ota-qualification-$target.json")
            test -n "$file"
            jq -e --arg tag "$TAG" --arg target "$target" '.tag == $tag and .target == $target and (.accepted | type == "boolean")' "$file" > /dev/null
            if [ "$(jq -r .accepted "$file")" != true ]; then accepted=false; fi
          done
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          if [ "$accepted" = false ]; then echo 'Both Mac architectures need an older qualified baseline. No channel pointers changed.' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Promote R2 pointers and the legacy GitHub feed
        if: steps.qualification.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DESKTOP_ASSETS_DIR: out/desktop/assets
          DESKTOP_R2_BUCKET: ${{ vars.DESKTOP_R2_BUCKET }}
          DESKTOP_R2_ENDPOINT: ${{ vars.DESKTOP_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          FEED_TAG: ${{ needs.resolve.outputs.channel == 'staging' && 'desktop-staging-feed' || 'desktop-feed' }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)
          export TAU_DESKTOP_SOURCE_SHA
          gh release download "$DESKTOP_RELEASE_TAG" --dir "$DESKTOP_ASSETS_DIR" --pattern 'desktop-update-*.json' --pattern download.json
          for target in darwin-arm64 darwin-x64; do
            receipt=$(find out/desktop/acceptance -name "ota-receipt-$target.json")
            test -n "$receipt"
            cp "$receipt" "$DESKTOP_ASSETS_DIR/ota-receipt-$target.json"
          done
          pnpm nx run desktop:publish --args=promote
          gh release upload "$FEED_TAG" "$DESKTOP_ASSETS_DIR"/desktop-update-*.json --clobber
          gh release upload "$DESKTOP_RELEASE_TAG" "$DESKTOP_ASSETS_DIR"/ota-receipt-*.json
          if [ "$CHANNEL" = production ]; then gh release edit "$DESKTOP_RELEASE_TAG" --latest; fi

  production-api:
    needs: [resolve, verify-app]
    if: >-
      github.event_name == 'release' && needs.resolve.outputs.project == 'api' &&
      github.ref == format('refs/tags/{0}', needs.resolve.outputs.tag)
    name: Production API
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      app: api
    secrets: inherit

  production-ui:
    needs: [resolve, verify-app]
    if: >-
      github.event_name == 'release' && needs.resolve.outputs.project == 'ui' &&
      github.ref == format('refs/tags/{0}', needs.resolve.outputs.tag)
    name: Production UI
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-ui.yml
    with:
      environment: production
      transport: main-run
    secrets: inherit

  production-docs:
    needs: [resolve, verify-app]
    if: >-
      github.event_name == 'release' && needs.resolve.outputs.project == 'ui' &&
      github.ref == format('refs/tags/{0}', needs.resolve.outputs.tag)
    name: Production docs
    # `deploy-docs.yml` asks for `actions: read` for its staging supersede check.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-docs.yml
    with:
      environment: production
      tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit
