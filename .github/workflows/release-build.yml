# Build application releases from their exact tags. UI/API deploy through their
# existing production jobs. Desktop candidates attach their assets to a draft
# GitHub Release, mirror them to isolated channel R2 buckets, and advance public
# downloads/feeds only after a real signed macOS A→B replacement and
# installed-payload verification.
# Releases are immutable (charter I13, go-live DEL-20): release.yml and
# release-desktop-staging.yml create each release as a draft and then its tag,
# whose push starts this workflow. Every asset is attached to the draft through
# ./.github/actions/release-assets, which never replaces one: a rerun accepts an
# asset holding the same sha256 and refuses a different one. A release is
# published once its assets are complete: a UI or API release after verification
# (and the UI's source kit), a desktop release after native OTA qualification.
# Staging keeps Developer ID signing and release hardening but skips notarization;
# production also notarizes and staples. Both retain source/relink release assets:
# the kit is the taucad/geospec release asset for the `geospec-engine` catalog
# pin, and while that asset is missing, the releases that ship OCCT refuse.
# The first mirrored candidate establishes a baseline without changing live feeds.
# Signing credentials stay in desktop/desktop-staging; R2 credentials are separately
# scoped to each download bucket. Nothing here publishes npm packages.
name: Release build
run-name: ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['ui@*', 'api@*', 'desktop@*', 'desktop-staging@*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rebuild, e.g. desktop@0.2.0 or desktop-staging@0.2.0-staging.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  pnpm_config_verify_deps_before_run: warn
  NX_NO_CLOUD: 'true'

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      project: ${{ steps.tag.outputs.project }}
      version: ${{ steps.tag.outputs.version }}
      kind: ${{ steps.tag.outputs.kind }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
          DELETED: ${{ github.event.deleted || false }}
          AUTHOR: ${{ github.actor }}
          RELEASE_BOT_LOGIN: ${{ vars.RELEASE_BOT_LOGIN || 'tau-release-bot[bot]' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel=production
          if [ "$DELETED" = true ]; then
            echo "::notice::$TAG was deleted; nothing to build."
            echo "kind=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$TAG" =~ ^desktop-staging@([0-9]+\.[0-9]+\.[0-9]+)-staging\.[0-9]+$ ]]; then
            # A staging desktop prerelease builds the desktop app at its manifest version.
            project=desktop
            version=${BASH_REMATCH[1]}
            channel=staging
          elif [[ "$TAG" =~ ^([a-z0-9-]+)@([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            project=${BASH_REMATCH[1]}
            version=${BASH_REMATCH[2]}
          else
            echo "::notice::$TAG is not an application release; nothing to build."
            echo "kind=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kind=app
          if [ "$project" = desktop ]; then kind=desktop; fi

          # Only build what release.yml released: a tag the bot pushed, naming a
          # commit already on main. Release managers can push release tags too,
          # and a desktop build signs and ships what it builds.
          if [ "$EVENT" = push ] && [ "$AUTHOR" != "$RELEASE_BOT_LOGIN" ]; then
            echo "::error::$TAG was pushed by $AUTHOR, not $RELEASE_BOT_LOGIN; refusing to build it."
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$TAG" --jq .status)
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::$TAG is not on main (compare status: $status); refusing to build it."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "project=$project"
            echo "version=$version"
            echo "kind=$kind"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

  verify-app:
    needs: resolve
    if: needs.resolve.outputs.kind == 'app' || needs.resolve.outputs.kind == 'desktop'
    name: Verify ${{ needs.resolve.outputs.tag }}
    runs-on: ubuntu-24.04
    # Includes waiting for the release commit's main CI run, which starts with
    # the same merge and whose macOS GeoSpec producer takes over an hour.
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Require a release application at the released version
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # pnpm can print warnings ahead of the JSON, which is always the last line.
          pnpm nx show project "$PROJECT" --json | tail -1 > "$RUNNER_TEMP/project.json"
          jq -e '.tags | index("release:app")' "$RUNNER_TEMP/project.json" > /dev/null \
            || { echo "::error::$PROJECT is not tagged release:app"; exit 1; }
          root=$(jq -r .root "$RUNNER_TEMP/project.json")
          actual=$(jq -r .version "$root/package.json")
          test "$actual" = "$VERSION" \
            || { echo "::error::$root/package.json is $actual, the tag says $VERSION"; exit 1; }

      # A release is built only once main is green on its commit.
      - name: Require the release commit's main CI run to have passed
        uses: ./.github/actions/main-ci-success
        with:
          wait-minutes: '180'
          github-token: ${{ github.token }}

      - name: Lint, typecheck, test and build the release
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
        run: pnpm nx run-many -t lint typecheck test build --projects="$PROJECT" --parallel=2

  # OCCT (LGPL-2.1 with the Open CASCADE exception) is compiled into the GeoSpec
  # engine that the UI serves as Wasm and the desktop app bundles, so each UI
  # and desktop release carries the complete source and relink kit, the OCCT
  # licence and exception, and the GeoSpec notices as release assets. The kit
  # is the taucad/geospec release asset for the installed `geospec-engine` pin
  # and must match the receipt in that package's licenses/SOURCE-RELINK.json;
  # without it the job refuses.
  source-kit:
    needs: [resolve, verify-app]
    if: needs.resolve.outputs.project == 'ui' || needs.resolve.outputs.project == 'desktop'
    name: Attach the GeoSpec source and relink kit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    environment:
      name: release-pr
      deployment: false
    steps:
      - name: Checkout the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Take the GeoSpec source and relink kit for the engine pin
        id: kit
        uses: ./.github/actions/geospec-source-relink
        with:
          github-token: ${{ github.token }}

      - name: Gather the kit and notices
        env:
          KIT: ${{ steps.kit.outputs.archive }}
          LICENSES: ${{ steps.kit.outputs.licenses }}
        run: |
          set -euo pipefail
          licenses="$LICENSES"
          kit="$KIT"
          mkdir -p "$RUNNER_TEMP/source-kit"
          cp "$kit" "$RUNNER_TEMP/source-kit/"
          cp "$licenses/OCCT-LGPL-2.1.txt" "$licenses/OCCT-LGPL-exception.txt" "$RUNNER_TEMP/source-kit/"
          cp "$licenses/NOTICE.txt" "$RUNNER_TEMP/source-kit/GeoSpec-NOTICE.txt"
          cp "$licenses/THIRD-PARTY-NOTICES.txt" "$RUNNER_TEMP/source-kit/GeoSpec-THIRD-PARTY-NOTICES.txt"
          cp "$licenses/SOURCE-RELINK.md" "$RUNNER_TEMP/source-kit/GeoSpec-SOURCE-RELINK.md"

      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Attach the kit and notices
        uses: ./.github/actions/release-assets
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          files: ${{ runner.temp }}/source-kit/*
          github-token: ${{ steps.bot.outputs.token }}

  # A UI or API release becomes public, and with immutable releases unchangeable,
  # once it is verified and the UI's source kit is attached. desktop-promote
  # publishes a desktop release after its OTA qualification.
  app-release:
    needs: [resolve, verify-app, source-kit]
    if: >-
      !cancelled() && needs.resolve.outputs.kind == 'app' && needs.verify-app.result == 'success' &&
      (needs.source-kit.result == 'success' || needs.source-kit.result == 'skipped')
    name: Publish ${{ needs.resolve.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release-pr
      deployment: false
    steps:
      - name: Checkout the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Publish the release
        uses: ./.github/actions/release-assets
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          publish: 'true'
          github-token: ${{ steps.bot.outputs.token }}

  desktop-macos:
    needs: [resolve, verify-app]
    if: needs.resolve.outputs.kind == 'desktop'
    name: Package macOS ${{ matrix.arch }} (signed)
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
            machine: arm64
            package-target: package-macos-release
          - arch: x64
            runner: macos-26-intel
            machine: x86_64
            package-target: package-macos-release-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    environment:
      name: ${{ needs.resolve.outputs.channel == 'staging' && 'desktop-staging' || 'desktop' }}
    env:
      GEOSPEC_WORKERS: 1
      TAU_DESKTOP_CHANNEL: ${{ needs.resolve.outputs.channel }}
      TAU_DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      TAU_MACOS_PACKAGE_OUTPUT_ROOT: ${{ github.workspace }}/out/desktop/macos-${{ matrix.arch }}
    steps:
      - name: Checkout the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'

      - name: Check the packaging host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = "${{ matrix.machine }}"

      # The engine's darwin-arm64 binding installs with the workspace; its LGPL
      # source and relink kit comes from the engine pin's taucad/geospec release,
      # and package-macos-release refuses to package without it. The Intel
      # package ships no native GeoSpec engine, so it takes no kit.
      - name: Take the GeoSpec source and relink kit for the engine pin
        if: matrix.arch == 'arm64'
        id: geospec-kit
        uses: ./.github/actions/geospec-source-relink
        with:
          github-token: ${{ github.token }}

      # prepare-build123d-python resolves its wheels with uv, as on the
      # portable hosts.
      - name: Install uv
        run: |
          command -v uv || pipx install uv
          uv --version

      - name: Record package source identity
        shell: bash
        run: echo "TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # A throwaway keychain holds the Developer ID identity and the notary
      # profile for this job only; it is deleted in the last step.
      - name: Import the Developer ID identity and notary credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ENVIRONMENT: ${{ needs.resolve.outputs.channel == 'staging' && 'desktop-staging' || 'desktop' }}
        run: |
          set -euo pipefail
          names=(MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID)
          if [ "$TAU_DESKTOP_CHANNEL" = production ]; then
            names+=(APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID)
          fi
          for name in "${names[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the $ENVIRONMENT environment"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/tau-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          search_list=("$keychain")
          while IFS= read -r entry; do
            entry=${entry//\"/}
            search_list+=("${entry#"${entry%%[![:space:]]*}"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"
          security default-keychain -d user -s "$keychain"
          rm -f "$certificate"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE "s/.*\"(Developer ID Application: .*\($APPLE_TEAM_ID\))\".*/\1/p" | head -1)
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity for team $APPLE_TEAM_ID in the imported certificate"
            exit 1
          fi
          # package-macos.mts notarizes through this keychain profile.
          if [ "$TAU_DESKTOP_CHANNEL" = production ]; then
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key"
          xcrun notarytool store-credentials tau-notary --key "$api_key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --keychain "$keychain"
          rm -f "$api_key"
          fi
          {
            echo "TAU_CODESIGN_IDENTITY=$identity"
            echo "TAU_NOTARYTOOL_PROFILE=tau-notary"
            echo "TAU_SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Package and sign; notarize production
        env:
          TAU_GEOSPEC_SOURCE_RELINK_ARCHIVE: ${{ steps.geospec-kit.outputs.archive }}
        run: |
          config=()
          if [ "$TAU_DESKTOP_CHANNEL" = staging ]; then config+=(--configuration=staging); fi
          pnpm nx run desktop:${{ matrix.package-target }} --parallel=1 "${config[@]}"

      # Uploaded before verification so a failed verify leaves the signed app
      # for verify-desktop-macos.yml. Publishing still needs this whole job.
      - name: Upload the macOS archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-darwin-${{ matrix.arch }}
          path: ${{ env.TAU_MACOS_PACKAGE_OUTPUT_ROOT }}/Tau-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

      # The Tau PicoGK layer (charter W4, D13): the framework-dependent ReadyToRun
      # worker with the engine prepare-picogk-dotnet built and ad-hoc signed, as a
      # deterministic tar.gz digested with its record. Built before verification so
      # verify-macos-release launches it through the runtime archive's dotnet muxer;
      # picogk-layer-release and picogk-layer-mirror publish it by digest.
      - name: Build the Tau PicoGK layer
        if: matrix.arch == 'arm64'
        run: pnpm nx run picogk:prepare-layer

      - name: Upload the Tau PicoGK layer
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: picogk-layer-darwin-arm64
          path: |
            out/picogk-layer/darwin-arm64/tau-picogk-layer-darwin-arm64.tar.gz
            out/picogk-layer/darwin-arm64/tau-layer.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify the signed package
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          config=()
          if [ "$TAU_DESKTOP_CHANNEL" = staging ]; then config+=(--configuration=staging); fi
          pnpm nx run desktop:verify-macos-release "${config[@]}"

      - name: Delete the signing keychain
        if: always()
        run: |
          if [ -n "${TAU_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$TAU_SIGNING_KEYCHAIN" || true
          fi

  # One immutable GitHub Release per layer digest, created draft → upload →
  # publish and never clobbered (charter I13, DEL-20): a rerun or a later desktop
  # release that builds the same bytes finds the published release and only
  # re-verifies it. The composed tau-plugin.json is the pin a follow-up PR lands.
  picogk-layer-release:
    needs: [resolve, desktop-macos]
    if: needs.resolve.outputs.kind == 'desktop'
    name: Publish the Tau PicoGK layer release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release-pr
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: picogk-layer-darwin-arm64
          path: out/picogk-layer/darwin-arm64
      - name: Verify the layer against its record and compose the pin
        id: layer
        run: |
          set -euo pipefail
          node --import @oxc-node/core/register packages/plugins/picogk/scripts/compose-tau-plugin.mts \
            --layer out/picogk-layer/darwin-arm64/tau-layer.json \
            --archive out/picogk-layer/darwin-arm64/tau-picogk-layer-darwin-arm64.tar.gz \
            --write out/picogk-layer/tau-plugin.json --outputs >> "$GITHUB_OUTPUT"
      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Create, fill and publish the layer release
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          LAYER_TAG: ${{ steps.layer.outputs.tag }}
          LAYER_ASSET: ${{ steps.layer.outputs.asset }}
          LAYER_SHA256: ${{ steps.layer.outputs.sha256 }}
          LAYER_DIR: out/picogk-layer/darwin-arm64
        run: |
          set -euo pipefail
          # gh resolves a draft by its tag name too, so an interrupted run's draft is reused.
          if ! draft=$(gh release view "$LAYER_TAG" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/release-error"); then
            if ! grep -qi 'release not found' "$RUNNER_TEMP/release-error"; then cat "$RUNNER_TEMP/release-error" >&2; exit 1; fi
            gh release create "$LAYER_TAG" --draft --target "$(git rev-parse HEAD)" --latest=false \
              --title "$LAYER_TAG" \
              --notes "Tau PicoGK layer for darwin-arm64, sha256 $LAYER_SHA256. Immutable: pinned by the tau-plugin.json of @taucad/picogk."
            draft=true
          fi
          assets=$(gh release view "$LAYER_TAG" --json assets --jq '[.assets[].name] | join(" ")')
          for name in "$LAYER_ASSET" tau-layer.json; do
            if [[ " $assets " != *" $name "* ]]; then
              if [ "$draft" != true ]; then
                echo "::error::$LAYER_TAG is published without $name; published assets are never replaced."
                exit 1
              fi
              gh release upload "$LAYER_TAG" "$LAYER_DIR/$name"
            fi
          done
          gh release download "$LAYER_TAG" --pattern "$LAYER_ASSET" --dir "$RUNNER_TEMP/released"
          echo "$LAYER_SHA256  $RUNNER_TEMP/released/$LAYER_ASSET" | sha256sum --check --strict
          if [ "$draft" = true ]; then
            gh release edit "$LAYER_TAG" --draft=false --latest=false
          fi
          {
            echo "### Tau PicoGK layer"
            echo
            echo "- sha256 \`$LAYER_SHA256\`"
            echo "- release \`$LAYER_TAG\`"
            echo "- pin: the \`picogk-tau-plugin\` artifact (\`tau-plugin.json\`)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: picogk-tau-plugin
          path: out/picogk-layer/tau-plugin.json
          if-no-files-found: error
          retention-days: 30

  # The same bytes under `blobs/sha256/<hex>` of the public content bucket, the
  # digest-addressed layout cdn.tau.new serves (D2, D25). Written once with
  # If-None-Match and never replaced. The upload credential (go-live SEC-9) lives
  # on the `payloads` environment; until the operator sets it this job only
  # verifies the layer and says why it skipped.
  picogk-layer-mirror:
    needs: [resolve, desktop-macos]
    if: needs.resolve.outputs.kind == 'desktop'
    name: Mirror the Tau PicoGK layer to cdn.tau.new
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: payloads
      deployment: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PAYLOAD_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PAYLOAD_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      PAYLOAD_R2_ENDPOINT: ${{ vars.PAYLOAD_R2_ENDPOINT }}
      PAYLOAD_R2_BUCKET: ${{ vars.PAYLOAD_R2_BUCKET || 'tau-prod-content' }}
      PAYLOAD_CDN_BASE: https://cdn.tau.new/
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: picogk-layer-darwin-arm64
          path: layer
      - name: Verify the layer against its record
        id: layer
        run: |
          set -euo pipefail
          sha256=$(jq -r .sha256 layer/tau-layer.json)
          asset=$(jq -r .asset layer/tau-layer.json)
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] && [ "$asset" = tau-picogk-layer-darwin-arm64.tar.gz ]
          echo "$sha256  layer/$asset" | sha256sum --check --strict
          {
            echo "sha256=$sha256"
            echo "asset=$asset"
            echo "key=blobs/sha256/$sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Require the payload upload credential
        id: credential
        run: |
          missing=()
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY PAYLOAD_R2_ENDPOINT; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice title=Tau PicoGK layer not mirrored::The payloads environment lacks the secrets PAYLOAD_R2_ACCESS_KEY_ID and PAYLOAD_R2_SECRET_ACCESS_KEY or the variable PAYLOAD_R2_ENDPOINT (missing: ${missing[*]}; go-live SEC-9). The layer is published on its GitHub Release only; rerun this job once they are set."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the layer once under its digest
        if: steps.credential.outputs.available == 'true'
        env:
          KEY: ${{ steps.layer.outputs.key }}
          SHA256: ${{ steps.layer.outputs.sha256 }}
          ASSET: ${{ steps.layer.outputs.asset }}
        run: |
          set -euo pipefail
          s3() { aws --endpoint-url "$PAYLOAD_R2_ENDPOINT" s3api "$@"; }
          if s3 get-object --bucket "$PAYLOAD_R2_BUCKET" --key "$KEY" "$RUNNER_TEMP/existing" > /dev/null 2> "$RUNNER_TEMP/get-error"; then
            echo "$SHA256  $RUNNER_TEMP/existing" | sha256sum --check --strict
            echo "::notice::$KEY already holds these bytes; nothing written."
          else
            if ! grep -Eq '\((NoSuchKey|404)\)' "$RUNNER_TEMP/get-error"; then cat "$RUNNER_TEMP/get-error" >&2; exit 1; fi
            s3 put-object --bucket "$PAYLOAD_R2_BUCKET" --key "$KEY" --body "layer/$ASSET" \
              --content-type application/gzip --cache-control 'public, max-age=31536000, immutable' \
              --if-none-match '*' > /dev/null
          fi
      - name: Read the layer back from cdn.tau.new
        if: steps.credential.outputs.available == 'true'
        env:
          KEY: ${{ steps.layer.outputs.key }}
          SHA256: ${{ steps.layer.outputs.sha256 }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/public" "$PAYLOAD_CDN_BASE$KEY"
          echo "$SHA256  $RUNNER_TEMP/public" | sha256sum --check --strict

  desktop-portable:
    needs: [resolve, verify-app]
    if: needs.resolve.outputs.kind == 'desktop'
    name: Package ${{ matrix.platform }} (unsigned)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            target: package-linux
            archive: Tau-linux-x64.tar.gz
          - platform: win32-x64
            runner: windows-2025
            target: package-windows
            archive: Tau-win32-x64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      TAU_DESKTOP_CHANNEL: ${{ needs.resolve.outputs.channel }}
      TAU_DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      TAU_DESKTOP_PACKAGE_OUTPUT_ROOT: ${{ github.workspace }}/out/desktop/${{ matrix.platform }}
    steps:
      # Windows checkouts default to CRLF, which breaks the lockfile parse; keep
      # the committed bytes.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false

      - name: Checkout the release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      # prepare-build123d-python resolves its wheels with uv on both hosts;
      # prepare-git builds git on Linux against libcurl and zlib.
      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          pipx install uv
          uv --version
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
          fi

      # The Linux package seals the build123d closure it ships (charter W6), and its
      # seal step compiles bytecode inside the native sandbox.
      - name: Setup Linux sandbox prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-sandbox

      # On Windows the archive uses the inbox bsdtar,
      # which must come before Git Bash's GNU tar on PATH.
      - name: Record package source identity
        shell: bash
        run: echo "TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="/c/Windows/System32:$PATH"
          fi
          pnpm nx run "desktop:${{ matrix.target }}" --parallel=1

      - name: Upload the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ env.TAU_DESKTOP_PACKAGE_OUTPUT_ROOT }}/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  desktop-publish:
    needs: [resolve, desktop-macos, desktop-portable, source-kit]
    if: needs.resolve.outputs.kind == 'desktop'
    name: Attach immutable candidate assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release-pr
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: out/desktop/assets
          merge-multiple: true
      - name: Prepare the immutable candidate
        env:
          DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DESKTOP_ASSETS_DIR: out/desktop/assets
        run: |
          set -euo pipefail
          TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)
          export TAU_DESKTOP_SOURCE_SHA
          pnpm nx run desktop:publish --args=prepare
      # A rerun never replaces signed bytes under an existing release/version:
      # the draft keeps the first attempt's assets and different bytes refuse.
      - name: Attach the candidate to the draft release
        uses: ./.github/actions/release-assets
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          files: |
            out/desktop/assets/Tau-*
            out/desktop/assets/*.json
            out/desktop/assets/SHA256SUMS.txt
          github-token: ${{ steps.bot.outputs.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: out/desktop/assets/*.json
          retention-days: 30

  desktop-mirror:
    needs: [resolve, desktop-publish]
    name: Mirror candidate to R2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    environment:
      name: ${{ needs.resolve.outputs.channel == 'staging' && 'desktop-staging' || 'desktop' }}
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - name: Mirror and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DESKTOP_ASSETS_DIR: out/desktop/assets
          DESKTOP_R2_BUCKET: ${{ vars.DESKTOP_R2_BUCKET }}
          DESKTOP_R2_ENDPOINT: ${{ vars.DESKTOP_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)
          export TAU_DESKTOP_SOURCE_SHA
          gh release download "$DESKTOP_RELEASE_TAG" --dir "$DESKTOP_ASSETS_DIR" --pattern 'Tau-*' --pattern '*.json' --pattern SHA256SUMS.txt
          pnpm nx run desktop:publish --args=mirror
          jq '{tag, sourceCommit, verified: true}' "$DESKTOP_ASSETS_DIR/download.json" > "$DESKTOP_ASSETS_DIR/mirror-receipt.json"
      - name: Attach the mirror receipt
        uses: ./.github/actions/release-assets
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          files: out/desktop/assets/mirror-receipt.json
          github-token: ${{ github.token }}

  desktop-ota:
    needs: [resolve, desktop-mirror]
    name: Verify native macOS ${{ matrix.arch }} OTA replacement
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'
      # The candidate is still a draft, which this job's read-only token cannot
      # see: take the archive and download.json desktop-publish attached from the
      # run's artifacts, whose public R2 bytes desktop-mirror verified.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-darwin-${{ matrix.arch }}
          path: out/desktop/assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
          path: out/desktop/assets
      - name: Find a qualified older candidate or establish the first baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          TARGET: darwin-${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -f 'out/desktop/assets/Tau-macos-${{ matrix.arch }}.zip'
          jq --exit-status --arg tag "$TAG" '.tag == $tag' out/desktop/assets/download.json > /dev/null
          version=$(jq -r .version out/desktop/assets/download.json)
          prefix=desktop@
          if [ "$CHANNEL" = staging ]; then prefix=desktop-staging@; fi
          found=false
          origin=https://downloads.tau.new
          if [ "$CHANNEL" = staging ]; then origin=https://downloads.taucad.dev; fi
          status=$(curl --silent --show-error --retry 3 --output "$RUNNER_TEMP/current.json" --write-out '%{http_code}' "$origin/latest/download.json")
          if [ "$status" != 200 ] && [ "$status" != 404 ]; then echo "Current download pointer returned $status" >&2; exit 1; fi
          # Prefer the actual installed channel baseline. Only initial bootstrap
          # (or a retry of an already-promoted tag) falls back to mirrored candidates.
          if [ "$status" = 200 ]; then jq -r .tag "$RUNNER_TEMP/current.json" > "$RUNNER_TEMP/baselines"; else : > "$RUNNER_TEMP/baselines"; fi
          # Drafts are invisible to this token, so only published releases are listed.
          gh release list --limit 100 --json tagName --jq ".[] | select(.tagName | startswith(\"$prefix\")) | .tagName" >> "$RUNNER_TEMP/baselines"
          while IFS= read -r previous; do
            if [ "$previous" = "$TAG" ]; then continue; fi
            # A fresh directory per candidate, so nothing is downloaded over an earlier file.
            previous_dir=$(mktemp -d "$RUNNER_TEMP/previous.XXXXXX")
            if ! gh release download "$previous" --pattern mirror-receipt.json --dir "$previous_dir" 2> "$RUNNER_TEMP/previous-error"; then
              # Publication is not qualification: only completely mirrored candidates can bootstrap.
              if grep -Eq '^(no assets match|no assets to download$)' "$RUNNER_TEMP/previous-error"; then continue; fi
              cat "$RUNNER_TEMP/previous-error" >&2; exit 1
            fi
            gh release download "$previous" --pattern download.json --dir "$previous_dir"
            jq --exit-status --arg tag "$previous" '.verified == true and .tag == $tag' "$previous_dir/mirror-receipt.json" > /dev/null
            old=$(jq -r .version "$previous_dir/download.json")
            if [ "$old" = "$version" ] || [ "$(printf '%s\n%s\n' "$old" "$version" | sort -V | tail -1)" != "$version" ]; then continue; fi
            sha=$(jq -r .sourceCommit "$previous_dir/download.json")
            test "$sha" = "$(jq -r .sourceCommit "$previous_dir/mirror-receipt.json")"
            if ! git merge-base --is-ancestor "$sha" HEAD; then continue; fi
            # Older ARM-only releases cannot serve as an Intel baseline.
            if ! jq -e --arg target "$TARGET" '.assets[$target]' "$previous_dir/download.json" > /dev/null; then continue; fi
            url=$(jq -r --arg target "$TARGET" '.assets[$target].url' "$previous_dir/download.json")
            curl --fail --location --retry 3 "$url" --output "$RUNNER_TEMP/baseline.zip"
            expected=$(jq -r --arg target "$TARGET" '.assets[$target].sha256' "$previous_dir/download.json")
            printf '%s  %s\n' "$expected" "$RUNNER_TEMP/baseline.zip" | shasum -a 256 -c -
            found=true
            break
          done < "$RUNNER_TEMP/baselines"
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" = false ]; then
            echo 'First OTA-capable candidate established as baseline. Publish a second candidate to exercise native OTA; no live feed or website pointer was changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Observe the actual signed A to B update
        if: steps.baseline.outputs.found == 'true'
        env:
          DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DESKTOP_ASSETS_DIR: out/desktop/assets
          OTA_BASELINE_ZIP: ${{ runner.temp }}/baseline.zip
        run: |
          TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)
          export TAU_DESKTOP_SOURCE_SHA
          pnpm nx run desktop:verify-ota
      - name: Record architecture qualification
        env:
          ACCEPTED: ${{ steps.baseline.outputs.found }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: darwin-${{ matrix.arch }}
        run: |
          if [ "$ACCEPTED" = true ]; then test -f "out/desktop/assets/ota-receipt-$TARGET.json"; fi
          jq -n --arg tag "$TAG" --arg target "$TARGET" --argjson accepted "$ACCEPTED" \
            '{tag:$tag,target:$target,accepted:$accepted}' > "out/desktop/assets/ota-qualification-$TARGET.json"
      - name: Retain OTA receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ota-acceptance-${{ matrix.arch }}
          path: |
            out/desktop/assets/ota-receipt-*.json
            out/desktop/assets/ota-qualification-*.json
            ~/Library/Application Support/Tau Staging/ota-probe*.json
            ~/Library/Application Support/Tau Staging/logs/
            ~/Library/Application Support/Tau/ota-probe*.json
            ~/Library/Application Support/Tau/logs/
          if-no-files-found: ignore
          retention-days: 30

  desktop-promote:
    needs: [resolve, desktop-ota]
    name: Promote the tested channel release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: desktop-promotion-${{ needs.resolve.outputs.channel }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.resolve.outputs.channel == 'staging' && 'desktop-staging' || 'desktop' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nx
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ota-acceptance-*
          merge-multiple: true
          path: out/desktop/acceptance
      - name: Require qualification for both Mac architectures
        id: qualification
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          accepted=true
          for target in darwin-arm64 darwin-x64; do
            file=$(find out/desktop/acceptance -name "ota-qualification-$target.json")
            test -n "$file"
            jq -e --arg tag "$TAG" --arg target "$target" '.tag == $tag and .target == $target and (.accepted | type == "boolean")' "$file" > /dev/null
            if [ "$(jq -r .accepted "$file")" != true ]; then accepted=false; fi
          done
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          if [ "$accepted" = false ]; then echo 'Both Mac architectures need an older qualified baseline. No channel pointers changed.' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Gather the release metadata and OTA receipts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DESKTOP_ASSETS_DIR: out/desktop/assets
          ACCEPTED: ${{ steps.qualification.outputs.accepted }}
        run: |
          set -euo pipefail
          mkdir -p "$DESKTOP_ASSETS_DIR" out/desktop/receipts
          gh release download "$DESKTOP_RELEASE_TAG" --dir "$DESKTOP_ASSETS_DIR" --pattern 'desktop-update-*.json' --pattern download.json
          if [ "$ACCEPTED" = true ]; then
            for target in darwin-arm64 darwin-x64; do
              receipt=$(find out/desktop/acceptance -name "ota-receipt-$target.json")
              test -n "$receipt"
              cp "$receipt" "out/desktop/receipts/ota-receipt-$target.json"
              cp "$receipt" "$DESKTOP_ASSETS_DIR/ota-receipt-$target.json"
            done
          fi
      # The draft becomes public and immutable here, with its OTA receipts when
      # both architectures qualified; a first baseline is published without
      # them so the next candidate can find it. Publishing precedes the R2
      # promotion because installed apps link the release page of the update.
      - name: Attach the OTA receipts and publish the release
        uses: ./.github/actions/release-assets
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          files: ${{ steps.qualification.outputs.accepted == 'true' && 'out/desktop/receipts/ota-receipt-*.json' || '' }}
          publish: 'true'
          latest: ${{ steps.qualification.outputs.accepted == 'true' && needs.resolve.outputs.channel == 'production' }}
          github-token: ${{ github.token }}
      - name: Promote the R2 pointers
        if: steps.qualification.outputs.accepted == 'true'
        env:
          DESKTOP_RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DESKTOP_ASSETS_DIR: out/desktop/assets
          DESKTOP_R2_BUCKET: ${{ vars.DESKTOP_R2_BUCKET }}
          DESKTOP_R2_ENDPOINT: ${{ vars.DESKTOP_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)
          export TAU_DESKTOP_SOURCE_SHA
          pnpm nx run desktop:publish --args=promote

  production-api:
    needs: [resolve, verify-app, app-release]
    if: >-
      github.event_name == 'push' && needs.resolve.outputs.project == 'api' &&
      github.ref == format('refs/tags/{0}', needs.resolve.outputs.tag)
    name: Production API
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      app: api
    secrets: inherit

  # The UI serves OCCT compiled into the GeoSpec engine, so it ships only once
  # `source-kit` has attached that engine's source and relink kit.
  production-ui:
    needs: [resolve, verify-app, source-kit, app-release]
    if: >-
      github.event_name == 'push' && needs.resolve.outputs.project == 'ui' &&
      github.ref == format('refs/tags/{0}', needs.resolve.outputs.tag)
    name: Production UI
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-ui.yml
    with:
      environment: production
    secrets: inherit

  production-docs:
    needs: [resolve, verify-app, app-release]
    if: >-
      github.event_name == 'push' && needs.resolve.outputs.project == 'ui' &&
      github.ref == format('refs/tags/{0}', needs.resolve.outputs.tag)
    name: Production docs
    # `deploy-docs.yml` asks for `actions: read` for its staging supersede check.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-docs.yml
    with:
      environment: production
      tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit
