# Staging desktop candidates. Each green `ci.yml` push run on `main` that affects `desktop`
# creates a candidate that release-build.yml packages for Apple silicon only; the nightly
# schedule (and a dispatch that asks for it) creates one that also packages Intel, so the x64
# archive and its OTA replacement are still exercised once a day while `main` pushes cost one
# macOS packaging job each. The tag records which: an annotated tag whose message carries a
# `Mac architectures: arm64 x64` line is a full candidate, a lightweight tag is arm64 only.
# Production `desktop@*` tags always package both.
name: Release desktop to staging
run-name: Release desktop to staging

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      intel:
        description: 'Also package and qualify the Intel (x64) archive'
        type: boolean
        default: true
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-desktop-staging
  cancel-in-progress: false

jobs:
  prerelease:
    name: Create the staging desktop prerelease
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    environment:
      name: release-pr
      deployment: false
    steps:
      - name: Find the newest main commit with green CI
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          STAGING_SUPPORT_SHA: ef81d9124c75b29e7115da226b3c616e0df2d43a
        run: |
          set -euo pipefail
          # Run listings come back in an unreliable order (a re-run keeps its
          # old creation time), so walk main's history newest first and ask
          # each commit whether its CI push run succeeded.
          sha=$TRIGGER_SHA
          if [ -z "$sha" ]; then
          for candidate in $(gh api "repos/${GH_REPO}/commits?sha=main&per_page=50" --jq '.[].sha'); do
            green=$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${candidate}&branch=main&event=push" --jq 'any(.workflow_runs[]; .conclusion == "success")')
            if [ "$green" = true ]; then
              sha=$candidate
              break
            fi
          done
          fi
          if [ -z "$sha" ]; then
            echo "::error::No ci.yml push run on main has succeeded yet."
            exit 1
          fi
          # Release build runs from the tag's own commit. Require #697, which
          # builds draft candidates from tag pushes and supplies release-assets.
          status=$(gh api "repos/${GH_REPO}/compare/${STAGING_SUPPORT_SHA}...${sha}" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::The newest main commit with green CI, $sha, predates staging release support ($STAGING_SUPPORT_SHA). Run this again once main CI is green on a newer commit."
            exit 1
          fi
          echo "Releasing $sha, the newest main commit with green CI."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require OTA-capable source
        run: test -f apps/desktop/src/main/ota-probe.ts && test -f apps/desktop/scripts/publish-desktop.mts

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Skip duplicate, obsolete or unaffected automatic candidates
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ steps.target.outputs.sha }}
          EVENT: ${{ github.event_name }}
          DISPATCH_INTEL: ${{ inputs.intel }}
        run: |
          set -euo pipefail
          intel=false
          if [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ "$DISPATCH_INTEL" = true ]; }; then intel=true; fi
          echo "intel=$intel" >> "$GITHUB_OUTPUT"
          releases=$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("desktop-staging@")) | .tagName')
          previous=$(head -n 1 <<< "$releases")
          # The nightly compares with the newest full candidate, so it skips only when Intel already
          # shipped this desktop.
          if [ "$EVENT" = schedule ]; then
            previous=''
            for tag in $(head -n 30 <<< "$releases"); do
              object=$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object | "\(.type) \(.sha)"')
              [ "${object%% *}" = tag ] || continue
              message=$(gh api "repos/${GH_REPO}/git/tags/${object#* }" --jq .message)
              if grep -qx 'Mac architectures: arm64 x64' <<< "$message"; then
                previous=$tag
                break
              fi
            done
          fi
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$previous" ]; then
            base=$(git rev-parse "$previous^{commit}")
            if [ "$base" = "$TARGET" ] || ! git merge-base --is-ancestor "$base" "$TARGET"; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Nx may log before its final JSON line. Invalid output must fail,
            # not silently count as an unaffected desktop.
            pnpm nx show projects --affected --base="$base" --head="$TARGET" --json | tail -1 > "$RUNNER_TEMP/affected.json"
            jq -e 'type == "array" and all(.[]; type == "string")' "$RUNNER_TEMP/affected.json" > /dev/null
            if ! jq -e 'index("desktop")' "$RUNNER_TEMP/affected.json" > /dev/null; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Create the tag and prerelease
        if: steps.selected.outputs.release == 'true'
        id: release
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ steps.target.outputs.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          INTEL: ${{ steps.selected.outputs.intel }}
        run: |
          set -euo pipefail
          version=$(jq -r .version apps/desktop/package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::apps/desktop/package.json version $version is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          tag="desktop-staging@${version}-staging.${RUN_NUMBER}"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Staging build of the Tau desktop app from \`${TARGET}\` on \`main\`.

          It signs in to and works against https://taucad.dev, never production, and follows its isolated staging update feed. macOS is Developer ID signed without notarization. The channel feed advances only after a native OTA acceptance test.
          NOTES
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          # A draft, because a published release is immutable (go-live DEL-20):
          # release-build.yml attaches the archives and publishes it. The tag's
          # push, not the draft, starts release-build.yml.
          gh release create "$tag" --draft --target "$TARGET" --title "Tau desktop staging ${version} (build ${RUN_NUMBER})" \
            --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          # release-build.yml reads the architectures from the tag: a full candidate's tag is
          # annotated with the line it looks for, an arm64-only candidate's is lightweight.
          ref_sha=$TARGET
          if [ "$INTEL" = true ]; then
            ref_sha=$(gh api "repos/$GH_REPO/git/tags" -f tag="$tag" -f object="$TARGET" -f type=commit \
              -f message="Mac architectures: arm64 x64" --jq .sha)
          fi
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$ref_sha" --silent
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: steps.selected.outputs.release == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ARCHES: ${{ steps.selected.outputs.intel == 'true' && 'Apple silicon and Intel' || 'Apple silicon only' }}
        run: |
          {
            echo "Created the draft prerelease $TAG and its tag ($ARCHES)."
            echo "**Release build** packages it, attaches the archives and publishes it once main CI is green on this commit."
          } >> "$GITHUB_STEP_SUMMARY"
