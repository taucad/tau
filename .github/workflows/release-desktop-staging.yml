name: Release desktop to staging
run-name: Release desktop to staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-desktop-staging
  cancel-in-progress: false

jobs:
  prerelease:
    name: Create the staging desktop prerelease
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    environment:
      name: release-pr
      deployment: false
    steps:
      - name: Find the newest main commit with green CI
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          STAGING_SUPPORT_SHA: cd8f118318e7720aeace25d6871c6b478f352673
        run: |
          set -euo pipefail
          # Run listings come back in an unreliable order (a re-run keeps its
          # old creation time), so walk main's history newest first and ask
          # each commit whether its CI push run succeeded.
          sha=$TRIGGER_SHA
          if [ -z "$sha" ]; then
          for candidate in $(gh api "repos/${GH_REPO}/commits?sha=main&per_page=50" --jq '.[].sha'); do
            green=$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${candidate}&branch=main&event=push" --jq 'any(.workflow_runs[]; .conclusion == "success")')
            if [ "$green" = true ]; then
              sha=$candidate
              break
            fi
          done
          fi
          if [ -z "$sha" ]; then
            echo "::error::No ci.yml push run on main has succeeded yet."
            exit 1
          fi
          # Release build runs from the tag's own commit, so it must already
          # build staging releases: the first such main commit is #331.
          status=$(gh api "repos/${GH_REPO}/compare/${STAGING_SUPPORT_SHA}...${sha}" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::The newest main commit with green CI, $sha, predates staging release support ($STAGING_SUPPORT_SHA). Run this again once main CI is green on a newer commit."
            exit 1
          fi
          echo "Releasing $sha, the newest main commit with green CI."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require OTA-capable source
        run: test -f apps/desktop/src/main/ota-probe.ts && test -f apps/desktop/scripts/publish-desktop.mts

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Skip duplicate, obsolete or unaffected automatic candidates
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ steps.target.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          previous=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("desktop-staging@"))][0].tagName // empty')
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$previous" ]; then
            base=$(git rev-parse "$previous^{commit}")
            if [ "$base" = "$TARGET" ] || ! git merge-base --is-ancestor "$base" "$TARGET"; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pnpm nx show projects --affected --base="$base" --head="$TARGET" --json > "$RUNNER_TEMP/affected.json"
            if ! jq -e 'index("desktop")' "$RUNNER_TEMP/affected.json" > /dev/null; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Create the tag and prerelease
        if: steps.selected.outputs.release == 'true'
        id: release
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ steps.target.outputs.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(jq -r .version apps/desktop/package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::apps/desktop/package.json version $version is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          tag="desktop-staging@${version}-staging.${RUN_NUMBER}"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Staging build of the Tau desktop app from \`${TARGET}\` on \`main\`.

          It signs in to and works against https://taucad.dev, never production, and follows its isolated staging update feed. macOS is Developer ID signed without notarization. The channel feed advances only after a native OTA acceptance test.
          NOTES
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$TARGET" --title "Tau desktop staging ${version} (build ${RUN_NUMBER})" \
            --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: steps.selected.outputs.release == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "Created the prerelease [$TAG](https://github.com/$REPOSITORY/releases/tag/$(jq -rn --arg t "$TAG" '$t | @uri'))."
            echo "**Release build** packages it and attaches the archives once main CI is green on this commit."
          } >> "$GITHUB_STEP_SUMMARY"
