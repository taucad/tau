name: Release gate

# The release gate (CI throughput review RG-1): fresh, uncached evidence on the exact commit being shipped,
# in place of the whole-graph sweep the nightlies used to give. The merge queue runs only what a landing
# affects and reads the remote cache; this gate runs every project with no cache at all, so an input Nx does
# not see (a cross-root read, an undeclared environment variable, a stale cached output) cannot carry a
# green verdict to users.
#
# - Sweep: every project's `lint`, `typecheck`, `build` (with `size` and `check-desktop-payload`),
#   package checks and `test`, in the `ci.yml` affected lanes' shards, with `--skip-nx-cache` and no
#   remote cache server. `test` excludes `tag:scope:api` (it needs PostgreSQL and MinIO, which only the
#   `ci.yml` API job provides) and `tag:ci:quarantined`, as the `ci.yml` lanes do.
# - Formal matrix: `formal-nightly.yml` for every `formal:nightly` project and target, seeded by this run's
#   id, so each gate run explores a fresh seed and prints it for replay.
# - Cross-root reads: `scripts:validate-cross-root-reads`, which also runs in every `ci.yml` workspace job.
# - API tests (C2a): every `tag:scope:api` project's `test` (without `tag:ci:quarantined`) against the PostgreSQL,
#   Redis and MinIO containers `ci.yml`'s API job starts, after the protected migration job. Their credentials
#   are the local development values in `apps/api/.env.example`; no secret is read.
# - End-to-end (C2b): every ratcheted suite, one row per entry of a `test:e2e:queue` target's `dependsOn`, run as
#   `ci.yml`'s `e2e-queue` rows run them, for every project instead of the affected ones. `tag:ci:quarantined`
#   projects are left out, as the sweep leaves out their `test`.
#
# Every workflow the gate calls takes an `uncached` input, and the gate passes `true`: a caller's workflow-level
# `env` (this file's `NX_SKIP_NX_CACHE`) does not reach a called workflow, so the called workflow sets
# `NX_SKIP_NX_CACHE` and omits the remote cache server itself.
# - Viewer parity: `viewer-parity.yml` with `uncached`, every fixture captured in its eight shards and gated once,
#   from GLBs generated on this commit (VP-1: the merge queue no longer runs it; a pull request runs it on its own
#   inputs).
#
# When (event-driven, nothing waits on a timer):
# - A desktop candidate: when `release-build.yml` is requested for a `desktop-staging@*` or `desktop@*` tag,
#   the gate starts on that tag's commit, alongside the build. One gate per channel runs at a time and a
#   newer candidate cancels the older one's gate, so only the newest candidate is ever being gated; a
#   cancelled candidate gets a gate on demand if it is ever promoted. UI and API release tags start no
#   gate: `release-build.yml` deploys them ungated.
# - On demand: `desktop-route-promotion.yml` (promote-routes, either channel) and `deploy-production.yml`
#   (a forward deploy) read the commit's verdict (`.github/actions/release-gate-verdict`). Green proceeds;
#   running or red blocks and names the run; none dispatches this workflow from `main` for the commit and
#   blocks naming it, and the operator dispatches the promotion again once it passes. A renewal, a rollback
#   and a redeploy never read it. An operator can dispatch it from `main` for any commit, too.
# - On a period (C3): three times a day, on `main`'s head. A head that already has a green verdict ends at `reuse`.
#   The scheduled runs share a group of their own that cancels nothing, so a scheduled run never cancels a
#   candidate's gate or a dispatch, and is never cancelled by one. A red scheduled run is reported by
#   `nightly-watchdog.yml`, which watches every workflow with a `schedule` (scripts/src/nightly-watchdog.ts).
#
# Each run is named `Release gate <sha>` and records one verdict job, `Release gate verdict (<sha>)`.
#
# Trust: a `workflow_run` run always runs `main`'s copy of this file, a scheduled run runs `main`'s copy on
# `main`'s head, and a dispatch counts only from `main`, so a changed copy of the gate on another branch can never
# record a verdict a promotion reads.
#
# A commit gates once: the `reuse` job ends the run early when a trusted green verdict for the commit
# exists, and dispatched runs on one commit queue behind each other.
run-name: Release gate ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit sha to gate
        type: string
        required: true
  workflow_run:
    workflows: ['Release build']
    types: [requested]
  # C3: the head of `main`, at off-peak minutes clear of :00, :30 and 06:00 to 09:00 Pacific, each finished
  # before the 18:30 watchdog reads it.
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC
    - cron: '23 10 * * *' # 10:23 UTC
    - cron: '47 21 * * *' # 21:47 UTC

# A candidate's gate shares its channel's group and the newest candidate wins; a `workflow_run` for any other
# tag (a UI or API release) runs no job and gets a group of its own, so it cancels nothing; a dispatch queues
# per commit; a scheduled run queues in the scheduled group and cancels nothing.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_run' && (
      startsWith(github.event.workflow_run.head_branch, 'desktop-staging@') && 'release-gate-candidate-staging' ||
      startsWith(github.event.workflow_run.head_branch, 'desktop@') && 'release-gate-candidate-production' ||
      format('release-gate-other-{0}', github.run_id)) ||
      github.event_name == 'schedule' && 'release-gate-scheduled' ||
      format('release-gate-{0}', inputs.ref) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

permissions:
  contents: read
  actions: read

env:
  # No remote cache server and no local cache reads: every task runs.
  NX_SKIP_NX_CACHE: 'true'
  NX_NO_CLOUD: 'true'
  # The UI build and tests read the same local service addresses as ci.yml; without them the prerender and the
  # flag constants refuse the environment (first gate run 44109171015: `ui:build`, `ui:build:serve`, `ui:test`).
  TAU_API_URL: http://localhost:4000
  TAU_WEBSOCKET_URL: ws://localhost:4001
  TAU_FRONTEND_URL: http://localhost:3000

jobs:
  reuse:
    name: Find a release gate verdict for this commit
    # A release build of a UI or API tag gates nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.event.workflow_run.head_branch, 'desktop-staging@') ||
      startsWith(github.event.workflow_run.head_branch, 'desktop@')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Name the commit
        id: ref
        env:
          REF: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full commit sha: $REF"; exit 1; }
          echo "Gating ${REF}."
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Find a green verdict for the commit
        id: find
        uses: ./.github/actions/release-gate-verdict
        with:
          sha: ${{ steps.ref.outputs.ref }}
          github-token: ${{ github.token }}

  sweep:
    name: Release sweep (${{ matrix.lane }})
    needs: [reuse]
    if: needs.reuse.result == 'success' && needs.reuse.outputs.run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [lint, typecheck, build, pkgcheck-1, pkgcheck-2, pkgcheck-3, test-1, test-2, test-3, cross-root-reads]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.reuse.outputs.ref }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Setup Linux sandbox prerequisites
        if: startsWith(matrix.lane, 'test-')
        uses: ./.github/actions/setup-linux-sandbox

      - name: Find the lane's pinned downloads
        id: pins
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          graph="$RUNNER_TEMP/lane-graph.json"
          case "$LANE" in
            lint) pnpm nx run-many -t lint --graph="$graph" > /dev/null ;;
            typecheck) pnpm nx run-many -t typecheck --graph="$graph" > /dev/null ;;
            build) pnpm nx run-many -t build size check-desktop-payload --graph="$graph" > /dev/null ;;
            pkgcheck-*) pnpm nx run-many -t pkgcheck audit-public-surface readme-quickstart --graph="$graph" > /dev/null ;;
            test-*) pnpm nx run-many -t test --exclude tag:scope:api,tag:ci:quarantined --graph="$graph" > /dev/null ;;
            cross-root-reads) exit 0 ;;
            *) echo "Unknown lane $LANE" >&2; exit 1 ;;
          esac
          node scripts/src/ci-pinned-downloads.ts --graph "$graph" >> "$GITHUB_OUTPUT"

      - name: Restore the Python kernel seeds
        if: steps.pins.outputs.kernel-seeds-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pins.outputs.kernel-seeds-path }}
          key: ${{ steps.pins.outputs.kernel-seeds-key }}

      - name: Restore the wasi-sdk archive
        if: steps.pins.outputs.wasi-sdk-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pins.outputs.wasi-sdk-path }}
          key: ${{ steps.pins.outputs.wasi-sdk-key }}

      # The same shards and `--parallel` caps as the `ci.yml` affected lanes (see the reasons there: two of
      # ui's lint, typecheck or build exhaust a hosted runner), over every project instead of the affected ones.
      - name: Run the lane's tasks
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$LANE" in
            lint) pnpm nx run-many -t lint --parallel=1 ;;
            typecheck) pnpm nx run-many -t typecheck --parallel=1 ;;
            build) pnpm nx run-many -t build size check-desktop-payload --parallel=1 ;;
            pkgcheck-*)
              pnpm nx run-many -t pkgcheck audit-public-surface readme-quickstart --graph="$RUNNER_TEMP/pkgcheck-graph.json" > /dev/null
              projects=$(jq -c '
                [.tasks.tasks[] | select(.target.target | IN("pkgcheck", "audit-public-surface", "readme-quickstart")) | .target.project]
                | unique' "$RUNNER_TEMP/pkgcheck-graph.json")
              shard=$(echo "$projects" | node scripts/src/test-shard-dealer.ts --shard "${LANE#pkgcheck-}" --shards 3 \
                --durations scripts/src/pkgcheck-shard-durations.json)
              if [ -z "$shard" ]; then
                echo "No package checks in this shard."
                exit 0
              fi
              echo "Shard projects: $shard"
              # The builds run serially first, so the checks (three at a time) never race a build.
              built=$(jq -r --arg shard "$shard" '
                ($shard | split(",")) as $mine
                | [.tasks.tasks[] | select(.target.target == "pkgcheck") | .target.project]
                | unique | map(select(IN($mine[]))) | join(",")' "$RUNNER_TEMP/pkgcheck-graph.json")
              if [ -n "$built" ]; then
                pnpm nx run-many -t build --projects "$built" --parallel=1
              fi
              pnpm nx run-many -t pkgcheck audit-public-surface readme-quickstart --projects "$shard" --parallel=3
              ;;
            test-*)
              pnpm nx run-many -t test --exclude tag:scope:api,tag:ci:quarantined --graph="$RUNNER_TEMP/test-graph.json" > /dev/null
              projects=$(jq -c '
                .graph.nodes as $nodes
                | [.tasks.tasks[] | select(.target.target == "test") | .target.project] | unique
                | map(select($nodes[.].data.tags // [] | any(. == "scope:api" or . == "ci:quarantined") | not))' "$RUNNER_TEMP/test-graph.json")
              shard=$(echo "$projects" | node scripts/src/test-shard-dealer.ts --shard "${LANE#test-}" --shards 3)
              if [ -z "$shard" ]; then
                echo "No test projects in this shard."
                exit 0
              fi
              echo "Shard projects: $shard"
              pnpm nx run-many -t test --projects "$shard" --parallel=1 --outputStyle=static
              ;;
            cross-root-reads) pnpm nx run scripts:validate-cross-root-reads ;;
            *) echo "Unknown lane $LANE" >&2; exit 1 ;;
          esac

  formal:
    name: Release formal matrix
    needs: [reuse]
    if: needs.reuse.result == 'success' && needs.reuse.outputs.run-id == ''
    permissions: # Required for nrwl/nx-set-shas (in setup-nx) to read workflow runs
      actions: 'read'
      contents: 'read'
    uses: ./.github/workflows/formal-nightly.yml
    with:
      ref: ${{ needs.reuse.outputs.ref }}
      seed: ${{ github.run_id }}
      uncached: true

  # C2a: the suites the sweep leaves out because they need services, as `ci.yml`'s `api` job runs them, but for
  # every `tag:scope:api` project instead of the affected ones. Only the `test` targets: the service-backed
  # `test:server-modes`, `test:git`, `test:models` and `test:billing-composition` steps stay `ci.yml`'s.
  api:
    name: Release API tests (Postgres + MinIO)
    needs: [reuse]
    if: needs.reuse.result == 'success' && needs.reuse.outputs.run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.reuse.outputs.ref }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Prepare API env file
        run: cp apps/api/.env.example apps/api/.env

      - name: Start Postgres + Redis + MinIO
        run: docker compose -f infra/docker-compose.yml up -d postgres redis minio minio-bootstrap

      - name: MinIO smoke (seed + RW)
        run: bash infra/docker-compose.test.sh

      - name: Apply the protected migration job
        run: BILLING_DATABASE_URL=postgresql://dev_user:dev_password@localhost:5432/tau_dev pnpm nx run-many -t db-migrate --projects tag:scope:api

      # One suite at a time on the one PostgreSQL, as in `ci.yml` (DC-2).
      - name: Run API suites (real PostgreSQL + MinIO)
        env:
          DATABASE_URL: postgresql://dev_user:dev_password@localhost:5432/tau_dev
        run: pnpm nx run-many -t test --projects tag:scope:api --exclude tag:ci:quarantined --parallel=1 --outputStyle=static

  # C2b: one row per ratcheted end-to-end suite of every project, read from the graph as `ci.yml`'s plan reads
  # the affected ones, with the same refusals: an entry that is not a target of its project, or a suite that
  # declares shards, fails the plan rather than drop a suite. No suite at all fails it too.
  e2e-plan:
    name: List the release end-to-end suites
    needs: [reuse]
    if: needs.reuse.result == 'success' && needs.reuse.outputs.run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.reuse.outputs.ref }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Write the project graph
        run: pnpm nx graph --file="$RUNNER_TEMP/graph.json" > /dev/null

      - name: List the suites
        id: suites
        run: |
          set -euo pipefail
          suites=$(jq -c '
            .graph.nodes as $nodes
            | [$nodes | keys[] as $project
                | $nodes[$project].data as $data
                | select($data.tags // [] | index(["ci:quarantined"]) | not)
                | $data.targets as $targets
                | select($targets["test:e2e:queue"] != null)
                | $targets["test:e2e:queue"].dependsOn // [] | .[]
                | if type != "string" or ($targets[.] == null) then
                    error("\($project):test:e2e:queue depends on \(tojson), which is not a target of \($project)")
                  elif ($targets[.].metadata.shards // 1) > 1 then
                    error("\($project):\(.) declares shards; the release end-to-end leg runs a suite as one job")
                  else {project: $project, target: ., label: "\($project) \(.)", slug: ("\($project)-\(.)" | gsub(":"; "-"))} end]' \
            "$RUNNER_TEMP/graph.json")
          echo "Release end-to-end suites: $suites"
          if [ "$(jq 'length' <<< "$suites")" -eq 0 ]; then
            echo "::error::No project has a ratcheted end-to-end suite."
            exit 1
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  # Each row is `ci.yml`'s `e2e-queue` row for that suite: the same browsers, Pandoc, sandbox, software Vulkan, xvfb
  # and chat log validation, on the gated commit.
  e2e:
    name: Release end-to-end (${{ matrix.suite.label }})
    needs: [reuse, e2e-plan]
    if: needs.e2e-plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.e2e-plan.outputs.suites) }}
    env:
      # The suites that open no chat, so capture no chat log for the empty-capture rule to find: e2e-nightly.yml's list.
      SUITES_WITHOUT_CHAT: '["test:e2e:non-isolated", "test:e2e:deploy-skew", "test:e2e:service-worker", "test:e2e:filesystem-scenarios"]'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.reuse.outputs.ref }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      - name: Install browsers for Vitest Browser (system dependencies)
        uses: ./.github/actions/apt-install
        with:
          playwright-browsers: chromium firefox webkit
      - name: Install browsers for Vitest Browser
        run: pnpm exec playwright install chromium firefox webkit

      - name: Install Pandoc for reference conversion
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.12/pandoc-3.12-1-amd64.deb
          echo "91903ff19f1b1d4db4129797c7e18f71212990d7394fcff1787719aebf04e372  $RUNNER_TEMP/pandoc.deb" | sha256sum --check --quiet
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"

      - name: Setup Linux sandbox prerequisites
        uses: ./.github/actions/setup-linux-sandbox

      - name: Install a software Vulkan driver for native rendering
        uses: ./.github/actions/apt-install
        with:
          packages: mesa-vulkan-drivers
      - name: Select the software Vulkan driver
        run: echo 'VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json' >> "$GITHUB_ENV"

      - name: Prepare API env file
        run: cp apps/api/.env.example apps/api/.env

      - name: Run the end-to-end suite
        timeout-minutes: 60
        env:
          TAU_E2E_WEBGPU_PROFILE: software
          PROJECT: ${{ matrix.suite.project }}
          TARGET: ${{ matrix.suite.target }}
        run: xvfb-run --auto-servernum pnpm nx run-many -t "$TARGET" --projects "$PROJECT" --parallel=1 --outputStyle=stream

      - name: Setup formal toolchains
        if: ${{ !cancelled() && !contains(fromJSON(env.SUITES_WITHOUT_CHAT), matrix.suite.target) }}
        uses: ./.github/actions/setup-formal
        with:
          tools: tlc

      - name: Validate captured chat logs
        if: ${{ !cancelled() && !contains(fromJSON(env.SUITES_WITHOUT_CHAT), matrix.suite.target) }}
        env:
          PROJECT: ${{ matrix.suite.project }}
        run: pnpm nx run-many -t formal:logs --projects "$PROJECT"

      - name: Check workspace root hygiene
        if: always()
        run: pnpm nx run scripts:validate-workspace-root

      - name: Upload Vitest Browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-e2e-diagnostics-${{ matrix.suite.slug }}
          path: |
            out/test-results/vitest-browser
            out/test-results/filesystem-scenarios
            out/test-results/chat-logs
            out/reports/formal
          if-no-files-found: ignore
          retention-days: 7

  # Viewer parity (VP-1): the merge queue never runs it, and a pull request runs it only when its own diff touches a
  # parity input, so every candidate captures and gates every fixture here, from GLBs generated fresh from this commit
  # (`uncached`: no Actions cache read or saved, no Nx cache, no secrets).
  viewer-parity:
    name: Release viewer parity
    needs: [reuse]
    if: needs.reuse.result == 'success' && needs.reuse.outputs.run-id == ''
    permissions:
      contents: 'read'
    uses: ./.github/workflows/viewer-parity.yml
    with:
      ref: ${{ needs.reuse.outputs.ref }}
      uncached: true

  # The verdict a promotion reads. Its name carries the commit, which is what `release-gate-verdict` looks for;
  # it passes on a reused verdict, or when the sweep, the formal matrix, the API tests, the end-to-end rows and
  # viewer parity all passed, and fails otherwise.
  verdict:
    name: Release gate verdict (${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }})
    needs: [reuse, sweep, formal, api, e2e, viewer-parity]
    if: ${{ !cancelled() && needs.reuse.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every leg
        env:
          REUSE_RESULT: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.run-id }}
          SWEEP_RESULT: ${{ needs.sweep.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          API_RESULT: ${{ needs.api.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          VIEWER_PARITY_RESULT: ${{ needs.viewer-parity.result }}
        run: |
          set -euo pipefail
          test "$REUSE_RESULT" = success
          if [ -n "$REUSED" ]; then
            echo "Release gate passed on this commit in run $REUSED."
            exit 0
          fi
          test "$SWEEP_RESULT" = success || { echo "::error::The release sweep did not pass ($SWEEP_RESULT)."; exit 1; }
          test "$FORMAL_RESULT" = success || { echo "::error::The release formal matrix did not pass ($FORMAL_RESULT)."; exit 1; }
          test "$API_RESULT" = success || { echo "::error::The release API tests did not pass ($API_RESULT)."; exit 1; }
          test "$E2E_RESULT" = success || { echo "::error::The release end-to-end rows did not pass ($E2E_RESULT)."; exit 1; }
          test "$VIEWER_PARITY_RESULT" = success || { echo "::error::Release viewer parity did not pass ($VIEWER_PARITY_RESULT)."; exit 1; }
          echo "Release gate passed."
