# Application releases: the standing release pull request and the GitHub
# Releases its merge creates.
#
# Tau's deployable applications (projects tagged `release:app`: the UI, the API
# and the desktop app) are versioned by `scripts/src/release-apps.ts` from the
# conventional commits that touched each application's dependency closure since
# its last `<project>@<version>` tag. npm packages are not released here: the
# package train keeps Nx version plans and `publish.yml`, which CI no longer
# triggers.
#
# On every push to `main`:
#   - A push that is not a release commit regenerates the release commit on
#     `release/next` and upserts one pull request titled with its subject. With
#     nothing to release, the pull request is closed and the branch deleted.
#   - A release commit (subject `chore(release): <project> v<version>, …`, the
#     squash merge of that pull request) creates one tag and one GitHub Release
#     per application it versions. Creating the release is what starts
#     `release-build.yml`, which builds and verifies what the release ships.
#
# Merging the release pull request is the release act. Production is a separate,
# explicit act: `deploy-production.yml`, dispatched from GitHub or the Command
# Center with a release tag.
#
# Modelled on taucad/nanoraster's `release-pr.yml`. Every write uses a minted
# `tau-release-bot` token: the default GITHUB_TOKEN can neither trigger CI on the
# pull request nor start `release-build.yml` from the releases it creates.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release-commit: ${{ steps.subject.outputs.release-commit }}
    steps:
      - name: Classify the head commit
        id: subject
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          first_line=${SUBJECT%%$'\n'*}
          # The application release subject names a project before its version;
          # the npm train's `chore(release): v<version>` does not match.
          if [[ "$first_line" =~ ^chore\(release\):\ [a-z0-9-]+\ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "release-commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "release-commit=false" >> "$GITHUB_OUTPUT"
          fi

  publish-releases:
    needs: classify
    if: needs.classify.outputs.release-commit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release-pr
      deployment: false
    steps:
      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Create a tag and GitHub Release per application
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/src/release-apps.ts tags > "$RUNNER_TEMP/tags.json"
          count=$(jq length "$RUNNER_TEMP/tags.json")
          if [ "$count" -eq 0 ]; then
            echo "::warning::This release commit introduces no untagged application version."
            exit 0
          fi
          for index in $(seq 0 $((count - 1))); do
            tag=$(jq -r ".[$index].tag" "$RUNNER_TEMP/tags.json")
            jq -r ".[$index].notes" "$RUNNER_TEMP/tags.json" > "$RUNNER_TEMP/notes.md"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already has a GitHub Release"
              continue
            fi
            # Only a desktop release becomes "latest", and only once
            # release-build.yml has attached its assets: the desktop updater
            # reads its feed from the latest release.
            gh release create "$tag" --target "$TARGET" --title "$tag" \
              --notes-file "$RUNNER_TEMP/notes.md" --latest=false
            echo "Released $tag"
          done
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            --delete release/next 2>/dev/null || true

  release-pr:
    needs: classify
    if: needs.classify.outputs.release-commit != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release-pr
      deployment: false
    steps:
      - name: Mint tau-release-bot token
        id: bot
        uses: actions/create-github-app-token@064492a9a1762067169d50c792a7dc02bc3d1254 # v2.0.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true
          token: ${{ steps.bot.outputs.token }}

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx

      - name: Generate the release commit
        id: generate
        run: |
          set -euo pipefail
          node scripts/src/release-apps.ts prepare > "$RUNNER_TEMP/plan.json"
          subject=$(jq -r '.subject // empty' "$RUNNER_TEMP/plan.json")
          if [ -z "$subject" ]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pending=true" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

          # The release commit carries only manifest versions and changelogs.
          git add -- 'apps/*/package.json' 'apps/*/CHANGELOG.md'
          unexpected=$( { git diff --name-only; git diff --cached --name-only; } \
            | grep -Ev '^apps/[^/]+/(package\.json|CHANGELOG\.md)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::release generation changed unexpected files: $unexpected"
            exit 1
          fi
          git config user.name "tau-release-bot[bot]"
          git config user.email "tau-release-bot[bot]@users.noreply.github.com"
          git commit --quiet -m "$subject"
          git push --force origin HEAD:refs/heads/release/next

          {
            echo 'body<<BODYEOF'
            jq -r '.releases[] | "### \(.tag)\n\n" +
              (if .bump == "first" then "First tracked release." else
                "\(.bump) bump from \(.previousTag), \(.commits | length) commit(s):\n\n" +
                ([.commits[] | "- \(.hash[0:9]) \(.subject)"] | .[0:60] | join("\n")) end) + "\n"' \
              "$RUNNER_TEMP/plan.json"
            echo 'BODYEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert the release pull request
        if: steps.generate.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TITLE: ${{ steps.generate.outputs.subject }}
          RELEASES: ${{ steps.generate.outputs.body }}
        run: |
          set -euo pipefail
          body=$(cat <<BODYEOF
          Releases the applications below. Merging this pull request creates their
          tags and GitHub Releases, which start \`release-build.yml\`; it deploys
          nothing to production.

          ${RELEASES}

          ---

          - This pull request is **bot-managed**: it is regenerated on every push to
            \`main\` and closes itself when nothing is left to release. Do not push to
            \`release/next\` or enable auto-merge.
          - Squash merge it with the title unchanged; the release workflow keys on it.
          - Production deploys a release with **Deploy release to production**
            (\`deploy-production.yml\`), from GitHub or the Command Center.
          BODYEOF
          )
          pr_number=$(gh pr list --base main --head release/next --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            gh pr create --base main --head release/next --title "$TITLE" --body "$body"
          else
            gh pr edit "$pr_number" --title "$TITLE" --body "$body"
          fi

      - name: Close the release pull request when nothing is pending
        if: steps.generate.outputs.pending == 'false'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --base main --head release/next --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --comment "Nothing is left to release on \`main\`." --delete-branch
          else
            git push origin --delete release/next 2>/dev/null || true
          fi
