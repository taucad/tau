name: Deploy Review Apps

on:
  # Review apps are paid Fly resources, so nothing creates one automatically.
  # Deploy, redeploy or destroy a PR's API review app by running this workflow
  # by hand with the PR number. Closing a PR still destroys its app if one exists; the
  # close path never creates one. Trail PRs targeting `production` never get a
  # review app: production rolls out via `deploy-production.yml` against the
  # long-lived `tau-api` Fly app and the `taucad-prod-us` Netlify site.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to deploy a review app for
        required: true
        type: number
      operation:
        description: Deploy the review app, or destroy it
        required: true
        default: deploy
        type: choice
        options: [deploy, destroy]
  pull_request:
    types: [closed]
    branches-ignore:
      - production

# FLY_API_TOKEN is set only on the Fly step, not workflow-wide, so checkout
# and the comment actions never see it.
env:
  # Match the region with production apps
  FLY_REGION: syd
  FLY_ORG: personal
  PR_NUMBER: ${{ inputs.pr_number || github.event.number }}
  # API review app + paired Netlify deploy-preview URL.
  API_APP_NAME: tau-api-pr-${{ inputs.pr_number || github.event.number }}
  API_REVIEW_URL: https://tau-api-pr-${{ inputs.pr_number || github.event.number }}.fly.dev
  UI_PREVIEW_URL: https://deploy-preview-${{ inputs.pr_number || github.event.number }}--taucad.netlify.app

jobs:
  # The per-PR UI is built by the Netlify GitHub integration on the `taucad`
  # site (deploy-preview context, scoped by `apps/ui/netlify.toml`). Reviewers
  # click the Netlify comment on the PR to access the UI; the API job below
  # provides the per-PR backend the preview connects to.
  review_app_api:
    name: Deploy API Review App
    runs-on: ubuntu-latest
    # Skip Dependabot PRs
    if: github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    # Only run one deployment at a time per PR for API.
    concurrency:
      group: pr-${{ inputs.pr_number || github.event.number }}-api
      cancel-in-progress: true

    environment:
      name: review-api
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Get code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}

      # superfly/fly-pr-review-apps reads the PR number and the action from the
      # event payload, which a manual run does not carry. Record the requested PR
      # there, and mark a destroy request as `closed`, the action's destroy path.
      - name: Record the manual request in the event payload
        if: github.event_name == 'workflow_dispatch'
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          action=$([ "$OPERATION" = destroy ] && echo closed || echo dispatched)
          jq --argjson number "$PR_NUMBER" --arg action "$action" '.number = $number | .action = $action' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/event.json"
          cp "$RUNNER_TEMP/event.json" "$GITHUB_EVENT_PATH"

      - name: Post initial API status
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: fly-review-api
          number: ${{ env.PR_NUMBER }}
          message: |
            ### API Preview :octopus:
            **Status:** ${{ (github.event.action == 'closed' || inputs.operation == 'destroy') && '🗑️ Destroying...' || '🔄 Deploying...' }}
            **API URL:** ${{ env.API_REVIEW_URL }}
            **Paired UI:** ${{ env.UI_PREVIEW_URL }} (Netlify deploy preview)

      - name: Deploy API PR app to Fly.io
        id: deploy
        continue-on-error: true
        uses: superfly/fly-pr-review-apps@5d9f067254bebd0aaa77d908d6337b63f4d4f019 # v1.6.0
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        with:
          name: ${{ env.API_APP_NAME }}
          region: syd
          config: apps/api/fly.staging.toml
          secrets: TAU_FRONTEND_URL=${{ env.UI_PREVIEW_URL }} AUTH_URL=${{ env.API_REVIEW_URL }} ADDITIONAL_CORS_ORIGINS=["${{ env.UI_PREVIEW_URL }}"]

      - name: Update API status - success
        if: steps.deploy.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: fly-review-api
          number: ${{ env.PR_NUMBER }}
          message: |
            ### API Preview :octopus:
            **Status:** ${{ (github.event.action == 'closed' || inputs.operation == 'destroy') && '✅ Destroyed' || '✅ Deployed' }}
            **API URL:** ${{ (github.event.action == 'closed' || inputs.operation == 'destroy') && '_Review app destroyed_' || env.API_REVIEW_URL }}
            **Paired UI:** ${{ (github.event.action == 'closed' || inputs.operation == 'destroy') && '_Netlify preview will be auto-cleaned_' || format('{0} (Netlify deploy preview)', env.UI_PREVIEW_URL) }}

      - name: Update API status - failure
        if: steps.deploy.outcome == 'failure'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: fly-review-api
          number: ${{ env.PR_NUMBER }}
          message: |
            ### API Preview :octopus:
            **Status:** ❌ Deployment Failed
            **API URL:** ${{ env.API_REVIEW_URL }}

      - name: Update API status - cancelled
        if: steps.deploy.outcome == 'cancelled'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: fly-review-api
          number: ${{ env.PR_NUMBER }}
          message: |
            ### API Preview :octopus:
            **Status:** ⚠️ Deployment Cancelled
            **API URL:** ${{ env.API_REVIEW_URL }}

      - name: Fail job if deployment failed
        if: steps.deploy.outcome == 'failure' || steps.deploy.outcome == 'cancelled'
        run: exit 1
