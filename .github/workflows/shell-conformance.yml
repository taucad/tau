# The native shell conformance rows (desktop Bash/Terminal blueprint W2, testing contract
# `sandbox:test:shell-conformance`, extended by the W3 service rows `shell-service:test:shell-conformance` and `host:test:shell-conformance`, and the
# W5 desktop Terminal rows `desktop:test:terminal-conformance` and their concern-level mirror
# `desktop-terminal:test:terminal-conformance`): the real sandbox provider and the machine's own Bash on each
# row, positive controls before negatives, network negatives judged by canaries outside the sandbox, and one
# JSON receipt per row binding source, host, runtime, Bash and node-pty identities (I12).
#
# - LNX-U, LNX-U26 and LNX-D: a disposable stock Ubuntu 24.04, Ubuntu 26.04 or Debian 13 cloud guest under KVM. The guest keeps its
#   shipped AppArmor policy and `kernel.apparmor_restrict_unprivileged_userns`; the sandbox reaches user
#   namespaces only through the Tau-scoped profile the real APT selector installs with its bwrap copy. This
#   row never uses `setup-linux-sandbox`, which relaxes that sysctl for the CAD workers.
# - MAC-A and MAC-X: hosted `macos-26` (arm64) and `macos-26-intel` (x64), Seatbelt through the same
#   provider. The macOS Terminal rows run with the shipped own-pty Seatbelt rule (operator ruling 2026-11-09).
# - WIN-ARM is not a row yet: the Windows provider is paused.
#
# Fresh by construction except where reuse is asked for (CF-1): the sandbox, service, host, qualification and Terminal
# concern targets are cacheable only under the environment fingerprint of `scripts/src/shell-evidence.ts`, which is a
# fresh nonce unless `TAU_SHELL_EVIDENCE` is `reuse`. Only the merge queue's semantics-tier call and a labelled pull
# request run ask for reuse; the nightly, `workflow_dispatch` and the candidate gate's call run fresh and still pass
# `--skip-nx-cache`, `desktop:test:terminal-conformance` is never cached, and the Linux guests always run fresh. The
# stamp step then records each macOS receipt as fresh or as a verdict reused from an Nx hash first proven at another
# commit, and refuses a reused receipt in a fresh run. This workflow has no remote cache env yet (CP-5b follow-up), so
# until then a reuse run can only hit the runner's local cache, which is empty on a hosted runner.
name: Shell conformance

# Placement (CI throughput review, operator decision D3 of 2026-11-08): the five rows run nightly on `main`
# head, on demand, and on a pull request only while it carries the `shell-conformance` label. They no
# longer run on every `main` push or on every pull request that touches a shell path. The nightly watchdog
# alerts the operator when a nightly is red or missing. `release-desktop-staging.yml` calls the rows on
# the commit it is about to tag, so no desktop candidate exists without five green rows on its own commit.
#
# Tiers (shell split blueprint PR 4): the nightly, a dispatch, the label and the candidate gate pass no
# `tier` and run the `full` tier, every row and target. The merge queue calls the `semantics` tier from
# `ci.yml` with the affected `tag:ci:shell` projects: the Linux guests skip the Electron build, its transfer
# and the application tier, and each row runs only the listed projects' targets. `tier` and `projects` are
# `workflow_call` inputs only, so every run of this workflow the promotion lookup can find is a full run.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit the rows check out (a desktop candidate's commit)
        type: string
        required: true
      tier:
        description: '`full` (every row and target, the default) or `semantics` (no Electron build or application tier)'
        type: string
        required: false
      projects:
        description: JSON array of the projects whose shell targets run (default all seven)
        type: string
        required: false
  schedule:
    - cron: '17 2 * * *'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  pnpm_config_verify_deps_before_run: warn

concurrency:
  # Another label added to a pull request starts a run whose rows skip; its own group keeps it from
  # cancelling the rows already running for the `shell-conformance` label.
  group: shell-conformance-${{ inputs.ref && format('candidate-{0}', inputs.ref) || github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'shell-conformance' && '-other-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One normalization of the inputs: they are empty on `schedule`, `pull_request` and a dispatch, so every
  # guard below reads these outputs, never `inputs.*`, and `fromJSON('')` is never evaluated.
  select:
    name: Select the shell rows
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'shell-conformance') &&
      (github.event.action != 'labeled' || github.event.label.name == 'shell-conformance') &&
      github.triggering_actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.select.outputs.tier }}
      projects: ${{ steps.select.outputs.projects }}
    steps:
      - name: Normalize the tier and the projects
        id: select
        env:
          TIER: ${{ inputs.tier || 'full' }}
          PROJECTS: ${{ inputs.projects || '["sandbox","native-process-core","shell-service","host","desktop-terminal","desktop","desktop-e2e"]' }}
        run: |
          set -euo pipefail
          case "$TIER" in full|semantics) ;; *) echo "::error::unknown shell tier: $TIER"; exit 1 ;; esac
          jq -e '
            ["sandbox","native-process-core","shell-service","host","desktop-terminal","desktop","desktop-e2e"] as $known
            | type == "array" and length > 0 and all(.[]; type == "string" and (. as $name | $known | index([$name]) != null))
          ' <<< "$PROJECTS" > /dev/null || { echo "::error::projects must be a non-empty JSON array of shell projects: $PROJECTS"; exit 1; }
          projects=$(jq -c . <<< "$PROJECTS")
          echo "Shell tier $TIER, projects $projects"
          { echo "tier=$TIER"; echo "projects=$projects"; } >> "$GITHUB_OUTPUT"

  linux:
    name: Shell conformance on ${{ matrix.row }} (stock ${{ matrix.distro }} guest)
    needs: select
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'shell-conformance') &&
      (github.event.action != 'labeled' || github.event.label.name == 'shell-conformance') &&
      github.triggering_actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            row: LNX-U
          - distro: debian
            row: LNX-D
          - distro: ubuntu2604
            row: LNX-U26
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      # The renderer can peak above the guest's 8 GiB. Transfer this exact build; never rebuild inside the guest.
      # The semantics tier has no application tier, so it builds and transfers nothing.
      - name: Build the production Electron application
        if: needs.select.outputs.tier == 'full'
        timeout-minutes: 25
        run: pnpm nx build desktop --parallel=1

      - name: Run the conformance target in the stock guest
        timeout-minutes: 85
        env:
          TAU_VM_DISTRO: ${{ matrix.distro }}
          TAU_SHELL_TIER: ${{ needs.select.outputs.tier }}
          TAU_SHELL_PROJECTS: ${{ needs.select.outputs.projects }}
        # The receipts bind `GITHUB_SHA`; a caller's `ref` checks out another commit, so pass the one the rows test.
        run: GITHUB_SHA="$(git rev-parse HEAD)" timeout --signal=TERM --kill-after=120s 80m bash libs/sandbox/scripts/shell-conformance-vm.sh

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-conformance-${{ matrix.row }}
          path: out/test-results/shell-conformance/${{ matrix.row }}/
          retention-days: 14
          if-no-files-found: error

  # A row with no listed macOS target (a queue run that selected only `native-process-core`, whose rows are
  # Linux-only) is skipped rather than run with an empty receipt directory.
  macos:
    name: Shell conformance on ${{ matrix.row }} (${{ matrix.runner }})
    needs: select
    if: >-
      (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'shell-conformance') &&
      (github.event.action != 'labeled' || github.event.label.name == 'shell-conformance') &&
      github.triggering_actor != 'dependabot[bot]')) &&
      (contains(fromJSON(needs.select.outputs.projects), 'sandbox') ||
      contains(fromJSON(needs.select.outputs.projects), 'shell-service') ||
      contains(fromJSON(needs.select.outputs.projects), 'host') ||
      contains(fromJSON(needs.select.outputs.projects), 'desktop') ||
      contains(fromJSON(needs.select.outputs.projects), 'desktop-terminal'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Reuse a fingerprinted verdict only in the merge queue's semantics-tier call and on this workflow's own pull
      # request trigger; the candidate gate (no tier, never `merge_group` or `pull_request`), the nightly and a
      # dispatch need fresh evidence (CF-1). Nothing reads a pull request run's verdict: the promotion lookup skips it.
      TAU_SHELL_EVIDENCE: ${{ ((github.event_name == 'merge_group' && needs.select.outputs.tier == 'semantics') || (github.event_name == 'pull_request' && !inputs.ref && needs.select.outputs.tier == 'full')) && 'reuse' || 'fresh' }}
      TAU_SHELL_TIER: ${{ needs.select.outputs.tier }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            row: MAC-A
          - runner: macos-26-intel
            row: MAC-X
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      # The runtime searches mandatory deny paths with ripgrep; the hosted image does not always carry it.
      - name: Install ripgrep
        run: command -v rg || brew install ripgrep

      # node-pty 1.1.0 publishes its macOS `spawn-helper` mode 0644 and its fork path execs it, so every Terminal
      # launch from the checkout fails with `posix_spawnp failed`. The packaged app sets the bit at staging
      # (`runtime-stage.mts`); the rows run node-pty from the workspace, so they set it the same way here.
      - name: Make the workspace node-pty spawn-helper executable
        run: |
          set -euo pipefail
          helpers=$(find node_modules/.pnpm -path '*/node-pty/prebuilds/darwin-*/spawn-helper' -type f)
          [ -n "$helpers" ] || { echo '::error::no node-pty darwin spawn-helper in the workspace'; exit 1; }
          echo "$helpers" | xargs chmod 0755
          echo "$helpers" | xargs ls -l

      - name: Run the conformance target
        if: contains(fromJSON(needs.select.outputs.projects), 'sandbox')
        env:
          TAU_SHELL_CONFORMANCE_ROW: ${{ matrix.row }}
          TAU_SHELL_CONFORMANCE_RECEIPT: ${{ github.workspace }}/out/test-results/shell-conformance/${{ matrix.row }}/receipt.json
        run: GITHUB_SHA="$(git rev-parse HEAD)" pnpm nx run sandbox:test:shell-conformance ${{ env.TAU_SHELL_EVIDENCE == 'fresh' && '--skip-nx-cache' || '' }}

      - name: Run the shell service conformance target
        if: (success() || failure()) && contains(fromJSON(needs.select.outputs.projects), 'shell-service')
        env:
          TAU_SHELL_CONFORMANCE_ROW: ${{ matrix.row }}
          TAU_SHELL_CONFORMANCE_RECEIPT: ${{ github.workspace }}/out/test-results/shell-conformance/${{ matrix.row }}/service-receipt.json
        run: GITHUB_SHA="$(git rev-parse HEAD)" pnpm nx run shell-service:test:shell-conformance ${{ env.TAU_SHELL_EVIDENCE == 'fresh' && '--skip-nx-cache' || '' }}

      # The service rows that run through a real Tau agent host and the host's tool registry (H08-H10).
      - name: Run the host shell conformance target
        if: (success() || failure()) && contains(fromJSON(needs.select.outputs.projects), 'host')
        env:
          TAU_SHELL_CONFORMANCE_ROW: ${{ matrix.row }}
          TAU_SHELL_CONFORMANCE_RECEIPT: ${{ github.workspace }}/out/test-results/shell-conformance/${{ matrix.row }}/host-receipt.json
        run: GITHUB_SHA="$(git rev-parse HEAD)" pnpm nx run host:test:shell-conformance ${{ env.TAU_SHELL_EVIDENCE == 'fresh' && '--skip-nx-cache' || '' }}

      # The W7 application and adversarial qualification rows: the agent host over the real provider (T, E and S rows).
      - name: Run the shell qualification target
        if: (success() || failure()) && contains(fromJSON(needs.select.outputs.projects), 'host')
        env:
          TAU_SHELL_CONFORMANCE_ROW: ${{ matrix.row }}
          TAU_SHELL_CONFORMANCE_RECEIPT: ${{ github.workspace }}/out/test-results/shell-conformance/${{ matrix.row }}/qualification-receipt.json
        run: GITHUB_SHA="$(git rev-parse HEAD)" pnpm nx run host:test:shell-qualification ${{ env.TAU_SHELL_EVIDENCE == 'fresh' && '--skip-nx-cache' || '' }}

      # The desktop Terminal rows (W5): probe, refusal and PTY rows, on macOS with the shipped own-pty Seatbelt rule.
      - name: Run the desktop terminal conformance target
        if: (success() || failure()) && contains(fromJSON(needs.select.outputs.projects), 'desktop')
        env:
          TAU_SHELL_CONFORMANCE_ROW: ${{ matrix.row }}
          TAU_SHELL_CONFORMANCE_RECEIPT: ${{ github.workspace }}/out/test-results/shell-conformance/${{ matrix.row }}/terminal-receipt.json
        run: GITHUB_SHA="$(git rev-parse HEAD)" pnpm nx run desktop:test:terminal-conformance --skip-nx-cache

      # The Terminal concern's own rows (shell split PR 3): the same probe, refusal and PTY rows over a port into the concern.
      - name: Run the Terminal concern conformance target
        if: (success() || failure()) && contains(fromJSON(needs.select.outputs.projects), 'desktop-terminal')
        env:
          TAU_SHELL_CONFORMANCE_ROW: ${{ matrix.row }}
          TAU_SHELL_CONFORMANCE_RECEIPT: ${{ github.workspace }}/out/test-results/shell-conformance/${{ matrix.row }}/terminal-concern-receipt.json
        run: GITHUB_SHA="$(git rev-parse HEAD)" pnpm nx run desktop-terminal:test:terminal-conformance ${{ env.TAU_SHELL_EVIDENCE == 'fresh' && '--skip-nx-cache' || '' }}

      # Uncached: each receipt of a listed project is stamped fresh (this run, this commit) or reused (restored by a
      # cache hit, with the Nx hash and the commit that first proved it). A fresh run refuses a reused receipt, and a
      # listed project's missing receipt is refused.
      - name: Stamp the receipts
        if: success() || failure()
        env:
          TAU_SHELL_CONFORMANCE_ROW: ${{ matrix.row }}
          TAU_SHELL_PROJECTS: ${{ needs.select.outputs.projects }}
        run: >-
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/src/shell-evidence.ts stamp
          "out/test-results/shell-conformance/$TAU_SHELL_CONFORMANCE_ROW"
          sandbox=receipt.json shell-service=service-receipt.json host=host-receipt.json
          host=qualification-receipt.json desktop=terminal-receipt.json
          desktop-terminal=terminal-concern-receipt.json

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-conformance-${{ matrix.row }}
          path: out/test-results/shell-conformance/${{ matrix.row }}/
          retention-days: 14
          if-no-files-found: error
