name: Prepare current-source products for spikes

on:
  workflow_call:

permissions:
  contents: read

jobs:
  products:
    name: Prepare verified GeoSpec products
    runs-on: macos-15
    timeout-minutes: 180
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          native-node-version: '24.10.0'
          save-pnpm-store: 'false'
      - name: Identify current-source products
        id: products
        run: echo "key=geospec-transport-v1-$(node packages/geospec-engine-native/scripts/ci-artifacts.mjs product-key)" >> "$GITHUB_OUTPUT"
      - name: Look up current-source products
        id: cached
        uses: ./.github/actions/geospec-transport
        with:
          key: ${{ steps.products.outputs.key }}
          mode: lookup
      - name: Restore current-source products
        if: steps.cached.outputs.cache-hit == 'true'
        uses: ./.github/actions/geospec-transport
        with:
          key: ${{ steps.products.outputs.key }}
          mode: restore
      # A product-cache hit can still need a current-source delivery assembly.
      - name: Prepare current-source products and delivery
        uses: ./.github/actions/geospec-producer
      - name: Verify current-source products
        run: pnpm nx run-many -t require-geospec-delivery --parallel=1
      - name: Keep verified products for later runs
        if: steps.cached.outputs.cache-hit != 'true'
        uses: ./.github/actions/geospec-transport
        with:
          key: ${{ steps.products.outputs.key }}
          mode: save
      - name: Upload verified current-source products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-geospec-${{ github.sha }}
          path: |
            packages/geospec-engine-native/bindings/node/generated/index.d.ts
            packages/geospec-engine-native/bindings/node/generated/index.js
            packages/geospec-engine-native/bindings/node/generated/geospec-engine-native.darwin-arm64.node
            packages/geospec-engine-native/bindings/emscripten/generated/geospec_engine_native.mjs
            packages/geospec-engine-native/bindings/emscripten/generated/geospec_engine_native.wasm
            out/artifacts/geospec-native-engine/ci
          if-no-files-found: error
          overwrite: true
          retention-days: 7
