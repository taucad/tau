# Spike S25 (native-dependency-resolution charter, wave 1): which environment variable names Codex and
# Claude Code pass to a stdio MCP server, whether progress notifications reach the client, and whether
# the client sends notifications/cancelled on tool timeout (D7, D25, Q9, W5).
# Spike code under scripts/spikes/s25. Each client is driven through one tool call by a loopback mock
# model API: no credential is used and only variable names are recorded, never values. The clients are
# installed from npm with install scripts disabled.
name: Spike S25 (MCP env, progress, cancellation)

on:
  pull_request:
    paths:
      - '.github/workflows/spike-s25.yml'
      - 'scripts/spikes/s25/**'
      - 'scripts/spikes/native-deps/linux/annotate.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-s25-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s25:
    name: S25 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      CODEX_VERSION: '0.162.1'
      CLAUDE_CODE_VERSION: '2.1.296'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'
      - name: Install both clients (install scripts disabled)
        run: |
          mkdir -p "$RUNNER_TEMP/clients"
          cd "$RUNNER_TEMP/clients"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts "@openai/codex@$CODEX_VERSION" "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          # With install scripts off, claude-code's bin stays a placeholder; run the platform package's binary.
          claude_bin="$(ls "$RUNNER_TEMP"/clients/node_modules/@anthropic-ai/claude-code-*/claude | head -n 1)"
          echo "CLAUDE_BIN=$claude_bin" >> "$GITHUB_ENV"
          ./node_modules/.bin/codex --version
          "$claude_bin" --version
      - name: Run the scenarios
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          node scripts/spikes/s25/run.ts "$RUNNER_TEMP/clients/node_modules/.bin/codex" "$CLAUDE_BIN" "$RUNNER_TEMP/evidence" | tee "$RUNNER_TEMP/evidence/s25-summary.txt"
          { echo '```'; cat "$RUNNER_TEMP/evidence/s25-summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the summary as annotations
        if: always()
        run: scripts/spikes/native-deps/linux/annotate.sh 'S25 ${{ matrix.os }}' "$RUNNER_TEMP/evidence/s25-summary.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike-s25-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/evidence/s25.json
            ${{ runner.temp }}/evidence/s25-summary.txt
            ${{ runner.temp }}/evidence/*/probe.jsonl
            ${{ runner.temp }}/evidence/*/model.jsonl
          retention-days: 30
