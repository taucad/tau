# Spike S28 (native dependency charter, D9/D23): 4-6 parallel streams on a throttled link.
#
# A local CONNECT proxy shapes every tunnel's downstream bytes through one token bucket at 100
# and 25 Mbit/s; the preparation host prepares build123d from its real origins through it
# (HTTPS_PROXY with NODE_USE_ENV_PROXY=1). Records link utilisation, open streams, the progress
# event cadence, and tmp/ leftovers after a host-level cancel and a CLI SIGINT at 40 % of the
# bytes. Deleted when W21 lands.
name: Spike S28 (throttled parallel streams)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/spike-s28.yml
      - scripts/spikes/native-deps/store-spike.mts
      - scripts/spikes/native-deps/s28-throttled-streams.mts

permissions:
  actions: read # nrwl/nx-set-shas inside setup-nx
  contents: read

concurrency:
  group: spike-s28-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  s28:
    name: S28 throttled parallel streams (macos-15)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'
          save-pnpm-store: 'false'

      # The same digest-keyed seed the native-darwin job keeps (D30); restore only.
      - name: Identify the Build123d darwin-arm64 closure
        id: seed-key
        run: |
          digest=$(node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("packages/plugins/build123d/tau-plugin.json", "utf8"));
            const pins = Object.values(manifest.dependencies).flat()
              .filter(({ target }) => target.os === "darwin" && target.arch === "arm64")
              .flatMap(({ payloads }) => payloads.map(({ integrity }) => integrity))
              .toSorted();
            console.log(createHash("sha256").update(pins.join("\n")).digest("hex"));
          ')
          echo "key=native-seed-v1-build123d-darwin-arm64-$digest" >> "$GITHUB_OUTPUT"

      - name: Restore the seed
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: out/cache/build123d-seed
          key: ${{ steps.seed-key.outputs.key }}

      - name: Fill the seed from the pinned origins
        run: pnpm nx run build123d:seed --outputStyle=static

      - name: Build the CLI
        run: pnpm nx run cli:build --outputStyle=static

      - name: Run the spike
        run: |
          set -o pipefail
          node --import @oxc-node/core/register scripts/spikes/native-deps/s28-throttled-streams.mts \
            --work "$RUNNER_TEMP/s28" --out "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/console.log"

      - name: Publish the summary
        if: always()
        run: |
          { echo '```'; cat "$RUNNER_TEMP/out/s28-summary.txt" 2>/dev/null || echo 'no summary'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          scripts/spikes/native-deps/linux/annotate.sh "S28" "$RUNNER_TEMP/out/s28-summary.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike-s28-evidence
          path: |
            ${{ runner.temp }}/out
            ${{ runner.temp }}/console.log
          retention-days: 30
