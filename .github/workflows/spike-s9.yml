# Spike S9 (native-dependency-resolution charter, wave 0): Windows python-build-standalone archive links and CRT (W20)
# Spike code under scripts/spikes/native-deps/linux/s9; the run's evidence is the uploaded artifact
# and the job summary. Downloaded bytes are inspected as data and never executed.
name: Spike S9 (Windows PBS CRT)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-s9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s9:
    name: S9 list the Windows install_only_stripped archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'
      - name: List both archives (tar -tvzf, no extraction)
        run: |
          scripts/spikes/native-deps/linux/s9/list-windows-pbs.sh "$RUNNER_TEMP/s9"
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP"/s9/*.txt "$RUNNER_TEMP/evidence/"
          { echo '```'; cat "$RUNNER_TEMP/s9/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Survey bundled MSVC runtimes in the locked win_amd64 wheels
        run: |
          node scripts/spikes/native-deps/linux/s9/wheel-crt-survey.ts | tee "$RUNNER_TEMP/evidence/wheel-crt-survey.json"
          { echo '```json'; cat "$RUNNER_TEMP/evidence/wheel-crt-survey.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect the summary
        if: always()
        run: |
          { cat "$RUNNER_TEMP/s9/summary.txt"; node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1]));for(const w of r.platformWheels)console.log(w.wheel,"native="+w.nativeModules,"crt="+(w.crt.join(" ")||"none"));console.log("pure wheels",r.pureWheels)' "$RUNNER_TEMP/evidence/wheel-crt-survey.json"; } > "$RUNNER_TEMP/evidence/s9-summary.txt" || true
      - name: Publish the numbers as annotations
        if: always()
        run: scripts/spikes/native-deps/linux/annotate.sh 'S9' "$RUNNER_TEMP/evidence/s9-summary.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike-s9-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 30
