# Spike W2 (desktop Bash/Terminal blueprint): the Linux stock-VM netns confirmation + Tau-scoped
# AppArmor profile row. Spike W1's LNX-U row runs on a hosted ubuntu-24.04 runner whose AppArmor /
# userns posture is a runner artifact (and where Tau's own setup-linux-sandbox would set
# kernel.apparmor_restrict_unprivileged_userns=0 — a GLOBAL relaxation this program forbids). This
# file stands up a GENUINE stock Ubuntu 24.04 cloud image in a VM, leaves that sysctl at its shipped
# value, and runs the EXISTING, UNMODIFIED harness packages/core/native-process/spikes/shell/
# fs-net-probe.mts against Tau's BUNDLED bwrap, in three phases, to settle three questions:
#
#   1. CONFIRM it is stock-24.04 behaviour (not hosted-runner-specific): with Tau's bundled bwrap at an
#      /opt/Tau path that the stock /usr/bin/bwrap AppArmor profile does not cover, loopback bring-up
#      fails `bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted` and the sandbox is
#      unavailable — under apparmor_restrict_unprivileged_userns left at stock 1.
#   2. PROTOTYPE a Tau-SCOPED AppArmor profile (linux-vm/apparmor/tau-bwrap) installed the .deb way
#      (apparmor_parser at install time). With it loaded — sysctl STILL 1, system default untouched —
#      the sandbox launches and fs-net-probe produces real S0/S1.
#   3. RECORD what an AppImage gets WITHOUT the profile: the same bwrap at an AppImage mount path, no
#      install step → still blocked. AppImage packaging needs a different containment story.
#
# ─ KVM reality ─────────────────────────────────────────────────────────────────────────────────────
# A stock Ubuntu cloud image reaches cloud-init completion in minutes even under QEMU TCG software
# emulation, so unlike the Win11 lane a missing /dev/kvm is NOT a hard blocker: preflight-kvm.sh records
# the KVM verdict (a first-class output of this lane) and selects TCG with a longer inner deadline when
# KVM is absent. The accelerator actually used is recorded in the receipts. If KVM is absent AND TCG is
# disallowed (allow_tcg=false), the row records a kvm-unavailable blocker and fails — never a fake green.
#
# ─ Image basis (license-clean, pinned) ──────────────────────────────────────────────────────────────
# Ubuntu cloud images are freely redistributable and published with SHA256SUMS, so this lane ships a
# working default URL and verifies the download against Ubuntu's published checksums (trust-on-publish);
# an operator may pin image_sha256 exactly. Point image_url/image_sha256 at a Debian 13 generic cloud
# image to run the optional Debian 13 row with no code change (the lane is image-agnostic).
name: Spike W2 (Linux stock-VM netns + Tau AppArmor profile)

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'HTTPS URL of a stock cloud image. Default = Ubuntu 24.04 server cloud image. Point at a Debian 13 generic cloud image for that row.'
        required: false
        type: string
        default: ''
      image_sha256:
        description: 'Lowercase hex SHA-256 to pin the image exactly. Empty = verify against the publisher SHA256SUMS.'
        required: false
        type: string
        default: ''
      allow_tcg:
        description: 'Allow TCG software emulation when /dev/kvm is absent. false = record a kvm-unavailable blocker instead.'
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - 'packages/core/native-process/spikes/shell/**'
      - '.github/workflows/spike-w2-linux-vm.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: spike-w2-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'

jobs:
  linux-vm:
    name: Stock Ubuntu 24.04 VM — bwrap/netns + Tau AppArmor profile (LNX-VM)
    runs-on: ubuntu-24.04
    # A cloud-image boot + apt + a harness run is quick under KVM; under TCG it is much slower. Give the
    # job room but never the full 6h — boot-vm.sh enforces its own inner deadline so a hung VM fails.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Install the workspace so the 9p-shared repo carries node_modules (incl. the catalog-pinned
      # @anthropic-ai/sandbox-runtime 0.0.75) for the UNMODIFIED harness to resolve inside the guest.
      - uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'

      # Step 1: KVM preflight + accelerator selection (the KVM availability verdict is a lane output).
      - name: Preflight — KVM / accelerator
        id: kvm
        env:
          ALLOW_TCG: ${{ inputs.allow_tcg == false && 'false' || 'true' }}
        run: bash packages/core/native-process/spikes/shell/linux-vm/preflight-kvm.sh

      # Step 2: host-side VM toolchain (pinned apt packages; no third-party actions in the boot path).
      - name: Install VM toolchain (QEMU, xorriso)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso

      # Step 3: fetch + digest-verify the stock cloud image (or record an image blocker).
      - name: Acquire and verify stock Ubuntu 24.04 cloud image
        id: image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          IMAGE_SHA256: ${{ inputs.image_sha256 }}
          DROP: ${{ runner.temp }}/linux-vm-drop
        run: |
          set -euo pipefail
          # Default IMAGE_URL handled inside the script; keep empty inputs from overriding the default.
          if [[ -z "${IMAGE_URL}" ]]; then unset IMAGE_URL; fi
          if [[ -z "${IMAGE_SHA256}" ]]; then unset IMAGE_SHA256; fi
          bash packages/core/native-process/spikes/shell/linux-vm/acquire-image.sh

      # Step 4: build the NoCloud cidata seed ISO (synthetic console password only; no secret).
      - name: Build cloud-init seed ISO
        if: steps.image.outputs.have_image == 'true'
        env:
          DROP: ${{ runner.temp }}/linux-vm-drop
        run: bash packages/core/native-process/spikes/shell/linux-vm/make-seed-iso.sh

      # Step 5: boot the stock VM; cloud-init runs the in-guest orchestrator (three phases) and powers
      # off after dropping receipts + the DONE sentinel. The sysctl is left at its shipped value.
      - name: Boot stock VM and run the three-phase harness
        if: steps.image.outputs.have_image == 'true'
        env:
          DROP: ${{ runner.temp }}/linux-vm-drop
          REPO: ${{ github.workspace }}
          IMAGE: ${{ steps.image.outputs.image }}
          ACCEL: ${{ steps.kvm.outputs.accel }}
        run: bash packages/core/native-process/spikes/shell/linux-vm/boot-vm.sh

      - name: Summarize
        if: always()
        env:
          DROP: ${{ runner.temp }}/linux-vm-drop
        run: bash packages/core/native-process/spikes/shell/linux-vm/summarize-vm.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-spike-LNX-VM
          path: ${{ runner.temp }}/linux-vm-drop/
          if-no-files-found: error
          retention-days: 14
