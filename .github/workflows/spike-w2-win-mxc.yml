# Spike W2 (desktop Bash/Terminal blueprint, ratification §RQ5): the Windows MXC processcontainer
# S0-S2 containment receipts, collected on a matrix of two hosted runners.
#
#   PRIMARY  windows-11-arm  real Windows 11 Enterprise, build 10.0.26200 (25H2), arm64. This is the
#            S0-S2 lane: it runs the FULL receipt set as a NON-ADMIN local user the job creates on the
#            runner (never elevated) — MXC probe (PSEC / PSE_SUPPORT_FS_DENY / ConPTY), the two-
#            concurrent-container isolation + proxy + reaping receipt, D14 ShellIdentity on both
#            resolution branches, and the capability-SID fallback where MXC is absent. arch=arm64 is
#            recorded in every receipt (laneIdentity.os.arch). HONEST SCOPE: an arm64 PSEC receipt
#            does NOT close the x64 or consumer-SKU rows — the x64 package is qualified separately (W8).
#   SECONDARY windows-2025   hosted Server 2025 (~build 26100 / 24H2-equivalent, x64). PSEC is absent
#            here, so its MXC probe is a typed-unavailable RED by design; it still yields the hosted
#            D14 ShellIdentity / grammar / PTY receipts. Kept unchanged from the original lane.
#
# The ratified Windows ShellProvider target is Microsoft MXC (Microsoft eXecution Containers)
# `processcontainer` over the Windows process security environment (PSEC). This lane pins the MXC
# Node SDK (@microsoft/mxc-sdk, see mxc/pin.json; the SDK and Node both ship win-arm64 builds, so the
# arm64 row runs native, never emulated), provisions it, probes the host capabilities, and collects
# the core deliverable: a two-concurrent-container isolation receipt in which every allow/deny is
# decided by an EXTERNAL out-of-container observer (a file digest the harness placed, or a
# credential-authenticated loopback listener's own request log), never a trusted in-container error.
#
# Evidence discipline (mirrors spike-w1): a preflight sentinel proves the probe really ran inside a
# container; an unavailable prerequisite is a TYPED state and a failed row, never a skip and never an
# unsupported-platform green. Where the MXC probe fails on a row, the job instead proves the
# capability-SID fallback (a WRITE_RESTRICTED token with per-session capability restricting SIDs plus
# Tau deny-read ACEs) — so the row is still a real receipt, never a vacuous pass.
#
# One dispatch runs both rows (matrix, fail-fast off). The Win11-consumer x64 MXC confirmation rides
# the separate parked Win11 Eval VM lane; the mxc/ scripts are standalone so they are reusable there.
# Noncacheable by intent: this proves the live hosts.
name: Spike W2 (Windows MXC processcontainer isolation)

# workflow_dispatch ONLY (no pull_request): a PR push must not cancel an in-flight run and lose the
# hosted D14 ShellIdentity / grammar / PTY receipts. Ref-keyed concurrency, cancel-in-progress false.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: spike-w2-win-mxc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# TAU_SPIKE_OUT is not set here: the `runner` context is unavailable in workflow-level env, so the
# harness defaults its output directory to $RUNNER_TEMP/mxc-spike (see mxc/mxc-lib.mts outDir),
# which is exactly the path the upload step collects.
env:
  MXC_DIR: packages/core/native-process/spikes/shell/mxc

jobs:
  win-mxc:
    # Matrix os dimension: one dispatch runs both rows. fail-fast off so the PRIMARY arm64 lane
    # completes and uploads even if the SECONDARY x64 lane fails (or vice versa). runner.arch selects
    # the per-row path below: the x64 row keeps the original steps verbatim; the arm64 row runs the
    # full set through run-nonadmin.ps1 as a created non-admin user.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025]
    name: Windows MXC containment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Preserve source bytes on Windows
        run: git config --global core.autocrlf false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The pinned MXC SDK requires Node >= 24. setup-node fetches the win-arm64 build on the arm row.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'

      # Install the pinned SDK (mxc/package.json pins @microsoft/mxc-sdk 1.0.1; npm verifies the
      # registry integrity on fetch; it also brings node-pty, used by the PTY row). Non-fatal: the
      # provision/probe steps record the SDK-absent typed state.
      # Every step below is continue-on-error so that ALL receipts are produced and uploaded; the
      # final Summarize step is the single gate (it exits nonzero if any receipt is not pass), so the
      # row stays RED while PSEC is absent — that red is the intended evidence.
      - name: Install pinned MXC Node SDK
        id: install
        continue-on-error: true
        shell: bash
        run: npm install --prefix "$MXC_DIR" --no-audit --no-fund

      # bash: provision does not exercise the SDK's getPlatformSupport/probe whoami path, so it is
      # unaffected by the Git-bash whoami shadow. Its user-SID record uses .NET WindowsIdentity.
      # ---- SECONDARY (windows-2025, x64): the original steps, unchanged, run as the runner. ----
      - name: Provision + record (pin, licence, digest, OS build)
        id: provision
        if: matrix.os == 'windows-2025'
        continue-on-error: true
        shell: bash
        run: node "$MXC_DIR/provision.mts"

      # D14 ShellIdentity (the primary hosted-collectable receipt): resolve the Windows shell at the
      # fixed paths for BOTH branches (pwsh 7 present, and 5.1 with pwsh 7 hidden) and record kind +
      # version + digest + launch argv. pwsh host so System32 whoami.exe wins.
      - name: D14 ShellIdentity (pwsh7 + forced-5.1 branches)
        id: shellid
        if: matrix.os == 'windows-2025'
        continue-on-error: true
        shell: pwsh
        run: node "$env:MXC_DIR/shell-identity.mts"

      # T02-pwsh grammar cases against the resolved shell (containment cases stay language-neutral).
      - name: T02-pwsh grammar
        id: grammar
        if: matrix.os == 'windows-2025'
        continue-on-error: true
        shell: pwsh
        run: node "$env:MXC_DIR/grammar.mts"

      # PTY row: interactive PowerShell over a ConPTY terminal (the D14 Terminal-pane argv).
      - name: PTY (ConPTY + interactive PowerShell)
        id: pty
        if: matrix.os == 'windows-2025'
        continue-on-error: true
        shell: pwsh
        run: node "$env:MXC_DIR/pty.mts"

      # Capability probe: PSEC create/close (external preflight sentinel), PSE_SUPPORT_FS_DENY, ConPTY,
      # isolation tier, OS build. On hosted Server 2025 PSEC is absent, so this is a typed-unavailable
      # RED by design (recorded, fail-closed) — the capability-SID fallback is concluded exercisable-
      # but-unreceipted here and is NOT re-run.
      - name: Capability probe (PSEC / PSE_SUPPORT_FS_DENY / ConPTY)
        id: probe
        if: matrix.os == 'windows-2025'
        continue-on-error: true
        shell: pwsh
        run: node "$env:MXC_DIR/probe.mts"

      # Core deliverable, taken only where the MXC probe passed (a PSEC-capable Windows build): two
      # concurrent containers, external canaries for read/write/HOME/temp/approved-folder, proxy
      # cross-use and the D14 PowerShell descendant-reaping case. Skipped on hosted (PSEC absent).
      - name: Two-concurrent-container isolation receipt
        id: isolation
        if: matrix.os == 'windows-2025' && steps.probe.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: node "$env:MXC_DIR/isolation.mts"

      # ---- PRIMARY (windows-11-arm, arm64): the FULL S0-S2 receipt set, run as a created non-admin
      # local user (never elevated). run-nonadmin.ps1 creates the user, proves it is not an
      # administrator, then runs provision / D14 ShellIdentity (both branches) / grammar / pty / probe
      # as that user, and then the two-container isolation receipt when the MXC probe passes (PSEC
      # present) or the capability-SID fallback when MXC is absent. arch=arm64 is in every receipt.
      # continue-on-error so Summarize remains the single gate; the launcher only surfaces its own
      # infrastructure failure (recorded as a typed non-pass receipt). ---------------------------------
      - name: Full S0-S2 receipts as a non-admin user (arm64)
        id: nonadmin
        if: matrix.os == 'windows-11-arm'
        continue-on-error: true
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File "$env:MXC_DIR/run-nonadmin.ps1"

      # Single gate: prints the summary AND exits nonzero if any produced receipt is not pass (so the
      # row stays red while PSEC is absent). Collects every receipt regardless of earlier failures.
      - name: Summarize + gate
        if: always()
        shell: bash
        run: node "$MXC_DIR/summarize.mts" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mxc-spike-${{ matrix.os }}
          path: ${{ runner.temp }}/mxc-spike/
          if-no-files-found: error
          retention-days: 14
