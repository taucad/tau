# Lane W6 oracles (native dependency charter, phase 1; D10, D24, ruling X30): the desktop ships its native kernels'
# sealed closures under Contents/Resources/payloads and seeds the payload store from them by clonefile.
#
# On macos-15 this packages the ad-hoc signed app, runs the package verifier (whose native roots are now the shipped
# closures: their keys equal the tau-plugin.json pins and each re-verifies against its receipt), then runs
# desktop-e2e's desktop-store-seed.spec.ts against the package with the payload mirror at a closed port and no
# fallback: first launch seeds by clone, a second launch copies nothing, and a .py export runs from the seeded store.
# That spec needs no API, so it runs under a configuration without the suite's global setup (macOS runners have no
# docker for the services test:e2e:packaged boots).
name: Spike W6 (desktop store seed)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/spike-w6-desktop-seed.yml
      - apps/desktop/src/tau/native-*.ts
      - apps/desktop/src/main/main.ts
      - apps/desktop/scripts/package-macos.mts
      - apps/desktop/scripts/runtime-stage.mts
      - apps/desktop/scripts/verify-macos-package.mts
      - apps/desktop-e2e/src/desktop-store-seed.spec.ts

permissions:
  actions: read # nrwl/nx-set-shas inside setup-nx
  contents: read

concurrency:
  group: spike-w6-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  seed:
    name: Package, verify and seed (macos-15)
    runs-on: macos-15
    timeout-minutes: 150
    env:
      GEOSPEC_WORKERS: 1
      EVIDENCE: ${{ github.workspace }}/out/w6
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'
          save-pnpm-store: 'false'

      - name: Install uv
        run: |
          command -v uv || pipx install uv
          uv --version

      - name: Record package source identity
        run: echo "TAU_DESKTOP_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Package (ad-hoc signed)
        run: |
          mkdir -p "$EVIDENCE"
          pnpm nx run desktop:package-macos --parallel=1 --outputStyle=static 2>&1 | tee "$EVIDENCE/package.log"

      - name: Verify the package
        run: pnpm nx run desktop:verify-macos-package --outputStyle=static 2>&1 | tee "$EVIDENCE/verify.log"

      - name: Record the shipped closures
        run: |
          payloads=apps/desktop/package-out/Tau-darwin-arm64/Tau.app/Contents/Resources/payloads
          {
            echo "### Shipped closures"
            for receipt in "$payloads"/closures/sha256/*/receipt.json; do
              node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(`- ${r.package} ${r.dependency}: ${r.closureIntegrity} (${r.files.length} files)`)' "$receipt"
            done
            du -sh "$payloads"
          } | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE/closures.md"

      - name: Build the CLI
        run: pnpm nx run cli:build --outputStyle=static

      - name: Seed the store from the package, offline
        working-directory: apps/desktop-e2e
        env:
          TAU_E2E_STORE_SEED_EVIDENCE: ${{ github.workspace }}/out/w6
        run: |
          cat > vitest.w6.config.ts <<'EOF'
          import { defineConfig } from 'vitest/config';
          import desktopConfig from './vitest.config.js';
          export default defineConfig({
            ...desktopConfig,
            test: { ...desktopConfig.test, globalSetup: [], include: ['src/desktop-store-seed.spec.ts'] },
          });
          EOF
          TAU_E2E_DESKTOP_EXECUTABLE="$PWD/../desktop/package-out/Tau-darwin-arm64/Tau.app/Contents/MacOS/Tau" \
            ../../node_modules/.bin/vitest run --config vitest.w6.config.ts 2>&1 | tee "$EVIDENCE/store-seed.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w6-desktop-store-seed
          path: out/w6
          if-no-files-found: ignore
          retention-days: 30
