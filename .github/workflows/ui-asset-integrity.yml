# The UI's WASM integrity in browsers (charter D26, W19; ruling X31): build the web client, re-hash its asset receipt,
# then load every WASM module the build ships through the runtime's loader in a module worker under COOP/COEP, in
# Chromium, Firefox and WebKit. A tampered byte must be refused, and integrity may add at most 200 ms per module, or
# 8 ms per MB for a module over 25 MB, on the platform each engine ships on (X44): Chromium and Firefox on Linux,
# WebKit on macOS. A module over its line is measured once more before it fails (see the script's header).
name: UI asset integrity

on:
  pull_request:
    # `ready_for_review` so a draft, which requests no macOS runner, gets its WebKit leg once it is ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/ui/asset-integrity.vite-plugin.ts
      - apps/ui/scripts/check-asset-integrity.mts
      - apps/ui/scripts/subresource-integrity.mts
      - apps/ui/vite.config.ts
      - apps/ui/serve/vite.config.ts
      - packages/runtime/src/framework/wasm-loader.ts
      - .github/workflows/ui-asset-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request's head branch cancels its outdated run; a dispatch is never cancelled.
concurrency:
  group: ui-asset-integrity-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    name: Probe ui:build on macos-26 (Node ${{ matrix.node }}, ${{ matrix.round }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        node: ['24.20.0', '26.13.1']
        round: [1, 2, 3, 4]
    timeout-minutes: 60
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: ${{ matrix.node }}
          save-pnpm-store: 'false'
      - name: Host
        run: |
          sysctl hw.memsize hw.ncpu
          vm_stat | head -5
      - name: Build the dependencies of ui:build
        env:
          TAU_API_URL: http://localhost:4000
          TAU_WEBSOCKET_URL: ws://localhost:4000
          TAU_FRONTEND_URL: http://localhost:3000
        run: pnpm nx build ui --exclude-task-dependencies=false --outputStyle=static --skip-nx-cache -- --help > /dev/null 2>&1 || true
      - name: Build ui under /usr/bin/time -l
        env:
          TAU_API_URL: http://localhost:4000
          TAU_WEBSOCKET_URL: ws://localhost:4000
          TAU_FRONTEND_URL: http://localhost:3000
        run: |
          ( while true; do echo "pressure $(date +%T) $(memory_pressure | tail -1)"; sleep 15; done ) &
          watcher=$!
          set +e
          NX_VERBOSE_LOGGING=true /usr/bin/time -l pnpm nx build ui --outputStyle=stream 2>&1 | tee "$RUNNER_TEMP/ui-build.log"; code=${PIPESTATUS[0]}
          kill $watcher
          echo "--- crash reports"
          ls -la ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports 2>/dev/null | grep -iE "node|\.ips" || true
          for f in ~/Library/Logs/DiagnosticReports/*node*.ips /Library/Logs/DiagnosticReports/*node*.ips; do
            [ -f "$f" ] || continue
            echo "=== $f"; head -c 6000 "$f"; echo
          done
          echo "--- end crash reports"
          echo "--- ui:build errors"
          grep -nE "error|Error|ERR_|build-lock:|Killed|exited with|signal" "$RUNNER_TEMP/ui-build.log" | grep -v "externalized for browser" | tail -40 || true
          log show --last 30m --predicate 'eventMessage CONTAINS[c] "jetsam" OR eventMessage CONTAINS[c] "memorystatus"' --style compact 2>/dev/null | grep -i "node" | tail -20 || true
          echo "ui:build exit $code"
          exit $code
