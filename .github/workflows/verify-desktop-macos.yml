# Verify an already-built signed macOS desktop archive, without rebuilding it.
#
# `release-build.yml` uploads `desktop-darwin-arm64` (Tau-macos-arm64.zip)
# before it verifies the package, so the archive survives a failed verify for
# 7 days. Dispatch this with that run's ID to rerun `verify-macos-package.mts
# --release` on a fresh macos-15 runner in minutes instead of a ~2 h signed
# build. Dispatch it from a branch to try verifier changes against the same
# signed app.
#
# It needs no signing secrets and publishes nothing: it only reads the
# artifact and the dispatched ref's sources (fixtures and the verifier).
name: Verify desktop macOS archive
run-name: Verify desktop macOS archive from run ${{ inputs.run-id }}

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'release-build.yml run ID whose desktop-darwin-arm64 artifact to verify'
        required: true
        type: string
      channel:
        description: 'Channel the archive was packaged for'
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify the signed package
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAU_DESKTOP_CHANNEL: ${{ inputs.channel }}
      TAU_MACOS_PACKAGE_OUTPUT_ROOT: ${{ github.workspace }}/out/desktop/macos
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'

      - name: Download the signed archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-darwin-arm64
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/archive

      # ditto keeps the signature, extended attributes and notarization ticket.
      - name: Unpack Tau.app
        run: |
          mkdir -p "$TAU_MACOS_PACKAGE_OUTPUT_ROOT/Tau-darwin-arm64"
          ditto -x -k "$RUNNER_TEMP/archive/Tau-macos-arm64.zip" "$TAU_MACOS_PACKAGE_OUTPUT_ROOT/Tau-darwin-arm64"
          test -d "$TAU_MACOS_PACKAGE_OUTPUT_ROOT/Tau-darwin-arm64/Tau.app"

      - name: Verify the signed package
        run: pnpm nx run desktop:verify-macos-release
