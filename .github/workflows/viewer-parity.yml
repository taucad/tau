name: Viewer parity

# Viewer parity gate (Tau Brain research/nanoraster-viewer-parity-charter.md, W6, D2, D7): every parity fixture's
# nanoraster capture, from the options Tau sends for the viewer's camera, is within 1% mean absolute RGB difference of
# the production viewer's frame, with ambient occlusion on and off, on software GPUs.
#
# 0. `fixtures`: generates the tau-examples fixture GLBs from source (libs/tau-examples/scripts/export-parity-fixtures.mts,
#    fixtures/viewer-parity/fixtures.json names them) once per run; the GLBs are not committed. Every later job
#    downloads these same files, so the viewer and nanoraster always draw identical bytes; some exports are not
#    byte-deterministic between runs (replicad/bottle), so nothing pins their bytes. The cache key is the hash of the
#    fixtures' example sources, the exporter, the manifest and the lockfile.
# 1. `viewer` (four shards): the production viewer in headed Chromium under Xvfb on SwiftShader WebGPU. Headless
#    Chromium loses the SwiftShader WebGPU device on its first present and the viewer falls back to WebGL2; the capture
#    refuses such a frame. The software-adapter AO gate is the harness's one bypass (I2), named in the test. Each frame
#    is written twice: with the canvas's own alpha (the coverage) and as the page shows it, the canvas's premultiplied
#    bytes composited on #242424, which is what the gate compares against.
# 2. `gate` (`tau-examples:test:viewer-parity`): both nanoraster builds Tau ships render each fixture at the captured
#    camera, and the gate scores each against the viewer. The WASM build, which the web app's image worker runs, renders
#    first in headless Chromium on SwiftShader WebGPU through nanoraster's universal entry, as the worker's bundle
#    resolves it (nanoraster never presents a frame, so headless keeps the device). The native addon, which desktop,
#    the CLI and the MCP host run, renders on lavapipe (Mesa's Vulkan CPU driver). The two builds render alike on one
#    adapter; the gate reports any gap between them above 0.05 points, which here is lavapipe against SwiftShader.
#
# Until Tau's catalog moves to nanoraster 0.9.0 the gate renders with the program branch built at
# NANORASTER_PARITY_REF. At that bump (charter W8, resume P5) delete NANORASTER_PARITY_REF, the `Build nanoraster`
# steps and TAU_PARITY_NANORASTER below: the gate then loads the installed package, both its Node and its universal
# entry, and refuses one older than 0.9.0.

on:
  pull_request:
    paths:
      - '.github/workflows/viewer-parity.yml'
      - '.github/actions/setup-nx/**'
      - 'pnpm-workspace.yaml'
      - 'packages/viewer/src/**'
      - 'packages/runtime-testing/src/browser/three-renderer-output*'
      - 'packages/plugins/image/src/**'
      - 'libs/types/src/constants/viewer-render-profile*'
      - 'libs/agent-tools/src/capture/viewer-capture-options*'
      - 'libs/tau-examples/fixtures/viewer-parity/**'
      - 'libs/tau-examples/scripts/viewer-parity*'
      - 'libs/tau-examples/scripts/export-parity-fixtures.mts'
      - 'libs/tau-examples/vitest.viewer-parity.config.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/viewer-parity.yml'
      - 'pnpm-workspace.yaml'
      - 'packages/viewer/src/**'
      - 'packages/runtime-testing/src/browser/three-renderer-output*'
      - 'packages/plugins/image/src/**'
      - 'libs/types/src/constants/viewer-render-profile*'
      - 'libs/agent-tools/src/capture/viewer-capture-options*'
      - 'libs/tau-examples/fixtures/viewer-parity/**'
      - 'libs/tau-examples/scripts/viewer-parity*'
      - 'libs/tau-examples/scripts/export-parity-fixtures.mts'
      - 'libs/tau-examples/vitest.viewer-parity.config.ts'
  workflow_dispatch:
    inputs:
      nanoraster-ref:
        description: 'taucad/nanoraster commit to render with (default: NANORASTER_PARITY_REF)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: viewer-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  # nanoraster main after the viewer-parity squash merge (nanoraster#130), before the 0.9.0 release.
  NANORASTER_PARITY_REF: 291ac9106ded916af36c57237e1362c248d7960a
  PARITY_FIXTURES_OUT: out/test-results/viewer-parity/fixtures
  PARITY_VIEWER_OUT: out/test-results/viewer-parity/viewer
  PARITY_OUT: out/test-results/viewer-parity/nanoraster

jobs:
  fixtures:
    name: Fixture GLBs from tau-examples
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
      - name: Hash the fixtures' example sources
        id: sources
        run: |
          # Every file of each manifest example (`<kernel>/<example>`) but its generated thumbnail, then the exporter,
          # the manifest and the lockfile.
          {
            jq -r '.fixtures[].source | select(test("^[a-z0-9-]+/[a-z0-9-]+$"))' \
              libs/tau-examples/fixtures/viewer-parity/fixtures.json |
              while read -r example; do
                find "libs/tau-examples/src/kernels/$example" -type f ! -name thumbnail.webp
              done
            echo libs/tau-examples/scripts/export-parity-fixtures.mts
            echo libs/tau-examples/fixtures/viewer-parity/fixtures.json
            echo pnpm-lock.yaml
          } | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/parity-fixture-sources.txt"
          echo "hash=$(sha256sum "$RUNNER_TEMP/parity-fixture-sources.txt" | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: Restore the fixture GLBs
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PARITY_FIXTURES_OUT }}
          key: viewer-parity-fixtures-${{ steps.sources.outputs.hash }}
      - name: Generate the fixture GLBs
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec tsx libs/tau-examples/scripts/export-parity-fixtures.mts --out="$PARITY_FIXTURES_OUT"
      - name: Upload the fixture GLBs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-parity-fixtures
          path: ${{ env.PARITY_FIXTURES_OUT }}
          if-no-files-found: error
          retention-days: 14

  viewer:
    name: Viewer references (${{ matrix.shard }}/4)
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
      - name: Download the fixture GLBs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viewer-parity-fixtures
          path: ${{ env.PARITY_FIXTURES_OUT }}
      - name: Install Chromium and Xvfb
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Capture the viewer's frames
        env:
          TAU_E2E_WEBGPU_PROFILE: software
          PARITY_HEADED: '1'
          PARITY_SHARD: ${{ matrix.shard }}/4
        run: xvfb-run -a -s '-screen 0 1280x1024x24' pnpm nx run viewer:capture:viewer-parity
      - name: Upload the viewer references
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-parity-viewer-${{ matrix.shard }}
          path: ${{ env.PARITY_VIEWER_OUT }}
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Parity gate (nanoraster native on lavapipe, WASM on SwiftShader)
    needs: [fixtures, viewer]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NANORASTER_REF: ${{ inputs.nanoraster-ref || 'unset' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
      - name: Download the fixture GLBs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viewer-parity-fixtures
          path: ${{ env.PARITY_FIXTURES_OUT }}
      - name: Install lavapipe and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          echo 'VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json' >> "$GITHUB_ENV"
          pnpm exec playwright install --with-deps chromium
      # Build nanoraster: remove at the 0.9.0 catalog bump (see the header).
      - name: Build nanoraster (check out)
        run: |
          ref="$NANORASTER_PARITY_REF"
          if [ "$NANORASTER_REF" != 'unset' ]; then ref="$NANORASTER_REF"; fi
          checkout="$RUNNER_TEMP/nanoraster"
          git clone --filter=blob:none https://github.com/taucad/nanoraster "$checkout"
          git -C "$checkout" checkout --detach "$ref"
          echo "TAU_PARITY_NANORASTER=$checkout" >> "$GITHUB_ENV"
          echo "NANORASTER_COMMIT=$(git -C "$checkout" rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build nanoraster (cache)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/wasm-pack
            ${{ runner.temp }}/nanoraster/rust/target
          key: viewer-parity-nanoraster-wasm-${{ env.NANORASTER_COMMIT }}
          restore-keys: viewer-parity-nanoraster-
      - name: Build nanoraster (native addon and WASM)
        working-directory: ${{ runner.temp }}/nanoraster
        env:
          CARGO_BUILD_JOBS: '2'
          # nanoraster's own CI builds its WASM with this wasm-pack.
          WASM_PACK_VERSION: 0.15.0
        run: |
          rustup toolchain install
          if ! wasm-pack --version 2>/dev/null | grep -qxF "wasm-pack $WASM_PACK_VERSION"; then
            cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked --force
          fi
          pnpm install --frozen-lockfile
          pnpm run build:napi
          pnpm run build:wasm
      - name: Download the viewer references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: viewer-parity-viewer-*
          path: ${{ env.PARITY_VIEWER_OUT }}
          merge-multiple: true
      - name: Run the parity gate
        env:
          TAU_E2E_WEBGPU_PROFILE: software
        run: pnpm nx run tau-examples:test:viewer-parity
      - name: Summarize
        if: always()
        run: |
          results="$PARITY_OUT/results.json"
          if [ -f "$results" ]; then
            {
              echo "### Viewer parity against nanoraster ${NANORASTER_COMMIT:-installed}"
              echo
              jq -r '"Native: \(.adapters.native.name // "unknown"). WASM: \(.adapters.wasm.name // "unknown") in \(.browser // "unknown")."' "$results"
              echo
              echo '| Fixture | Native AO on | Native AO off | WASM AO on | WASM AO off | Gap (points) | Result |'
              echo '| --- | --- | --- | --- | --- | --- | --- |'
              jq -r 'def pct: . * 1000 | round / 1000 | tostring + "%"; def gap: ([.aoOn, .aoOff] | map(if . < 0 then -. else . end) | max * 1000 | round / 1000); .results[] | "| \(.fixture) | \(.native.aoOn.percent | pct) | \(.native.aoOff.percent | pct) | \(.wasm.aoOn.percent | pct) | \(.wasm.aoOff.percent | pct) | \(.backendGapPoints | gap) | \(if .native.pass and .wasm.pass then "pass" elif .knownFailure then "known failure" else "FAIL" end) |"' "$results"
              echo
              jq -r '.summary' "$results"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the parity results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-parity-results
          path: ${{ env.PARITY_OUT }}
          retention-days: 14
