name: Viewer parity

# Viewer parity gate (Tau Brain research/nanoraster-viewer-parity-charter.md, W6, D2, D7): every parity fixture's
# nanoraster capture, from the options Tau sends for the viewer's camera, is within 1% mean absolute RGB difference of
# the production viewer's frame, with ambient occlusion on and off, on software GPUs.
#
# 0. `fixtures`: generates the tau-examples fixture GLBs from source (libs/tau-examples/scripts/export-parity-fixtures.mts,
#    fixtures/viewer-parity/fixtures.json names them) once per run; the GLBs are not committed. Every later job
#    downloads these same files, so the viewer and nanoraster always draw identical bytes; some exports are not
#    byte-deterministic between runs (replicad/bottle), so nothing pins their bytes. The cache key is the hash of the
#    fixtures' example sources, the exporter, the manifest and the lockfile. A pull request run reads its own entries
#    and `main`'s, and an entry saved in the merge queue or on a pull request reaches no other ref, so a push to `main`
#    that changes a key input runs this job alone to save one. The release gate (`uncached`) neither reads nor saves one.
# 1. `viewer` (eight shards, VP-1): each shard deals the manifest's fixtures by measured capture seconds
#    (fixtures/viewer-parity/capture-seconds.json) with the dealer the `ci.yml` test shards use
#    (scripts/src/test-shard-dealer.ts), heaviest first to the lightest shard, so the shards partition the fixtures and
#    finish together (about 5 min of capture each); a fixture the snapshot does not list weighs its default. The gate
#    refuses a fixture with no viewer reference, so a fixture no shard captured fails the run. The production viewer in
#    headed Chromium under Xvfb on SwiftShader WebGPU. Headless
#    Chromium loses the SwiftShader WebGPU device on its first present and the viewer falls back to WebGL2; the capture
#    refuses such a frame. The software-adapter AO gate is the harness's one bypass (I2), named in the test. Each frame
#    is written twice: with the canvas's own alpha (the coverage) and as the page shows it, the canvas's premultiplied
#    bytes composited on #242424, which is what the gate compares against.
# 2. `gate` (`tau-examples:test:viewer-parity`): both nanoraster builds Tau ships render each fixture at the captured
#    camera, and the gate scores each against the viewer. The WASM build, which the web app's image worker runs, renders
#    first in headless Chromium on SwiftShader WebGPU through nanoraster's universal entry, as the worker's bundle
#    resolves it (nanoraster never presents a frame, so headless keeps the device). The native addon, which desktop,
#    the CLI and the MCP host run, renders on lavapipe (Mesa's Vulkan CPU driver). The two builds render alike on one
#    adapter; the gate reports any gap between them above 0.05 points, which here is lavapipe against SwiftShader.
#    Both builds are the nanoraster package the lockfile installs, its Node and its universal entry; the gate refuses
#    one older than 0.9.0, the release that accepts the viewer-parity options.

# Selection (VP-1, operator ruling 2026-11-18: "PR-side + release gate"). The merge queue never runs this workflow.
# - `ci.yml` calls it (`workflow_call`, with `ref`) on a ready pull request whose own diff touches a viewer-parity
#   input (its plan's VIEWER_PARITY_LANE_PATHS, the manifest's example sources and the three and nanoraster pins). The
#   required check `Run affected tasks` fails when a job here does, so a red parity run keeps the pull request out of
#   the queue. It also calls it on a push to `main` the queue did not prove, when the graph finds `tau-examples`
#   affected.
# - `release-gate.yml` calls it on the candidate commit with `uncached`: every fixture, and the verdict requires it.
# - A dispatch runs it directly. A pull request runs it on demand while it carries the `viewer-parity` label (the
#   `shell-conformance` label's pattern); every other pull request event starts a run whose jobs all skip.
# - A push to `main` that changes a fixture cache key input runs `fixtures` alone, to save the cache entry.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out (the caller's commit or the release candidate); set on every call
        type: string
        required: true
      uncached:
        description: Generate the fixture GLBs fresh, reading and saving no Actions cache (the release gate)
        type: boolean
        required: false
        default: false
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'libs/tau-examples/src/kernels/**'
      - libs/tau-examples/scripts/export-parity-fixtures.mts
      - libs/tau-examples/fixtures/viewer-parity/fixtures.json
      - pnpm-lock.yaml

permissions:
  contents: read

# A labelled pull request's newer push cancels its outdated run, and another label added to it starts a run whose jobs
# skip, in a group of its own so it cannot cancel the parity jobs already running. Every other run gets a group of its
# own (`github.run_id`) and is never cancelled here: a call (`inputs.ref` is set only on a call, and
# `github.event_name` is then the caller's event), a push and a dispatch. A superseded pull request's call is cancelled
# by `ci.yml`'s own group, and a shared group would let a newer push cancel a `main` run's parity jobs. The group never
# names `github.workflow`, which is `CI` in a called workflow and would cancel the call.
concurrency:
  group: viewer-parity-${{ github.event_name == 'pull_request' && inputs.ref == '' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}${{ github.event.action == 'labeled' && github.event.label.name != 'viewer-parity' && '-other-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && inputs.ref == '' }}

defaults:
  run:
    shell: bash

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  # No remote cache server is configured here and both targets are `cache: false`; this keeps any task they come to
  # depend on uncached as well, as the release gate requires.
  NX_SKIP_NX_CACHE: 'true'
  PARITY_FIXTURES_OUT: out/test-results/viewer-parity/fixtures
  PARITY_VIEWER_OUT: out/test-results/viewer-parity/viewer
  PARITY_OUT: out/test-results/viewer-parity/nanoraster

jobs:
  # The one label guard: `viewer` and `gate` need this job, so they skip with it. A call (`inputs.ref`) never meets it,
  # though `github.event_name` is `pull_request` in a call from a pull request's `ci.yml` run.
  fixtures:
    name: Fixture GLBs from tau-examples
    if: >-
      inputs.ref != '' ||
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'viewer-parity') &&
      (github.event.action != 'labeled' || github.event.label.name == 'viewer-parity') &&
      github.triggering_actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
      - name: Hash the fixtures' example sources
        id: sources
        run: |
          # Every file of each manifest example (`<kernel>/<example>`) but its generated thumbnail, then the exporter,
          # the manifest and the lockfile.
          {
            jq -r '.fixtures[].source | select(test("^[a-z0-9-]+/[a-z0-9-]+$"))' \
              libs/tau-examples/fixtures/viewer-parity/fixtures.json |
              while read -r example; do
                find "libs/tau-examples/src/kernels/$example" -type f ! -name thumbnail.webp
              done
            echo libs/tau-examples/scripts/export-parity-fixtures.mts
            echo libs/tau-examples/fixtures/viewer-parity/fixtures.json
            echo pnpm-lock.yaml
          } | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/parity-fixture-sources.txt"
          echo "hash=$(sha256sum "$RUNNER_TEMP/parity-fixture-sources.txt" | cut -c1-64)" >> "$GITHUB_OUTPUT"
      # The release gate reads no cache: its GLBs come from this commit's sources alone.
      - name: Restore the fixture GLBs
        id: cache
        if: ${{ !inputs.uncached }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PARITY_FIXTURES_OUT }}
          key: viewer-parity-fixtures-${{ steps.sources.outputs.hash }}
      - name: Generate the fixture GLBs
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec tsx libs/tau-examples/scripts/export-parity-fixtures.mts --out="$PARITY_FIXTURES_OUT"
      - name: Upload the fixture GLBs
        if: inputs.ref != '' || github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-parity-fixtures
          path: ${{ env.PARITY_FIXTURES_OUT }}
          if-no-files-found: error
          retention-days: 14

  # A push of its own only saves the fixture cache; a call on a push (`ci.yml`) captures and gates as any call does.
  viewer:
    name: Viewer references (${{ matrix.shard }}/8)
    needs: fixtures
    if: inputs.ref != '' || github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      # The checkout above can be a commit older than this workflow, so the apt installer comes from this
      # workflow's own commit (scripts/src/apt-resilience.test.ts).
      - name: Check out this workflow's apt installer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .tau-ci
          sparse-checkout: .github/actions/apt-install
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
      - name: Download the fixture GLBs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viewer-parity-fixtures
          path: ${{ env.PARITY_FIXTURES_OUT }}
      - name: Install Xvfb and Chromium's system dependencies
        uses: ./.tau-ci/.github/actions/apt-install
        with:
          packages: xvfb
          playwright-browsers: chromium
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Deal this shard's fixtures
        id: deal
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          fixtures=$(jq -c '[.fixtures[].name]' libs/tau-examples/fixtures/viewer-parity/fixtures.json |
            node scripts/src/test-shard-dealer.ts --shard "$SHARD" --shards 8 \
              --durations libs/tau-examples/fixtures/viewer-parity/capture-seconds.json)
          # An empty PARITY_FIXTURES captures every fixture, so a shard the deal leaves empty fails instead.
          test -n "$fixtures"
          echo "Shard fixtures: $fixtures"
          echo "fixtures=$fixtures" >> "$GITHUB_OUTPUT"
      - name: Capture the viewer's frames
        env:
          TAU_E2E_WEBGPU_PROFILE: software
          PARITY_HEADED: '1'
          PARITY_FIXTURES: ${{ steps.deal.outputs.fixtures }}
        run: xvfb-run -a -s '-screen 0 1280x1024x24' pnpm nx run viewer:capture:viewer-parity
      - name: Upload the viewer references
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-parity-viewer-${{ matrix.shard }}
          path: ${{ env.PARITY_VIEWER_OUT }}
          if-no-files-found: error
          retention-days: 14

      # FQ-1 (CI flake quarantine blueprint): the rows `@taucad/vitest-ci` wrote, one per test execution, for the
      # flake ledger. A task replayed from the cache restores its rows with the ids of the run that executed it.
      - name: Upload test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-outcomes-viewer-parity-${{ matrix.shard }}
          path: out/test-results/*/*.outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # Every fixture of the manifest, against the eight shards' references merged: the gate runs once, unsharded.
  gate:
    name: Parity gate (nanoraster native on lavapipe, WASM on SwiftShader)
    needs: [fixtures, viewer]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      # The checkout above can be a commit older than this workflow, so the apt installer comes from this
      # workflow's own commit (scripts/src/apt-resilience.test.ts).
      - name: Check out this workflow's apt installer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .tau-ci
          sparse-checkout: .github/actions/apt-install
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          save-pnpm-store: 'false'
      - name: Download the fixture GLBs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: viewer-parity-fixtures
          path: ${{ env.PARITY_FIXTURES_OUT }}
      - name: Install lavapipe and Chromium's system dependencies
        uses: ./.tau-ci/.github/actions/apt-install
        with:
          packages: mesa-vulkan-drivers
          playwright-browsers: chromium
      - name: Install Chromium and select lavapipe
        run: |
          echo 'VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json' >> "$GITHUB_ENV"
          pnpm exec playwright install chromium
      - name: Download the viewer references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: viewer-parity-viewer-*
          path: ${{ env.PARITY_VIEWER_OUT }}
          merge-multiple: true
      - name: Run the parity gate
        env:
          TAU_E2E_WEBGPU_PROFILE: software
        run: pnpm nx run tau-examples:test:viewer-parity
      - name: Summarize
        if: always()
        run: |
          results="$PARITY_OUT/results.json"
          if [ -f "$results" ]; then
            {
              echo "### Viewer parity against $(jq -r '.nanoraster.native // "nanoraster"' "$results")"
              echo
              jq -r '"Native: \(.adapters.native.name // "unknown"). WASM: \(.adapters.wasm.name // "unknown") in \(.browser // "unknown")."' "$results"
              echo
              echo '| Fixture | Native AO on | Native AO off | WASM AO on | WASM AO off | Gap (points) | Result |'
              echo '| --- | --- | --- | --- | --- | --- | --- |'
              jq -r 'def pct: . * 1000 | round / 1000 | tostring + "%"; def gap: ([.aoOn, .aoOff] | map(if . < 0 then -. else . end) | max * 1000 | round / 1000); .results[] | "| \(.fixture) | \(.native.aoOn.percent | pct) | \(.native.aoOff.percent | pct) | \(.wasm.aoOn.percent | pct) | \(.wasm.aoOff.percent | pct) | \(.backendGapPoints | gap) | \(if .native.pass and .wasm.pass then "pass" elif .knownFailure then "known failure" else "FAIL" end) |"' "$results"
              echo
              jq -r '.summary' "$results"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the parity results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-parity-results
          path: ${{ env.PARITY_OUT }}
          retention-days: 14

      # FQ-1 (CI flake quarantine blueprint): the rows `@taucad/vitest-ci` wrote, one per test execution, for the
      # flake ledger. A task replayed from the cache restores its rows with the ids of the run that executed it.
      - name: Upload test outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-outcomes-viewer-parity-gate
          path: out/test-results/*/*.outcomes.jsonl
          if-no-files-found: ignore
          retention-days: 30
