# fly.toml app configuration file generated for tau-api on 2025-02-25T12:43:15+13:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tau-api'
primary_region = 'syd'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
dockerfile = 'Dockerfile'

[deploy]
# Protected one-shot migration (B7 R8 / B8 R3): runs under the DDL identity before any new
# app machine boots; API replicas only assert schema compatibility and never migrate.
release_command = 'node /app/dist/billing-command.js migrate --environment prod-us'

[processes]
app = 'node /app/dist/main.js'
# One worker opens at most one PostgreSQL connection (billing-command postgres max: 1).
billing-recovery = 'node /app/dist/billing-command.js recover-llm-worker --environment prod-us --limit 100 --poll-milliseconds 5000'
# One Stripe/DB worker fulfils webhook-queued payment sources every five seconds and runs
# the independent journal sweep every fifteen minutes. Without it paid purchases are never credited.
billing-operations = 'node /app/dist/billing-command.js billing-operations-worker --environment prod-us --limit 100 --poll-milliseconds 5000'

[env]
NODE_ENV = 'production'
WEB_CONCURRENCY = '1'
TAU_FRONTEND_URL = 'https://tau.new'
# Replies to transactional email land here (OQ8); the mailbox must exist before this deploys.
TAU_EMAIL_REPLY_TO = 'help@tau.new'
LANGSMITH_TRACING = true
LANGSMITH_ENDPOINT = 'https://api.smith.langchain.com'
LANGSMITH_PROJECT = 'tau-api-prod'
AUTH_URL = 'https://api.tau.new'
# Browser-facing origin of this API, used to build authenticated publication file
# proxy URLs. Required by the env schema with no default.
TAU_API_URL = 'https://api.tau.new'
# Bare repositories of the Tau Hosted Remote live on the volume below
# (charter EQ13: volume + git binary).
TAU_GIT_ROOT = '/data/git'
LOG_SERVICE = 'fly'
LOG_LEVEL = 'info'
OTEL_METRICS_PORT = '9464'
OTEL_EXPORTER_OTLP_COMPRESSION = 'gzip'
# Additional CORS origin for the Netlify default domain of the prod-us site
# (`taucad-prod-us.netlify.app`). Required for pre-cutover smoke-testing the
# Netlify deploy before `tau.new` NS authority moves to Cloudflare. After
# cutover this entry can be dropped — `https://tau.new` matches
# `TAU_FRONTEND_URL` directly. No deploy-preview glob: prod-us is CI-only
# (no Git integration, no PR previews — those live on staging).
ADDITIONAL_CORS_ORIGINS = '["https://taucad-prod-us.netlify.app"]'
# TAU_S3_BUCKET, TAU_S3_ENDPOINT, TAU_S3_ACCESS_KEY_ID, TAU_S3_SECRET_ACCESS_KEY
# are pushed as Fly secrets by module.fly_api_secrets (repos/tau-cloud) — not set here.
TAU_S3_PUBLIC_BASE_URL = 'https://cdn.tau.new'
TAU_S3_REGION = 'auto'
TAU_S3_FORCE_PATH_STYLE = 'false'

# One Fly volume per app Machine: a volume attaches to exactly one Machine, so
# the repositories a Machine serves are the repositories on its own disk. The
# `app` process must stay single-Machine (or gain request routing by project)
# until a shared-storage backend exists — see the W11a report's operator items.
#
# Sized against the plan, not against today's usage (ruling OQ1, review C27).
# `storageLimitBytesByTier.pro` is 10 GiB, so a 10gb volume meant the *first*
# paying customer could fill the disk and the second could not be served at all;
# an Enterprise allowance (100 GiB) did not fit under any circumstances. Fly
# bills the provisioned size, so the volume starts at five Pro allowances and
# extends itself rather than being over-provisioned up front. Nothing in
# `apps/api` reads free disk: the plan is the quota, and a second free-disk
# quota system beside it is exactly what OQ1 declines.
[[mounts]]
source = 'tau_git_data'
destination = '/data'
initial_size = '50gb'
auto_extend_size_threshold = 80
auto_extend_size_increment = '10gb'
auto_extend_size_limit = '250gb'
processes = ['app']

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
interval = "10s"
grace_period = "30s"
method = "GET"
path = "/health/ready"
timeout = "2s"

[[metrics]]
port = 9464
path = "/metrics"
processes = ['app', 'billing-recovery', 'billing-operations']

[[vm]]
memory = '2gb'
cpu_kind = 'shared'
cpus = 1
processes = ['app']

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
processes = ['billing-recovery']

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
processes = ['billing-operations']
