# fly.toml app configuration file generated for tau-api on 2025-02-25T12:43:15+13:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tau-api'
primary_region = 'syd'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
dockerfile = 'Dockerfile'

[env]
NODE_ENV = 'production'
WEB_CONCURRENCY = '1'
TAU_FRONTEND_URL = 'https://tau.new'
LANGSMITH_TRACING = true
LANGSMITH_ENDPOINT = 'https://api.smith.langchain.com'
LANGSMITH_PROJECT = 'tau-api-prod'
AUTH_URL = 'https://api.tau.new'
# Browser-facing origin of this API, used to build authenticated publication file
# proxy URLs. Required by the env schema with no default.
TAU_API_URL = 'https://api.tau.new'
LOG_SERVICE = 'fly'
LOG_LEVEL = 'info'
OTEL_METRICS_PORT = '9464'
OTEL_EXPORTER_OTLP_COMPRESSION = 'gzip'
# Additional CORS origin for the Netlify default domain of the prod-us site
# (`taucad-prod-us.netlify.app`). Required for pre-cutover smoke-testing the
# Netlify deploy before `tau.new` NS authority moves to Cloudflare. After
# cutover this entry can be dropped — `https://tau.new` matches
# `TAU_FRONTEND_URL` directly. No deploy-preview glob: prod-us is CI-only
# (no Git integration, no PR previews — those live on staging).
ADDITIONAL_CORS_ORIGINS = '["https://taucad-prod-us.netlify.app"]'
# TAU_S3_BUCKET, TAU_S3_ENDPOINT, TAU_S3_ACCESS_KEY_ID, TAU_S3_SECRET_ACCESS_KEY
# are pushed as Fly secrets by module.fly_api_secrets (repos/tau-cloud) — not set here.
TAU_S3_PUBLIC_BASE_URL = 'https://cdn.tau.new'
TAU_S3_REGION = 'auto'
TAU_S3_FORCE_PATH_STYLE = 'false'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
interval = "10s"
grace_period = "30s"
method = "GET"
path = "/health/ready"
timeout = "2s"

[metrics]
port = 9464
path = "/metrics"

[[vm]]
memory = '2gb'
cpu_kind = 'shared'
cpus = 1
