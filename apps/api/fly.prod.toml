# fly.toml app configuration file generated for tau-api on 2025-02-25T12:43:15+13:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tau-api'
primary_region = 'syd'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
dockerfile = 'Dockerfile'

[deploy]
# Protected one-shot migration (B7 R8 / B8 R3): runs under the DDL identity before any new
# app machine boots; API replicas only assert schema compatibility and never migrate.
release_command = 'node /app/dist/billing-command.js migrate --environment prod-us'
# Rolling, not bluegreen (charter W8): with `app` at two or more Machines a rolling
# deploy replaces them one at a time and the group never reaches zero, and it replaces
# a single-Machine group in place — so `revisions-maintenance` is never briefly two
# Machines, which a bluegreen green set would be and D21 forbids.
strategy = 'rolling'

[processes]
app = 'node /app/dist/main.js'
# One worker opens at most one PostgreSQL connection (billing-command postgres max: 1).
billing-recovery = 'node /app/dist/billing-command.js recover-llm-worker --environment prod-us --limit 100 --poll-milliseconds 5000'
# One Stripe/DB worker fulfils webhook-queued payment sources, charges consented automatic
# reloads (only once BILLING_LIVE_COLLECTION_ENABLED=true), cancels closed accounts' subscriptions
# and runs the scheduled sweeps. Without it paid purchases are never credited. Run exactly one
# Machine: `fly scale count billing-operations=1 billing-recovery=1`.
billing-operations = 'node /app/dist/billing-command.js billing-operations-worker --environment prod-us --limit 100 --poll-milliseconds 5000'
# Charter D21: purge, LFS retirement, blob collection and restore must run once, not
# in every `app` replica — `assertSingletonProcessGroup` refuses to run in the `app`
# group at all. Each subcommand is a one-shot that exits, so the group wraps them the
# way the billing workers poll: do a pass, sleep, do it again. Run exactly one
# Machine: `fly scale count app=2 revisions-maintenance=1`.
#
# All three periodic subcommands are here, and `retire-lfs` is why the list matters:
# its 30-day window (`lfsRetirementWindowMilliseconds`) has no other caller anywhere
# in the app — no `@Cron`, no scheduler — so a loop that omits it is a retirement
# that never happens.
#
# `|| exit 1` on each: the command sets a non-zero exit only on a real failure, and
# without this the shell would swallow it, sleep, and go on looking alive forever.
# Exiting hands the failure to Fly's restart policy, which is the one signal this
# group has: it is deliberately outside `[[metrics]]` and has no health check. A
# refusal is *not* a failure and does not trip this — a purge that skips an owner
# over the confirmation bound, or a tombstone whose user row is still live, records
# the outcome and exits 0, so the pass continues to the next subcommand.
#
# Restore is operator-invoked on this Machine (`fly ssh console`), and reads the
# `TAU_S3_RESTORE_*` family — Fly secrets, never values in this file.
# ponytail: a 24 h sleep keeps one 512 MB Machine up for a nightly pass. If that idle
# cost matters, give `maintenance-command.ts` a `--poll-milliseconds` mode like the
# billing workers, or move the group to a scheduled Machine.
revisions-maintenance = "sh -c 'while true; do node /app/dist/maintenance-command.js purge || exit 1; node /app/dist/maintenance-command.js retire-lfs || exit 1; node /app/dist/maintenance-command.js collect-blobs || exit 1; sleep 86400; done'"

[env]
NODE_ENV = 'production'
WEB_CONCURRENCY = '1'
TAU_FRONTEND_URL = 'https://tau.new'
# Replies to transactional email land here (OQ8); the mailbox must exist before this deploys.
TAU_EMAIL_REPLY_TO = 'help@tau.new'
LANGSMITH_TRACING = true
LANGSMITH_ENDPOINT = 'https://api.smith.langchain.com'
LANGSMITH_PROJECT = 'tau-api-prod'
AUTH_URL = 'https://api.tau.new'
# Browser-facing origin of this API, used to build authenticated publication file
# proxy URLs. Required by the env schema with no default.
TAU_API_URL = 'https://api.tau.new'
LOG_SERVICE = 'fly'
LOG_LEVEL = 'info'
OTEL_METRICS_PORT = '9464'
OTEL_EXPORTER_OTLP_COMPRESSION = 'gzip'
# Additional CORS origin for the Netlify default domain of the prod-us site
# (`taucad-prod-us.netlify.app`). Required for pre-cutover smoke-testing the
# Netlify deploy before `tau.new` NS authority moves to Cloudflare. After
# cutover this entry can be dropped — `https://tau.new` matches
# `TAU_FRONTEND_URL` directly. No deploy-preview glob: prod-us is CI-only
# (no Git integration, no PR previews — those live on staging).
ADDITIONAL_CORS_ORIGINS = '["https://taucad-prod-us.netlify.app"]'
# TAU_S3_BUCKET, TAU_S3_ENDPOINT, TAU_S3_ACCESS_KEY_ID, TAU_S3_SECRET_ACCESS_KEY
# are pushed as Fly secrets by module.fly_api_secrets (repos/tau-cloud) — not set here.
TAU_S3_PUBLIC_BASE_URL = 'https://cdn.tau.new'
TAU_S3_REGION = 'auto'
TAU_S3_FORCE_PATH_STYLE = 'false'

# No `[[mounts]]`. Charter S3/D1: the durable state of the Hosted Remote is the
# object store, leases are ephemeral working copies under the Machine's own
# `os.tmpdir()`, and `TAU_GIT_ROOT` now refuses boot. A volume here would attach to
# exactly one Machine and take the `app` group back to one. The old sizing argument
# (ruling OQ1, review C27 — a volume large enough for several Pro allowances) is
# retired with it: bytes are the plan's quota, in a bucket that has no size.
#
# DG4 must delete the `tau_git_data` volumes by hand after the deploy: `fly deploy`
# leaves an orphaned volume in place rather than destroying data.

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
# Charter S2: two or more API processes serve the same repository concurrently, with
# no shared disk and no cross-process lock. Two is also the floor a rolling deploy
# needs to keep one Machine serving; the count itself is `fly scale count app=2`.
min_machines_running = 2
processes = ['app']

[[http_service.checks]]
interval = "10s"
grace_period = "30s"
method = "GET"
path = "/health/ready"
timeout = "2s"

[[metrics]]
port = 9464
path = "/metrics"
# `revisions-maintenance` is deliberately absent: its command opens no metrics
# server, so scraping it would only produce a permanently failing target.
processes = ['app', 'billing-recovery', 'billing-operations']

# The rootfs is now the capacity knob the retired volume used to be: a lease is a
# temporary working copy under `os.tmpdir()`, and admission refuses one when
# `concurrent leases × 2.5 GiB` (W0a's measured figure at D20's 1 GiB ceiling)
# exceeds the free bytes `statfs` reports. On Fly's default 8 GiB rootfs, minus the
# image and the pruned deploy tree, that is two ceiling-sized leases at once and a
# third only if the image is smaller than it looks — admission reads the real free
# bytes, so the number self-corrects and the figure here is not a contract. Raise
# the rootfs before raising the ceiling.
[[vm]]
memory = '2gb'
cpu_kind = 'shared'
cpus = 1
processes = ['app']

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
processes = ['billing-recovery']

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
processes = ['billing-operations']

# Restore hydrates a repository through a lease of its own, so this Machine wants the
# same lease headroom an `app` Machine has; the purge and collector passes stream
# keys and need almost none.
[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
processes = ['revisions-maintenance']
