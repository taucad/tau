# fly.toml app configuration file for staging environment (api.taucad.dev)
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tau-api-staging'
primary_region = 'syd'
kill_signal = 'SIGTERM'
# 120 s, not Fly's 5 s default nor the 30 s it was: the API drains in-flight model
# steps before it stops (`app/lifecycle/graceful-shutdown.ts`, `shutdownPhases`), and a
# step cut by a deploy costs the person the step. A longer window slows a rolling
# deploy only while a step is still streaming. Change both together.
kill_timeout = '120s'

[build]
dockerfile = 'Dockerfile'

[deploy]
# Protected one-shot migration (B7 R8 / B8 R3): runs under the DDL identity before any new
# app machine boots; API replicas only assert schema compatibility and never migrate.
# It also owns the tariff: with TAU_CLOUD_ENABLED=true it derives the commercial policy from
# this image's code route table over the BILLING_COMMERCIAL_POLICY secret and publishes it
# when the content moved, honouring the 30-day notice rule. A commercial-only change is
# therefore a Terraform apply plus a redeploy of the serving image, with no rebuild.
release_command = 'node /app/dist/billing-command.js migrate --environment staging'
# Rolling, not bluegreen (charter W8): with `app` at two or more Machines a rolling
# deploy replaces them one at a time and the group never reaches zero, and it replaces
# a single-Machine group in place — so `revisions-maintenance` is never briefly two
# Machines, which a bluegreen green set would be and D21 forbids.
strategy = 'rolling'

[processes]
app = 'node /app/dist/main.js'
# One Stripe/DB worker fulfils webhook-queued payment sources, charges consented automatic
# reloads, cancels closed accounts' subscriptions and runs the scheduled sweeps. Run exactly one
# Machine: `fly scale count billing-operations=1`. It opens at most one PostgreSQL
# connection (billing-command postgres max: 1).
# LLM hold recovery has no process group: every `app` Machine runs it in-process
# (`BillingRecoveryScheduler`, `BILLING_RECOVERY_INTERVAL_MS`) and emits its metrics.
# The `billing-recovery` group was retired; `recover-llm-worker` remains as optional
# scale-out if a backlog ever outruns the in-API clock.
billing-operations = 'node /app/dist/billing-command.js billing-operations-worker --environment staging --limit 100 --poll-milliseconds 5000'
# Charter D21: exactly one maintenance Machine, never an app replica.
# Recovery runs every 60 seconds with a 50-second storage budget; daily heavy
# work runs independently and processes project cleanup before tenant cleanup.
# Each pass records durable liveness; status requires recovery within 120 seconds.
# One connection per lane (pool cap 2); the singleton remains at 512 MiB.
# Restore remains operator-invoked using TAU_S3_RESTORE_* secrets.
# DC4: this group is moving to the private app in `apps/maintenance/fly.staging.toml`,
# which holds in standby (TAU_MAINTENANCE_STANDBY) while this line exists. Do not
# remove it here alone: the cutover scales this group to zero, deletes this line,
# its `[[vm]]` and the standby flag there in one reviewed change, after the new
# app is deployed and healthy (`app/maintenance-app.test.ts` enforces the pairing).
revisions-maintenance = "node /app/dist/maintenance-command.js worker"

[env]
NODE_ENV = 'production'
WEB_CONCURRENCY = '1'
TAU_FRONTEND_URL = 'https://taucad.dev'
LANGSMITH_TRACING = true
LANGSMITH_ENDPOINT = 'https://api.smith.langchain.com'
LANGSMITH_PROJECT = 'tau-api-staging'
AUTH_URL = 'https://api.taucad.dev'
# Browser-facing origin of this API, used to build authenticated publication file
# proxy URLs. Required by the env schema with no default.
TAU_API_URL = 'https://api.taucad.dev'
LOG_SERVICE = 'fly'
LOG_LEVEL = 'info'
OTEL_METRICS_PORT = '9464'
OTEL_EXPORTER_OTLP_COMPRESSION = 'gzip'
DATABASE_POOL_MAX = '10'
DATABASE_CONNECT_TIMEOUT_SECONDS = '10'
DATABASE_IDLE_TIMEOUT_SECONDS = '60'
DATABASE_STATEMENT_TIMEOUT_MS = '15000'
DATABASE_LOCK_TIMEOUT_MS = '5000'
DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS = '15000'
DATABASE_RUNTIME_ROLE = 'tau_api_runtime'
# Additional CORS origins for the Netlify-hosted UI:
#   - https://deploy-preview-*--taucad.netlify.app : per-PR Netlify deploy previews
#   - https://taucad.netlify.app                   : Netlify default domain for the `taucad` site
# The narrow `deploy-preview-*` glob is intentional — do not broaden to `*--taucad.netlify.app`,
# which would silently allow non-PR branch deploys (currently disabled per allowed_branches).
ADDITIONAL_CORS_ORIGINS = '["https://deploy-preview-*--taucad.netlify.app","https://taucad.netlify.app"]'
# TAU_AUTH_ALLOWED_EMAIL_DOMAINS (the staging sign-in allowlist) is a Fly secret written by Tau Cloud's
# staging stack, not set here: staging's Stripe sandbox accepts test cards, so open sign-up would let
# anyone buy credit that spends real supplier keys. Production leaves it unset.
# TAU_S3_BUCKET, TAU_S3_ENDPOINT, TAU_S3_ACCESS_KEY_ID, TAU_S3_SECRET_ACCESS_KEY
# are pushed as Fly secrets by module.fly_api_secrets (repos/tau-cloud) — not set here.
TAU_S3_PUBLIC_BASE_URL = 'https://cdn.taucad.dev'
# DC1: git RPCs are forwarded to the private tau-storage app over its Flycast
# address (apps/storage/fly.staging.toml). Set together with the secrets
# TAU_STORAGE_GRANT_SIGNING_KEY and TAU_STORAGE_RECEIPT_PUBLIC_KEYS, which a
# production-mode boot requires once this is set (tau-cloud P2.5).
TAU_STORAGE_URL = 'http://tau-storage-staging.flycast'
# DC2: rank each project over the members tau-storage answers on /v1/members and
# send it to its first choice through Flycast, spilling once. CI deploys
# tau-storage before this app, so the members list exists first.
TAU_STORAGE_AFFINITY = 'rendezvous'
TAU_S3_REGION = 'auto'
TAU_S3_FORCE_PATH_STYLE = 'false'
# Files service (tau-cloud files gates): LFS downloads are links to the files
# Worker instead of presigned R2 URLs. Needs the Fly secret
# TAU_FILES_LINK_SIGNING_KEY, which tau-cloud's staging stack writes (gate 3,
# tau-cloud#136; docs/files-service-runbook.md "Apply order").
# Remove this line and redeploy to roll back to presigned downloads.
TAU_FILES_BASE_URL = 'https://files.taucad.dev'
# Runtime Observability PR-2: staging records runtime telemetry entries (on | off | paused-until:<ISO>).
TAU_RUNTIME_TELEMETRY = 'on'

# No `[[mounts]]`. Charter S3/D1: the durable state of the Hosted Remote is the
# object store, leases are ephemeral working copies under the Machine's own
# `os.tmpdir()`, and `TAU_GIT_ROOT` now refuses boot. A volume here would attach to
# exactly one Machine and take the `app` group back to one.
#
# DG4 must delete the `tau_git_data` volumes by hand after the deploy: `fly deploy`
# leaves an orphaned volume in place rather than destroying data, and Fly bills its
# provisioned size. Staging deploys itself on a merge to `main`, so this is the
# environment where an orphan is easiest to forget.

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
# Charter S2: two or more API processes serve the same repository concurrently, with
# no shared disk and no cross-process lock. Two is also the floor a rolling deploy
# needs to keep one Machine serving; the count itself is `fly scale count app=2`.
min_machines_running = 2
processes = ['app']

# FR11 (DC1): a push is silent between its last body byte and tau-storage's
# compare-and-swap for up to the 5-minute commit deadline, and the client's
# connection to this proxy is idle for all of it. 600 s is the deadline plus
# margin, the same value as tau-storage's Flycast service; DB2 measures it.
[http_service.http_options]
idle_timeout = 600

[[http_service.checks]]
interval = "10s"
grace_period = "30s"
method = "GET"
path = "/health/ready"
timeout = "2s"

[[metrics]]
port = 9464
path = "/metrics"
# `revisions-maintenance` is deliberately absent: its command opens no metrics
# server, so scraping it would only produce a permanently failing target.
processes = ['app', 'billing-operations']

# The rootfs is now the capacity knob the retired volume used to be: a lease is a
# temporary working copy under `os.tmpdir()`, and admission refuses one when its
# real-byte reservation does not fit in the free bytes `statfs` reports less what
# admitted leases still have to write (DA3): a fetch reserves its packs plus a
# 64 MiB floor, a push adds its quarantine bound (what is left of the plan or of
# D20's 1 GiB ceiling, plus 64 MiB of slack). On Fly's default 8 GiB rootfs, about
# 7.3 GiB free on staging, that is over a hundred fetches of a KiB repository, six
# fetches of a 1 GiB one, or about six pushes at once. Admission reads the real free
# bytes, so the numbers self-correct and the figures here are not a contract. Raise
# the rootfs before raising the ceiling.
[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
processes = ['app']

# F-10: 512 MB, not 256. The worker loads the API's dependency graph (Nest, the drizzle
# schema, Stripe, react-email through EmailService, OTel auto-instrumentations) and
# measured ~213 MiB peak RSS locally; staging OOM-killed it twice at 256 MB, once with
# a one-shot `billing-command.js` run inside it and once on a failing pass alone. One-shot
# `billing-command.js` runs (`recover-payments`, `lifecycle`, `pause-route`, `resume-route`,
# `export-supplier-legacy` and the like) belong on an `app` Machine (`fly ssh console -g app`),
# never inside this worker.
[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
processes = ['billing-operations']

# Restore copies packs from the source bucket to the primary as streams (DA4) and takes
# no lease, so it needs no lease headroom; the purge and collector passes stream keys
# and need almost none either.
[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
processes = ['revisions-maintenance']
