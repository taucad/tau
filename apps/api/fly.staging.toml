# fly.toml app configuration file for staging environment (api.taucad.dev)
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tau-api-staging'
primary_region = 'syd'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
dockerfile = 'Dockerfile'

[deploy]
# Protected one-shot migration (B7 R8 / B8 R3): runs under the DDL identity before any new
# app machine boots; API replicas only assert schema compatibility and never migrate.
release_command = 'node /app/dist/billing-command.js migrate --environment staging'

[processes]
app = 'node /app/dist/main.js'
# One worker opens at most one PostgreSQL connection (billing-command postgres max: 1).
billing-recovery = 'node /app/dist/billing-command.js recover-llm-worker --environment staging --limit 100 --poll-milliseconds 5000'
# One Stripe/DB worker fulfils webhook-queued payment sources every five seconds and runs
# the independent journal sweep every fifteen minutes.
billing-operations = 'node /app/dist/billing-command.js billing-operations-worker --environment staging --limit 100 --poll-milliseconds 5000'
# One collection-authority worker executes consented automatic reload charges; without it
# an enabled reload consent never charges. It refuses to start outside Stripe test mode.
billing-reload = 'node /app/dist/billing-command.js billing-reload-worker --environment staging --limit 100 --poll-milliseconds 15000'

[env]
NODE_ENV = 'production'
WEB_CONCURRENCY = '1'
TAU_FRONTEND_URL = 'https://taucad.dev'
LANGSMITH_TRACING = true
LANGSMITH_ENDPOINT = 'https://api.smith.langchain.com'
LANGSMITH_PROJECT = 'tau-api-staging'
AUTH_URL = 'https://api.taucad.dev'
# Browser-facing origin of this API, used to build authenticated publication file
# proxy URLs. Required by the env schema with no default.
TAU_API_URL = 'https://api.taucad.dev'
# Bare repositories of the Tau Hosted Remote live on the volume below
# (charter EQ13: volume + git binary).
TAU_GIT_ROOT = '/data/git'
LOG_SERVICE = 'fly'
LOG_LEVEL = 'info'
OTEL_METRICS_PORT = '9464'
OTEL_EXPORTER_OTLP_COMPRESSION = 'gzip'
DATABASE_POOL_MAX = '10'
DATABASE_CONNECT_TIMEOUT_SECONDS = '10'
DATABASE_IDLE_TIMEOUT_SECONDS = '60'
DATABASE_STATEMENT_TIMEOUT_MS = '15000'
DATABASE_LOCK_TIMEOUT_MS = '5000'
DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS = '15000'
DATABASE_RUNTIME_ROLE = 'tau_api_runtime'
# Additional CORS origins for the Netlify-hosted UI:
#   - https://deploy-preview-*--taucad.netlify.app : per-PR Netlify deploy previews
#   - https://taucad.netlify.app                   : Netlify default domain for the `taucad` site
# The narrow `deploy-preview-*` glob is intentional — do not broaden to `*--taucad.netlify.app`,
# which would silently allow non-PR branch deploys (currently disabled per allowed_branches).
ADDITIONAL_CORS_ORIGINS = '["https://deploy-preview-*--taucad.netlify.app","https://taucad.netlify.app"]'
# TAU_S3_BUCKET, TAU_S3_ENDPOINT, TAU_S3_ACCESS_KEY_ID, TAU_S3_SECRET_ACCESS_KEY
# are pushed as Fly secrets by module.fly_api_secrets (repos/tau-cloud) — not set here.
TAU_S3_PUBLIC_BASE_URL = 'https://cdn.taucad.dev'
TAU_S3_REGION = 'auto'
TAU_S3_FORCE_PATH_STYLE = 'false'

# One Fly volume per app Machine: a volume attaches to exactly one Machine, so
# the repositories a Machine serves are the repositories on its own disk. The
# `app` process must stay single-Machine (or gain request routing by project)
# until a shared-storage backend exists — see the W11a report's operator items.
#
# Sized against the plan, not against today's usage (ruling OQ1, review C27).
# Staging carries seeded Pro accounts rather than customers, so it starts at one
# Pro allowance (10 GiB) and extends; prod starts at five. See `fly.prod.toml`
# for why this is a volume setting and not a free-disk check in code.
[[mounts]]
source = 'tau_git_data'
destination = '/data'
initial_size = '10gb'
auto_extend_size_threshold = 80
auto_extend_size_increment = '5gb'
auto_extend_size_limit = '50gb'
processes = ['app']

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
interval = "10s"
grace_period = "30s"
method = "GET"
path = "/health/ready"
timeout = "2s"

[[metrics]]
port = 9464
path = "/metrics"
processes = ['app', 'billing-recovery', 'billing-operations', 'billing-reload']

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
processes = ['app']

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
processes = ['billing-recovery']

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
processes = ['billing-operations']

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
processes = ['billing-reload']
