StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google, proselint
Vocab = tau
IgnoredScopes = code, tt, frontmatter

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Google, proselint, tau

# Tau addresses CAD developers; spelling out established format and platform initialisms adds noise.
Google.Acronyms = NO
# Runtime objects own, observe, and expose state as precise API responsibilities.
Google.Anthropomorphism = NO
# Definition labels, protocol fields, and ordered steps retain intentional capitalization after colons.
Google.Colons = NO
# Explicit negatives are clearer than contractions in lifecycle and failure contracts.
Google.Contractions = NO
# Tau's house style uses spaced em dashes, as DESIGN.md does.
Google.EmDash = NO
# Tau.Marketing handles unearned claims without flagging formal guarantees or comparative fit.
Google.ExcessiveClaims = NO
# API symbols and navigational headings retain exact casing instead of forced sentence case.
Google.Headings = NO
# Questions and exact API syntax are valid task-first heading punctuation.
Google.HeadingPunctuation = NO
# Compact Latin abbreviations are established notation in dense technical reference prose.
Google.Latin = NO
# Hyphenated import and build terms retain deliberate compound boundaries.
Google.LyHyphens = NO
# The Oxford-comma heuristic misreads contrast clauses and chained protocol outcomes as lists.
Google.OxfordComma = NO
# Parentheses carry signatures, units, and compact technical qualifiers in reference prose.
Google.Parens = NO
# Actorless passive voice is precise for state transitions and protocol outcomes.
Google.Passive = NO
# Rendered diagram copy is authored as JavaScript string literals inside MDX expressions.
Google.Quotes = NO
# Semicolons compact paired protocol constraints without adding filler.
Google.Semicolons = NO
# Timing literals mirror runtime options and traces; the same rule also misreads HTTP 404s as seconds.
Google.Units = NO
# Future tense states deterministic postconditions in tutorials and lifecycle contracts.
Google.Will = NO
