# The www.npmjs.com pass of the docs link check (`.github/workflows/docs-links.yml`).
# npm's website answers automated clients with 403 Forbidden whatever the page: run
# 41444006152 got 403 for the published `@taucad/image` and `@taucad/camera`, and a package that
# does not exist gets the same 403 (checked 2026-11-09). So this pass accepts 403 in addition to
# lychee's 2xx default; it still fails on a DNS, TLS or connection error, a timeout, or any other
# status, but it cannot tell a missing package from a published one. It checks only
# www.npmjs.com links; `lychee.toml` checks every other link and never accepts 403.
scheme = ["https", "http"]
no_progress = true
cache = true
max_cache_age = "12h"
include = ['^https://www\.npmjs\.com/']
exclude = ['.*']
accept = ["200..=299", "403"]
