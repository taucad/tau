# External links of the published docs (`.github/workflows/docs-links.yml`). Every https/http
# link is checked with lychee's default accepted statuses, except www.npmjs.com, which
# `lychee.npmjs.toml` checks in a second pass: npm answers automated clients with 403, so that
# pass alone accepts 403, for that host alone. This config never accepts 403.
scheme = ["https", "http"]
no_progress = true
# The cache is shared with the daily sweep; 12 h keeps a cached success younger than the gap
# between two sweeps, so every link is fetched again at least once a day.
cache = true
max_cache_age = "12h"
exclude = ['^https://www\.npmjs\.com/']
