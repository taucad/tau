[package]
name = "tau-openscad-language"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "OpenSCAD language server compiled to WebAssembly for the Tau source editor"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.145"
tree-sitter = { version = "0.27.1", default-features = false }
tree-sitter-language = "0.1.9"

[build-dependencies]
cc = "1.2.41"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
