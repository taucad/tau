# Netlify configuration for Tau UI — shared by staging (`taucad`, taucad.dev) and
# production (`taucad-prod-us`, tau.new).
#
# This file is **build config only**: commands, `[dev]`, and `[[headers]]`.
# Per-site `TAU_*`, `NODE_ENV`, runtime configuration live in the Netlify
# dashboard via Terraform (`repos/tau-cloud/stacks/cloud/{staging,prod-us}`).
# Pattern follows novuhq/novu: one `netlify.toml` shape, sites differ by dashboard env.
#
# Triggers: Netlify no longer builds from Git (`deploy_mode = "ci"` in tau-cloud).
# GitHub Actions runs this build with `netlify deploy --prod --context production`
# (`.github/workflows/deploy-ui.yml`), after bringing in the GeoSpec engine
# products that only CI's macOS producer can make:
#   - staging: pushes to `main` that affect the UI (`ci.yml` deploy-ui-staging).
#   - prod: pushes to Git branch `production`, made only by dispatching
#     `.github/workflows/deploy-production.yml` with a release tag.
# There are no PR deploy previews.
#
# SOURCE MAPS: GitHub Actions supplies and validates a separate PostHog personal
# key/project ID per environment. Netlify stores no source-map credentials.
# Actions requires both PostHog and Sentry uploads in both environments.
# Public analytics keys are independent.
#
# Actions installs the workspace's development dependencies before this build.
# Use Nx's default TypeScript transpiler for config imports and dependency builds.

[build]
# Vendored engine licences must clear before any deploy artifact is built.
# Paths relative to site base directory (`apps/ui`, set in Terraform).
command = "pnpm nx run tscircuit:check-vendored-licenses && pnpm nx build ui && ([ \"$TAU_SOURCEMAPS_ENABLED\" = true ] && SENTRY_AUTH_TOKEN=\"$TAU_SENTRY_AUTH_TOKEN\" POSTHOG_CLI_TOKEN=\"$TAU_POSTHOG_CLI_TOKEN\" POSTHOG_CLI_ENV_ID=\"$TAU_POSTHOG_CLI_ENV_ID\" pnpm nx run ui:sourcemaps || { [ \"$TAU_SOURCEMAPS_OPTIONAL\" = true ] && echo \"Warning: source map upload disabled or failed; continuing because TAU_SOURCEMAPS_OPTIONAL=true.\"; })"
publish = "build/client"

[build.environment]
# Temporary: current Netlify plan cannot create Builds-scoped secrets.
NX_NO_CLOUD = "true"

# The React Router plugin writes the SSR function to `.netlify/v1/functions`
# under this base. Naming that directory makes Netlify bundle the function from
# its real path, where its import of `build/server/server.js` resolves, as a
# user function that outranks the copy `deploy-ui.yml` exposes as a framework
# function through its `.netlify` link (which ships without the server build).
[functions]
directory = ".netlify/v1/functions"

[context.production]
command = "pnpm nx run tscircuit:check-vendored-licenses && pnpm nx build ui && ([ \"$TAU_SOURCEMAPS_ENABLED\" = true ] && SENTRY_AUTH_TOKEN=\"$TAU_SENTRY_AUTH_TOKEN\" POSTHOG_CLI_TOKEN=\"$TAU_POSTHOG_CLI_TOKEN\" POSTHOG_CLI_ENV_ID=\"$TAU_POSTHOG_CLI_ENV_ID\" pnpm nx run ui:sourcemaps || { [ \"$TAU_SOURCEMAPS_OPTIONAL\" = true ] && echo \"Warning: source map upload disabled or failed; continuing because TAU_SOURCEMAPS_OPTIONAL=true.\"; })"

[context.deploy-preview]
command = "pnpm nx run tscircuit:check-vendored-licenses && pnpm nx build ui"

[context.branch-deploy]
command = "pnpm nx run tscircuit:check-vendored-licenses && pnpm nx build ui"

[dev]
command = "pnpm nx dev ui"
targetPort = 3000
autoLaunch = false

[dev.environment]
NODE_ENV = "development"
TAU_API_URL = "http://localhost:4000"
TAU_FRONTEND_URL = "http://localhost:3000"
TAU_WEBSOCKET_URL = "ws://localhost:4001"

# Marketing site: `netlify/edge-functions/marketing.ts` proxies a full load of
# `/` and the apps/www pages to the deploy named by the `MARKETING_ORIGIN` site
# variable (set per site in tau-cloud). Unset, every request reaches the app.

# The docs site serves documentation at its root, so the old runtime-scoped
# LLM indexes are replaced by its top-level ones rather than moving verbatim.
[[redirects]]
from = "/docs/runtime/llms.txt"
to = "https://docs.tau.new/llms.txt"
status = 301
force = true

[[redirects]]
from = "/docs/runtime/llms-full.txt"
to = "https://docs.tau.new/llms-full.txt"
status = 301
force = true

[[redirects]]
from = "/docs"
to = "https://docs.tau.new/"
status = 301
force = true

[[redirects]]
from = "/docs/*"
to = "https://docs.tau.new/:splat"
status = 301
force = true

[[redirects]]
from = "/docs.mdx"
to = "https://docs.tau.new/docs.mdx"
status = 301
force = true

[[redirects]]
from = "/llms-full.txt"
to = "https://docs.tau.new/llms-full.txt"
status = 301
force = true

[[redirects]]
from = "/llms.mdx"
to = "https://docs.tau.new/llms.txt"
status = 301
force = true

[[redirects]]
from = "/llms.mdx/*"
to = "https://docs.tau.new/llms.mdx/:splat"
status = 301
force = true

[[headers]]
for = "/*"
[headers.values]
# XSS Protection
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
# Clickjacking Protection
X-Frame-Options = "DENY"
# HSTS (forces HTTPS)
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
# Referrer Policy
Referrer-Policy = "strict-origin-when-cross-origin"
# Permissions Policy (Feature Policy)
Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), usb=(), interest-cohort=()"
# Cross-Origin Policies
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
Cross-Origin-Embedder-Policy = "require-corp"
# JavaScript Profiling
Document-Policy = "js-profiling"
# Static-file policy; SSR documents set the matching policy in
# app/lib/content-security-policy.server.ts. entry.server.test.tsx checks parity.
# Netlify custom headers do not apply to function responses.
# Content Security Policy (CSP) - Start with report-only mode
# NOTE: Test thoroughly before switching to enforcing mode
# Remove '-Report-Only' suffix to enforce
# connect-src allowlist:
#   - 'self' covers same-origin SSR fetches (proxied PostHog at /api/ph,
#     health endpoints).
#   - https://api.zoo.dev / https://api.kittycad.io: Zoo external converter API
#     used by the @taucad/runtime transcoder pipeline (server-to-server).
#   - https://api.tau.new + wss://api.tau.new: explicit production API +
#     Socket.IO endpoint. Listed explicitly so when CSP flips to enforcing
#     (report-only first) we don't rely on the catch-all `wss:` and any unintended hop is
#     immediately reported.
#   - https://*.ingest.sentry.io / https://*.ingest.us.sentry.io: Sentry browser
#     error reports (launch gate OBS-7), sent only when SENTRY_DSN is set.
#   - https://registry.npmjs.org: packuments and tarballs for the Packages
#     panel's Install (tarballs are checked against package-lock.json integrity).
Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.taucad.dev https://cdn.tau.new https://github.com https:; font-src 'self' data:; connect-src 'self' https://tau-prod-content-private.271cffba9907a76320b6a4993f756601.r2.cloudflarestorage.com https://tau-staging-content-private.271cffba9907a76320b6a4993f756601.r2.cloudflarestorage.com https://api.taucad.dev wss://api.taucad.dev https://cdn.taucad.dev https://cdn.tau.new https://api.github.com https://api.zoo.dev https://api.kittycad.io https://api.tau.new wss://api.tau.new https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://registry.npmjs.org wss:; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

# The apex selects marketing or the app from a presentation cookie. Never reuse
# one visitor's document for another, or restore stale HTML after switching.
[[headers]]
for = "/"
[headers.values]
Cache-Control = "private, no-store"
CDN-Cache-Control = "no-store"
Netlify-CDN-Cache-Control = "no-store"

# Content-hashed Vite bundles + WASM (immutable filenames)
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Netlify-CDN-Cache-Control = "public, durable, max-age=31536000"

[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=2592000"
Netlify-CDN-Cache-Control = "public, durable, max-age=2592000"

[[headers]]
for = "/*.svg"
[headers.values]
Cache-Control = "public, max-age=86400"
Netlify-CDN-Cache-Control = "public, durable, max-age=86400"
