\* The target, labelled, at one project, one journal row, one mutation and one access question resting on one
\* read, so the graph stays under 1 MB (graphs.LibraryCatalog). No SYMMETRY: the export records every transition.
SPECIFICATION Spec
CONSTANTS
 Projects = {p1}
 Rows = {r1, r2}
 InitRows = {r1}
 Ops = {"create", "delete"}
 Questions = {q1}
 Reads = 1
 MaxMutations = 1
 MaxCrashes = 0
 MaxStops = 0
 MaxBumps = 0
 MaxPolls = 0
 MaxEnvChange = 0
 MaxEnvAdd = 0
 MaxEnvSettle = 0
 MaxWorkspaceLoss = 0
 Transient = FALSE
 EnvSettlesReplaying = FALSE
 CatalogFence = "pass"
 AccessLoop = "target"
 Labelled = TRUE
INVARIANTS TypeOK SkippedPassRedone CatalogReflectsStorage
PROPERTIES NoStaleReconcile RecoveryGatesMutation RowAccounted TerminalStops RetryOnlyWhenCleared AccessAnswerFenced AccessMatchedById
CHECK_DEADLOCK FALSE
