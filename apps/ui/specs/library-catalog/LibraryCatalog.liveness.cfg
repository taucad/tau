\* RowEventuallySettled under LiveSpec: weak fairness of the replay and of discovery; the person, the
\* environment, a crash and the workspace are not fair. One crash, the workspace away once. No SYMMETRY.
SPECIFICATION LiveSpec
CONSTANTS
 Projects = {p1, p2}
 Rows = {r1, r2}
 InitRows = {r1}
 Ops = {"create", "delete"}
 Questions = {}
 Reads = 2
 MaxMutations = 1
 MaxCrashes = 1
 MaxStops = 0
 MaxBumps = 0
 MaxPolls = 0
 MaxEnvChange = 0
 MaxEnvAdd = 0
 MaxEnvSettle = 0
 MaxWorkspaceLoss = 1
 MaxAsks = 0
 EnvSettlesReplaying = FALSE
 CatalogFence = "pass"
 AccessLoop = "target"
 AccessMatch = "gen"
 Labelled = FALSE
INVARIANT TypeOK
PROPERTIES RowEventuallySettled
CHECK_DEADLOCK FALSE
