\* Target route access: two questions, one invalidation, a mutation whose row starts recovering while a
\* question reads, and one re-ask or cancel whose earlier replies complete late. No crash: target-access-crash.
SPECIFICATION Spec
CONSTANTS
 Projects = {p1, p2}
 Rows = {r1}
 InitRows = {}
 Ops = {"create", "delete"}
 Questions = {q1, q2}
 Reads = 2
 MaxMutations = 1
 MaxCrashes = 0
 MaxStops = 0
 MaxBumps = 1
 MaxPolls = 0
 MaxEnvChange = 0
 MaxEnvAdd = 0
 MaxEnvSettle = 0
 MaxWorkspaceLoss = 0
 MaxAsks = 1
 EnvSettlesReplaying = FALSE
 CatalogFence = "pass"
 AccessLoop = "target"
 AccessMatch = "gen"
 Labelled = FALSE
INVARIANTS TypeOK SkippedPassRedone CatalogReflectsStorage
PROPERTIES NoStaleReconcile RecoveryGatesMutation RowAccounted TerminalStops RetryOnlyWhenCleared AccessAnswerFenced AccessMatchedById
SYMMETRY ProjectSymmetry
CHECK_DEADLOCK FALSE
