\* Target while the workspace goes away and returns three times: a replay fails with workspace-unavailable,
\* is re-armed on return, and a row can reach its third attempt. One mutation, to fit the pr queue.
SPECIFICATION Spec
CONSTANTS
 Projects = {p1, p2}
 Rows = {r1, r2, r3}
 InitRows = {r1}
 Ops = {"create", "delete"}
 Questions = {}
 Reads = 2
 MaxMutations = 1
 MaxCrashes = 0
 MaxStops = 0
 MaxBumps = 0
 MaxPolls = 0
 MaxEnvChange = 0
 MaxEnvAdd = 0
 MaxEnvSettle = 0
 MaxWorkspaceLoss = 3
 MaxAsks = 0
 EnvSettlesReplaying = FALSE
 CatalogFence = "pass"
 AccessLoop = "target"
 AccessMatch = "gen"
 Labelled = FALSE
INVARIANTS TypeOK SkippedPassRedone CatalogReflectsStorage
PROPERTIES NoStaleReconcile RecoveryGatesMutation RowAccounted TerminalStops RetryOnlyWhenCleared AccessAnswerFenced AccessMatchedById
SYMMETRY ProjectSymmetry
CHECK_DEADLOCK FALSE
