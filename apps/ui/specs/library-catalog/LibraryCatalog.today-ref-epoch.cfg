\* Today: getProjectListing checks the epoch after the pass settles and returns, and the listing lands in
\* the query cache a step later. An invalidation cancels the query, but a new pass (a poll, a route's read)
\* moves the epoch without cancelling it, so a listing from the previous epoch replaces the catalog.
SPECIFICATION Spec
CONSTANTS
 Projects = {p1, p2}
 Rows = {r1, r2}
 InitRows = {r1}
 Ops = {"create", "delete"}
 Questions = {}
 Reads = 2
 MaxMutations = 1
 MaxCrashes = 0
 MaxStops = 0
 MaxBumps = 0
 MaxPolls = 1
 MaxEnvChange = 0
 MaxEnvAdd = 0
 MaxEnvSettle = 0
 MaxWorkspaceLoss = 0
 Transient = FALSE
 EnvSettlesReplaying = FALSE
 CatalogFence = "ref"
 AccessLoop = "target"
 Labelled = FALSE
PROPERTY NoStaleReconcile
SYMMETRY ProjectSymmetry
CHECK_DEADLOCK FALSE
