\* RequestEventuallySettles at budget 2 with two person opens and two person closes: focus's open
\* may wait in pendingOpen for a closing session while a person's open of another project spawns
\* into the room or fails to start, which displaces the slot. One session start may fail. Focus
\* derives the displacement, since it sent the person's open, and goes back to OpenAsked; without
\* that it waits in opening forever. No library change, no Home, no failed flush or retry.
SPECIFICATION LiveSpec
CONSTANTS
 Projects = {p1, p2}
 Chats = {c1}
 None = None
 Home = Home
 MaxRequests = 3
 MaxLibraryChanges = 0
 Budget = 2
 MaxFlushFails = 0
 MaxOpenFails = 1
 MaxRetries = 0
 MaxPersonOpens = 2
 MaxPersonCloses = 2
 MaxCloseFails = 0
 MaxDiscards = 0
 AllowHome = FALSE
 IdleExpiry = FALSE
 Focus = "target"
 IdFence = TRUE
 SelectorRoute = TRUE
 SelectorMatch = "project"
 LateRegistration = FALSE
 ModuleAtStart = "unloaded"
 SessionFacts = TRUE
 FactOrder = "together"
 RegistryChecksEpoch = FALSE
 Labelled = FALSE
INVARIANTS TypeOK OpeningWaitsOrWentLive
PROPERTIES RequestEventuallySettles FailedFlushSendsNoOpen
CHECK_DEADLOCK FALSE
