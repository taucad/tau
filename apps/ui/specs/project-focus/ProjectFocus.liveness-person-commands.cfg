\* RequestEventuallySettles with one person close and one person open, so the session focus opened
\* may close before the join (TOpenLost settles focus on `closed`, with the reopen offer). Budget 1,
\* no Home, no library change, no failed flush or retry, which liveness covers. Without TOpenLost
\* this config fails. The pr form; liveness-person-commands-wide (nightly) adds a library change,
\* so focus withdraws and re-sends its pending open.
SPECIFICATION LiveSpec
CONSTANTS
 Projects = {p1, p2}
 Chats = {c1}
 None = None
 Home = Home
 MaxRequests = 3
 MaxLibraryChanges = 0
 Budget = 1
 MaxFlushFails = 0
 MaxOpenFails = 0
 MaxRetries = 0
 MaxPersonOpens = 1
 MaxPersonCloses = 1
 MaxCloseFails = 0
 MaxDiscards = 0
 AllowHome = FALSE
 IdleExpiry = FALSE
 Focus = "target"
 IdFence = TRUE
 SelectorRoute = TRUE
 SelectorMatch = "project"
 LateRegistration = FALSE
 ModuleAtStart = "unloaded"
 SessionFacts = TRUE
 FactOrder = "together"
 RegistryChecksEpoch = FALSE
 Labelled = FALSE
INVARIANT TypeOK
PROPERTIES RequestEventuallySettles FailedFlushSendsNoOpen
CHECK_DEADLOCK FALSE
