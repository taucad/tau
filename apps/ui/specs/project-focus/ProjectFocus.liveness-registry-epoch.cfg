\* RequestEventuallySettles with RegistryChecksEpoch (A5c): after the registry drops focus's stale
\* open and replies, focus re-sends from its fresh answer and still settles. Without the reply it
\* waits in opening forever and this config fails.
SPECIFICATION LiveSpec
CONSTANTS
 Projects = {p1, p2}
 Chats = {c1}
 None = None
 Home = Home
 MaxRequests = 3
 MaxLibraryChanges = 1
 Budget = 1
 MaxFlushFails = 1
 MaxOpenFails = 0
 MaxRetries = 1
 MaxPersonOpens = 0
 MaxPersonCloses = 0
 MaxCloseFails = 0
 MaxDiscards = 0
 AllowHome = TRUE
 IdleExpiry = FALSE
 Focus = "target"
 IdFence = TRUE
 SelectorRoute = TRUE
 SelectorMatch = "project"
 LateRegistration = FALSE
 ModuleAtStart = "unloaded"
 SessionFacts = TRUE
 FactOrder = "together"
 RegistryChecksEpoch = TRUE
 Labelled = FALSE
INVARIANT TypeOK
PROPERTIES RequestEventuallySettles FailedFlushSendsNoOpen
CHECK_DEADLOCK FALSE
