\* RequestEventuallySettles when a close fails (I6) on a budget-1 device while focus's open waits in
\* pendingOpen for the session being closed. Refused back to live (CloseFlushFailed), the registry
\* reopens it retained (sessions.machine.ts reopenRetained), so focus's open goes live. Failed to
\* `failed` (CloseFailed), the registry keeps pendingOpen and emits budgetRefused; focus clears its
\* open and re-sends it as a touch. One person close, one failed close, no person open, no library
\* change, no Home, no failed leave flush or retry. Without either answer focus waits in opening
\* forever.
SPECIFICATION LiveSpec
CONSTANTS
 Projects = {p1, p2}
 Chats = {c1}
 None = None
 Home = Home
 MaxRequests = 3
 MaxLibraryChanges = 0
 Budget = 1
 MaxFlushFails = 0
 MaxOpenFails = 0
 MaxRetries = 0
 MaxPersonOpens = 0
 MaxPersonCloses = 1
 MaxCloseFails = 1
 MaxDiscards = 0
 AllowHome = FALSE
 IdleExpiry = FALSE
 Focus = "target"
 IdFence = TRUE
 SelectorRoute = TRUE
 SelectorMatch = "project"
 LateRegistration = FALSE
 ModuleAtStart = "unloaded"
 SessionFacts = TRUE
 FactOrder = "together"
 RegistryChecksEpoch = FALSE
 Labelled = FALSE
INVARIANTS TypeOK OpeningWaitsOrWentLive
PROPERTIES RequestEventuallySettles FailedFlushSendsNoOpen
CHECK_DEADLOCK FALSE
