\* RequestEventuallySettles under weak fairness of the library, the leave flush, the import, the
\* registry and focus: once requests stop, focus is focused, held or flushFailed on the last one.
\* Budget 1, so settling may need the registry's close. No symmetry: TLC does not combine it with
\* liveness. liveness-person-commands adds the person's close and open.
SPECIFICATION LiveSpec
CONSTANTS
 Projects = {p1, p2}
 Chats = {c1}
 None = None
 Home = Home
 MaxRequests = 3
 MaxLibraryChanges = 1
 Budget = 1
 MaxFlushFails = 1
 MaxOpenFails = 0
 MaxRetries = 1
 MaxPersonOpens = 0
 MaxPersonCloses = 0
 AllowHome = TRUE
 IdleExpiry = FALSE
 Focus = "target"
 IdFence = TRUE
 SelectorRoute = TRUE
 SelectorMatch = "project"
 LateRegistration = FALSE
 ModuleAtStart = "unloaded"
 SessionFacts = TRUE
 FactOrder = "together"
 RegistryChecksEpoch = FALSE
 Labelled = FALSE
INVARIANT TypeOK
PROPERTIES RequestEventuallySettles FailedFlushSendsNoOpen
CHECK_DEADLOCK FALSE
