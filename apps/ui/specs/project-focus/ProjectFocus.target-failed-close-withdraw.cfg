\* The withdraw on a failed close (CloseFailed, rule 12): budget 1, two person closes and one close
\* that fails to `failed`, 4 requests, no person open, library change, Home, failed leave flush or
\* retry. Focus's open waits for the session being closed; when the close fails, focus withdraws it
\* (cancelPendingOpen) as it re-sends. Without the withdraw focus's request stays in pendingOpen after
\* focus moves on, and the session's next close respawns it from that request, which
\* OpenOnlyOnCurrentAccess rejects (SelfResumed). Every target safety property holds. 2 projects.
