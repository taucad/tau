 MaxOpenFails = 1
 MaxRetries = 1
 MaxPersonOpens = 0
 MaxPersonCloses = 0
 AllowHome = TRUE
 IdleExpiry = FALSE
 Focus = "target"
 IdFence = TRUE
 SelectorRoute = TRUE
 SelectorMatch = "project"
 LateRegistration = FALSE
 ModuleAtStart = "unloaded"
 SessionFacts = TRUE
 FactOrder = "together"
 RegistryChecksEpoch = FALSE
 Labelled = FALSE
INVARIANTS TypeOK FocusFollowsLatestRequest FlushBeforeLeave FailedFlushBlocks OpenCarriesRequest EditorOnlyWhenReady FirstCheckBeforeEditor EditorOnlyForCommittedProject SameProjectKeepsEditor
PROPERTIES FocusNeverCloses OpenOnlyOnCurrentAccess CloseAfterFlush StaleReplyIgnored EditorJoinFresh FailedFlushSendsNoOpen
SYMMETRY Symmetry
