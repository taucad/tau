\* Budget 1, a one-project device: the next project waits in pendingOpen until the registry closes the
\* session being left through its own close flush (sessions.machine.ts 389 to 399). Focus never
\* closes (FocusNeverCloses); the registry does (BudgetSwitchClose, SessionClosed). One session
\* start may fail, which gives held.
