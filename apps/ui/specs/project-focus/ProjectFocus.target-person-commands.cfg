\* The sidebar's open and a notice's reopen go through focus with the request focus kept for that
\* project (S39), up to two of each with two closes, interleaved with route requests. A budget wait
\* keeps its request in pendingOpen and the registry resumes the open with it (S38). No Home and no
\* library change, which target covers.
SPECIFICATION Spec
CONSTANTS
 Projects = {p1, p2, p3}
 Chats = {c1}
 None = None
 Home = Home
 MaxRequests = 3
 MaxLibraryChanges = 0
 Budget = 2
 MaxFlushFails = 1
 MaxOpenFails = 0
 MaxRetries = 1
 MaxPersonOpens = 2
 MaxPersonCloses = 2
 AllowHome = FALSE
 IdleExpiry = FALSE
 Focus = "target"
 IdFence = TRUE
 SelectorRoute = TRUE
 SelectorMatch = "project"
 LateRegistration = FALSE
 ModuleAtStart = "unloaded"
 SessionFacts = TRUE
 FactOrder = "together"
 RegistryChecksEpoch = FALSE
 Labelled = FALSE
INVARIANTS TypeOK FocusFollowsLatestRequest FlushBeforeLeave FailedFlushBlocks OpenCarriesRequest EditorOnlyWhenReady FirstCheckBeforeEditor EditorOnlyForCommittedProject SameProjectKeepsEditor
PROPERTIES FocusNeverCloses OpenOnlyOnCurrentAccess CloseAfterFlush StaleReplyIgnored
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
