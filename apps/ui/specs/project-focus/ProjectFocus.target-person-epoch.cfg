\* A person's waiting open and a library change at budget 1: 2 projects, 3 requests, 1 library
\* change, 2 person opens and 1 person close, no Home, no failed flush or close. A library change
\* drops every kept request, so focus withdraws a person's open waiting in pendingOpen whose kept
\* request was dropped (StandingAfter, TAccessAsked); every target safety property holds. The pr
\* check of this interaction since target-retained-session's pr form dropped its library change.
SPECIFICATION Spec
CONSTANTS
 Projects = {p1, p2}
 Chats = {c1}
 None = None
 Home = Home
 MaxRequests = 3
 MaxLibraryChanges = 1
 Budget = 1
 MaxFlushFails = 0
 MaxOpenFails = 0
 MaxRetries = 0
 MaxPersonOpens = 2
 MaxPersonCloses = 1
 MaxCloseFails = 0
 MaxDiscards = 0
 AllowHome = FALSE
 IdleExpiry = FALSE
 Focus = "target"
 IdFence = TRUE
 SelectorRoute = TRUE
 SelectorMatch = "project"
 LateRegistration = FALSE
 ModuleAtStart = "unloaded"
 SessionFacts = TRUE
 FactOrder = "together"
 RegistryChecksEpoch = FALSE
 Labelled = FALSE
INVARIANTS TypeOK FocusFollowsLatestRequest FlushBeforeLeave FailedFlushBlocks OpenCarriesRequest EditorOnlyWhenReady FirstCheckBeforeEditor EditorOnlyForCommittedProject SameProjectKeepsEditor OpeningWaitsOrWentLive
PROPERTIES FocusNeverCloses OpenOnlyOnCurrentAccess CloseAfterFlush StaleReplyIgnored EditorJoinFresh FailedFlushSendsNoOpen DirtyNeverDiscarded
SYMMETRY Symmetry
