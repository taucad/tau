\* The requirement on A5c that closes target-resume-window: an open carries focus's library epoch,
\* and the registry's resume drops a pendingOpen of focus's whose epoch is stale. With it
\* StaleResumeUnreached holds with every target safety property; this is A5c's conformance target.
\* The registry replies when it drops, so focus re-sends from its fresh answer: NoSpuriousClosed.
SPECIFICATION Spec
