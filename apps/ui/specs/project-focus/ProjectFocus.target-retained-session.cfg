\* The fifth ruled statement (I6): budget 1, two person opens and one close, one failed leave flush
\* and one failed close flush, and one explicit discard. A person's open while focus is in
\* flushFailed makes the registry close the dirty session being left; when that close fails, back
\* to live (CloseFlushFailed) or to failed (CloseFailed), the session is retained with its unsaved
\* work, and an open waiting for another project keeps waiting, until a later close's flush
\* succeeds or the person discards. Nothing is lost:
\* DirtyNeverDiscarded and every target safety property hold. 2 projects, no Home. The pr form, with
\* no library change; target-retained-session-wide (nightly) adds one.
SPECIFICATION Spec
CONSTANTS
 Projects = {p1, p2}
 Chats = {c1}
 None = None
 Home = Home
 MaxRequests = 3
 MaxLibraryChanges = 0
 Budget = 1
 MaxFlushFails = 1
 MaxOpenFails = 0
 MaxRetries = 1
 MaxPersonOpens = 2
 MaxPersonCloses = 1
 MaxCloseFails = 1
 MaxDiscards = 1
 AllowHome = FALSE
 IdleExpiry = FALSE
 Focus = "target"
 IdFence = TRUE
 SelectorRoute = TRUE
 SelectorMatch = "project"
 LateRegistration = FALSE
 ModuleAtStart = "unloaded"
 SessionFacts = TRUE
 FactOrder = "together"
 RegistryChecksEpoch = FALSE
 Labelled = FALSE
INVARIANTS TypeOK FocusFollowsLatestRequest FlushBeforeLeave FailedFlushBlocks OpenCarriesRequest EditorOnlyWhenReady FirstCheckBeforeEditor EditorOnlyForCommittedProject SameProjectKeepsEditor OpeningWaitsOrWentLive
PROPERTIES FocusNeverCloses OpenOnlyOnCurrentAccess CloseAfterFlush StaleReplyIgnored EditorJoinFresh FailedFlushSendsNoOpen DirtyNeverDiscarded
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
