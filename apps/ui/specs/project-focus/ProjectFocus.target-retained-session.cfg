\* The fifth ruled statement (I6): budget 1, two person opens and one close, one failed leave flush
\* and one failed close flush, and one explicit discard. A person's open while focus is in
\* flushFailed makes the registry close the dirty session being left; when that close's flush
\* fails the session is retained, live with its unsaved work, and the waiting open keeps waiting,
\* until a later close's flush succeeds or the person discards. Nothing is lost:
\* DirtyNeverDiscarded and every target safety property hold. 2 projects, no Home.
SPECIFICATION Spec
