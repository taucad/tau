\* A retry after a failed session start, with a library change between: budget 1, 2 projects,
\* 2 requests, 1 failed start, 1 retry, 1 library change, no Home, no failed flush or person
\* command. A retry from held asks access again, so the next open carries the current epoch's
\* answer (OpenCarriesRequest); every target safety property holds. The pr check of this since
\* target-one-project's pr form dropped its retry.
