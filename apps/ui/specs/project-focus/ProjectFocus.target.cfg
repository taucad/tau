\* The focus machine (D7) against every safety property: three projects and Home, three requests, one library
\* change, budget 2, one failed leave flush and one retry. The chat facts settle together here;
\* target-open-facts takes their order.
SPECIFICATION Spec
CONSTANTS
 Projects = {p1, p2, p3}
 Chats = {c1}
 None = None
 Home = Home
 MaxRequests = 3
 MaxLibraryChanges = 1
 Budget = 2
 MaxFlushFails = 1
 MaxOpenFails = 0
 MaxRetries = 1
 MaxPersonOpens = 0
 MaxPersonCloses = 0
 AllowHome = TRUE
 IdleExpiry = FALSE
 Focus = "target"
 IdFence = TRUE
 SelectorRoute = TRUE
 SelectorMatch = "project"
 LateRegistration = FALSE
 ModuleAtStart = "unloaded"
 SessionFacts = TRUE
 FactOrder = "together"
 RegistryChecksEpoch = FALSE
 Labelled = FALSE
INVARIANTS TypeOK FocusFollowsLatestRequest FlushBeforeLeave FailedFlushBlocks OpenCarriesRequest EditorOnlyWhenReady FirstCheckBeforeEditor EditorOnlyForCommittedProject SameProjectKeepsEditor
PROPERTIES FocusNeverCloses OpenOnlyOnCurrentAccess CloseAfterFlush StaleReplyIgnored EditorJoinFresh FailedFlushSendsNoOpen
