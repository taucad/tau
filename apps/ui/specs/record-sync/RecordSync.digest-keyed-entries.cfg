\* Witness: entries keyed by digest, so a conflict removes the entry of an earlier write of the same bytes.
SPECIFICATION Spec
CONSTANTS
 Bytes = {a, b, c}
 InitialBytes = a
 MaxWrites = 3
 MaxEdits = 3
 MaxForeign = 2
 MaxEcho = 2
 MaxLost = 1
 MaxForced = 0
 Attribution = "digest"
 DropOnRead = "other-bytes"
 DropOnAck = TRUE
 ReplyPublish = "quiet"
 Refresh = TRUE
 Fence = TRUE
 EntryKey = "digest"
 OverlapOnComplete = TRUE
 WaitLatestRead = TRUE
 EagerWriter = FALSE
 Labelled = FALSE
INVARIANT OwnWriteAttributed
CHECK_DEADLOCK FALSE
