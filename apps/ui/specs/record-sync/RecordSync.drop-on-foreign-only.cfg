\* Witness: only a read attributed foreign drops acknowledged entries.
SPECIFICATION Spec
CONSTANTS
 Bytes = {a, b, c}
 InitialBytes = a
 MaxWrites = 3
 MaxEdits = 3
 MaxForeign = 2
 MaxEcho = 2
 MaxLost = 1
 Attribution = "digest"
 DropOnRead = "foreign-only"
 DropOnAck = TRUE
 ReplyPublish = "quiet"
 Refresh = TRUE
 Fence = TRUE
INVARIANT ForeignStaysForeign
CHECK_DEADLOCK FALSE
