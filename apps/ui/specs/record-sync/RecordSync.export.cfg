\* The writer as `recordSync` schedules it, labelled, at two writes, two edits, one foreign write and one lost reply
\* over two byte values, with no repeated change event and no forced read, so the graph stays under 1 MB
\* (graphs.RecordSync).
SPECIFICATION Spec
CONSTANTS
 Bytes = {a, b}
 InitialBytes = a
 MaxWrites = 2
 MaxEdits = 2
 MaxForeign = 1
 MaxEcho = 0
 MaxLost = 1
 MaxForced = 0
 Attribution = "digest"
 DropOnRead = "other-bytes"
 DropOnAck = TRUE
 ReplyPublish = "quiet"
 Refresh = TRUE
 Fence = TRUE
 EntryKey = "write"
 OverlapOnComplete = TRUE
 WaitLatestRead = TRUE
 EagerWriter = TRUE
 Labelled = TRUE
INVARIANTS TypeOK OwnWriteAttributed ForeignStaysForeign
PROPERTIES SnapshotMonotone FenceStopsWrites
CHECK_DEADLOCK FALSE
