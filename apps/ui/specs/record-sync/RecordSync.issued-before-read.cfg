\* Witness: a foreign read drops every entry issued before it started, in flight or not.
SPECIFICATION Spec
CONSTANTS
 Bytes = {a, b, c}
 InitialBytes = a
 MaxWrites = 3
 MaxEdits = 3
 MaxForeign = 2
 MaxEcho = 2
 MaxLost = 1
 Attribution = "digest"
 DropOnRead = "issued-before-read"
 DropOnAck = TRUE
 ReplyPublish = "quiet"
 Refresh = TRUE
 Fence = TRUE
 EntryKey = "write"
 OverlapOnComplete = TRUE
INVARIANT OwnWriteAttributed
CHECK_DEADLOCK FALSE
