\* Target liveness under LiveSpec's weak fairness with the writer as `recordSync` schedules it. No SYMMETRY.
SPECIFICATION LiveSpec
CONSTANTS
 Bytes = {a, b, c}
 InitialBytes = a
 MaxWrites = 5
 MaxEdits = 2
 MaxForeign = 1
 MaxEcho = 1
 MaxLost = 1
 MaxForced = 0
 Attribution = "digest"
 DropOnRead = "other-bytes"
 DropOnAck = TRUE
 ReplyPublish = "quiet"
 Refresh = TRUE
 Fence = TRUE
 EntryKey = "write"
 OverlapOnComplete = TRUE
 WaitLatestRead = TRUE
 EagerWriter = TRUE
 Labelled = FALSE
INVARIANT TypeOK
PROPERTIES EditEventuallySettled EventuallyCurrent
CHECK_DEADLOCK FALSE
