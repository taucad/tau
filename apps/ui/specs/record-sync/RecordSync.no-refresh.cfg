\* Witness: no refresh read after an overlapped write. Liveness: no SYMMETRY.
SPECIFICATION LiveSpec
CONSTANTS
 Bytes = {a, b, c}
 InitialBytes = a
 MaxWrites = 4
 MaxEdits = 1
 MaxForeign = 1
 MaxEcho = 1
 MaxLost = 1
 Attribution = "digest"
 DropOnRead = "other-bytes"
 DropOnAck = TRUE
 ReplyPublish = "quiet"
 Refresh = FALSE
 Fence = TRUE
PROPERTY EventuallyCurrent
CHECK_DEADLOCK FALSE
