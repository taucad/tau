\* Witness: the writer waits only for the read its reply started, not for a read that superseded it. Liveness: no SYMMETRY.
SPECIFICATION LiveSpec
CONSTANTS
 Bytes = {a, b, c}
 InitialBytes = a
 MaxWrites = 3
 MaxEdits = 2
 MaxForeign = 1
 MaxEcho = 1
 MaxLost = 0
 MaxForced = 0
 Attribution = "digest"
 DropOnRead = "other-bytes"
 DropOnAck = TRUE
 ReplyPublish = "quiet"
 Refresh = TRUE
 Fence = TRUE
 EntryKey = "write"
 OverlapOnComplete = TRUE
 WaitLatestRead = FALSE
 EagerWriter = FALSE
 Labelled = FALSE
PROPERTY EditEventuallySettled
CHECK_DEADLOCK FALSE
