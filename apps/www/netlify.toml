# Separate marketing preview site only. Never apply to the UI production site.
[build]
base = "apps/www"
command = "node scripts/build.mjs"
publish = "dist"

[build.environment]
NODE_VERSION = "22"
WWW_LAUNCH = "false"

# Security, cache and preview noindex headers are emitted in dist/_headers.
# No app proxy or production domain is enabled in this preview configuration.

# If the selected build image detects the root pnpm workspace, keep dependency
# installation scoped to this dependency-free app and suppress workspace hooks.
[context.deploy-preview.environment]
PNPM_FLAGS = "--filter @taucad/www --ignore-scripts"

[context.branch-deploy.environment]
PNPM_FLAGS = "--filter @taucad/www --ignore-scripts"
