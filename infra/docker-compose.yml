services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tau-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: tau_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev_user -d tau_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tau-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: tau-otel-lgtm
    restart: unless-stopped
    environment:
      GF_INSTALL_PLUGINS: redis-datasource,grafana-postgresql-datasource
    ports:
      - '6100:3000' # Grafana UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
      - '9090:9090' # Prometheus
      - '3100:3100' # Loki
      - '3200:3200' # Tempo
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./grafana/provisioning:/otel-lgtm/grafana/conf/provisioning
      - ./grafana/dashboards:/otel-lgtm/grafana/dashboards
      - ./grafana/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml
      - otel_lgtm_data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: tau-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tauminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tauminio-dev-secret}
      MINIO_SERVER_URL: http://localhost:9000
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: tau-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tauminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tauminio-dev-secret}
    volumes:
      - ./seed:/seed:ro
    entrypoint: >
      /bin/sh -c '
        set -eu;
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing local/tau-content;
        mc anonymous set download local/tau-content;
        mc mb --ignore-existing local/tau-content-private;
        mc mb --ignore-existing local/tau-content-restore;
        mc admin user add local tau-api tau-api-dev-secret || true;
        mc admin policy attach local readwrite --user tau-api || true;
        mc cp /seed/default-og.png local/tau-content/defaults/og.png;
        mc cp /seed/default-thumb.webp local/tau-content/defaults/thumb.webp;
        printf "ok\n" | mc pipe local/tau-content/__health/probe.txt;
        echo "MinIO bootstrap complete";
      '
    restart: 'no'

  hatchet-database:
    image: postgres:17-alpine
    profiles: [jobs]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: dev_user
      PGPASSWORD: dev_password
      PGDATABASE: postgres
    entrypoint: >
      /bin/sh -c '
        set -eu;
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '"'"'hatchet'"'"'" | grep -q 1; then
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE hatchet";
        fi;
      '
    restart: 'no'

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite-dev:v0.105.12
    container_name: tau-hatchet
    profiles: [jobs]
    depends_on:
      hatchet-database:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres:5432/hatchet?sslmode=disable
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7070
      SERVER_GRPC_INSECURE: 'true'
      SERVER_AUTH_COOKIE_INSECURE: 'true'
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_SECURITY_CHECK_ENABLED: 'false'
    ports:
      - '7070:7070'
      - '8888:8888'
    volumes:
      - hatchet_config:/config
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8888/api/live']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  otel_lgtm_data:
  minio-data:
  hatchet_config:
