              intervalMs: 15000
              maxDataPoints: 20
              refId: implementation_failures
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          runbook_url: docs/handbooks/cloud/operate/runtime-observability-bootstrap.md
          summary: "More than 5 % of one operation's completed runtime attempts failed with an implementation-class cause (failed, discarded, or an implementation-class issue) over 15 min, with at least 10 failures and 50 completed attempts. Completed excludes superseded, cancelled and abandoned, so merged counts cannot move the ratio. Drill: T14 fixture, which stops at its own deadline."
