# Grafana Alerting Rules for Tau API
# These are provisioned as code via the grafana/otel-lgtm volume mount.
# In production (Fly.io managed Grafana), import these via the Grafana API.
#
# To configure Grafana Cloud alerts, set OTEL_EXPORTER_OTLP_ENDPOINT and
# OTEL_EXPORTER_OTLP_HEADERS as Fly.io secrets:
#
#   fly secrets set OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp-gateway-<region>.grafana.net/otlp
#   fly secrets set OTEL_EXPORTER_OTLP_HEADERS="Authorization=Basic <base64(instanceId:apiKey)>"

apiVersion: 1

# Rules removed from this file stay in an existing Grafana until deleted here.
deleteRules:
  - orgId: 1
    uid: rpc-failure-rate # rpc_* lost its emitter in 15ef0677e

groups:
  - orgId: 1
    name: tau-critical
    folder: Tau Alerts
    interval: 1m
    rules:
      - uid: redis-connection-lost
        title: 'P0: Redis Connection Lost'
        condition: redis_down
        data:
          - refId: redis_down
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: redis_connection_state{service_name="tau-api"} == 0
              intervalMs: 15000
              maxDataPoints: 20
        for: 1m
        annotations:
          summary: Redis connection is down. Chat RPC, session management, and adapter services are degraded.
          runbook_url: ''
        labels:
          severity: critical
          service: tau-api
          component: redis

      - uid: supplier-auth-failure
        title: "P0: Supplier Rejected Tau's Key"
        condition: supplier_auth
        data:
          - refId: supplier_auth
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                sum by (app, gen_ai_provider_name) (increase(gen_ai_client_operation_duration_count{service_name="tau-api",error_type="upstream_auth"}[5m])) > 0
              intervalMs: 15000
              maxDataPoints: 20
        for: 0s
        annotations:
          summary: 'A supplier answered a funded call with 401/403 (F-11). The key is Tau''s, so every funded call to that supplier fails as PROVIDER_UNAVAILABLE until the key is replaced. A new process fires from its second rejection: increase() cannot see a series'' first sample. Grouped by Fly `app`, so staging (tau-api-staging) and prod (tau-api) fire separately. Same event as tau_billing_provider_account_refusals_total{reason="credential_rejected"}.'
          runbook_url: docs/handbooks/cloud/playbooks/supplier-outage.md
        labels:
          severity: critical
          service: tau-api
          component: billing

      - uid: supplier-credit-exhausted
        title: 'P0: Supplier Account Out of Credit'
        condition: supplier_credit
        data:
          - refId: supplier_credit
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                sum by (app, providerId) (increase(tau_billing_provider_account_refusals_total{service_name="tau-api",reason!="credential_rejected"}[5m])) > 0
              intervalMs: 15000
              maxDataPoints: 20
        for: 0s
        annotations:
          summary: "A supplier refused a funded call because Tau's account with it is out of credit (BIL-11). Funded calls to that supplier fail until it is topped up. Credential rejections are excluded here; supplier-auth-failure pages for them."
          runbook_url: docs/handbooks/cloud/playbooks/supplier-outage.md
        labels:
          severity: critical
          service: tau-api
          component: billing

      - uid: billing-worker-stalled
        title: 'P0: Billing Worker Stalled'
        condition: worker_stalled
        data:
          - refId: worker_stalled
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: >
                sum by (app, tau_worker) (max_over_time(tau_billing_worker_passes_total{service_name="tau-api"}[24h])) unless sum by (app, tau_worker) (increase(tau_billing_worker_passes_total{service_name="tau-api",outcome="ok"}[15m]) > 0)
              intervalMs: 15000
              maxDataPoints: 20
        for: 5m
        annotations:
          summary: 'A billing worker seen in the last 24 h has completed no successful pass in 15 min: hung, dead or failing every pass (F-10). operations stalled means paid purchases are not credited; recovery stalled means no API replica is completing its in-process recovery pass, so funded operations stay held (see chat-llm-failing.md). Grouped by Fly `app` and `tau_worker`. A worker scaled to 0 on purpose also fires until 24 h pass, so silence it.'
          runbook_url: docs/handbooks/cloud/playbooks/paid-not-credited.md
        labels:
          severity: critical
          service: tau-api
          component: billing

  - orgId: 1
    name: tau-warning
    folder: Tau Alerts
    interval: 1m
    rules:
      - uid: ws-disconnect-storm
        title: 'P1: WebSocket Disconnect Storm'
        condition: ws_disconnect_spike
        data:
          - refId: ws_disconnect_spike
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                sum(rate(ws_disconnections_total{service_name="tau-api",ws_close_reason="error"}[5m])) > 1
              intervalMs: 15000
              maxDataPoints: 20
        for: 2m
        annotations:
          summary: More than one abnormal WebSocket close (close-code class `error`) per second across the hosts and kernels gateways.
        labels:
          severity: warning
          service: tau-api
          component: websocket

      - uid: llm-error-rate
        title: 'P1: LLM API Error Rate'
        condition: llm_errors
        data:
          - refId: llm_errors
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: >
                sum(rate(gen_ai_client_operation_duration_count{service_name="tau-api",error_type!=""}[10m]))
                / sum(rate(gen_ai_client_operation_duration_count{service_name="tau-api"}[10m])) > 0.05
              intervalMs: 15000
              maxDataPoints: 20
        for: 5m
        annotations:
          summary: LLM API error rate exceeds 5%.
        labels:
          severity: warning
          service: tau-api
          component: ai

      - uid: high-5xx-rate
        title: 'P1: High 5xx Error Rate'
        condition: http_5xx_high
        data:
          - refId: http_5xx_high
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                (sum(rate(http_server_request_duration_count{service_name="tau-api",http_response_status_code=~"5.."}[5m])) or vector(0))
                / sum(rate(http_server_request_duration_count{service_name="tau-api"}[5m])) > 0.05
              intervalMs: 15000
              maxDataPoints: 20
        for: 5m
        annotations:
          summary: HTTP 5xx error rate exceeds 5% over 5 minutes.
        labels:
          severity: warning
          service: tau-api
          component: api

      - uid: billing-funded-operation-limit
        title: 'P1: Funded LLM Failsafe Reached'
        condition: billing_funded_operation_limit
        data:
          - refId: billing_funded_operation_limit
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                sum(increase(tau_billing_funded_operation_denials_total{service_name="tau-api",tau_billing_capacity_pool="primary",tau_billing_denial_reason="genuine_saturation"}[5m])) > 0
              intervalMs: 15000
              maxDataPoints: 20
        for: 0s
        annotations:
          summary: A primary funded LLM request reached the account abuse failsafe after recovery.
        labels:
          severity: warning
          service: tau-api
          component: billing

      - uid: billing-funded-operation-recovery-failed
        title: 'P1: Funded LLM Recovery Failed'
        condition: billing_funded_operation_recovery_failed
        data:
          - refId: billing_funded_operation_recovery_failed
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                sum(increase(tau_billing_funded_operation_recoveries_total{service_name="tau-api",tau_billing_recovery_outcome="failed"}[5m])) > 0
              intervalMs: 15000
              maxDataPoints: 20
        for: 0s
        annotations:
          summary: Funded LLM recovery failed; admission remains fail-closed without changing customer money.
        labels:
          severity: warning
          service: tau-api
          component: billing

      - uid: billing-funded-operation-due-age
        title: 'P1: Funded LLM Recovery SLO Breach'
        condition: billing_funded_operation_due_age
        data:
          - refId: billing_funded_operation_due_age
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                max by (deployment_environment, tau_billing_capacity_pool) (tau_billing_funded_operation_oldest_due_age{service_name="tau-api"}) > 30000
              intervalMs: 15000
              maxDataPoints: 20
        for: 1m
        annotations:
          summary: The oldest due funded LLM operation has exceeded the 30-second healthy recovery SLO.
        labels:
          severity: warning
          service: tau-api
          component: billing

      - uid: billing-funded-operation-occupancy
        title: 'P1: Funded LLM Pool Near Failsafe'
        condition: billing_funded_operation_occupancy
        data:
          - refId: billing_funded_operation_occupancy
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: >
                max(tau_billing_funded_operation_current{service_name="tau-api",tau_billing_pending_state="pending"}) >= 56
              intervalMs: 15000
              maxDataPoints: 60
        for: 10m
        annotations:
          summary: A funded LLM capacity pool has remained above 87.5% of its 64-operation abuse failsafe.
        labels:
          severity: warning
          service: tau-api
          component: billing

      - uid: billing-recovery-provider-execution
        title: 'P1: Provider Execution During Recovery'
        condition: billing_funded_operation_recovery_provider_execution
        data:
          - refId: billing_funded_operation_recovery_provider_execution
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                max(tau_billing_funded_operation_recovery_provider_executions{service_name="tau-api"}) > 0
              intervalMs: 15000
              maxDataPoints: 20
        for: 0s
        annotations:
          summary: DB-only funded LLM recovery observed a provider execution; the invariant is zero.
        labels:
          severity: warning
          service: tau-api
          component: billing

      - uid: tau-process-restarting
        title: 'P1: Tau Process Crash-Looping'
        condition: process_restarting
        data:
          - refId: process_restarting
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: >
                sum by (app, instance, tau_process) (resets(process_uptime{service_name="tau-api"}[30m])) > 2
              intervalMs: 15000
              maxDataPoints: 20
        for: 0s
        annotations:
          summary: 'A Tau process (app or billing worker) restarted more than twice in 30 min: it is crash-looping (F-10: billing-operations OOM-kills on a 256 MB Machine, before its first pass completes). Reads process_uptime, which exists from the first scrape. A deploy restarts it once.'
          runbook_url: docs/handbooks/cloud/playbooks/paid-not-credited.md
        labels:
          severity: warning
          service: tau-api
          component: runtime
