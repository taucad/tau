            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              instant: true
              range: false
              expr: max(tau_mirror_reconcile_hidden_versions{app=~".*mirror.*",service_name="tau-mirror",destination="b2"}) > 0
              intervalMs: 15000
              maxDataPoints: 20
              refId: hidden_versions
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          runbook_url: docs/handbooks/cloud/system/services/second-copy-b2.md
          summary: 'The reconciler found hide (delete) markers in the second copy. The copier never hides, so another key wrote them: treat as a credential incident.'
        labels:
          severity: critical
          service: tau-mirror
          component: mirror
      - uid: storage-b2-lock-overlong
        title: 'P0: B2 Lock Extended Beyond 35 Days (Security)'
        condition: lock_overlong
        data:
          - refId: lock_overlong
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              instant: true
              range: false
              expr: max(tau_mirror_retention_max_ahead_seconds{app=~".*mirror.*",service_name="tau-mirror",destination="b2"}) > 3024000
              intervalMs: 15000
              maxDataPoints: 20
              refId: lock_overlong
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          runbook_url: docs/handbooks/cloud/system/services/second-copy-b2.md
          summary: A version in the second copy is locked more than 35 days ahead, which the copier never does; erased data would outlive the 31-day deadline.
        labels:
          severity: critical
          service: tau-mirror
          component: mirror
      - uid: storage-b2-drill-failed
        title: 'P0: B2 Restore Drill Failed'
        condition: drill_failed
        data:
          - refId: drill_failed
            queryType: ''
            relativeTimeRange:
              from: 691200
              to: 0
            datasourceUid: prometheus
            model:
              instant: true
              range: false
              expr: ((max_over_time((timestamp(sum(increase(tau_mirror_drill_runs_total{app=~".*mirror.*",service_name="tau-mirror",outcome="fail"}[2m])) > 0))[8d:1m]) - 120) > on() max(tau_mirror_drill_last_success_timestamp_seconds{app=~".*mirror.*",service_name="tau-mirror"})) or ((max_over_time((timestamp(sum(increase(tau_mirror_drill_runs_total{app=~".*mirror.*",service_name="tau-mirror",outcome="fail"}[2m])) > 0))[8d:1m]) - 120) unless on() max(tau_mirror_drill_last_success_timestamp_seconds{app=~".*mirror.*",service_name="tau-mirror"}))
              intervalMs: 15000
              maxDataPoints: 20
              refId: drill_failed
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          runbook_url: docs/handbooks/cloud/system/services/second-copy-b2.md
          summary: The newest second-copy drill failure in the last 8 days is later than the newest passing drill (D23, STO-1), so a later pass clears it. The failure time is the minute the fail counter rose, less 2 min, so a pass within 2 min before a failure can hide it. The copier exports drill results from mirror_drill_run rows, so the failure survives the drill Machine's exit.
        labels:
          severity: critical
          service: tau-mirror
          component: mirror
