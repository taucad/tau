# Grafana Alerting Rules for Tau API
# These are provisioned as code via the grafana/otel-lgtm volume mount.
# In production (Fly.io managed Grafana), import these via the Grafana API.
#
# To configure Grafana Cloud alerts, set OTEL_EXPORTER_OTLP_ENDPOINT and
# OTEL_EXPORTER_OTLP_HEADERS as Fly.io secrets:
#
#   fly secrets set OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp-gateway-<region>.grafana.net/otlp
#   fly secrets set OTEL_EXPORTER_OTLP_HEADERS="Authorization=Basic <base64(instanceId:apiKey)>"

apiVersion: 1

groups:
  - orgId: 1
    name: tau-critical
    folder: Tau Alerts
    interval: 1m
    rules:
      - uid: redis-connection-lost
        title: 'P0: Redis Connection Lost'
        condition: redis_down
        data:
          - refId: redis_down
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: redis_connection_state{service_name="tau-api"} == 0
              intervalMs: 15000
              maxDataPoints: 20
        for: 1m
        annotations:
          summary: Redis connection is down. Chat RPC, session management, and adapter services are degraded.
          runbook_url: ''
        labels:
          severity: critical
          service: tau-api
          component: redis

  - orgId: 1
    name: tau-warning
    folder: Tau Alerts
    interval: 1m
    rules:
      - uid: rpc-failure-rate
        title: 'P1: RPC Failure Rate Spike'
        condition: rpc_errors_high
        data:
          - refId: rpc_errors_high
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                sum(rate(rpc_server_call_duration_count{service_name="tau-api",rpc_status="error"}[5m]))
                / sum(rate(rpc_server_call_duration_count{service_name="tau-api"}[5m])) > 0.1
              intervalMs: 15000
              maxDataPoints: 20
        for: 5m
        annotations:
          summary: RPC error rate exceeds 10% over 5 minutes.
        labels:
          severity: warning
          service: tau-api
          component: rpc

      - uid: ws-disconnect-storm
        title: 'P1: WebSocket Disconnect Storm'
        condition: ws_disconnect_spike
        data:
          - refId: ws_disconnect_spike
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                rate(ws_disconnections_total{service_name="tau-api",ws_close_reason=~"transport close|transport error|ping timeout"}[5m]) > 1
              intervalMs: 15000
              maxDataPoints: 20
        for: 2m
        annotations:
          summary: High rate of abnormal WebSocket disconnections detected.
        labels:
          severity: warning
          service: tau-api
          component: websocket

      - uid: llm-error-rate
        title: 'P1: LLM API Error Rate'
        condition: llm_errors
        data:
          - refId: llm_errors
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: >
                sum(rate(gen_ai_client_operation_duration_count{service_name="tau-api",error_type!=""}[10m]))
                / sum(rate(gen_ai_client_operation_duration_count{service_name="tau-api"}[10m])) > 0.05
              intervalMs: 15000
              maxDataPoints: 20
        for: 5m
        annotations:
          summary: LLM API error rate exceeds 5%.
        labels:
          severity: warning
          service: tau-api
          component: ai

      - uid: high-5xx-rate
        title: 'P1: High 5xx Error Rate'
        condition: http_5xx_high
        data:
          - refId: http_5xx_high
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                sum(rate(http_server_duration_count{service_name="tau-api",http_status_code=~"5.."}[5m]))
                / sum(rate(http_server_duration_count{service_name="tau-api"}[5m])) > 0.05
              intervalMs: 15000
              maxDataPoints: 20
        for: 5m
        annotations:
          summary: HTTP 5xx error rate exceeds 5% over 5 minutes.
        labels:
          severity: warning
          service: tau-api
          component: api

      - uid: billing-funded-operation-limit
        title: 'P1: Funded LLM Failsafe Reached'
        condition: billing_funded_operation_limit
        data:
          - refId: billing_funded_operation_limit
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                sum(increase(tau_billing_funded_operation_denials_total{service_name="tau-api",tau_billing_capacity_pool="primary",tau_billing_denial_reason="genuine_saturation"}[5m])) > 0
              intervalMs: 15000
              maxDataPoints: 20
        for: 0s
        annotations:
          summary: A primary funded LLM request reached the account abuse failsafe after recovery.
        labels:
          severity: warning
          service: tau-api
          component: billing

      - uid: billing-funded-operation-recovery-failed
        title: 'P1: Funded LLM Recovery Failed'
        condition: billing_funded_operation_recovery_failed
        data:
          - refId: billing_funded_operation_recovery_failed
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                sum(increase(tau_billing_funded_operation_recoveries_total{service_name="tau-api",tau_billing_recovery_outcome="failed"}[5m])) > 0
              intervalMs: 15000
              maxDataPoints: 20
        for: 0s
        annotations:
          summary: Funded LLM recovery failed; admission remains fail-closed without changing customer money.
        labels:
          severity: warning
          service: tau-api
          component: billing

      - uid: billing-funded-operation-due-age
        title: 'P1: Funded LLM Recovery SLO Breach'
        condition: billing_funded_operation_due_age
        data:
          - refId: billing_funded_operation_due_age
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                max(tau_billing_funded_operation_oldest_due_age{service_name="tau-api"}) > 30000
              intervalMs: 15000
              maxDataPoints: 20
        for: 1m
        annotations:
          summary: The oldest due funded LLM operation has exceeded the 30-second healthy recovery SLO.
        labels:
          severity: warning
          service: tau-api
          component: billing

      - uid: billing-funded-operation-occupancy
        title: 'P1: Funded LLM Pool Near Failsafe'
        condition: billing_funded_operation_occupancy
        data:
          - refId: billing_funded_operation_occupancy
            datasourceUid: prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: >
                max(tau_billing_funded_operation_current{service_name="tau-api",tau_billing_pending_state="pending"}) >= 56
              intervalMs: 15000
              maxDataPoints: 60
        for: 10m
        annotations:
          summary: A funded LLM capacity pool has remained above 87.5% of its 64-operation abuse failsafe.
        labels:
          severity: warning
          service: tau-api
          component: billing

      - uid: billing-funded-operation-recovery-provider-execution
        title: 'P1: Provider Execution During Recovery'
        condition: billing_funded_operation_recovery_provider_execution
        data:
          - refId: billing_funded_operation_recovery_provider_execution
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >
                max(tau_billing_funded_operation_recovery_provider_executions{service_name="tau-api"}) > 0
              intervalMs: 15000
              maxDataPoints: 20
        for: 0s
        annotations:
          summary: DB-only funded LLM recovery observed a provider execution; the invariant is zero.
        labels:
          severity: warning
          service: tau-api
          component: billing
