            queryType: ''
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              instant: true
              range: false
              expr: sum(increase(tau_mirror_copy_failures_total{app=~".*mirror.*",service_name="tau-mirror",destination="b2",reason="source_missing"}[1h])) > 0
              intervalMs: 15000
              maxDataPoints: 20
              refId: source_missing
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          runbook_url: docs/handbooks/cloud/playbooks/storage-failure.md
          summary: 'The copier found a manifest naming an object R2 does not hold: possible primary data loss. Stop sweeps and investigate before anything else.'
        labels:
          severity: critical
          service: tau-mirror
          component: mirror
      - uid: storage-b2-down-page
        title: 'P0: B2 Unreachable for 60 min'
        condition: b2_down_page
        data:
          - refId: b2_down_page
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              instant: true
              range: false
