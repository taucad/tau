              intervalMs: 15000
              maxDataPoints: 20
              refId: b2_down_page
        noDataState: OK
        execErrState: OK
        for: 60m
        annotations:
          runbook_url: docs/handbooks/cloud/system/services/second-copy-b2.md
          summary: The copier's probe of the B2 destination has failed for an hour, so the recovery point is ageing.
        labels:
          severity: critical
          service: tau-mirror
          component: mirror
      - uid: storage-b2-hidden-versions
        title: 'P0: Hide Markers Found in B2 (Security)'
        condition: hidden_versions
        data:
