[package]
name = "tau-windows-sandbox"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Restricted-token AppContainer PowerShell sandbox helper for Tau's Windows shell provider"
publish = false

[[bin]]
name = "tau-windows-sandbox"
path = "src/main.rs"

# A stand-in native worker for the WIN-X64 conformance row, never installed: it answers JSON lines on stdin.
[[example]]
name = "tau-worker-probe"
path = "examples/tau_worker_probe.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_NetManagement",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Rpc",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_WindowsFirewall",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
