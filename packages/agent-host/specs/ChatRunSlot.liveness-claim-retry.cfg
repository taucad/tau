\* HA4 (RC3, H22): a claim refused after W6's grant opens nothing and is retried; every orphan is eventually abandoned.
SPECIFICATION Spec
CONSTANTS
  Features = {"opening", "stale", "external", "extpause", "resume", "claimretry"}
  MaxCrashes = 1
  BoundaryExclusive = TRUE
  HoldUntilRows = TRUE
  ReleaseOnFailure = TRUE
  PayloadFirst = TRUE
  AtomicAbandon = TRUE
  KeyedCommands = TRUE
  AckAfterRow = TRUE
  SingleDecider = TRUE
  DurablePause = TRUE
  LazyClaim = TRUE
  SettlePerAttempt = TRUE
  StopFence = TRUE
  CloseBarrier = TRUE
  ResolveFirst = TRUE
  OrphanCoded = TRUE
INVARIANT TypeOK
PROPERTY OrphanAbandoned
PROPERTY AdmittedRunEnds
PROPERTY EveryCommandAnswered
CHECK_DEADLOCK FALSE
