\* Witness: the ending decides its drain from the durable prefix only ("committed"); a request ordered but not yet flushed outlives its run.
SPECIFICATION Spec
CONSTANTS
  Features = {"pipelined", "external", "extpause", "opening", "committed"}
  MaxCrashes = 1
  BoundaryExclusive = TRUE
  HoldUntilRows = TRUE
  ReleaseOnFailure = TRUE
  PayloadFirst = TRUE
  AtomicAbandon = TRUE
  KeyedCommands = TRUE
  AckAfterRow = TRUE
  SingleDecider = TRUE
  DurablePause = TRUE
  LazyClaim = TRUE
  SettlePerAttempt = TRUE
  StopFence = TRUE
  CloseBarrier = TRUE
  ResolveFirst = TRUE
  OrphanCoded = TRUE
INVARIANT TypeOK
INVARIANT NoPendingAfterEnd
CHECK_DEADLOCK FALSE
