\* WP-10 step B witness: pipelined writes without the model request waiting for its prepared row; a crash drops the row and the retry cannot know the attempt.
SPECIFICATION Spec
CONSTANTS
  Features = {"pipelined", "nobarrier", "gateway", "resume"}
  MaxCrashes = 1
  BoundaryExclusive = TRUE
  HoldUntilRows = TRUE
  ReleaseOnFailure = TRUE
  PayloadFirst = TRUE
  AtomicAbandon = TRUE
  KeyedCommands = TRUE
  AckAfterRow = TRUE
  SingleDecider = TRUE
  DurablePause = TRUE
  LazyClaim = TRUE
  SettlePerAttempt = TRUE
  StopFence = TRUE
  CloseBarrier = TRUE
  ResolveFirst = TRUE
  OrphanCoded = TRUE
INVARIANT TypeOK
INVARIANT NeverResendKnownAttempt
CHECK_DEADLOCK FALSE
