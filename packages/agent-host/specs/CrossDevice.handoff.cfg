\* CrossDevice (EQ3, XD1 handoff): a device opens a new term before admitting a turn another device's rows came
\* before, so every view keeps that admission after them. Synced clocks; a backwards clock step is the known limit.
CONSTANTS
  NDevices = 2
  MaxRows = 3
  MaxTerms = 3
  MaxSyncs = 2
  ClockSkew = FALSE
  Copies = FALSE
  MergeFixed = TRUE
  Repair = FALSE
  Rehome = TRUE
  Handoff = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AdmittedAfterSeen
CHECK_DEADLOCK FALSE
