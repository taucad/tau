\* CrossDevice (EQ3, XD1 handoff): a device opens a new term before admitting a turn another device's rows came
\* before, so every view keeps that admission after them. Deciding to rehome reads no clock; the merge still orders
\* terms by their start, so a term's first row is stamped after what its device read, and a clock step is that limit.
CONSTANTS
  NDevices = 2
  MaxRows = 3
  MaxTerms = 3
  MaxSyncs = 2
  ClockSkew = FALSE
  Copies = FALSE
  MergeFixed = TRUE
  Repair = FALSE
  Rehome = TRUE
  Handoff = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AdmittedAfterSeen
CHECK_DEADLOCK FALSE
