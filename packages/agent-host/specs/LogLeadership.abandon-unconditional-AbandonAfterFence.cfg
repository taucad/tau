\* W6 I13: per-run scope with unconditional appends; a thawed holder and a stealer share an epoch and a run is abandoned in the epoch that admitted it.
SPECIFICATION Spec
CONSTANTS
  Workers = {"w1","w2"}
  Keys = {}
  MaxEpoch = 6
  MaxCrashes = 1
  MaxSends = 0
  Steal = TRUE
  Fence = "lazynocas"
  IdemKeys = TRUE
  MustAnswer = TRUE
  WaitOnAnyHeartbeat = FALSE
  MaxWants = 2
  MaxFreezes = 1
  Scope = "run"
  Build <- CrossBuild
  StealRule = "silent"
INVARIANT TypeOK
INVARIANT AbandonAfterFence
CHECK_DEADLOCK FALSE
ALIAS TraceView
