\* HA4 (H22, RC3, AR3-6): a claim refused after the grant leaves M2 leading with no writer; M2 retries it until the still-closing bound, then releases the lock. Safety, and the lock is released or a writer opens (WriterlessReleased).
SPECIFICATION Spec
CONSTANTS
  Workers = {"w1","w2"}
  Keys = {}
  MaxEpoch = 6
  MaxCrashes = 1
  MaxSends = 0
  Steal = TRUE
  Fence = "lazy"
  IdemKeys = TRUE
  MustAnswer = TRUE
  WaitOnAnyHeartbeat = FALSE
  MaxWants = 2
  MaxFreezes = 1
  Scope = "run"
  Build <- CrossBuild
  StealRule = "silent"
  ClaimRefusal = "release"
INVARIANT TypeOK
INVARIANT OneWriterPerEpoch
INVARIANT EpochsMonotone
INVARIANT OneTerminalPerRun
INVARIANT AbandonAfterFence
INVARIANT SameBuildWriter
PROPERTY WriterlessReleased
CHECK_DEADLOCK FALSE
ALIAS TraceView
