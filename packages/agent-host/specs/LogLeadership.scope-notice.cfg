\* RV7-F4 (T4 claiming, RH-Q10): M2 rereads on its belief, the read is split so a notice cancels it, and a notice queued while frozen runs first.
SPECIFICATION Spec
CONSTANTS
  Workers = {"w1","w2"}
  Keys = {}
  MaxEpoch = 6
  MaxCrashes = 1
  MaxSends = 0
  Steal = TRUE
  Fence = "lazy"
  IdemKeys = TRUE
  MustAnswer = TRUE
  WaitOnAnyHeartbeat = FALSE
  MaxWants = 2
  MaxFreezes = 1
  Scope = "run"
  Build <- CrossBuild
  StealRule = "silent"
  SplitRead = TRUE
  NoticeFirst = TRUE
INVARIANT TypeOK
INVARIANT OneWriterPerEpoch
INVARIANT EpochsMonotone
INVARIANT OneTerminalPerRun
INVARIANT AbandonAfterFence
INVARIANT SameBuildWriter
INVARIANT NoZombieAbandon
PROPERTY Served
CHECK_DEADLOCK FALSE
ALIAS TraceView
