\* RV7-F3 (RH-R12, RH-R17): on OPFS no steal; a frozen holder keeps its handle, writers wait, and it serves them after it thaws.
SPECIFICATION Spec
CONSTANTS
  Workers = {"w1","w2"}
  Keys = {}
  MaxEpoch = 6
  MaxCrashes = 1
  MaxSends = 0
  Steal = FALSE
  Fence = "handle"
  IdemKeys = TRUE
  MustAnswer = TRUE
  WaitOnAnyHeartbeat = FALSE
  MaxWants = 2
  MaxFreezes = 1
  Scope = "run"
  Build <- CrossBuild
  StealRule = "silent"
  FairThaw = TRUE
INVARIANT TypeOK
INVARIANT OneWriterPerEpoch
INVARIANT EpochsMonotone
INVARIANT OneTerminalPerRun
INVARIANT AbandonAfterFence
INVARIANT SameBuildWriter
INVARIANT NoAbandonWithoutCrash
PROPERTY Served
CHECK_DEADLOCK FALSE
ALIAS TraceView
