\* RV7-F2 (RH-R16, RH-R12): queued reconcile requests kept only while visible, the heard rule, a heartbeat in the grant callback; one build.
SPECIFICATION Spec
CONSTANTS
  Workers = {"w1","w2"}
  Keys = {}
  MaxEpoch = 6
  MaxCrashes = 1
  MaxSends = 0
  Steal = TRUE
  Fence = "lazy"
  IdemKeys = TRUE
  MustAnswer = TRUE
  WaitOnAnyHeartbeat = FALSE
  MaxWants = 2
  MaxFreezes = 1
  Scope = "run"
  StealRule = "silent"
  HeardRule = TRUE
  MaxQueues = 1
INVARIANT TypeOK
INVARIANT OneWriterPerEpoch
INVARIANT EpochsMonotone
INVARIANT OneTerminalPerRun
INVARIANT AbandonAfterFence
INVARIANT SameBuildWriter
PROPERTY Served
CHECK_DEADLOCK FALSE
ALIAS TraceView
