\* W6 EQ4 (RH-R8): the lock held per run, two builds, steal only from a silent holder; safety, the fence refinement and no wedge.
SPECIFICATION Spec
CONSTANTS
  Workers = {"w1","w2"}
  Keys = {}
  MaxEpoch = 6
  MaxCrashes = 1
  MaxSends = 0
  Steal = TRUE
  Fence = "lazy"
  IdemKeys = TRUE
  MustAnswer = TRUE
  WaitOnAnyHeartbeat = FALSE
  MaxWants = 2
  MaxFreezes = 1
  Scope = "run"
  Build <- CrossBuild
  StealRule = "silent"
INVARIANT TypeOK
INVARIANT OneWriterPerEpoch
INVARIANT EpochsMonotone
INVARIANT OneTerminalPerRun
INVARIANT AbandonAfterFence
INVARIANT SameBuildWriter
PROPERTY Served
PROPERTY FenceRefined
CHECK_DEADLOCK FALSE
ALIAS TraceView
