\* RV7-F1: the steal guarded by the follower's heartbeat timer, which may fire for a healthy holder: a run is abandoned with no freeze and no crash (a limit; W4 T9's frozen-time rule bounds it).
SPECIFICATION Spec
CONSTANTS
  Workers = {"w1","w2"}
  Keys = {}
  MaxEpoch = 6
  MaxCrashes = 1
  MaxSends = 0
  Steal = TRUE
  Fence = "lazy"
  IdemKeys = TRUE
  MustAnswer = TRUE
  WaitOnAnyHeartbeat = FALSE
  MaxWants = 2
  MaxFreezes = 1
  Scope = "run"
  Build <- CrossBuild
  StealRule = "timer"
INVARIANT TypeOK
INVARIANT NoAbandonWithoutFault
CHECK_DEADLOCK FALSE
ALIAS TraceView
