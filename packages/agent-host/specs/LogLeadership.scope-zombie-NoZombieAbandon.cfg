\* RV7-F4 without the ordering assumption: a thawed holder reads and abandons the stealer's live run before its notice runs.
SPECIFICATION Spec
CONSTANTS
  Workers = {"w1","w2"}
  Keys = {}
  MaxEpoch = 6
  MaxCrashes = 1
  MaxSends = 0
  Steal = TRUE
  Fence = "lazy"
  IdemKeys = TRUE
  MustAnswer = TRUE
  WaitOnAnyHeartbeat = FALSE
  MaxWants = 2
  MaxFreezes = 1
  Scope = "run"
  Build <- CrossBuild
  StealRule = "silent"
  SplitRead = TRUE
INVARIANT TypeOK
INVARIANT NoZombieAbandon
CHECK_DEADLOCK FALSE
ALIAS TraceView
