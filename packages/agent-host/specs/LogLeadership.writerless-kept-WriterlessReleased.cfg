\* H22 before HA4: a claim refused after the grant is only logged, so M2 keeps the lock with no writer and nothing releases it.
SPECIFICATION Spec
CONSTANTS
  Workers = {"w1","w2"}
  Keys = {}
  MaxEpoch = 6
  MaxCrashes = 1
  MaxSends = 0
  Steal = TRUE
  Fence = "lazy"
  IdemKeys = TRUE
  MustAnswer = TRUE
  WaitOnAnyHeartbeat = FALSE
  MaxWants = 2
  MaxFreezes = 1
  Scope = "run"
  Build <- CrossBuild
  StealRule = "silent"
  ClaimRefusal = "kept"
INVARIANT TypeOK
PROPERTY WriterlessReleased
CHECK_DEADLOCK FALSE
ALIAS TraceView
