\* M2's two tabs of one build, with the lock per run, one queued reconciliation, one freeze, no steal and no crash (the graph stays under 1 MB, FM-R7): the graph export and covering suite (graphs.LogLeadershipGraph).
SPECIFICATION GraphSpec
CONSTANTS
  Workers = {"w1","w2"}
  Keys = {}
  MaxEpoch = 3
  MaxCrashes = 0
  MaxSends = 0
  Steal = FALSE
  Fence = "lazy"
  IdemKeys = TRUE
  MustAnswer = TRUE
  WaitOnAnyHeartbeat = FALSE
  Scope <- [LogLeadership] RunScope
  StealRule <- [LogLeadership] SilentRule
  MaxWants <- [LogLeadership] One
  MaxFreezes <- [LogLeadership] One
  MaxQueues <- [LogLeadership] One
CHECK_DEADLOCK FALSE
