\* One run per trace: `formal check` sets FORMAL_TRACE to a sanitized copy of a committed trace and searches depth-first.
\* The implementation claims every switch; a line no action allows ends the search, and TraceAccepted names the row.
CONSTANTS
  Keys <- TraceKeys
  MaxGen = 2
  Keyed = TRUE
  Replay = TRUE
  CheckCursor = TRUE
  Floor = TRUE
INIT TraceInit
NEXT TraceNext
VIEW TraceView
POSTCONDITION TraceAccepted
CHECK_DEADLOCK FALSE
