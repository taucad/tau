\* Before W2, or an API older than settlesBy: a lost reply's live retry and a Resume end on a wait code after the
\* host's short waits, while the gateway's own settlement time is still minutes away.
SPECIFICATION LiveSpec
CONSTANTS
  Notice = 1
  Budget = 2
  Due = 4
  ImmediateCut = TRUE
  StartWaits = TRUE
  ResumeWaits = TRUE
  SettlesBy = FALSE
INVARIANT TypeOK
INVARIANT NoWaitEndBeforeSettlesBy
CHECK_DEADLOCK FALSE
