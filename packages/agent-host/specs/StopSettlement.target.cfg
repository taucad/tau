\* As implemented: the API settles a noticed cut at once, both lookups wait, until the gateway's settlesBy when it states
\* one (W2), a Stop ends any wait at once, and a user who keeps resuming proceeds.
SPECIFICATION LiveSpec
CONSTANTS
  Notice = 1
  Budget = 2
  Due = 4
  ImmediateCut = TRUE
  StartWaits = TRUE
  ResumeWaits = TRUE
  SettlesBy = TRUE
INVARIANT TypeOK
INVARIANT StopNeverPauses
INVARIANT StopNeverRefuses
INVARIANT NoWaitEndBeforeSettlesBy
INVARIANT StopReleasesLookup
PROPERTY LookupAnswered
PROPERTY PausedProceeds
CHECK_DEADLOCK FALSE
