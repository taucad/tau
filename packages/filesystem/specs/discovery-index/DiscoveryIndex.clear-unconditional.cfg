\* Witness (index-contract review F5): a read that clears its directory whatever arrived while it ran installs a
\* value a fact has already overtaken.
SPECIFICATION Spec
CONSTANTS
 Dirs = {d1, d2}
 Values = {"v0", "v1"}
 MaxChanges = 1
 MaxLost = 0
 MaxWrites = 1
 MaxRepeats = 1
 ClearRule = "unconditional"
 ArmOrder = "arm-first"
 TapOrder = "before"
 AuditOn = TRUE
 Readers = {r1, r2}
 InstallRule = "monotone"
INVARIANT CleanIsCurrent
CHECK_DEADLOCK FALSE
