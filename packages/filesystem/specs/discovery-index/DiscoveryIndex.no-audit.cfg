\* Witness (index-contract review F3): with one lost fact and no audit, nothing reads the directory again.
\* Liveness, so no SYMMETRY.
SPECIFICATION LiveSpec
CONSTANTS
 Dirs = {d1, d2}
 Values = {"v0", "v1"}
 MaxChanges = 0
 MaxLost = 1
 MaxWrites = 1
 MaxRepeats = 1
 ClearRule = "versioned"
 ArmOrder = "arm-first"
 TapOrder = "before"
 AuditOn = FALSE
PROPERTY EventuallyCurrent
CHECK_DEADLOCK FALSE
