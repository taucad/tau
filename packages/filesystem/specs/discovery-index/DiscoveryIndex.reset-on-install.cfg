\* Witness (FW2 review M1): an install that puts the counter back to its floor lets a slower reader of older bytes
\* install after a faster reader installed newer ones.
SPECIFICATION Spec
CONSTANTS
 Dirs = {d1, d2}
 Values = {"v0", "v1"}
 MaxChanges = 1
 MaxLost = 0
 MaxWrites = 0
 MaxRepeats = 1
 ClearRule = "versioned"
 ArmOrder = "arm-first"
 TapOrder = "before"
 AuditOn = TRUE
 Readers = {r1, r2}
 InstallRule = "reset"
INVARIANT CleanIsCurrent
CHECK_DEADLOCK FALSE
