\* target-lost with the own write and the repeated fact back in: CleanIsCurrent and EventuallyCurrent under
\* LiveSpec at the bounds the pull-request tier narrows. No SYMMETRY.
SPECIFICATION LiveSpec
CONSTANTS
 Dirs = {d1, d2}
 Values = {"v0", "v1"}
 MaxChanges = 1
 MaxLost = 1
 MaxWrites = 1
 MaxRepeats = 1
 ClearRule = "versioned"
 ArmOrder = "arm-first"
 TapOrder = "before"
 AuditOn = TRUE
 Readers = {r1, r2}
 InstallRule = "monotone"
INVARIANTS TypeOK CleanIsCurrent
PROPERTY EventuallyCurrent
CHECK_DEADLOCK FALSE
