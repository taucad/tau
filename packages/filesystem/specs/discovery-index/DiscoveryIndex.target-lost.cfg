\* Target with one lost fact and the audit on: the index is never wrong outside its exemptions and comes to hold
\* storage. Liveness under LiveSpec, so no SYMMETRY.
SPECIFICATION LiveSpec
CONSTANTS
 Dirs = {d1, d2}
 Values = {"v0", "v1"}
 MaxChanges = 1
 MaxLost = 1
 MaxWrites = 1
 MaxRepeats = 1
 ClearRule = "versioned"
 ArmOrder = "arm-first"
 TapOrder = "before"
 AuditOn = TRUE
INVARIANTS TypeOK CleanIsCurrent
PROPERTY EventuallyCurrent
CHECK_DEADLOCK FALSE
