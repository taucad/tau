\* Target: the versioned clear rule, channels armed before the first read, the provider tap before and after each
\* write, no lost fact, two directories. Safety only.
SPECIFICATION Spec
CONSTANTS
 Dirs = {d1, d2}
 Values = {"v0", "v1"}
 MaxChanges = 2
 MaxLost = 0
 MaxWrites = 1
 MaxRepeats = 1
 ClearRule = "versioned"
 ArmOrder = "arm-first"
 TapOrder = "before"
 AuditOn = TRUE
 Readers = {r1, r2}
 InstallRule = "monotone"
INVARIANTS TypeOK CleanIsCurrent
CHECK_DEADLOCK FALSE
