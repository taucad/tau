[package]
name = "geospec-engine-native-emscripten"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
geospec-engine-native-core = { path = "../../rust" }
geospec-engine-native-runtime = { path = "../../native/runtime", default-features = false, features = [
  "binding-emscripten",
] }

[profile.release]
panic = "abort"
