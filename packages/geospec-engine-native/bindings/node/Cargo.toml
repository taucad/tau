[package]
name = "geospec-engine-native-node"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
geospec-engine-native-core = { path = "../../rust" }
napi = { version = "=3.12.2", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.3"

[build-dependencies]
napi-build = "=2.4.1"
