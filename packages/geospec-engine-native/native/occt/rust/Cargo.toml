[package]
name = "geospec-engine-native-occt"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
geospec-engine-native-core = { path = "../../../rust" }
serde = { version = "=1.0.219", features = ["derive"] }

[build-dependencies]
cc = "=1.4.4"

[[test]]
name = "trimmed_cylinder"
path = "tests/trimmed_cylinder.rs"

[[test]]
name = "set_containment"
path = "tests/set_containment.rs"

[[test]]
name = "report_bundle"
path = "tests/report_bundle.rs"
