[package]
name = "geospec-engine-native-runtime"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
build = "build.rs"

[features]
default = ["standalone"]
binding-node = []
binding-python = []
standalone = []

[dependencies]
geospec-engine-native-core = { path = "../../rust" }
geospec-engine-native-occt = { path = "../occt/rust" }
geospec-engine-native-csg = { path = "../manifold-rust/adapter" }

[dev-dependencies]
geospec-engine-native-cache-host = { path = "../cache-host" }
serde_json = { version = "=1.0.143", features = ["float_roundtrip"] }

[build-dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.143", features = ["float_roundtrip"] }
sha2 = { version = "=0.11.0", default-features = false }
