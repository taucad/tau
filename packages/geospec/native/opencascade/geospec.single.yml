additionalCppFiles:
  - wrappers/geospec-mesh-metrics.cpp
  - wrappers/geospec-step-reader.cpp
  - wrappers/geospec-xde-reader.cpp

mainBuild:
  name: geospec_opencascade_single.js
  bindings:
    - symbol: Message_ProgressRange
    - symbol: STEPControl_Reader
    - symbol: IFSelect_ReturnStatus
    - symbol: gp_Pnt
    - symbol: gp_Vec
    - symbol: gp_XYZ
    - symbol: gp_Dir
    - symbol: gp_Pln
    - symbol: gp_Cylinder
    - symbol: TopAbs_ShapeEnum
    - symbol: TopAbs_Orientation
    - symbol: TopLoc_Location
    - symbol: TopExp_Explorer
    - symbol: TopoDS
    - symbol: TopoDS_Shape
    - symbol: TopoDS_Face
    - symbol: TopoDS_Shell
    - symbol: TopoDS_Solid
    - symbol: Poly_Triangle
    - symbol: Poly_Triangulation
    - symbol: BRep_Tool
    - symbol: BRepAlgoAPI_Common
    - symbol: BRepBuilderAPI_MakeFace
    - symbol: BRepBuilderAPI_MakePolygon
    - symbol: BRepBuilderAPI_MakeSolid
    - symbol: BRepBuilderAPI_Sewing
    - symbol: BRepTools
    - symbol: BRepMesh_IncrementalMesh
    - symbol: BRepCheck_Analyzer
    - symbol: BRepBndLib
    - symbol: BRepGProp
    - symbol: GProp_GProps
    - symbol: BRepAdaptor_Surface
    - symbol: GeomAbs_SurfaceType
    - symbol: GeoSpecPoint
    - symbol: GeoSpecMeshDistanceStats
    - symbol: GeoSpecMeshOverlapResult
    - symbol: GeoSpecMeshMetrics
    - symbol: GeoSpecNativeVec3
    - symbol: GeoSpecStepReadResult
    - symbol: GeoSpecStepStreamReader
    - symbol: GeoSpecXdeReadResult
    - symbol: GeoSpecXdeReader
  emccFlags:
    - -flto
    - -O3
    - -fwasm-exceptions
    - -msimd128
    - -sMODULARIZE
    - -sEXPORT_ES6=1
    - -sWASM_BIGINT
    - -sEVAL_CTORS=2
    - -sEXPORT_EXCEPTION_HANDLING_HELPERS
    - -sALLOW_MEMORY_GROWTH=1
    - -sINITIAL_MEMORY=100MB
    - -sMAXIMUM_MEMORY=4GB
    - -sEXPORTED_RUNTIME_METHODS=["HEAP32","HEAPF64","FS"]
    - -sEXPORTED_FUNCTIONS=["_malloc","_free"]
    # BRepAlgoAPI_Common pulls OCCT OSD_MemInfo, which references glibc
    # mallinfo. The wasm path never calls that reporter; allow Emscripten's
    # dormant missing-function stub for this custom Boolean-analysis build.
    - -sERROR_ON_UNDEFINED_SYMBOLS=0
    - --no-entry
