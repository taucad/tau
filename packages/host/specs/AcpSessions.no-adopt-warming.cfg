\* Witness: ADOPT_WARMING = FALSE, an acquire finds its key warming and has no branch, so the prewarm blocks the turn it was opened for (WP-18 F-9).
CONSTANTS
  Keys = {"a", "b"}
  Runs = {1, 2}
  Limit = 1
  MaxProcs = 4
  ONE_RUN = TRUE
  LEASE = TRUE
  EVICT_ON_END = TRUE
  KEEP_KEY = TRUE
  BUSY_GUARD = TRUE
  HARD_CLOSE = TRUE
  QUEUED_CANCEL = TRUE
  DRAIN_BOUND = TRUE
  ADOPT_WARMING = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT PrewarmNeverBlocks
