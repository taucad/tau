# Runs outside Tau with uv: `uv sync --locked`, then `uv run main.py`.
# The dependencies are the libraries Tau's build123d kernel runs; keep these pins when you edit the list.
[project]
name = "tau-project"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "build123d==0.11.1",
  "cadquery-ocp-novtk==7.9.3.1.1",
]

# The platforms and versions of Tau's build123d runtime, so uv.lock and pylock.toml lock the same wheels' versions.
[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64' and implementation_name == 'cpython'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
  "sys_platform == 'linux' and platform_machine == 'aarch64' and implementation_name == 'cpython'",
  "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
]
constraint-dependencies = [
  "anytree==2.13.0",
  "asttokens==3.0.2",
  "build123d==0.11.1",
  "cadquery-ocp-novtk==7.9.3.1.1",
  "cadquery-ocp-proxy==7.9.3.1.1",
  "certifi==2026.7.22",
  "charset-normalizer==3.5.1",
