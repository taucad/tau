[workspace]
resolver = "2"
members = ["render-core", "render-wasm", "render-napi"]

# Speed-first release profile: opt-level=z throttled the codec crates up to
# 7x (benched 2026-07-12; per-crate O3 overrides don't fully apply under fat
# LTO) and saved only ~21 KB against the 1.5 MB-gz wasm budget (see
# docs/research/headless-thumbnail-rendering-architecture-v2.md).
# panic stays "unwind" so napi-rs can contain panics instead of aborting Node.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
