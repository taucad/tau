[package]
name = "render-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytemuck = "1.25.1"
futures-channel = "0.3.32"
glam = "0.33.2"
gltf = { version = "=1.4.1", default-features = false, features = ["utils"] }
image-webp = { path = "../vendor/image-webp" }
jpeg-encoder = "0.7.0"
png = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Native: Metal (macOS), Vulkan (Linux incl. lavapipe), DX12 (Windows incl. WARP).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = [
  "std",
  "wgsl",
  "parking_lot",
  "metal",
  "vulkan",
  "dx12",
] }

# Browser: WebGPU backend only — surface-less, no canvas, no WebGL2 fallback.
# "wgsl" only unlocks the ShaderSource::Wgsl variant here; with wgpu-core
# absent it pulls no naga compiler into the wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["std", "webgpu", "wgsl"] }

[dev-dependencies]
pollster = "1.0.1"
zune-jpeg = "0.5.15"

[build-dependencies]
fontdue = { version = "=0.9.3", default-features = false, features = ["std"] }
