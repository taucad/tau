\* Fixed by W5 RM-S5; today (L7 D-L7-2, D-L7-3): a coalesced or aborted requester is never answered (RM-S5).
CONSTANTS
  TurnReqs = {"t1"}
  SaveReqs = {"s1", "s2"}
  Coalesce = "keepAll"
  RegistryHeads = "ignore"
  MoveDuringMint = "defer"
  HeadFacts = "reread"
  CasChecksBranch = TRUE
  Cancellable = TRUE
  MaxExternal = 1
  MaxAnnounce = 2
INIT Init
NEXT Next
CHECK_DEADLOCK FALSE
INVARIANT EveryRequesterAnswered
