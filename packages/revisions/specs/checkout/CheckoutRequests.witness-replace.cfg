\* Witness: coalescing that replaces a requester leaves it unanswered.
CONSTANTS
  TurnReqs = {"t1"}
  SaveReqs = {"s1", "s2"}
  Coalesce = "replace"
  RegistryHeads = "ignore"
  MoveDuringMint = "defer"
  HeadFacts = "reread"
  CasChecksBranch = TRUE
  Cancellable = TRUE
  MaxExternal = 1
  MaxAnnounce = 2
INIT Init
NEXT Next
CHECK_DEADLOCK FALSE
INVARIANT EveryRequesterAnswered
