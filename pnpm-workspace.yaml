packages:
  - apps/*
  - apps/libs/*
  - apps/react-e2e/apps/*
  - examples/*
  - libs/*
  - packages/*
  - packages/plugins/*
  - packages/core/*
  - scripts
  - tools/*

enableGlobalVirtualStore: false

allowBuilds:
  '@datadog/pprof': false
  '@parcel/watcher': true
  '@swc/core': true
  # canvas is a root devDependency that jsdom loads only when it works. pnpm does not
  # put its prebuild-install on the install script's PATH here, so building it means a
  # node-gyp compile against cairo/pango/pixman on every machine. jsdom treats an
  # unbuilt canvas as absent, which is what the suites expect.
  canvas: false
  core-js: true
  electron: true
  esbuild: true
  less: false
  netlify-cli: false
  nx: true
  protobufjs: true
  sharp: true
  unix-dgram: false
  unrs-resolver: true
  '@nestjs/core': true
  nestjs-pino: true
  '@google/genai': false
  # Downloads the platform vale binary at install time; required for prose linting.
  '@vvago/vale': true
catalog:
  # Error tracking (launch gate OBS-7). Exact pins, one @sentry/core across the
  # API, UI and desktop: @sentry/electron 7.20.0 bundles @sentry/node 10.75.0.
