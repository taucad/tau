# Every shape the rule allows: targets, tag: selectors, globs, `nx affected`,
# `nx release`, `nx show projects`, `nx run` against a `type:tool` project, and
# a project list computed at run time.
name: Clean
on:
  push:
    branches: [main]

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run every workspace validator
        run: pnpm nx run scripts:validate

  affected:
    runs-on: ubuntu-latest
    steps:
      - name: Plan
        run: pnpm nx show projects --affected --with-target size --json
      - name: Lint, test, build what changed
        run: |
          pnpm nx affected -t lint test build typecheck \
            --exclude=tag:type:e2e
          echo "affected done"
      - name: Audit everything that has the target
        run: pnpm nx run-many -t audit-public-surface --projects=*

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Build the release train
        run: pnpm nx run-many -t build --projects=tag:type:package,tag:type:lib
      - name: Publish
        run: pnpm nx release publish -p tag:type:package --tag=beta

  shard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    steps:
      - name: Run one computed shard
        run: |
          shard=$(pnpm nx show projects --affected --with-target test --json | tail -1)
          pnpm nx run-many -t test --projects "$shard"
      - name: Run one matrix project
        run: pnpm nx run-many -t test --projects=${{ matrix.project }}
